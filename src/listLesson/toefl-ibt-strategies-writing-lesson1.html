<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEFL iBT Strategies - Writing Lesson 1</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom Scrollbar for the text area */
        textarea::-webkit-scrollbar { width: 12px; }
        textarea::-webkit-scrollbar-track { background: #f1f1f1; }
        textarea::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }
        textarea::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONS (Inline) ---
        const IconBase = ({ children, className, ...props }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width="24" 
                height="24" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round"
                className={className}
                {...props}
            >
                {children}
            </svg>
        );

        const BookOpen = (props) => <IconBase {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></IconBase>;
        const PenTool = (props) => <IconBase {...props}><path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.586 7.586"/><circle cx="11" cy="11" r="2"/></IconBase>;
        const Clock = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconBase>;
        const CheckCircle = (props) => <IconBase {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconBase>;
        const HelpCircle = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></IconBase>;
        const FileText = (props) => <IconBase {...props}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></IconBase>;
        const ChevronRight = (props) => <IconBase {...props}><polyline points="9 18 15 12 9 6"/></IconBase>;
        const RotateCcw = (props) => <IconBase {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></IconBase>;
        const Monitor = (props) => <IconBase {...props}><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></IconBase>;
        const AlertCircle = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></IconBase>;

        // --- COMPONENTS ---

        // 1. Warm Up Component
        const WarmUp = () => (
            <div className="space-y-8 fade-in">
                <div className="bg-white p-8 rounded-xl shadow-md border-l-8 border-indigo-500">
                    <h2 className="text-3xl font-bold text-gray-800 mb-6 flex items-center">
                        <BookOpen className="w-8 h-8 mr-3 text-indigo-500" />
                        Lesson Objectives
                    </h2>
                    <ul className="list-disc list-inside space-y-4 text-xl text-gray-600">
                        <li>Understand the two question types in the TOEFL iBT Writing section.</li>
                        <li>Understand the skills tested in the Writing section.</li>
                        <li>Evaluate current writing abilities, strengths, and challenges.</li>
                    </ul>
                </div>

                <div className="grid md:grid-cols-2 gap-8">
                    <div className="bg-indigo-50 p-8 rounded-xl shadow-sm">
                        <h3 className="text-xl font-bold text-indigo-900 mb-4">Discussion: Daily Writing</h3>
                        <p className="text-lg text-indigo-800 mb-6">Think about a typical day. Discuss these questions with your group:</p>
                        <ul className="space-y-4 text-lg text-gray-700">
                            <li className="flex items-start"><ChevronRight className="w-6 h-6 mr-2 mt-1 text-indigo-400"/> How much writing in your own language do you do?</li>
                            <li className="flex items-start"><ChevronRight className="w-6 h-6 mr-2 mt-1 text-indigo-400"/> Do you prefer typing or handwriting? Why?</li>
                            <li className="flex items-start"><ChevronRight className="w-6 h-6 mr-2 mt-1 text-indigo-400"/> If you had to write a 3-page essay today, what would you do first?</li>
                        </ul>
                    </div>
                    <div className="bg-amber-50 p-8 rounded-xl shadow-sm">
                        <h3 className="text-xl font-bold text-amber-900 mb-4">Discussion: Typing Skills</h3>
                        <p className="text-lg text-amber-800 mb-6">The TOEFL iBT is computer-based. Consider:</p>
                        <ul className="space-y-4 text-lg text-gray-700">
                            <li className="flex items-start"><ChevronRight className="w-6 h-6 mr-2 mt-1 text-amber-400"/> How often do you type on a full keyboard (laptop/desktop)?</li>
                            <li className="flex items-start"><ChevronRight className="w-6 h-6 mr-2 mt-1 text-amber-400"/> Do you know your WPM (Words Per Minute)?</li>
                            <li className="flex items-start"><ChevronRight className="w-6 h-6 mr-2 mt-1 text-amber-400"/> Do you look at the keyboard when you type?</li>
                        </ul>
                    </div>
                </div>
            </div>
        );

        // 2. Quiz Component
        const Quiz = () => {
            const questions = [
                { id: 1, text: "Most people prefer to type on the Writing section, but you can also write by hand if you inform the testing center in advance.", answer: false, explanation: "False. You must type your answers." },
                { id: 2, text: "There is no spellcheck function for the Writing section.", answer: true, explanation: "True. You must recognize errors yourself." },
                { id: 3, text: "There are three different writing tasks in the Writing section.", answer: false, explanation: "False. There are two: Integrated and Academic Discussion." },
                { id: 4, text: "There is no recommended minimum for the number of words you write in the Academic Discussion task.", answer: false, explanation: "False. The recommended minimum is 100 words." },
                { id: 5, text: "The questions on the Integrated task do not ask for your opinion or preference.", answer: true, explanation: "True. You are summarizing other people's ideas." },
                { id: 6, text: "For the Integrated task, you will have to summarize a reading passage and then summarize a lecture separately.", answer: false, explanation: "False. You must relate the lecture to the reading in one summary." },
                { id: 7, text: "Raters expect the writing responses to be completely free of errors.", answer: false, explanation: "False. Raters treat it as a first draft; high scores can have minor errors." },
                { id: 8, text: "Spelling and punctuation are not scored on the Writing section.", answer: true, explanation: "True (mostly). Simple typos aren't penalized unless they obscure meaning." },
                { id: 9, text: "While you listen to the lecture on the Integrated Task, you will be able to see the reading passage.", answer: false, explanation: "False. The reading disappears during the lecture, then reappears." },
                { id: 10, text: "The notes that you take for the Integrated task do not count towards your score.", answer: true, explanation: "True. Notes are collected and destroyed." }
            ];

            const [userAnswers, setUserAnswers] = useState({});
            const [confidence, setConfidence] = useState({});
            const [submitted, setSubmitted] = useState(false);

            const handleAnswer = (id, val) => {
                if(submitted) return;
                setUserAnswers(prev => ({...prev, [id]: val}));
            };

            const handleConfidence = (id, val) => {
                if(submitted) return;
                setConfidence(prev => ({...prev, [id]: val}));
            };

            const score = Object.keys(userAnswers).reduce((acc, key) => {
                const q = questions.find(q => q.id === parseInt(key));
                return acc + (userAnswers[key] === q.answer ? 1 : 0);
            }, 0);

            return (
                <div className="space-y-8 fade-in">
                    <div className="bg-white p-8 rounded-xl shadow-md">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-3xl font-bold text-gray-800">Writing Section Quiz</h2>
                            {submitted && (
                                <span className="bg-indigo-100 text-indigo-800 px-4 py-2 rounded-full text-lg font-bold">
                                    Score: {score}/{questions.length}
                                </span>
                            )}
                        </div>
                        <p className="text-xl text-gray-600 mb-8">Read each statement. Select True or False, and rate your confidence (1 = Not confident, 5 = Very confident).</p>
                        
                        <div className="space-y-8">
                            {questions.map((q) => {
                                const isCorrect = userAnswers[q.id] === q.answer;
                                return (
                                    <div key={q.id} className={`p-6 rounded-xl border-2 ${submitted ? (isCorrect ? 'border-green-200 bg-green-50' : 'border-red-200 bg-red-50') : 'border-gray-200 hover:border-indigo-300 transition'}`}>
                                        <div className="flex flex-col md:flex-row justify-between items-start gap-4">
                                            <p className="text-xl font-medium text-gray-800 w-full md:w-3/4 leading-relaxed">{q.id}. {q.text}</p>
                                            <div className="flex flex-col items-end space-y-4 w-full md:w-auto">
                                                <div className="flex rounded-lg shadow-sm w-full md:w-auto" role="group">
                                                    <button 
                                                        onClick={() => handleAnswer(q.id, true)}
                                                        className={`flex-1 md:flex-none px-6 py-2 text-lg border rounded-l-lg ${userAnswers[q.id] === true ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700'}`}
                                                    >True</button>
                                                    <button 
                                                        onClick={() => handleAnswer(q.id, false)}
                                                        className={`flex-1 md:flex-none px-6 py-2 text-lg border rounded-r-lg ${userAnswers[q.id] === false ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700'}`}
                                                    >False</button>
                                                </div>
                                                <div className="flex items-center text-sm text-gray-500">
                                                    <span className="mr-3 text-base">Confidence:</span>
                                                    {[1,2,3,4,5].map(num => (
                                                        <button 
                                                            key={num}
                                                            onClick={() => handleConfidence(q.id, num)}
                                                            className={`w-8 h-8 ml-1 rounded-full flex items-center justify-center border text-base font-medium ${confidence[q.id] === num ? 'bg-amber-400 border-amber-500 text-white' : 'bg-gray-100 hover:bg-gray-200'}`}
                                                        >
                                                            {num}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                        {submitted && (
                                            <div className="mt-4 text-lg pt-4 border-t border-gray-200/50">
                                                <span className={`font-bold ${isCorrect ? 'text-green-700' : 'text-red-700'}`}>
                                                    {isCorrect ? "Correct!" : "Incorrect."}
                                                </span> 
                                                <span className="text-gray-700 ml-2">{q.explanation}</span>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>

                        {!submitted && (
                            <button 
                                onClick={() => setSubmitted(true)}
                                className="mt-8 w-full bg-indigo-600 text-white py-4 rounded-xl text-xl font-bold hover:bg-indigo-700 transition shadow-md"
                            >
                                Submit Answers
                            </button>
                        )}
                        {submitted && (
                            <button 
                                onClick={() => { setSubmitted(false); setUserAnswers({}); setConfidence({}); }}
                                className="mt-8 w-full bg-gray-200 text-gray-700 py-4 rounded-xl text-xl font-bold hover:bg-gray-300 transition shadow-sm"
                            >
                                Reset Quiz
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        // 3. Item Types Component (Cloze/Notes)
        const ItemTypes = () => {
            const [inputs, setInputs] = useState({
                type1: "", type2: "", 
                acad1: "", acad2: "", 
                int1: "", int2: ""
            });
            const [showAnswers, setShowAnswers] = useState(false);

            const correctAnswers = {
                type1: "Academic Discussion task", type2: "Integrated task", 
                acad1: "professor's question", acad2: "contribution", 
                int1: "Summarize", int2: "cast doubt"
            };

            const handleChange = (e) => {
                const { name, value } = e.target;
                setInputs(prev => ({...prev, [name]: value}));
            };

            const toggleAnswers = () => {
                if (showAnswers) {
                    setInputs({ type1: "", type2: "", acad1: "", acad2: "", int1: "", int2: "" });
                } else {
                    setInputs(correctAnswers);
                }
                setShowAnswers(!showAnswers);
            };

            const inputClass = (isTitle = false) => `border-b-4 px-3 py-1 mx-1 outline-none transition-colors text-xl font-medium ${
                showAnswers 
                ? 'border-green-500 text-green-700 bg-green-50' 
                : isTitle 
                    ? 'border-indigo-300 bg-indigo-50 focus:border-indigo-600 text-indigo-700' 
                    : 'border-gray-300 focus:border-indigo-600 text-gray-800'
            }`;

            return (
                <div className="space-y-8 fade-in">
                    <div className="bg-blue-50 border-l-8 border-blue-500 p-6 rounded-r-xl shadow-sm">
                        <audio controls className="w-full focus:outline-none rounded-lg shadow-sm">
                            <source src="https://github.com/fajarudinakbar/audio/raw/refs/heads/main/TOEFL%20iBT%20-%20Writing%20Lesson%201%20General%20Introduction.mp3" type="audio/mpeg" />
                            Your browser does not support the audio element.
                        </audio>
                    </div>

                    <div className="bg-white p-10 rounded-xl shadow-md space-y-10">
                        
                        {/* Section 1 */}
                        <div>
                            <h3 className="text-2xl font-bold text-gray-800 mb-6 border-b-2 pb-3">1. Overview</h3>
                            <p className="text-xl text-gray-700 leading-loose">
                                There are two types of items on the Writing section, the <input name="type1" value={inputs.type1} onChange={handleChange} className={`${inputClass(true)} w-72`} placeholder="Task Name..." /> and the <input name="type2" value={inputs.type2} onChange={handleChange} className={`${inputClass(true)} w-64`} placeholder="Task Name..." />.
                            </p>
                        </div>

                        {/* Section 2 */}
                        <div className="bg-gray-50 p-8 rounded-xl border border-gray-200">
                            <h3 className="text-2xl font-bold text-gray-800 mb-6">2. Writing for an Academic Discussion</h3>
                            <div className="space-y-6 text-xl text-gray-700 leading-relaxed">
                                <p><strong>Scenario:</strong> Your professor is teaching a class. You must write a post responding to the <input name="acad1" value={inputs.acad1} onChange={handleChange} className={`${inputClass()} w-64`} placeholder="..." />.</p>
                                <ul className="list-disc list-inside ml-6 space-y-3">
                                    <li>Express and support your <span className="font-bold text-indigo-600">opinion</span>.</li>
                                    <li>Make a <input name="acad2" value={inputs.acad2} onChange={handleChange} className={`${inputClass()} w-48`} placeholder="..." /> to the discussion in your own words.</li>
                                </ul>
                                <div className="mt-6 text-lg text-gray-600 bg-white p-5 rounded-lg border shadow-sm">
                                    <span className="font-bold text-gray-900">Key Stats:</span> 10 minutes total. 100+ words recommended.
                                </div>
                            </div>
                        </div>

                        {/* Section 3 */}
                        <div className="bg-gray-50 p-8 rounded-xl border border-gray-200">
                            <h3 className="text-2xl font-bold text-gray-800 mb-6">3. Integrated Task</h3>
                            <div className="space-y-6 text-xl text-gray-700 leading-relaxed">
                                <p><strong>Task:</strong> <input name="int1" value={inputs.int1} onChange={handleChange} className={`${inputClass()} w-40`} placeholder="..." /> the points made in the lecture, being sure to explain how they <input name="int2" value={inputs.int2} onChange={handleChange} className={`${inputClass()} w-40`} placeholder="..." /> on specific points made in the reading passage.</p>
                                <div className="mt-6 text-lg text-gray-600 bg-white p-5 rounded-lg border shadow-sm">
                                    <span className="font-bold text-gray-900">Key Stats:</span> 3 min reading (notes allowed), ~2 min listening (notes allowed), 20 min writing. 150-225 words recommended. No opinion needed.
                                </div>
                            </div>
                        </div>

                        <div className="flex justify-end pt-4">
                            <button 
                                onClick={toggleAnswers}
                                className="text-lg text-indigo-600 hover:text-indigo-800 font-bold underline"
                            >
                                {showAnswers ? "Hide Answers" : "Show Answers (For Review)"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // 4. Writing Practice Component
        const WritingPractice = () => {
            const [timeLeft, setTimeLeft] = useState(600); // 10 minutes
            const [isActive, setIsActive] = useState(false);
            const [text, setText] = useState("");
            const [wordCount, setWordCount] = useState(0);

            useEffect(() => {
                let interval = null;
                if (isActive && timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimeLeft(timeLeft => timeLeft - 1);
                    }, 1000);
                } else if (timeLeft === 0) {
                    setIsActive(false);
                    clearInterval(interval);
                }
                return () => clearInterval(interval);
            }, [isActive, timeLeft]);

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };

            const handleTextChange = (e) => {
                const val = e.target.value;
                setText(val);
                setWordCount(val.trim() === '' ? 0 : val.trim().split(/\s+/).length);
            };

            const toggleTimer = () => setIsActive(!isActive);
            const resetTimer = () => {
                setIsActive(false);
                setTimeLeft(600);
                setText("");
                setWordCount(0);
            };

            return (
                <div className="space-y-8 fade-in h-full">
                    {/* Instructions Card */}
                    <div className="bg-white p-8 rounded-xl shadow-sm border border-gray-200">
                        <h3 className="text-2xl font-bold text-gray-800 mb-4">Practice Prompt (10 Minutes)</h3>
                        <p className="text-xl text-gray-700 italic mb-6 leading-relaxed">
                            "Think about your language-learning journey. When did you start learning English? How did you learn? What will you use English for in the future?"
                        </p>
                        <div className="text-base text-gray-500 font-medium">
                            <strong className="text-gray-700">Goal:</strong> Notice your typing speed, accuracy, and thought process. Don't worry about perfect grammar yet.
                        </div>
                    </div>

                    {/* Writing Interface */}
                    <div className="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-300">
                        {/* Toolbar */}
                        <div className="bg-gray-100 p-4 flex justify-between items-center border-b border-gray-300">
                            <div className="flex space-x-3">
                                <button className="px-4 py-2 hover:bg-gray-200 rounded text-gray-700 text-lg" title="Cut"><span className="font-serif">Cut</span></button>
                                <button className="px-4 py-2 hover:bg-gray-200 rounded text-gray-700 text-lg" title="Paste"><span className="font-serif">Paste</span></button>
                                <button className="px-4 py-2 hover:bg-gray-200 rounded text-gray-700" title="Undo"><RotateCcw className="w-6 h-6"/></button>
                            </div>
                            <div className="flex space-x-6 items-center">
                                <div className={`flex items-center font-mono font-bold text-2xl ${timeLeft < 60 ? 'text-red-600 animate-pulse' : 'text-gray-700'}`}>
                                    <Clock className="w-6 h-6 mr-3" />
                                    {formatTime(timeLeft)}
                                </div>
                                <div className="text-lg text-gray-600 font-semibold">
                                    Words: {wordCount}
                                </div>
                            </div>
                        </div>

                        {/* Editor */}
                        <textarea 
                            value={text}
                            onChange={handleTextChange}
                            placeholder="Start typing here..."
                            className="w-full h-[500px] p-8 outline-none text-xl text-gray-800 leading-relaxed resize-none font-serif"
                            spellCheck="false"
                        ></textarea>

                        {/* Footer Controls */}
                        <div className="bg-gray-50 p-6 border-t border-gray-200 flex justify-between items-center">
                            <button 
                                onClick={resetTimer}
                                className="text-gray-500 hover:text-red-600 text-lg font-bold"
                            >
                                Clear & Reset
                            </button>
                            <button 
                                onClick={toggleTimer}
                                className={`px-8 py-3 rounded-lg text-lg font-bold shadow-sm transition ${isActive ? 'bg-amber-500 hover:bg-amber-600 text-white' : 'bg-green-600 hover:bg-green-700 text-white'}`}
                            >
                                {isActive ? 'Pause Timer' : 'Start Timer'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // 5. Reflection Component
        const Reflection = () => (
            <div className="space-y-8 fade-in">
                <div className="bg-white p-8 rounded-xl shadow-md">
                    <h2 className="text-3xl font-bold text-gray-800 mb-8 flex items-center">
                        <Monitor className="w-8 h-8 mr-3 text-indigo-500" />
                        Post-Writing Reflection
                    </h2>
                    
                    <div className="space-y-6">
                        <p className="text-xl text-gray-600">Discuss these questions with your partner or group based on your practice session:</p>
                        
                        <div className="grid md:grid-cols-2 gap-6">
                            <div className="p-6 border-2 border-gray-100 rounded-xl hover:bg-gray-50 transition">
                                <h4 className="text-xl font-bold text-gray-800 mb-3">Process</h4>
                                <ul className="list-disc list-inside text-lg text-gray-600 space-y-2">
                                    <li>Did you start typing immediately, or did you plan first?</li>
                                    <li>Did you look at the screen, keyboard, or your hands?</li>
                                </ul>
                            </div>
                            <div className="p-6 border-2 border-gray-100 rounded-xl hover:bg-gray-50 transition">
                                <h4 className="text-xl font-bold text-gray-800 mb-3">Editing</h4>
                                <ul className="list-disc list-inside text-lg text-gray-600 space-y-2">
                                    <li>Did you backspace/delete often? Why?</li>
                                    <li>Did you go back to insert text in earlier sentences?</li>
                                </ul>
                            </div>
                            <div className="p-6 border-2 border-gray-100 rounded-xl hover:bg-gray-50 transition">
                                <h4 className="text-xl font-bold text-gray-800 mb-3">Accuracy</h4>
                                <ul className="list-disc list-inside text-lg text-gray-600 space-y-2">
                                    <li>Do you think you made spelling/grammar mistakes?</li>
                                    <li>Did you re-read your writing at the end?</li>
                                </ul>
                            </div>
                            <div className="p-6 border-2 border-gray-100 rounded-xl hover:bg-gray-50 transition">
                                <h4 className="text-xl font-bold text-gray-800 mb-3">Expression</h4>
                                <ul className="list-disc list-inside text-lg text-gray-600 space-y-2">
                                    <li>Was there an idea you wanted to express but couldn't find the words for?</li>
                                    <li>Can you explain it now in your own language?</li>
                                </ul>
                            </div>
                        </div>

                        <div className="mt-10 bg-indigo-50 p-6 rounded-xl flex items-start border border-indigo-100">
                            <AlertCircle className="w-8 h-8 text-indigo-600 mr-4 mt-1 flex-shrink-0" />
                            <div>
                                <h4 className="text-xl font-bold text-indigo-900">Next Steps</h4>
                                <p className="text-lg text-indigo-800 mt-2">
                                    To improve, identify one strategy to increase typing speed and one way to practice English writing outside of class this week.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );

        // --- MAIN APP COMPONENT ---

        const App = () => {
            const [activeTab, setActiveTab] = useState('intro');

            const renderContent = () => {
                switch(activeTab) {
                    case 'intro': return <WarmUp />;
                    case 'quiz': return <Quiz />;
                    case 'types': return <ItemTypes />;
                    case 'writing': return <WritingPractice />;
                    case 'reflect': return <Reflection />;
                    default: return <WarmUp />;
                }
            };

            const NavButton = ({ id, icon: Icon, label }) => (
                <button 
                    onClick={() => setActiveTab(id)}
                    className={`flex items-center px-6 py-4 text-lg font-semibold transition-colors border-b-4 ${
                        activeTab === id 
                        ? 'border-indigo-600 text-indigo-600 bg-indigo-50' 
                        : 'border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-50'
                    }`}
                >
                    <Icon className="w-5 h-5 mr-3" />
                    <span className="hidden lg:inline">{label}</span>
                    <span className="lg:hidden">{label.split(' ')[1] || label}</span>
                </button>
            );

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="bg-white border-b shadow-sm z-10 sticky top-0">
                        <div className="max-w-6xl mx-auto px-6 py-6 flex justify-between items-center">
                            <div className="flex items-center space-x-4">
                                <div className="bg-indigo-600 text-white p-3 rounded-xl shadow-lg">
                                    <PenTool className="w-8 h-8" />
                                </div>
                                <div>
                                    <h1 className="text-3xl font-bold text-gray-900 tracking-tight">TOEFL® Writing Strategies</h1>
                                    <p className="text-base text-gray-500 uppercase tracking-wider font-bold">Lesson 1: General Introduction</p>
                                </div>
                            </div>
                        </div>
                        
                        {/* Navigation */}
                        <div className="max-w-6xl mx-auto px-6 overflow-x-auto">
                            <nav className="flex space-x-2">
                                <NavButton id="intro" icon={BookOpen} label="1. Intro & Warm-up" />
                                <NavButton id="quiz" icon={CheckCircle} label="2. Quiz" />
                                <NavButton id="types" icon={FileText} label="3. Item Types" />
                                <NavButton id="writing" icon={Clock} label="4. Timed Practice" />
                                <NavButton id="reflect" icon={HelpCircle} label="5. Reflection" />
                            </nav>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-grow max-w-6xl mx-auto w-full p-6 md:p-10">
                        {renderContent()}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
