<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEFL ITP Structure - Practice Test C</title>
    <style>
        :root {
            --primary: #0ea5e9; /* Light Blue for Structure */
            --primary-dark: #0284c7;
            --secondary: #64748b;
            --bg-light: #f8fafc;
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-light: #64748b;
            --success: #22c55e;
            --error: #ef4444;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header & Progress */
        header {
            background: var(--surface);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 24px;
            border-top: 6px solid var(--primary);
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary-dark);
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .progress-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            position: relative;
            padding: 0 10px;
        }

        .progress-track {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 4px;
            background: #e2e8f0;
            z-index: 1;
            transform: translateY(-50%);
        }

        .progress-step {
            position: relative;
            z-index: 2;
            background: #e2e8f0;
            color: var(--text-light);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .progress-step.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.4);
        }

        .progress-step.completed {
            background: var(--success);
            color: white;
        }

        /* Pages & Animations */
        .module-page {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .module-page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Homepage Styles */
        .home-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        .home-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            display: block;
        }

        .instruction-list {
            text-align: left;
            margin: 20px auto;
            max-width: 500px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        .instruction-list li {
            margin-bottom: 10px;
            list-style-position: inside;
        }

        /* Module Containers */
        .module-container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .module-header {
            background: #f0f9ff;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
        }

        .module-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .module-subtitle {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-top: 4px;
        }

        .module-content {
            padding: 24px;
        }

        /* Question Cards */
        .question-card {
            background: var(--surface);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            transition: border-color 0.3s;
        }

        .question-card.unanswered-error {
            border: 2px solid var(--error);
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .q-number {
            font-weight: 700;
            color: var(--secondary);
            background: #e2e8f0;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 500;
            margin-bottom: 20px;
            color: var(--text-main);
            font-family: 'Georgia', serif;
        }

        /* Options */
        .options-grid {
            display: grid;
            gap: 8px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            border-color: #cbd5e1;
            background: #f8fafc;
        }

        .option-input {
            margin-right: 12px;
            accent-color: var(--primary);
            transform: scale(1.1);
        }

        /* Feedback Area */
        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            display: none;
            font-size: 0.95rem;
        }

        .feedback.correct {
            background-color: #f0fdf4;
            border: 1px solid #86efac;
            color: #166534;
        }

        .feedback.incorrect {
            background-color: #fef2f2;
            border: 1px solid #fca5a5;
            color: #991b1b;
        }

        .explanation-text {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(0,0,0,0.1);
            font-weight: 500;
        }

        /* Controls */
        .controls-area {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: transparent;
            color: var(--secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #f1f5f9;
            color: var(--text-main);
        }

        .btn-next {
            background: var(--text-main);
            display: none;
        }
        
        .btn-next:hover {
            background: #000;
        }

        /* Score Summary Page */
        .summary-card {
            text-align: center;
            padding: 40px;
        }
        
        .final-score {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin: 20px 0;
        }

        .correct-answer-highlight {
            border-color: var(--success) !important;
            background-color: #dcfce7 !important;
        }
        
        .wrong-answer-highlight {
            border-color: var(--error) !important;
            background-color: #fee2e2 !important;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>TOEFL ITP Structure</h1>
        <div class="subtitle">Practice Test C</div>
        
        <div class="progress-container">
            <div class="progress-track"></div>
            <div id="step-1" class="progress-step">1</div>
            <div id="step-2" class="progress-step">2</div>
            <div id="step-3" class="progress-step">3</div>
            <div id="step-4" class="progress-step">🏁</div>
        </div>
    </header>

    <form id="quizForm">
        <div id="quiz-content">
            </div>
    </form>
</div>

<script>
    // --- QUIZ DATA ---
    const quizData = [
        { 
            id: 1, 
            question: "_______ the sudden collapse of the Mayan civilization remains a mystery to archaeologists.", 
            options: { A: "It caused", B: "That caused", C: "What caused", D: "Caused" }, 
            answer: "C", 
            explanation: "Noun clause acting as the subject. 'What caused' creates the subject clause 'What caused the sudden collapse...'" 
        },
        { 
            id: 2, 
            question: "The Amazon River _______ through several countries in South America before reaching the Atlantic Ocean.", 
            options: { A: "it travels", B: "traveling", C: "travels", D: "with traveling water" }, 
            answer: "C", 
            explanation: "The sentence needs a main verb for the singular subject 'The Amazon River'. 'Travels' is the correct verb form." 
        },
        { 
            id: 3, 
            question: "The city of Philadelphia derives its name from Greek words _______ 'brotherly love'.", 
            options: { A: "meant", B: "meaning", C: "means", D: "they mean" }, 
            answer: "B", 
            explanation: "Reduced adjective clause. 'Which mean' reduces to the active participle 'meaning'." 
        },
        { 
            id: 4, 
            question: "A flock of wild geese _______ up to several thousand birds during the winter migration.", 
            options: { A: "include", B: "it includes", C: "can include", D: "including" }, 
            answer: "C", 
            explanation: "The subject 'flock' is singular (collective noun). 'Can include' correctly provides the verb phrase without agreement issues." 
        },
        { 
            id: 5, 
            question: "_______ giant sequoia tree are surprisingly small compared to its massive trunk.", 
            options: { A: "The", B: "The seeds of the", C: "Having seeds the", D: "On the" }, 
            answer: "B", 
            explanation: "A plural subject is needed for the verb 'are'. 'The seeds of the giant sequoia tree' provides the plural subject 'seeds'." 
        },
        { 
            id: 6, 
            question: "Dolphins, _______ marine mammals, are known for their high intelligence and complex social behavior.", 
            options: { A: "being a group", B: "are a group of", C: "a group of", D: "their group is" }, 
            answer: "C", 
            explanation: "Appositive phrase. 'A group of marine mammals' renames the subject 'Dolphins'." 
        },
        { 
            id: 7, 
            question: "The ultimate financial benefit of investing in renewable energy sources _______ substantial over the long term.", 
            options: { A: "as", B: "there is", C: "it is", D: "is" }, 
            answer: "D", 
            explanation: "The main subject is 'benefit' (singular). The correct main verb required is 'is'." 
        },
        { 
            id: 8, 
            question: "Marie Curie, born in Warsaw, _______ famous for her pioneering research on radioactivity.", 
            options: { A: "and became", B: "she was", C: "became", D: "and she became" }, 
            answer: "C", 
            explanation: "A simple past tense verb is needed for the subject 'Marie Curie' to complete the main clause." 
        },
        { 
            id: 9, 
            question: "The primary function _______ the regulation of blood sugar levels.", 
            options: { A: "the pancreas is", B: "of the pancreas is", C: "of the pancreas in the body", D: "the body's pancreas" }, 
            answer: "B", 
            explanation: "This completes the subject phrase 'The primary function of the pancreas' and provides the main verb 'is'." 
        },
        { 
            id: 10, 
            question: "Once an exclusive luxury in the early twentieth century, _______ accessible to the general public today.", 
            options: { A: "was air travel", B: "air travel was", C: "it was air travel", D: "air travel is" }, 
            answer: "D", 
            explanation: "The main clause requires a subject and a verb following the introductory phrase. 'Air travel is' provides both." 
        },
        { 
            id: 11, 
            question: "A comprehensive database of the stars using observations collected by telescopes orbiting the Earth _______ regularly on a public astronomical website.", 
            options: { A: "updates", B: "updating", C: "update", D: "to update" }, 
            answer: "A", 
            explanation: "The subject is 'database' (singular), despite the long modifying phrase. The correct singular verb is 'updates'." 
        },
        { 
            id: 12, 
            question: "_______ in the solar system, Jupiter possesses an incredibly strong magnetic field.", 
            options: { A: "Is the largest planet", B: "It is the largest planet", C: "The largest planet", D: "Unlike the largest planet" }, 
            answer: "C", 
            explanation: "An appositive or modifying phrase is needed at the beginning to describe the main subject 'Jupiter'." 
        },
        { 
            id: 13, 
            question: "_______ extreme temperatures, liquid nitrogen must be handled with specialized safety equipment.", 
            options: { A: "Because", B: "Because of its", C: "It is because", D: "Because of" }, 
            answer: "B", 
            explanation: "'Because of' is a prepositional phrase showing cause, and the possessive 'its' correctly refers back to 'liquid nitrogen'." 
        },
        { 
            id: 14, 
            question: "Traditionally, the barometer is a scientific instrument _______ to measure atmospheric pressure.", 
            options: { A: "is designed", B: "designed", C: "that designed", D: "which it is designed" }, 
            answer: "B", 
            explanation: "Reduced relative clause. 'Which is designed' reduces to the passive participle 'designed'." 
        },
        { 
            id: 15, 
            question: "_______ the exact origins of the first sophisticated agricultural tools in ancient Mesopotamia.", 
            options: { A: "Little understood", B: "About little is understood", C: "Little is understood about", D: "Little understood about" }, 
            answer: "C", 
            explanation: "'Little' acts as the subject, followed by the passive verb phrase 'is understood', and the preposition 'about' connecting to the object phrase." 
        }
    ];

    const quizContent = document.getElementById('quiz-content');
    const totalScore = { 1: 0, 2: 0, 3: 0 }; 

    // Modules - Split into 3 pages of 5 questions each
    const modules = [
        { id: 1, range: [0, 5], title: "Part A: Structure", subtitle: "Questions 1 to 5" },
        { id: 2, range: [5, 10], title: "Part A: Structure (Continued)", subtitle: "Questions 6 to 10" },
        { id: 3, range: [10, 15], title: "Part A: Structure (Continued)", subtitle: "Questions 11 to 15" }
    ];

    function renderApp() {
        // 1. Render Homepage
        const homeDiv = document.createElement('div');
        homeDiv.id = 'page-home';
        homeDiv.className = 'module-page active';
        homeDiv.innerHTML = `
            <div class="home-card">
                <span class="home-icon">✍️</span>
                <h2>Welcome to Structure Practice</h2>
                <p>This test simulates Part A (Structure) of the TOEFL ITP.</p>
                
                <ul class="instruction-list">
                    <li>This part contains <strong>15 Questions</strong>.</li>
                    <li>Each sentence is incomplete.</li>
                    <li>Select the word or phrase that best completes the sentence.</li>
                    <li>You must answer all questions in a section before proceeding.</li>
                </ul>

                <button type="button" class="btn" onclick="startTest()">Start Part A &rarr;</button>
            </div>
        `;
        quizContent.appendChild(homeDiv);

        // 2. Render Modules
        modules.forEach((mod) => {
            const pageDiv = document.createElement('div');
            pageDiv.id = `page-${mod.id}`;
            pageDiv.className = `module-page`;
            
            pageDiv.innerHTML = `
                <div class="module-container">
                    <div class="module-header">
                        <div class="module-title">${mod.title}</div>
                        <div class="module-subtitle">${mod.subtitle}</div>
                    </div>
                    <div class="module-content" id="questions-area-${mod.id}">
                        </div>
                </div>
                <div class="controls-area">
                    ${mod.id > 1 ? `<button type="button" class="btn btn-secondary" onclick="goToPreviousPage(${mod.id})">&larr; Previous Page</button>` : '<span></span>'}
                    
                    <div>
                        <button type="button" id="submit-btn-${mod.id}" class="btn" onclick="submitModule(${mod.id}, ${mod.range[0]}, ${mod.range[1]})">
                            Submit Answers
                        </button>
                        <button type="button" id="next-btn-${mod.id}" class="btn btn-next" onclick="goToNextPage(${mod.id})">
                            Proceed &rarr;
                        </button>
                    </div>
                </div>
            `;
            quizContent.appendChild(pageDiv);

            // Render Questions
            const qContainer = pageDiv.querySelector(`#questions-area-${mod.id}`);
            const slice = quizData.slice(mod.range[0], mod.range[1]);

            slice.forEach((q) => {
                const card = document.createElement('div');
                card.id = `card-${q.id}`;
                card.className = 'question-card';
                
                card.innerHTML = `
                    <div class="question-header">
                        <span class="q-number">Question ${q.id}</span>
                    </div>
                    <div class="question-text">${q.question}</div>
                    <div class="options-grid">
                        ${Object.entries(q.options).map(([key, value]) => `
                            <label class="option-label" id="label-${q.id}-${key}">
                                <input type="radio" name="q${q.id}" value="${key}" class="option-input" onclick="clearError(${q.id})">
                                <span><strong>(${key})</strong> ${value}</span>
                            </label>
                        `).join('')}
                    </div>
                    
                    <div id="feedback-${q.id}" class="feedback"></div>
                `;
                qContainer.appendChild(card);
            });
        });

        // 3. Render Summary Page (Hidden)
        const summaryDiv = document.createElement('div');
        summaryDiv.id = `page-summary`;
        summaryDiv.className = `module-page`;
        summaryDiv.innerHTML = `
            <div class="module-container summary-card">
                <h2>Structure Part A Completed!</h2>
                <p>You have finished the Structure section.</p>
                <div class="final-score" id="total-score-display">--/15</div>
                
                <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                    <button type="button" class="btn btn-secondary" onclick="goToPreviousPage(4)">Review Answers</button>
                    <button type="button" class="btn" onclick="location.reload()">Start Over</button>
                </div>
            </div>
        `;
        quizContent.appendChild(summaryDiv);
    }

    function startTest() {
        document.getElementById('page-home').classList.remove('active');
        document.getElementById('page-1').classList.add('active');
        document.getElementById('step-1').classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function clearError(id) {
        const card = document.getElementById(`card-${id}`);
        if(card) card.classList.remove('unanswered-error');
    }

    function submitModule(modId, start, end) {
        const moduleQuestions = quizData.slice(start, end);
        let unansweredCount = 0;
        let firstUnansweredId = null;

        // 1. Validation
        moduleQuestions.forEach(q => {
            const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
            if (!selected) {
                unansweredCount++;
                const card = document.getElementById(`card-${q.id}`);
                card.classList.add('unanswered-error');
                if (!firstUnansweredId) firstUnansweredId = q.id;
            }
        });

        if (unansweredCount > 0) {
            alert(`Please answer all questions in this section before submitting.`);
            if (firstUnansweredId) {
                document.getElementById(`card-${firstUnansweredId}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            return;
        }

        // 2. Grading & Feedback
        let modScore = 0;
        moduleQuestions.forEach(q => {
            const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
            const feedbackEl = document.getElementById(`feedback-${q.id}`);
            
            // Reset styles
            Object.keys(q.options).forEach(key => {
                document.getElementById(`label-${q.id}-${key}`).classList.remove('correct-answer-highlight', 'wrong-answer-highlight');
            });

            // Logic
            if (selected.value === q.answer) {
                modScore++;
                feedbackEl.className = "feedback correct";
                feedbackEl.innerHTML = `<strong>Correct!</strong> <div class="explanation-text">${q.explanation}</div>`;
                document.getElementById(`label-${q.id}-${q.answer}`).classList.add('correct-answer-highlight');
            } else {
                feedbackEl.className = "feedback incorrect";
                feedbackEl.innerHTML = `<strong>Incorrect.</strong> The correct answer is <strong>(${q.answer})</strong>. <div class="explanation-text">${q.explanation}</div>`;
                document.getElementById(`label-${q.id}-${selected.value}`).classList.add('wrong-answer-highlight');
                document.getElementById(`label-${q.id}-${q.answer}`).classList.add('correct-answer-highlight');
            }
            feedbackEl.style.display = 'block';
            
            // Lock inputs
            const inputs = document.querySelectorAll(`input[name="q${q.id}"]`);
            inputs.forEach(i => i.disabled = true);
        });

        // 3. Save Score & UI Transition
        totalScore[modId] = modScore;
        
        // Hide Submit, Show Next
        document.getElementById(`submit-btn-${modId}`).style.display = 'none';
        
        const nextBtn = document.getElementById(`next-btn-${modId}`);
        if(modId === 3) {
            nextBtn.innerHTML = "Finish & View Score";
        }
        nextBtn.style.display = 'inline-flex';

        // Update Step Indicator to Completed
        document.getElementById(`step-${modId}`).classList.remove('active');
        document.getElementById(`step-${modId}`).classList.add('completed');
        
        // Scroll top
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goToNextPage(currentModId) {
        document.getElementById(`page-${currentModId}`).classList.remove('active');
        
        if (currentModId < 3) {
            const nextId = currentModId + 1;
            document.getElementById(`page-${nextId}`).classList.add('active');
            document.getElementById(`step-${nextId}`).classList.add('active');
        } else {
            document.getElementById(`page-summary`).classList.add('active');
            document.getElementById(`step-4`).classList.add('completed');
            
            const total = totalScore[1] + totalScore[2] + totalScore[3];
            document.getElementById('total-score-display').innerText = `${total} / 15`;
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goToPreviousPage(currentModId) {
        // 1. Hide Current
        if (currentModId === 4) { // Summary page
            document.getElementById(`page-summary`).classList.remove('active');
            document.getElementById(`step-4`).classList.remove('completed');
        } else {
            document.getElementById(`page-${currentModId}`).classList.remove('active');
            document.getElementById(`step-${currentModId}`).classList.remove('active');
        }

        // 2. Show Previous
        const prevId = currentModId - 1;
        document.getElementById(`page-${prevId}`).classList.add('active');
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderApp();
</script>

</body>
</html>
