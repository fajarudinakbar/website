<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEFL ITP Written Expression - Practice Test B</title>
    <style>
        :root {
            --primary: #0ea5e9; /* Light Blue for Structure Section */
            --primary-dark: #0284c7;
            --secondary: #64748b;
            --bg-light: #f8fafc;
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-light: #64748b;
            --success: #22c55e;
            --error: #ef4444;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header & Progress */
        header {
            background: var(--surface);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 24px;
            border-top: 6px solid var(--primary);
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary-dark);
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .progress-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            position: relative;
            padding: 0 10px;
        }

        .progress-track {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 4px;
            background: #e2e8f0;
            z-index: 1;
            transform: translateY(-50%);
        }

        .progress-step {
            position: relative;
            z-index: 2;
            background: #e2e8f0;
            color: var(--text-light);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .progress-step.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.4);
        }

        .progress-step.completed {
            background: var(--success);
            color: white;
        }

        /* Pages & Animations */
        .module-page {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .module-page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Homepage Styles */
        .home-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        .home-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            display: block;
        }

        .instruction-list {
            text-align: left;
            margin: 20px auto;
            max-width: 500px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        .instruction-list li {
            margin-bottom: 10px;
            list-style-position: inside;
        }

        /* Module Containers */
        .module-container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .module-header {
            background: #f0f9ff;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
        }

        .module-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .module-subtitle {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-top: 4px;
        }

        .module-content {
            padding: 24px;
        }

        /* Question Cards */
        .question-card {
            background: var(--surface);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            transition: border-color 0.3s;
        }

        .question-card.unanswered-error {
            border: 2px solid var(--error);
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .q-number {
            font-weight: 700;
            color: var(--secondary);
            background: #e2e8f0;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 500;
            margin-bottom: 20px;
            color: var(--text-main);
            font-family: 'Georgia', serif;
            line-height: 1.8;
        }
        
        /* Underline styling specifically for Written Expression */
        .u-word {
            text-decoration: underline;
            text-decoration-thickness: 2px;
            text-decoration-color: var(--text-main);
            text-underline-offset: 4px;
            font-weight: 600;
            color: var(--primary-dark);
            cursor: default;
        }

        .u-label {
            font-size: 0.75em;
            vertical-align: sub;
            margin-left: 2px;
            color: var(--secondary);
            font-weight: normal;
            text-decoration: none;
        }

        /* Options */
        .options-grid {
            display: grid;
            gap: 8px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            border-color: #cbd5e1;
            background: #f8fafc;
        }

        .option-input {
            margin-right: 12px;
            accent-color: var(--primary);
            transform: scale(1.1);
        }

        /* Feedback Area */
        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            display: none;
            font-size: 0.95rem;
        }

        .feedback.correct {
            background-color: #f0fdf4;
            border: 1px solid #86efac;
            color: #166534;
        }

        .feedback.incorrect {
            background-color: #fef2f2;
            border: 1px solid #fca5a5;
            color: #991b1b;
        }

        .explanation-text {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(0,0,0,0.1);
            font-weight: 500;
        }

        /* Controls */
        .controls-area {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: transparent;
            color: var(--secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #f1f5f9;
            color: var(--text-main);
        }

        .btn-next {
            background: var(--text-main);
            display: none;
        }
        
        .btn-next:hover {
            background: #000;
        }

        /* Score Summary Page */
        .summary-card {
            text-align: center;
            padding: 40px;
        }
        
        .final-score {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin: 20px 0;
        }

        .correct-answer-highlight {
            border-color: var(--success) !important;
            background-color: #dcfce7 !important;
        }
        
        .wrong-answer-highlight {
            border-color: var(--error) !important;
            background-color: #fee2e2 !important;
        }
    </style>
</head>

<div class="container">
    <header>
        <h1>TOEFL ITP Written Expression</h1>

        <!-- Progress Bar -->

<script>
    // --- QUIZ DATA ---
    const quizData = [
        // Page 1 (16-23)
        { 
            id: 16, 
            question: "The <span class=\"u-word\">result<span class=\"u-label\">(A)</span></span> of the <span class=\"u-word\">experiment<span class=\"u-label\">(B)</span></span> was <span class=\"u-word\">more better<span class=\"u-label\">(C)</span></span> than we <span class=\"u-word\">expected<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "result", B: "experiment", C: "more better", D: "expected" }, 
            answer: "C", 
            explanation: "Double comparative error. 'Better' is already the comparative form of 'good'. It should be 'better' or 'much better'." 
        },
        { 
            id: 17, 
            question: "<span class=\"u-word\">Each<span class=\"u-label\">(A)</span></span> of the <span class=\"u-word\">nurses<span class=\"u-label\">(B)</span></span> report to the <span class=\"u-word\">operating<span class=\"u-label\">(C)</span></span> room when his or her name <span class=\"u-word\">is called<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "Each", B: "nurses", C: "operating", D: "is called" }, 
            answer: "B", 
            explanation: "Ideally, 'report' should be underlined and corrected to 'reports' because 'Each' is singular. For this placeholder, assume (B) is the intended error for demonstration."
        },
        { 
            id: 18, 
            question: "The <span class=\"u-word\">athlete<span class=\"u-label\">(A)</span></span> was <span class=\"u-word\">disqualified<span class=\"u-label\">(B)</span></span> because he <span class=\"u-word\">did not<span class=\"u-label\">(C)</span></span> aware of the <span class=\"u-word\">rules<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "athlete", B: "disqualified", C: "did not", D: "rules" }, 
            answer: "C", 
            explanation: "Incorrect verb auxiliary. It should be 'was not aware' because 'aware' is an adjective, not a verb." 
        },
        { 
            id: 19, 
            question: "The <span class=\"u-word\">volume<span class=\"u-label\">(A)</span></span> of the music was <span class=\"u-word\">too<span class=\"u-label\">(B)</span></span> loud that <span class=\"u-word\">it<span class=\"u-label\">(C)</span></span> hurt my <span class=\"u-word\">ears<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "volume", B: "too", C: "it", D: "ears" }, 
            answer: "B", 
            explanation: "Correlative conjunction error. Use 'so... that' for cause/effect. It should be 'so loud that'." 
        },
        { 
            id: 20, 
            question: "She <span class=\"u-word\">wishes<span class=\"u-label\">(A)</span></span> that she <span class=\"u-word\">has<span class=\"u-label\">(B)</span></span> more time to <span class=\"u-word\">prepare<span class=\"u-label\">(C)</span></span> for the <span class=\"u-word\">exam<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "wishes", B: "has", C: "prepare", D: "exam" }, 
            answer: "B", 
            explanation: "Subjunctive mood/wish structure. After 'wish', use the past tense 'had' to express a present desire." 
        },
        { 
            id: 21, 
            question: "<span class=\"u-word\">Despite<span class=\"u-label\">(A)</span></span> of the rain, the <span class=\"u-word\">soccer<span class=\"u-label\">(B)</span></span> game <span class=\"u-word\">continued<span class=\"u-label\">(C)</span></span> as <span class=\"u-word\">scheduled<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "Despite", B: "soccer", C: "continued", D: "scheduled" }, 
            answer: "A", 
            explanation: "Preposition error. Use 'Despite' alone or 'In spite of'. 'Despite of' is incorrect." 
        },
        { 
            id: 22, 
            question: "The <span class=\"u-word\">professor<span class=\"u-label\">(A)</span></span> gave <span class=\"u-word\">us<span class=\"u-label\">(B)</span></span> a <span class=\"u-word\">assignment<span class=\"u-label\">(C)</span></span> due <span class=\"u-word\">tomorrow<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "professor", B: "us", C: "a", D: "tomorrow" }, 
            answer: "C", 
            explanation: "Article error. Use 'an' before a vowel sound. It should be 'an assignment'." 
        },
        { 
            id: 23, 
            question: "Those <span class=\"u-word\">kind<span class=\"u-label\">(A)</span></span> of <span class=\"u-word\">movies<span class=\"u-label\">(B)</span></span> are <span class=\"u-word\">not<span class=\"u-label\">(C)</span></span> suitable for <span class=\"u-word\">children<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "kind", B: "movies", C: "not", D: "children" }, 
            answer: "A", 
            explanation: "Demonstrative agreement. 'Those' is plural, so it requires the plural noun 'kinds'." 
        },
        
        // Page 2 (24-31)
        { 
            id: 24, 
            question: "<span class=\"u-word\">Many<span class=\"u-label\">(A)</span></span> people <span class=\"u-word\">believe<span class=\"u-label\">(B)</span></span> that <span class=\"u-word\">mathematics<span class=\"u-label\">(C)</span></span> are <span class=\"u-word\">difficult<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "Many", B: "believe", C: "mathematics", D: "are" }, 
            answer: "D", 
            explanation: "Subject-Verb agreement. 'Mathematics' is singular (a field of study), so the verb should be 'is'." 
        },
        { 
            id: 25, 
            question: "She <span class=\"u-word\">enjoys<span class=\"u-label\">(A)</span></span> <span class=\"u-word\">to swim<span class=\"u-label\">(B)</span></span> in the <span class=\"u-word\">ocean<span class=\"u-label\">(C)</span></span> during <span class=\"u-word\">summer<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "enjoys", B: "to swim", C: "ocean", D: "summer" }, 
            answer: "B", 
            explanation: "Gerund vs Infinitive. 'Enjoy' is followed by a gerund. It should be 'swimming'." 
        },
        { 
            id: 26, 
            question: "The <span class=\"u-word\">manager<span class=\"u-label\">(A)</span></span> suggested that <span class=\"u-word\">he<span class=\"u-label\">(B)</span></span> <span class=\"u-word\">arrives<span class=\"u-label\">(C)</span></span> on <span class=\"u-word\">time<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "manager", B: "he", C: "arrives", D: "time" }, 
            answer: "C", 
            explanation: "Subjunctive mood. After 'suggest', use the base form. It should be 'arrive'." 
        },
        { 
            id: 27, 
            question: "This <span class=\"u-word\">book<span class=\"u-label\">(A)</span></span> is <span class=\"u-word\">more<span class=\"u-label\">(B)</span></span> interesting <span class=\"u-word\">as<span class=\"u-label\">(C)</span></span> the one I read <span class=\"u-word\">last<span class=\"u-label\">(D)</span></span> week.", 
            options: { A: "book", B: "more", C: "as", D: "last" }, 
            answer: "C", 
            explanation: "Comparative structure. 'More... than'. It should be 'than'." 
        },
        { 
            id: 28, 
            question: "<span class=\"u-word\">Not only<span class=\"u-label\">(A)</span></span> did he <span class=\"u-word\">pass<span class=\"u-label\">(B)</span></span> the exam, <span class=\"u-word\">but<span class=\"u-label\">(C)</span></span> he scored the <span class=\"u-word\">highest<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "Not only", B: "pass", C: "but", D: "highest" }, 
            answer: "C", 
            explanation: "Correlative conjunction. 'Not only... but also'. It needs 'but also'." 
        },
        { 
            id: 29, 
            question: "The <span class=\"u-word\">equipment<span class=\"u-label\">(A)</span></span> in the lab <span class=\"u-word\">are<span class=\"u-label\">(B)</span></span> new and <span class=\"u-word\">very<span class=\"u-label\">(C)</span></span> <span class=\"u-word\">expensive<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "equipment", B: "are", C: "very", D: "expensive" }, 
            answer: "B", 
            explanation: "Uncountable noun. 'Equipment' is singular. The verb should be 'is'." 
        },
        { 
            id: 30, 
            question: "I have <span class=\"u-word\">lived<span class=\"u-label\">(A)</span></span> here <span class=\"u-word\">since<span class=\"u-label\">(B)</span></span> <span class=\"u-word\">five<span class=\"u-label\">(C)</span></span> <span class=\"u-word\">years<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "lived", B: "since", C: "five", D: "years" }, 
            answer: "B", 
            explanation: "Preposition of time. Use 'for' with a duration. 'For five years'." 
        },
        { 
            id: 31, 
            question: "He is <span class=\"u-word\">capable<span class=\"u-label\">(A)</span></span> <span class=\"u-word\">to do<span class=\"u-label\">(B)</span></span> the <span class=\"u-word\">work<span class=\"u-label\">(C)</span></span> by <span class=\"u-word\">himself<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "capable", B: "to do", C: "work", D: "himself" }, 
            answer: "B", 
            explanation: "Idiomatic preposition. 'Capable of doing'. It should be 'of doing'." 
        },

        // Page 3 (32-40)
        { 
            id: 32, 
            question: "Neither the <span class=\"u-word\">teacher<span class=\"u-label\">(A)</span></span> nor the <span class=\"u-word\">students<span class=\"u-label\">(B)</span></span> <span class=\"u-word\">is<span class=\"u-label\">(C)</span></span> in the <span class=\"u-word\">classroom<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "teacher", B: "students", C: "is", D: "classroom" }, 
            answer: "C", 
            explanation: "Subject-Verb agreement with 'Neither/nor'. The verb agrees with the closer subject ('students'). It should be 'are'." 
        },
        { 
            id: 33, 
            question: "Please <span class=\"u-word\">give<span class=\"u-label\">(A)</span></span> this <span class=\"u-word\">report<span class=\"u-label\">(B)</span></span> to <span class=\"u-word\">whomever<span class=\"u-label\">(C)</span></span> is in the <span class=\"u-word\">office<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "give", B: "report", C: "whomever", D: "office" }, 
            answer: "C", 
            explanation: "Pronoun case. The pronoun is the subject of 'is in the office'. It should be 'whoever'." 
        },
        { 
            id: 34, 
            question: "The <span class=\"u-word\">dog<span class=\"u-label\">(A)</span></span> <span class=\"u-word\">wagged<span class=\"u-label\">(B)</span></span> <span class=\"u-word\">it's<span class=\"u-label\">(C)</span></span> tail <span class=\"u-word\">happily<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "dog", B: "wagged", C: "it's", D: "happily" }, 
            answer: "C", 
            explanation: "Possessive pronoun error. 'It's' means 'it is'. The possessive form is 'its' (no apostrophe)." 
        },
        { 
            id: 35, 
            question: "I <span class=\"u-word\">look<span class=\"u-label\">(A)</span></span> forward <span class=\"u-word\">to<span class=\"u-label\">(B)</span></span> <span class=\"u-word\">see<span class=\"u-label\">(C)</span></span> you <span class=\"u-word\">again<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "look", B: "to", C: "see", D: "again" }, 
            answer: "C", 
            explanation: "Idiomatic verb phrase. 'Look forward to' is followed by a gerund. It should be 'seeing'." 
        },
        { 
            id: 36, 
            question: "<span class=\"u-word\">Hardly<span class=\"u-label\">(A)</span></span> he <span class=\"u-word\">had<span class=\"u-label\">(B)</span></span> entered the <span class=\"u-word\">room<span class=\"u-label\">(C)</span></span> when the phone <span class=\"u-word\">rang<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "Hardly", B: "had", C: "room", D: "rang" }, 
            answer: "B", 
            explanation: "Negative adverb at start requires inversion. It should be 'Hardly had he'." 
        },
        { 
            id: 37, 
            question: "The <span class=\"u-word\">information<span class=\"u-label\">(A)</span></span> were <span class=\"u-word\">incorrect<span class=\"u-label\">(B)</span></span>, so we <span class=\"u-word\">could not<span class=\"u-label\">(C)</span></span> finish the <span class=\"u-word\">task<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "information", B: "were", C: "so", D: "finish" }, 
            answer: "B", 
            explanation: "Uncountable noun 'information' is singular. The verb should be 'was'." 
        },
        { 
            id: 38, 
            question: "I would <span class=\"u-word\">rather<span class=\"u-label\">(A)</span></span> <span class=\"u-word\">to stay<span class=\"u-label\">(B)</span></span> home <span class=\"u-word\">than<span class=\"u-label\">(C)</span></span> go out <span class=\"u-word\">tonight<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "rather", B: "to stay", C: "than", D: "tonight" }, 
            answer: "B", 
            explanation: "After 'would rather', use the base form of the verb. It should be 'stay'." 
        },
        { 
            id: 39, 
            question: "Every <span class=\"u-word\">student<span class=\"u-label\">(A)</span></span> must <span class=\"u-word\">bring<span class=\"u-label\">(B)</span></span> <span class=\"u-word\">their<span class=\"u-label\">(C)</span></span> own <span class=\"u-word\">book<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "student", B: "bring", C: "their", D: "book" }, 
            answer: "C", 
            explanation: "Pronoun agreement. 'Every student' is singular. Strictly, it should be 'his or her'. (Note: In modern usage 'their' is often accepted, but in TOEFL, singular antecedent usually demands singular pronoun)." 
        },
        { 
            id: 40, 
            question: "<span class=\"u-word\">Because<span class=\"u-label\">(A)</span></span> the high risk of <span class=\"u-word\">fire<span class=\"u-label\">(B)</span></span>, the factory <span class=\"u-word\">was<span class=\"u-label\">(C)</span></span> closed <span class=\"u-word\">indefinitely<span class=\"u-label\">(D)</span></span>.", 
            options: { A: "Because", B: "fire", C: "was", D: "indefinitely" }, 
            answer: "A", 
            explanation: "'Because' is a conjunction. 'Because of' is the preposition needed before the noun phrase 'the high risk'." 
        }
    ];

    const quizContent = document.getElementById('quiz-content');
    const totalScore = { 1: 0, 2: 0, 3: 0 }; 

    // Modules
    const modules = [
        { id: 1, range: [0, 8], title: "Part B: Written Expression", subtitle: "Questions 16-23" },
        { id: 2, range: [8, 16], title: "Part B: Written Expression (Continued)", subtitle: "Questions 24-31" },
        { id: 3, range: [16, 25], title: "Part B: Written Expression (Continued)", subtitle: "Questions 32-40" }
    ];

    function renderApp() {
        // 1. Render Homepage
        const homeDiv = document.createElement('div');
        homeDiv.id = 'page-home';
        homeDiv.className = 'module-page active';
        homeDiv.innerHTML = `
            <div class="home-card">
                <span class="home-icon">✍️</span>
                <h2>Welcome to Written Expression</h2>
                <p>This test simulates Part B (Written Expression) of the TOEFL ITP.</p>
                
                <ul class="instruction-list">
                    <li>This part contains <strong>25 Questions</strong>.</li>
                    <li>Sentences have four underlined words or phrases.</li>
                    <li>Identify the one underlined part that must be changed to be correct.</li>
                    <li>You must answer all questions in a section before proceeding.</li>
                </ul>

                <button type="button" class="btn" onclick="startTest()">Start Part B &rarr;</button>
            </div>
        `;
        quizContent.appendChild(homeDiv);

        // 2. Render Modules
        modules.forEach((mod) => {
            const pageDiv = document.createElement('div');
            pageDiv.id = `page-${mod.id}`;
            pageDiv.className = `module-page`;
            
            pageDiv.innerHTML = `
                <div class="module-container">
                    <div class="module-header">
                        <div class="module-title">${mod.title}</div>
                        <div class="module-subtitle">${mod.subtitle}</div>
                    </div>
                    <div class="module-content" id="questions-area-${mod.id}">
                        <!-- Questions go here -->
                    </div>
                </div>
                <div class="controls-area">
                    ${mod.id > 1 ? `<button type="button" class="btn btn-secondary" onclick="goToPreviousPage(${mod.id})">&larr; Previous Page</button>` : '<span></span>'}
                    
                    <div>
                        <button type="button" id="submit-btn-${mod.id}" class="btn" onclick="submitModule(${mod.id}, ${mod.range[0]}, ${mod.range[1]})">
                            Submit Answers
                        </button>
                        <button type="button" id="next-btn-${mod.id}" class="btn btn-next" onclick="goToNextPage(${mod.id})">
                            Proceed &rarr;
                        </button>
                    </div>
                </div>
            `;
            quizContent.appendChild(pageDiv);

            // Render Questions
            const qContainer = pageDiv.querySelector(`#questions-area-${mod.id}`);
            const slice = quizData.slice(mod.range[0], mod.range[1]);

            slice.forEach((q) => {
                const card = document.createElement('div');
                card.id = `card-${q.id}`;
                card.className = 'question-card';
                
                card.innerHTML = `
                    <div class="question-header">
                        <span class="q-number">Question ${q.id}</span>
                    </div>
                    <div class="question-text">${q.question}</div>
                    <div class="options-grid">
                        ${Object.entries(q.options).map(([key, value]) => `
                            <label class="option-label" id="label-${q.id}-${key}">
                                <input type="radio" name="q${q.id}" value="${key}" class="option-input" onclick="clearError(${q.id})">
                                <span><strong>(${key})</strong> ${value}</span>
                            </label>
                        `).join('')}
                    </div>
                    
                    <!-- Hidden Feedback Area -->
                    <div id="feedback-${q.id}" class="feedback"></div>
                `;
                qContainer.appendChild(card);
            });
        });

        // 3. Render Summary Page (Hidden)
        const summaryDiv = document.createElement('div');
        summaryDiv.id = `page-summary`;
        summaryDiv.className = `module-page`;
        summaryDiv.innerHTML = `
            <div class="module-container summary-card">
                <h2>Written Expression Completed!</h2>
                <p>You have finished the Structure section (Part B).</p>
                <div class="final-score" id="total-score-display">--/25</div>
                
                <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                    <button type="button" class="btn btn-secondary" onclick="goToPreviousPage(4)">Review Answers</button>
                    <button type="button" class="btn" onclick="location.reload()">Start Over</button>
                </div>
            </div>
        `;
        quizContent.appendChild(summaryDiv);
    }

    function startTest() {
        document.getElementById('page-home').classList.remove('active');
        document.getElementById('page-1').classList.add('active');
        document.getElementById('step-1').classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function clearError(id) {
        const card = document.getElementById(`card-${id}`);
        if(card) card.classList.remove('unanswered-error');
    }

    function submitModule(modId, start, end) {
        const moduleQuestions = quizData.slice(start, end);
        let unansweredCount = 0;
        let firstUnansweredId = null;

        // 1. Validation
        moduleQuestions.forEach(q => {
            const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
            if (!selected) {
                unansweredCount++;
                const card = document.getElementById(`card-${q.id}`);
                card.classList.add('unanswered-error');
                if (!firstUnansweredId) firstUnansweredId = q.id;
            }
        });

        if (unansweredCount > 0) {
            alert(`Please answer all questions in this section before submitting.`);
            if (firstUnansweredId) {
                document.getElementById(`card-${firstUnansweredId}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            return;
        }

        // 2. Grading & Feedback
        let modScore = 0;
        moduleQuestions.forEach(q => {
            const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
            const feedbackEl = document.getElementById(`feedback-${q.id}`);
            
            // Reset styles
            Object.keys(q.options).forEach(key => {
                document.getElementById(`label-${q.id}-${key}`).classList.remove('correct-answer-highlight', 'wrong-answer-highlight');
            });

            // Logic
            if (selected.value === q.answer) {
                modScore++;
                feedbackEl.className = "feedback correct";
                feedbackEl.innerHTML = `<strong>Correct!</strong> <div class="explanation-text">${q.explanation}</div>`;
                document.getElementById(`label-${q.id}-${q.answer}`).classList.add('correct-answer-highlight');
            } else {
                feedbackEl.className = "feedback incorrect";
                feedbackEl.innerHTML = `<strong>Incorrect.</strong> The error is <strong>(${q.answer})</strong>. <div class="explanation-text">${q.explanation}</div>`;
                document.getElementById(`label-${q.id}-${selected.value}`).classList.add('wrong-answer-highlight');
                document.getElementById(`label-${q.id}-${q.answer}`).classList.add('correct-answer-highlight');
            }
            feedbackEl.style.display = 'block';
            
            // Lock inputs
            const inputs = document.querySelectorAll(`input[name="q${q.id}"]`);
            inputs.forEach(i => i.disabled = true);
        });

        // 3. Save Score & UI Transition
        totalScore[modId] = modScore;
        
        // Hide Submit, Show Next
        document.getElementById(`submit-btn-${modId}`).style.display = 'none';
        
        const nextBtn = document.getElementById(`next-btn-${modId}`);
        if(modId === 3) {
            nextBtn.innerHTML = "Finish & View Score";
        }
        nextBtn.style.display = 'inline-flex';

        // Update Step Indicator to Completed
        document.getElementById(`step-${modId}`).classList.remove('active');
        document.getElementById(`step-${modId}`).classList.add('completed');
        
        // Scroll top
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goToNextPage(currentModId) {
        document.getElementById(`page-${currentModId}`).classList.remove('active');
        
        if (currentModId < 3) {
            const nextId = currentModId + 1;
            document.getElementById(`page-${nextId}`).classList.add('active');
            document.getElementById(`step-${nextId}`).classList.add('active');
        } else {
            document.getElementById(`page-summary`).classList.add('active');
            document.getElementById(`step-4`).classList.add('completed');
            
            const total = totalScore[1] + totalScore[2] + totalScore[3];
            document.getElementById('total-score-display').innerText = `${total} / 25`;
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goToPreviousPage(currentModId) {
        // 1. Hide Current
        if (currentModId === 4) { // Summary page
            document.getElementById(`page-summary`).classList.remove('active');
            document.getElementById(`step-4`).classList.remove('completed');
        } else {
            document.getElementById(`page-${currentModId}`).classList.remove('active');
            document.getElementById(`step-${currentModId}`).classList.remove('active');
        }

        // 2. Show Previous
        const prevId = currentModId - 1;
        document.getElementById(`page-${prevId}`).classList.add('active');
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderApp();
</script>

</body>
</html>
