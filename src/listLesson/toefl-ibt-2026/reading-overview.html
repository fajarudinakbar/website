<html lang="en">
<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        purple: {
                            50: '#F5F5FF',

                            700: '#8A8CFF', // Main theme color from your image

    <!-- Lucide Icons -->

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Custom scrollbar for reading pane */
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- App Container -->
    <div id="app"></div>

    <script>
        // --- DATA STRUCTURE WITH EXPLANATIONS ---
        const lessonData = {
            title: "Reading Section, Module 1",
            sections: [
                {
                    id: "m1_cloze",
                    type: "cloze",
                    title: "Fill in the missing letters (second half of the word).",
                    text: "We know from drawings that have been preserved in caves for over 10,000 years that early humans performed dances as a group activity. We %1% think %2% prehistoric %3% concentrated %4% on %5% survival. %6%, it %7% clear %8% the %9% that %10% was important to them. They recorded more drawings of dances than of any other group activity. Dances served various purposes, including ritualistic communication with the divine, storytelling, and social cohesion.",
                    blanks: [
                        { id: 1, prefix: "mi", suffix: "", answer: "might", explanation: "We use the modal verb 'might' to express a possibility or assumption about what we think." },
                        { id: 2, prefix: "th", suffix: "", answer: "that", explanation: "'That' acts as a conjunction here, introducing the noun clause 'prehistoric people concentrated...' after the verb 'think'." },
                        { id: 3, prefix: "peo", suffix: "", answer: "people", explanation: "Refers to the 'early humans' mentioned in the previous sentence." },
                        { id: 4, prefix: "on", suffix: "", answer: "only", explanation: "The adverb 'only' modifies the prepositional phrase 'on basic survival', meaning 'exclusively'." },
                        { id: 5, prefix: "ba", suffix: "", answer: "basic", explanation: "The adjective 'basic' describes the fundamental level of 'survival'." },
                        { id: 6, prefix: "How", suffix: "", answer: "However", explanation: "This conjunctive adverb is used to introduce a contrast between our assumption (they only cared about survival) and the evidence." },
                        { id: 7, prefix: "i", suffix: "", answer: "is", explanation: "The singular 'be' verb 'is' matches the dummy subject 'it' (it is clear)." },
                        { id: 8, prefix: "fr", suffix: "", answer: "from", explanation: "The preposition 'from' indicates the source of the evidence ('from the record')." },
                        { id: 9, prefix: "rec", suffix: "", answer: "record", explanation: "Refers to the historical or archaeological 'record' (the cave drawings)." },
                        { id: 10, prefix: "dan", suffix: "", answer: "dancing", explanation: "The gerund 'dancing' functions as the subject of the clause 'that dancing was important'." }
                    ]
                },
                {
                    id: "m1_reading1",
                    type: "reading",
                    format: "notice",
                    title: "Read in Daily Life",
                    passageTitle: "Municipal Charter",
                    passageContent: `Sign up for paperless billing statements today.\n\nSafe, convenient, easy. Enroll in paperless billing to receive monthly savings account statements in an electronic PDF document. Access your Municipal Charter account through the mobile app and select account preferences in the upper right-hand corner to enroll.`,
                    questions: [
                        {
                            id: 11,
                            text: "What type of business issued the notice?",
                            options: [
                                "An Internet provider",
                                "A computer company",
                                "A paper company",
                                "A bank"
                            ],
                            correctAnswer: 3,
                            explanation: "The text mentions receiving 'monthly <strong>savings account</strong> statements'. Savings accounts are financial products provided by <strong>banks</strong>."
                        },
                        {
                            id: 12,
                            text: "How can customers enroll in paperless billing?",
                            options: [
                                "By visiting a Municipal Charter office",
                                "By accessing the Municipal Charter website",
                                "By using the Municipal Charter app",
                                "By calling a Municipal Charter customer service representative"
                            ],
                            correctAnswer: 2,
                            explanation: "The text explicitly states: 'Access your Municipal Charter account through the <strong>mobile app</strong>... to enroll.'"
                        }
                    ]
                },
                {
                    id: "m1_reading2",
                    type: "reading",
                    format: "social",
                    title: "Read in Daily Life",
                    passageTitle: "Sofia Baker",
                    passageContent: `Every Saturday, our local farmer's market is the place to be! Fresh fruits, veggies, homemade goodies, and unique crafts await you. The Thompson family's organic produce is a must-try, known for its quality and cordial service. Their stall is always bustling with customers eager to buy fresh, pesticide-free vegetables from the welcoming staff.\n\nDon't miss the bakery stall—get there early for the best bread and pastries, including gluten-free and vegan options. The smell of freshly baked goods fills the air, and these treats sell out fast!\n\nIn addition to food, the market sells handmade crafts like jewelry, pottery, and textiles. These unique items make perfect gifts and support local artisans. Plus, enjoy live music while you shop. Talented local musicians help create a vibrant atmosphere, and the community spirit makes it a delightful experience for all. See you there!`,
                    questions: [
                        {
                            id: 13,
                            text: "What is the main purpose of the post?",
                            options: [
                                "To explain the benefits of organic farming",
                                "To describe the variety of products available at the farmer's market",
                                "To compare different farmer's markets in the area",
                                "To offer advice on starting a stall at the farmer's market"
                            ],
                            correctAnswer: 1,
                            explanation: "Sofia's post acts as a general promotion, listing the different things you can find there: fresh produce, bakery items, handmade crafts, and live music. It serves to <strong>describe the variety</strong> of the market."
                        },
                        {
                            id: 14,
                            text: "What reason is given for the popularity of the Thompson family's stall?",
                            options: [
                                "They offer cooking tips and recipes.",
                                "They offer the lowest prices at the market.",
                                "They provide friendly service and excellent products.",
                                "They have a beautiful and well-decorated stall."
                            ],
                            correctAnswer: 2,
                            explanation: "The post states their produce is 'known for its <strong>quality</strong> and <strong>cordial [friendly] service</strong>,' and mentions 'welcoming staff'."
                        },
                        {
                            id: 15,
                            text: "Why do customers go to the bakery stall early?",
                            options: [
                                "To get the free samples given in mornings",
                                "To get freshly baked bread and pastries before they are gone",
                                "To meet the famous baker",
                                "To take advantage of early morning discounts"
                            ],
                            correctAnswer: 1,
                            explanation: "The text advises to get there early because 'these treats <strong>sell out fast</strong>!'"
                        }
                    ]
                },
                {
                    id: "m1_academic",
                    type: "reading",
                    title: "Read an Academic Passage",
                    passageTitle: "The Mirror Test",
                    passageContent: `Very young children cannot recognize themselves in a mirror; they usually achieve this milestone around 18 months of age. The ability to recognize oneself in the mirror is considered to be a key component of self-awareness and consciousness for humans. But what about animals?\n\nFor many years, scientists have known that members of the great ape family could recognize themselves in mirrors. They measured this by the "mirror test," which involved putting a colored mark on an ape's body, and then showing the ape its reflection in a mirror. If the ape tried to remove the mark on its own body, the scientists knew that the ape was recognizing its reflection.\n\nApes are close relatives of humans, but in recent years, scientists have discovered that other animals also pass the "mirror test." Elephants and dolphins have shown signs of self-recognition. These, like apes, are highly intelligent animals. But in a more recent experiment, a type of fish called the cleaner fish tried to scrape a mark off its body when it saw itself in the mirror. This suggests that even less intelligent animals may possess more self-awareness than previously suspected.`,
                    questions: [
                        {
                            id: 16,
                            text: "What is the passage mainly about?",
                            options: [
                                "Stages of early childhood development",
                                "Research on animal cognition",
                                "Differences between apes, elephants, and dolphins",
                                "Recent experiments on fish"
                            ],
                            correctAnswer: 1,
                            explanation: "While childhood development and fish are mentioned, they are supporting details. The core topic connecting all paragraphs is how scientists test self-awareness (a part of <strong>cognition</strong>) in various <strong>animals</strong> using mirrors."
                        },
                        {
                            id: 17,
                            text: "The word \"milestone\" in the first sentence is closest in meaning to",
                            options: [
                                "accomplishment",
                                "distance",
                                "weight",
                                "discovery"
                            ],
                            correctAnswer: 0,
                            explanation: "In developmental psychology, a 'milestone' is a significant stage or <strong>accomplishment</strong> in development, such as a child learning to walk or recognizing themselves."
                        },
                        {
                            id: 18,
                            text: "Why did scientists put colored marks on animals' bodies?",
                            options: [
                                "It made it possible to track the animals' movements.",
                                "It helped them determine whether the animals recognized themselves.",
                                "It made it easier to tell the animals apart.",
                                "It showed whether some animals can detect color differences."
                            ],
                            correctAnswer: 1,
                            explanation: "Paragraph 2 states: 'If the ape tried to remove the mark on its own body, the scientists <strong>knew that the ape was recognizing its reflection</strong>.'"
                        },
                        {
                            id: 19,
                            text: "According to the passage, all of the following are true about elephants EXCEPT:",
                            options: [
                                "They can recognize themselves in mirrors.",
                                "They are highly intelligent animals.",
                                "They possess qualities in common with apes.",
                                "They understand certain signs from other animals."
                            ],
                            correctAnswer: 3,
                            explanation: "The passage notes that elephants show signs of self-recognition, are highly intelligent, and share traits with apes. However, it <strong>never mentions</strong> their ability to understand signs from other animals."
                        },
                        {
                            id: 20,
                            text: "Why does the author mention cleaner fish?",
                            options: [
                                "To suggest that a wide range of animals may possess self-awareness",
                                "To imply that ocean animals are highly intelligent",
                                "To demonstrate a flaw in a recent experiment",
                                "To provide an example of an animal that does not recognize itself"
                            ],
                            correctAnswer: 0,
                            explanation: "The author mentions cleaner fish to prove a point: 'This suggests that <strong>even less intelligent animals may possess more self-awareness</strong> than previously suspected.' This broadens the range of animals capable of self-awareness."
                        }
                    ]
                }
            ]
        };

        // --- STATE MANAGEMENT ---
        const state = {
            flatSteps: [],
            currentStepIndex: 0,
            answers: {},
            checkedSteps: {}, // Tracks if a step's answers have been submitted/checked
            showResults: false,
            showInstructions: true
        };

        // --- LOGIC FUNCTIONS ---

        function initLesson() {
            state.answers = {};
            state.checkedSteps = {};
            state.showResults = false;
            state.showInstructions = false; 
            state.currentStepIndex = 0;

            // Flatten steps
            const steps = [];
            lessonData.sections.forEach(section => {
                if (section.type === 'cloze') {
                    steps.push({
                        type: 'cloze',
                        data: section,
                        sectionId: section.id
                    });
                } else if (section.type === 'reading') {
                    section.questions.forEach((q, idx) => {
                        steps.push({
                            type: 'reading',
                            data: section,
                            question: q,
                            questionIndex: idx + 1,
                            totalQuestions: section.questions.length,
                            sectionId: section.id
                        });
                    });
                }
            });
            state.flatSteps = steps;
            
            render();
        }

        function handleCheckAnswer() {
            // Mark current step as checked to reveal explanations
            state.checkedSteps[state.currentStepIndex] = true;
            render();
        }

        function handleNext() {
            if (state.currentStepIndex < state.flatSteps.length - 1) {
                state.currentStepIndex++;
                render();
            } else {
                finishTest();
            }
        }

        function handleBack() {
            if (state.currentStepIndex > 0) {
                state.currentStepIndex--;
                render();
            }
        }

        function handleBeginLesson() {
            initLesson(); 
        }

        function finishTest() {
            state.showResults = true;
            render();
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function handleClozeInput(id, value, missingLength) {
            state.answers[id] = value;
            // Update dynamic underscores in the background
            const bgEl = document.getElementById(`bg-underscores-${id}`);
            if (bgEl) {
                const remaining = Math.max(0, missingLength - value.length);
                const safeValue = value.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
                bgEl.innerHTML = `<span class="opacity-0">${safeValue}</span><span>${'_'.repeat(remaining)}</span>`;
            }
        }

        function handleRadioInput(qId, value) {
            // Prevent changing answer if already checked
            if(state.checkedSteps[state.currentStepIndex]) return;
            state.answers[qId] = value;
            render(); // Re-render to show selection
        }

        function resetApp() {
            state.flatSteps = [];
            state.answers = {};
            state.checkedSteps = {};
            state.showResults = false;
            state.showInstructions = true;
            render(); 
        }

        // --- RENDER FUNCTIONS ---

        function renderWelcome() {
            return `
            <div class="min-h-screen w-full flex flex-col md:flex-row m-0 p-0">
                <div class="bg-purple-700 p-12 text-white flex flex-col justify-center items-center md:w-2/5 min-h-[40vh] md:min-h-screen text-center relative">
                    <div class="absolute inset-0 bg-gradient-to-br from-purple-600 to-purple-900 opacity-90"></div>
                    <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold font-sans leading-tight z-10">TOEFL iBT<br>Reading<br>Overview</h1>
                </div>
                
                <div class="p-8 md:p-16 lg:p-24 flex flex-col justify-center md:w-3/5 bg-white min-h-[60vh] md:min-h-screen overflow-y-auto">
                    <div class="max-w-2xl mx-auto w-full">
                        <p class="text-gray-600 mb-8 text-lg md:text-xl leading-relaxed">
                            Welcome! This guided lesson will help you practice reading strategies. 
                            You will receive <strong>immediate feedback and explanations</strong> after every question to help you learn as you go, and a full review at the end. There is no numerical score.
                        </p>

                        <div class="text-left mb-12">
                            <button onclick="handleBeginLesson()" class="inline-flex items-center px-10 py-5 bg-purple-700 text-white font-bold rounded-full shadow-lg hover:shadow-xl hover:bg-purple-800 transition-all text-xl w-full sm:w-auto justify-center">
                                Start Lesson <i data-lucide="arrow-right" class="ml-3 w-6 h-6"></i>
                            </button>
                        </div>

                        <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-6 text-left flex items-start shadow-sm">
                            <i data-lucide="info" class="w-6 h-6 text-yellow-600 mr-4 flex-shrink-0 mt-1"></i>
                            <div>
                                <h4 class="font-bold text-yellow-800 mb-2 text-lg">Important Notes</h4>
                                <p class="text-sm text-yellow-800 leading-relaxed mb-4">
                                    This is a guided practice lesson focused on reading strategy, <strong>not a full simulation test</strong>. 
                                    For a full simulation to see exactly how the real test looks and operates, please visit the 
                                    <a href="https://www.ets.org/toefl/test-takers/ibt/prepare.html" target="_blank" class="underline font-semibold hover:text-yellow-900 transition-colors">official TOEFL sample test</a>.
                                </p>
                                <div class="w-full h-px bg-yellow-200 my-4"></div>
                                <p class="text-sm text-yellow-800 leading-relaxed">
                                    <strong>Multistage Adaptive Design:</strong> In the real TOEFL iBT, the Reading section is multistage adaptive. This means your performance on the first part of the test (Module 1) is used to select the content for the second part (Module 2). The difficulty of the tasks will adapt to match your ability level, providing a more accurate measure of your English proficiency.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderHeader() {
            const isInstructionPhase = state.showInstructions;
            
            return `
            <header class="bg-purple-700 h-16 flex items-center justify-between px-6 shadow-md z-50 fixed w-full top-0">
                <div class="flex items-center space-x-4">
                    <span class="text-white text-lg font-sans font-semibold flex items-center">
                        TOEFL iBT Reading Overview
                    </span>
                </div>
            </header>
            `;
        }

        function renderSubHeader() {
            if (state.showInstructions) return '';

            const backBtn = state.currentStepIndex > 0 
                ? `<button onclick="handleBack()" class="flex items-center text-gray-500 hover:text-purple-700 font-semibold transition-colors">
                    <i data-lucide="chevron-left" class="w-4 h-4 mr-1"></i> Previous
                   </button>` 
                : '<div></div>';

            return `
            <div class="fixed top-16 w-full bg-white border-b border-gray-300 px-6 py-3 flex items-center text-gray-700 text-sm font-sans z-40 shadow-sm min-h-[45px]">
                ${backBtn}
            </div>
            `;
        }

        function renderCloze(step) {
            const { data } = step;
            const isChecked = state.checkedSteps[state.currentStepIndex];
            const parts = data.text.split(/%\d+%/);
            const isLastStep = state.currentStepIndex === state.flatSteps.length - 1;
            const btnText = isLastStep ? "Finish & Review All" : "Next";
            const btnIcon = isLastStep ? "list-checks" : "arrow-right";
            
            let content = '';
            parts.forEach((part, idx) => {
                content += part;
                const blank = data.blanks[idx];
                if (blank) {
                    const val = state.answers[blank.id] || '';
                    
                    if (!isChecked) {
                        const prefixLen = blank.prefix ? blank.prefix.length : 0;
                        const suffixLen = blank.suffix ? blank.suffix.length : 0;
                        const missingLength = blank.answer.length - prefixLen - suffixLen;
                        
                        const safeVal = val.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
                        const remainingUnderscores = Math.max(0, missingLength - val.length);
                        const inputWidth = (missingLength * 1.25) + 0.5;

                        content += `
                        <span class="inline-flex items-baseline mx-0.5 whitespace-nowrap">
                            ${blank.prefix ? `<span class="text-purple-800 font-semibold tracking-wide">${blank.prefix}</span>` : ''}
                            <span class="relative inline-block h-8 border-b-[3px] border-gray-300 focus-within:border-purple-700 transition-colors mx-0.5 align-baseline" style="width: ${inputWidth}rem;">
                                <!-- Background layer for dynamic spaced underscores -->
                                <span id="bg-underscores-${blank.id}" class="absolute inset-0 px-1 text-left font-mono text-xl tracking-[0.25em] pointer-events-none leading-8 text-gray-500 font-bold overflow-hidden">
                                    <span class="opacity-0">${safeVal}</span><span>${'_'.repeat(remainingUnderscores)}</span>
                                </span>
                                <!-- Foreground transparent input -->
                                <input 
                                    type="text" 
                                    value="${safeVal}" 
                                    maxlength="${missingLength}"
                                    oninput="handleClozeInput(${blank.id}, this.value, ${missingLength})"
                                    class="absolute inset-0 w-full h-full px-1 text-left bg-transparent text-purple-800 font-mono text-xl tracking-[0.25em] font-bold focus:outline-none leading-8"
                                    aria-label="Blank ${blank.id}"
                                    autocomplete="off"
                                    spellcheck="false"
                                />
                            </span>
                            ${blank.suffix ? `<span class="text-purple-800 font-semibold tracking-wide">${blank.suffix}</span>` : ''}
                        </span>`;
                    } else {
                        // Checked state rendering - provide immediate visual feedback replacing the inputs
                        const fullUserWord = (blank.prefix || "") + val + (blank.suffix || "");
                        const isCorrect = fullUserWord.toLowerCase() === blank.answer.toLowerCase();
                        
                        if (isCorrect) {
                            content += `<span class="inline-block px-1 mx-1 bg-green-100 text-green-700 font-bold border border-green-300 rounded">${fullUserWord}</span>`;
                        } else {
                            content += `<span class="inline-block px-1 mx-1 bg-red-50 text-red-500 line-through decoration-2 decoration-red-500 border border-red-200 rounded">${fullUserWord || "(empty)"}</span>
                                        <span class="inline-block px-1 mx-1 bg-green-100 text-green-700 font-bold border border-green-300 rounded shadow-sm">${blank.answer}</span>`;
                        }
                    }
                }
            });

            // Action Area
            let actionArea = '';
            if (!isChecked) {
                actionArea = `
                <div class="mt-8 flex justify-end border-t pt-6 border-gray-200">
                    <button onclick="handleCheckAnswer()" class="flex items-center px-6 py-3 bg-purple-700 text-white font-bold rounded shadow hover:bg-purple-800 transition-colors">
                        Check Answers <i data-lucide="check-circle" class="ml-2 w-5 h-5"></i>
                    </button>
                </div>`;
            } else {
                // Explanations Box
                let explanationsList = data.blanks.map(b => 
                    `<li class="mb-3">
                        <span class="font-mono bg-purple-100 text-purple-800 px-2 py-0.5 rounded mr-2 font-bold">${b.answer}</span>
                        <span class="text-gray-700">${b.explanation}</span>
                    </li>`
                ).join('');

                actionArea = `
                <div class="mt-8 bg-purple-50 border border-purple-200 rounded-lg p-6">
                    <h3 class="text-lg font-bold text-purple-900 mb-4 flex items-center">
                        <i data-lucide="lightbulb" class="w-5 h-5 mr-2 text-yellow-500 fill-current"></i> Teacher's Explanations
                    </h3>
                    <ul class="list-decimal pl-5 space-y-2">
                        ${explanationsList}
                    </ul>
                    <div class="mt-6 flex justify-end border-t border-purple-200 pt-4">
                        <button onclick="handleNext()" class="flex items-center px-6 py-3 bg-purple-700 text-white font-bold rounded shadow hover:bg-purple-800 transition-colors">
                            ${btnText} <i data-lucide="${btnIcon}" class="ml-2 w-5 h-5"></i>
                        </button>
                    </div>
                </div>`;
            }

            return `
            <div class="pt-32 px-4 md:px-12 max-w-5xl mx-auto pb-12">
                <h2 class="text-center text-2xl font-sans font-bold text-black mb-8">
                    ${data.title}
                </h2>
                
                <div class="bg-white p-8 leading-loose text-lg text-gray-800 font-sans text-justify shadow-sm border border-gray-200 rounded-lg">
                    ${content}
                    ${actionArea}
                </div>
            </div>
            `;
        }

        function renderReading(step) {
            const { data, question } = step;
            const isChecked = state.checkedSteps[state.currentStepIndex];
            const userAnsIdx = state.answers[question.id];
            const isLastStep = state.currentStepIndex === state.flatSteps.length - 1;
            const btnText = isLastStep ? "Finish & Review All" : "Next";
            const btnIcon = isLastStep ? "list-checks" : "arrow-right";
            
            // Render Passage (Left side)
            let passageHtml = '';
            if (data.format === 'social') {
                const paragraphs = data.passageContent.split('\n').filter(line => line.trim() !== '').map(line => `<p class="mb-3">${line}</p>`).join('');
                passageHtml = `
                <div class="max-w-md mx-auto border-[12px] border-gray-600 rounded-[2.5rem] overflow-hidden shadow-xl bg-white relative my-8">
                    <div class="bg-[#007b83] h-12 flex items-center justify-between px-5 text-white relative">
                        <i data-lucide="bar-chart-2" class="w-4 h-4 transform rotate-90"></i>
                        <div class="absolute top-2 left-1/2 transform -translate-x-1/2 w-3 h-3 bg-gray-900 rounded-full"></div>
                        <div class="absolute top-2 left-1/2 transform -translate-x-1/2 w-16 h-4 bg-gray-900 rounded-b-xl opacity-20"></div>
                        <div class="flex-1 mx-4 h-6 bg-white/20 rounded-full flex items-center px-2">
                            <i data-lucide="search" class="w-3 h-3 text-white/70 ml-auto"></i>
                        </div>
                        <i data-lucide="battery-full" class="w-5 h-5"></i>
                    </div>
                    <div class="p-5">
                        <div class="flex items-center mb-4">
                            <div class="w-10 h-10 bg-orange-200 rounded-full flex items-center justify-center text-orange-500 mr-3">
                                <i data-lucide="user" class="w-6 h-6"></i>
                            </div>
                            <span class="font-bold text-lg text-gray-900">${data.passageTitle}</span>
                        </div>
                        <div class="text-[0.95rem] text-gray-800 leading-snug">
                            ${paragraphs}
                        </div>
                        <div class="mt-5 pt-3 border-t border-gray-300 flex justify-between text-gray-500 font-semibold text-sm">
                            <button class="flex items-center hover:text-gray-700 transition"><i data-lucide="thumbs-up" class="w-4 h-4 mr-2"></i> Like</button>
                            <button class="flex items-center hover:text-gray-700 transition"><i data-lucide="message-square" class="w-4 h-4 mr-2"></i> Comment</button>
                        </div>
                    </div>
                </div>
                `;
            } else if (data.format === 'notice') {
                const paragraphs = data.passageContent.split('\n').filter(line => line.trim() !== '').map(line => `<p class="mb-4">${line}</p>`).join('');
                passageHtml = `
                <div class="max-w-md mx-auto border-[3px] border-gray-800 p-8 bg-white shadow-lg text-center my-12">
                    <h2 class="text-2xl font-bold mb-6 text-gray-900">${data.passageTitle}</h2>
                    <div class="text-[0.95rem] text-gray-800 leading-relaxed text-left">
                        ${paragraphs}
                    </div>
                </div>
                `;
            } else {
                const paragraphs = data.passageContent.split('\n').filter(line => line.trim() !== '').map(line => `<p class="mb-4">${line}</p>`).join('');
                passageHtml = `
                <h2 class="text-xl font-bold mb-4 font-sans text-black">${data.passageTitle}</h2>
                <div class="prose max-w-none text-black font-sans leading-relaxed text-lg">
                    ${paragraphs}
                </div>
                `;
            }
            
            // Render Options (Right side)
            const options = question.options.map((opt, idx) => {
                let isChecked = userAnsIdx === idx ? 'checked' : '';
                let optionClass = "border-2 border-gray-300 rounded-lg p-3 transition-all";
                let cursorClass = "cursor-pointer group hover:bg-gray-50 hover:border-purple-300";
                let radioDisabled = "";
                let feedbackIcon = "";

                if (isChecked) {
                    optionClass = "border-2 border-purple-600 bg-purple-50 rounded-lg p-3";
                }

                // If submitted, modify styling
                if (isChecked && state.checkedSteps[state.currentStepIndex]) {
                    cursorClass = "cursor-default";
                    radioDisabled = "disabled";
                    
                    if (idx === question.correctAnswer) {
                        optionClass = "border-2 border-green-500 bg-green-50 rounded-lg p-3 font-bold text-green-900 shadow-sm";
                        feedbackIcon = `<i data-lucide="check-circle" class="w-5 h-5 text-green-600 ml-auto"></i>`;
                    } else if (idx === userAnsIdx) {
                        optionClass = "border-2 border-red-400 bg-red-50 rounded-lg p-3 text-red-900";
                        feedbackIcon = `<i data-lucide="x-circle" class="w-5 h-5 text-red-500 ml-auto"></i>`;
                    }
                }
                
                // Show the correct answer explicitly if they got it wrong
                if (isChecked && state.checkedSteps[state.currentStepIndex] && idx === question.correctAnswer && userAnsIdx !== question.correctAnswer) {
                    optionClass = "border-2 border-green-500 bg-green-50 rounded-lg p-3 font-bold text-green-900 border-dashed";
                    feedbackIcon = `<i data-lucide="check-circle" class="w-5 h-5 text-green-600 ml-auto"></i>`;
                }

                return `
                <label class="flex items-center ${cursorClass} ${optionClass}">
                    <div class="relative flex items-center justify-center flex-shrink-0">
                        <input 
                            type="radio" 
                            name="q-${question.id}" 
                            ${isChecked}
                            ${radioDisabled}
                            onchange="handleRadioInput(${question.id}, ${idx})"
                            class="appearance-none w-5 h-5 border-2 border-gray-400 rounded-full checked:border-purple-700 checked:border-[5px] transition-all disabled:opacity-70"
                        />
                    </div>
                    <span class="ml-4 text-gray-800 font-sans text-lg flex-1">
                        ${opt}
                    </span>
                    ${feedbackIcon}
                </label>
                `;
            }).join('');

            // Action Area / Feedback Box
            let actionArea = '';
            const hasAnswered = userAnsIdx !== undefined;

            if (!isChecked) {
                actionArea = `
                <div class="mt-8 flex justify-end border-t pt-6 border-gray-200">
                    <button 
                        onclick="handleCheckAnswer()" 
                        ${!hasAnswered ? 'disabled' : ''}
                        class="flex items-center px-6 py-3 font-bold rounded shadow transition-colors ${hasAnswered ? 'bg-purple-700 text-white hover:bg-purple-800' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}">
                        Check Answer <i data-lucide="check-circle" class="ml-2 w-5 h-5"></i>
                    </button>
                </div>`;
            } else {
                const isCorrect = userAnsIdx === question.correctAnswer;
                const feedbackHeader = isCorrect 
                    ? `<span class="text-green-700 flex items-center font-bold text-lg"><i data-lucide="check-circle" class="w-6 h-6 mr-2"></i> Correct!</span>`
                    : `<span class="text-red-600 flex items-center font-bold text-lg"><i data-lucide="x-circle" class="w-6 h-6 mr-2"></i> Incorrect.</span>`;

                actionArea = `
                <div class="mt-8 bg-purple-50 border border-purple-200 rounded-lg p-6 shadow-inner relative overflow-hidden">
                    <div class="absolute left-0 top-0 bottom-0 w-1 ${isCorrect ? 'bg-green-500' : 'bg-red-500'}"></div>
                    
                    <div class="mb-3">${feedbackHeader}</div>
                    <div class="text-gray-800 leading-relaxed text-[0.95rem]">
                        ${question.explanation}
                    </div>
                    <div class="mt-6 flex justify-end border-t border-purple-200 pt-4">
                        <button onclick="handleNext()" class="flex items-center px-6 py-3 bg-purple-700 text-white font-bold rounded shadow hover:bg-purple-800 transition-colors">
                            ${btnText} <i data-lucide="${btnIcon}" class="ml-2 w-5 h-5"></i>
                        </button>
                    </div>
                </div>`;
            }

            return `
            <div class="pt-28 h-screen flex flex-col md:flex-row overflow-hidden bg-white">
                <!-- Left Pane: Passage -->
                <div class="w-full md:w-1/2 h-full overflow-y-auto border-r border-gray-300 p-8 bg-gray-50 custom-scroll pb-32">
                    ${passageHtml}
                </div>
                
                <!-- Right Pane: Question -->
                <div class="w-full md:w-1/2 h-full overflow-y-auto p-8 bg-white custom-scroll pb-32">
                    <div class="max-w-xl mx-auto">
                        <h3 class="text-xl font-bold text-black mb-6 font-sans leading-snug">${question.text}</h3>
                        <div class="space-y-3">
                            ${options}
                        </div>
                        ${actionArea}
                    </div>
                </div>
            </div>
            `;
        }

        function renderResults() {
            let reviewHtml = '<div class="max-w-4xl mx-auto mt-12 space-y-12 pb-16">';

            lessonData.sections.forEach(section => {
                if (section.type === 'cloze') {
                    reviewHtml += `
                    <div class="bg-white p-8 rounded-xl shadow-md border-t-4 border-purple-500">
                        <h3 class="font-bold text-2xl mb-6 text-purple-800 flex items-center">
                            <i data-lucide="edit-3" class="w-6 h-6 mr-3"></i> ${section.title}
                        </h3>
                        <div class="space-y-6">`;

                    section.blanks.forEach(b => {
                        const userVal = state.answers[b.id] ? state.answers[b.id].trim() : "";
                        const fullUserWord = (b.prefix || "") + userVal + (b.suffix || "");
                        const isCorrect = fullUserWord.toLowerCase() === b.answer.toLowerCase();

                        reviewHtml += `
                        <div class="border border-gray-200 rounded-lg p-5 ${isCorrect ? 'bg-green-50' : 'bg-red-50'}">
                            <div class="flex items-center justify-between mb-3">
                                <span class="font-bold text-gray-700 text-lg">Cloze Blank</span>
                                ${isCorrect ? '<span class="text-green-600 font-bold flex items-center bg-green-100 px-3 py-1 rounded-full"><i data-lucide="check-circle" class="w-4 h-4 mr-2"></i> Correct</span>' : '<span class="text-red-500 font-bold flex items-center bg-red-100 px-3 py-1 rounded-full"><i data-lucide="x-circle" class="w-4 h-4 mr-2"></i> Incorrect</span>'}
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm">
                                    <div class="text-xs text-gray-500 uppercase tracking-wider mb-1 font-bold">Your Answer</div>
                                    <div class="font-mono text-lg ${isCorrect ? 'text-green-700' : 'text-red-600 line-through'}">${fullUserWord || "(empty)"}</div>
                                </div>
                                <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm">
                                    <div class="text-xs text-gray-500 uppercase tracking-wider mb-1 font-bold">Correct Answer</div>
                                    <div class="font-mono text-lg text-green-700 font-bold">${b.answer}</div>
                                </div>
                            </div>
                            <div class="bg-purple-100/60 p-5 rounded-lg text-gray-800 text-[0.95rem] leading-relaxed border border-purple-200">
                                <strong class="text-purple-900 flex items-center mb-2"><i data-lucide="lightbulb" class="w-5 h-5 mr-2 text-yellow-600"></i> Teacher's Explanation:</strong>
                                ${b.explanation}
                            </div>
                        </div>`;
                    });

                    reviewHtml += `</div></div>`;
                } else if (section.type === 'reading') {
                    reviewHtml += `<div class="bg-white rounded-xl shadow-md overflow-hidden border-t-4 border-purple-500">`;
                    reviewHtml += `<div class="bg-gray-100 p-5 border-b border-gray-200 font-bold text-gray-800 text-lg flex items-center">
                                        <i data-lucide="book-open" class="w-6 h-6 mr-3 text-purple-700"></i> Passage: ${section.passageTitle}
                                    </div><div class="p-8 space-y-8">`;

                    section.questions.forEach((q, qIdx) => {
                        const userAnsIdx = state.answers[q.id];
                        const correctAnsIdx = q.correctAnswer;
                        const isCorrect = userAnsIdx === correctAnsIdx;

                        reviewHtml += `
                        <div class="border border-gray-200 rounded-lg p-6 relative">
                            <div class="absolute top-0 left-0 w-1.5 h-full ${isCorrect ? 'bg-green-500' : 'bg-red-500'} rounded-l-lg"></div>
                            <div class="flex justify-between items-start mb-4">
                                <span class="text-sm font-bold text-purple-600 uppercase tracking-wider">Reading Question</span>
                                ${isCorrect
                                    ? '<span class="text-green-600 font-bold text-sm flex items-center bg-green-50 px-3 py-1 rounded-full border border-green-200"><i data-lucide="check" class="w-4 h-4 mr-1"></i> Correct</span>'
                                    : '<span class="text-red-500 font-bold text-sm flex items-center bg-red-50 px-3 py-1 rounded-full border border-red-200"><i data-lucide="x" class="w-4 h-4 mr-1"></i> Incorrect</span>'}
                            </div>
                            <p class="font-bold text-xl mb-5 text-gray-900">${q.text}</p>
                            
                            <div class="space-y-3 mb-6">`;

                        q.options.forEach((opt, optIdx) => {
                            let optionClass = "p-4 rounded-lg border border-gray-200 text-gray-700 bg-gray-50 opacity-60";
                            let icon = "";

                            if (optIdx === correctAnsIdx) {
                                optionClass = "p-4 rounded-lg border-2 border-green-500 bg-green-50 text-green-900 font-bold shadow-sm opacity-100";
                                icon = '<i data-lucide="check-circle" class="w-6 h-6 ml-auto text-green-600"></i>';
                            } else if (optIdx === userAnsIdx && !isCorrect) {
                                optionClass = "p-4 rounded-lg border-2 border-red-400 bg-red-50 text-red-900 opacity-100";
                                icon = '<i data-lucide="x-circle" class="w-6 h-6 ml-auto text-red-500"></i>';
                            }

                            reviewHtml += `<div class="${optionClass} flex items-center transition-all">
                                                <span class="text-[1.05rem]">${opt}</span>
                                                ${icon}
                                            </div>`;
                        });

                        reviewHtml += `</div>
                            <div class="bg-purple-100/60 p-5 rounded-lg text-gray-800 text-[0.95rem] leading-relaxed border border-purple-200">
                                <strong class="text-purple-900 flex items-center mb-2"><i data-lucide="lightbulb" class="w-5 h-5 mr-2 text-yellow-600"></i> Teacher's Explanation:</strong>
                                ${q.explanation}
                            </div>
                        </div>`;
                    });
                    reviewHtml += `</div></div>`;
                }
            });

            reviewHtml += '</div>';

            return `
            <div class="min-h-screen bg-[#f0f0f0] pt-24 pb-12 px-4 overflow-y-auto custom-scroll">
                <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-xl overflow-hidden mb-8 border-t-8 border-purple-700">
                    <div class="bg-purple-700 p-10 text-white text-center">
                        <i data-lucide="book-check" class="w-20 h-20 mx-auto mb-6 text-purple-200"></i>
                        <h2 class="text-4xl font-bold mb-3 font-sans">Lesson Review</h2>
                        <p class="text-lg text-purple-100">Review your answers and explanations below.</p>
                    </div>
                    
                    <div class="p-8 text-center bg-purple-50">
                        <p class="text-gray-700 text-lg max-w-2xl mx-auto leading-relaxed">
                            Reflecting on your answers is an essential part of the learning process. Read through the teacher's explanations to understand the strategies behind each correct answer.
                        </p>
                    </div>
                </div>

                ${reviewHtml}
                
                <div class="flex justify-center pb-12 mt-8">
                     <button onclick="resetApp()" class="px-8 py-4 bg-purple-700 text-white rounded-full shadow-lg hover:bg-purple-800 transition-colors text-lg font-bold flex items-center">
                        <i data-lucide="rotate-ccw" class="w-5 h-5 mr-3"></i> Restart Practice
                    </button>
                </div>
            </div>`;
        }

        // --- MAIN RENDER LOOP ---
        function render() {
            const app = document.getElementById('app');
            
            if (state.flatSteps.length === 0) {
                app.innerHTML = renderWelcome();
            } else if (state.showResults) {
                app.innerHTML = renderHeader() + renderResults();
            } else {
                let mainContent = '';
                const step = state.flatSteps[state.currentStepIndex];
                if (step.type === 'cloze') {
                    mainContent = renderCloze(step);
                } else if (step.type === 'reading') {
                    mainContent = renderReading(step);
                }
                
                app.innerHTML = renderHeader() + renderSubHeader() + mainContent;
            }

            // Re-initialize icons after DOM update
            lucide.createIcons();
        }

        // Initialize App
        render();

    </script>
</body>
</html>
