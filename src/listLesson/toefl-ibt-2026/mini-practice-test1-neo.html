    <!-- SortableJS for drag and drop interactions -->

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overscroll-behavior-y: none; /* Prevents pull-to-refresh on mobile */
            background-color: #FDF8F5; /* Off-white background */
        }
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #fff;
            border-left: 3px solid #000;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #000;
            border: 1px solid #fff;
        }

        /* --- Neo-Brutalist Utilities --- */
        .brutal-border {
            border: 3px solid #000;
        }
        .brutal-shadow {
            box-shadow: 5px 5px 0px 0px #000;
        }
        .brutal-shadow-sm {
            box-shadow: 3px 3px 0px 0px #000;
        }
        .brutal-shadow-lg {
            box-shadow: 8px 8px 0px 0px #000;
        }
        .brutal-button {
            border: 3px solid #000;
            box-shadow: 4px 4px 0px 0px #000;
            transition: all 0.1s ease;
            border-radius: 0;
            font-weight: 800;
        }
        .brutal-button:hover:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px #000;
        }
        .brutal-button:disabled {
            opacity: 0.6;
            box-shadow: 0px 0px 0px 0px #000;
            transform: translate(4px, 4px);
            cursor: not-allowed;
            filter: grayscale(0.5);
        }

        .recording-pulse {
            animation: brutal-pulse 1s steps(2, end) infinite;
        }
        @keyframes brutal-pulse {
            0% { box-shadow: 4px 4px 0px 0px #000; transform: translate(0px, 0px); background-color: #FF5757; }
            50% { box-shadow: 0px 0px 0px 0px #000; transform: translate(4px, 4px); background-color: #FF0000; }
            100% { box-shadow: 4px 4px 0px 0px #000; transform: translate(0px, 0px); background-color: #FF5757; }
        }
        
        /* --- Drag and Drop Mechanics --- */
        .word-chip {
            background-color: #fff;
            border: 3px solid #000;
            color: #000;
            padding: 0.5rem 1.25rem;
            margin: 0.25rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            font-size: 1.125rem;
            font-weight: 800;
            cursor: grab;
            box-shadow: 4px 4px 0px 0px #000;
            transition: transform 0.1s, box-shadow 0.1s;
            touch-action: manipulation;
        }
        .word-chip:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px 0px #000;
            background-color: #00E5FF; /* Cyan hover */
        }
        
        /* Word Bank Styling */
        .word-bank {
            background-color: #B28DFF; /* Purple bg for bank */
        }

        /* Slot Line Styling */
        .slot-zone {
            transition: all 0.2s ease-in-out;
            background-color: #fff;
            border: 3px solid #000;
            box-shadow: inset 3px 3px 0px 0px rgba(0,0,0,0.1);
        }
        .slot-zone .word-chip {
            width: 100%;
            height: 100%;
            margin: 0;
            box-shadow: none;
            border: none;
            transform: none !important;
            background-color: #FFDE00 !important; /* Yellow when slotted */
        }

        /* Ghost styling varies based on which zone it's in */
        .word-bank .sortable-ghost {
            opacity: 1 !important;
            background: repeating-linear-gradient(45deg, #000, #000 10px, #FFDE00 10px, #FFDE00 20px) !important;
            color: transparent !important;
            box-shadow: none !important;
        }

        /* Highlights the underscore line when hovering over it */
        .slot-zone.sortable-ghost-parent {
            background-color: #A8FF76 !important; /* Green highlight */
        }
        
        .slot-zone .sortable-ghost {
            opacity: 0 !important;
        }

        .sortable-drag {
            cursor: grabbing !important;
            box-shadow: 8px 8px 0px 0px #000 !important;
            transform: rotate(3deg) !important;
            background-color: #00E5FF !important;
        }

        /* Hide radio inputs completely */
        .brutal-radio:checked + div {
            background-color: #000;
            color: #fff;
            transform: translate(2px, 2px);
            box-shadow: none;
        }
    </style>
</head>

        // --- NATIVE BROWSER VOICE SETUP (EDGE NATURAL VOICES) ---
        let femaleVoice = null;
        let maleVoice = null;

        function assignVoices() {
            const voices = window.speechSynthesis.getVoices();
            if (voices.length === 0) return;

            const enUSVoices = voices.filter(v => v.lang === 'en-US' || v.lang === 'en_US' || v.lang.startsWith('en'));
            
            femaleVoice = enUSVoices.find(v => v.name.includes('Natural') && (v.name.includes('Aria') || v.name.includes('Jenny') || v.name.includes('Michelle'))) ||
                          enUSVoices.find(v => v.name.includes('Female') || v.name.includes('Zira') || v.name.includes('Samantha') || v.name.includes('Google US English')) ||
                          enUSVoices[0];

            maleVoice = enUSVoices.find(v => v.name.includes('Natural') && (v.name.includes('Guy') || v.name.includes('Christopher') || v.name.includes('Eric') || v.name.includes('Roger'))) ||
                        enUSVoices.find(v => v.name.includes('Male') || v.name.includes('David') || v.name.includes('Alex')) ||
                        enUSVoices.find(v => v.name !== femaleVoice.name) || 
                        enUSVoices[1] || enUSVoices[0];
        }
        
        window.speechSynthesis.onvoiceschanged = assignVoices;

                        transcript: "Professor: Biomimicry is the human practice of learning from and imitating things found in nature in order to create new inventions. This way, scientists and engineers can create innovative solutions that are both efficient and sustainable.\nOne well known example of biomimicry is the development of a widely used fastening system. The inventor was inspired by the way burrs, uh thorns, from plants stuck to his dog's fur. By replicating the tiny hooks found on the burrs he removed from the dog fur, he created the new fastening system. Another example is the design of energy efficient buildings based on the ventilation system of structures created by termites. Termites are ground dwelling insects that use different materials to create hills, or mounds, in which the termites live. Termite mounds have a complex network of vents. The vents maintain a stable internal temperature, which can be emulated in human architecture.\nBiomimicry can also be applied to renewable energy. For instance, researchers are developing wind turbine blades modeled after the flippers of humpback whales. The unique shape of the flippers reduces drag and increases efficiency, leading to more effective wind energy capture.",

                            { id: 41, prompt: "I'm going to study at the library this afternoon.", chunks: ["to", "do", "borrow", "any books", "you", "need"], answer: "Do you need to borrow any books", targetLength: 6, punctuation: "?" },
                            { id: 42, prompt: "I'm thinking about getting a pet.", chunks: ["are", "you", "considering", "kind", "of", "what", "animal"], answer: "What kind of animal are you considering", targetLength: 7, punctuation: "?" },
                            { id: 43, prompt: "I'm excited to see the new science fiction movie tonight.", chunks: ["it", "showing", "is", "where"], answer: "Where is it showing", targetLength: 4, punctuation: "?" },
                            { id: 44, prompt: "I have an interview for a new job next week.", chunks: ["ready", "resume", "have", "you", "do", "your"], answer: "Do you have your resume ready", targetLength: 6, punctuation: "?" },

        // --- GLOBAL STATE ---
        const state = {
            hasStarted: false,
            userName: "",
            isAdmin: false,
            pdfGenerated: false,
            flatSteps: [],
            currentStepIndex: 0,
            answers: {},          
            showResults: false,
            
            // Timers
            sectionTimes: { reading: 1200, writing: 600 },
            currentSectionTimer: null,
            timerInterval: null,
            questionTimeLeft: null, 
            
            // Writing State
            sentenceStates: {},
            
            // Audio/Recording States
            isPlayingAudio: false,
            passageAudioPlayed: {},
            passageAudioFinished: {},

            isRecording: false,
            recognition: null,
            recordingTimeLeft: 0,
            recordingInterval: null,
            hasRecorded: {}, 
            aiFeedback: {},
            isGeneratingFeedback: {}

        // --- BROWSER STT (SPEECH-TO-TEXT) INITIALIZATION ---
        function initSpeechRecognition() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (window.SpeechRecognition) {
                state.recognition = new window.SpeechRecognition();
                state.recognition.continuous = true;
                state.recognition.interimResults = true;
                
                state.recognition.onresult = (event) => {
                    let finalTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        }
                    }
                    const step = state.flatSteps[state.currentStepIndex];
                    if (step && step.type === 'listen_and_repeat' && finalTranscript) {
                        const qId = step.question.id;
                        state.answers[qId] = (state.answers[qId] || '') + ' ' + finalTranscript;
                        render(); 
                    }
                };
            } else {
                console.warn("Speech Recognition API not supported. Fallback text input will be provided.");
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startTestWithUser() {
            const nameInput = document.getElementById('user-name').value.trim();
            if (nameInput) {
                if (nameInput === '300198') {
                    state.userName = 'Admin';
                    state.isAdmin = true;
                } else {
                    state.userName = nameInput;
                    state.isAdmin = false;
                }
                initTest();
            }
        }

        function initTest() {
            initSpeechRecognition();
            state.hasStarted = true;
            state.showResults = false;
            state.pdfGenerated = false;
            state.currentStepIndex = 0;
            state.answers = {};
            state.flatSteps = [];
            state.sentenceStates = {};
            state.passageAudioPlayed = {};
            state.passageAudioFinished = {};
            state.hasRecorded = {};

            const sectionOrder = ['reading', 'listening', 'writing', 'speaking'];

            sectionOrder.forEach(sectionKey => {
                const sectionData = testData[sectionKey];
                
                state.flatSteps.push({
                    type: 'section_intro',
                    globalSection: sectionKey,
                    title: sectionData.title
                });

                sectionData.sections.forEach(subSec => {
                    if (subSec.type === 'cloze') {
                        state.flatSteps.push({ type: 'cloze', globalSection: sectionKey, data: subSec, sectionId: subSec.id });
                    } else if (subSec.type === 'reading') {
                        subSec.questions.forEach((q, idx) => {
                            state.flatSteps.push({ type: 'reading', globalSection: sectionKey, data: subSec, question: q, questionIndex: idx + 1, totalQuestions: subSec.questions.length, sectionId: subSec.id });
                        });
                    } else if (subSec.type === 'listening') {
                        subSec.questions.forEach((q, idx) => {
                            state.flatSteps.push({ type: 'listening', globalSection: sectionKey, data: subSec, question: q, questionIndex: idx + 1, totalQuestions: subSec.questions.length, passageId: (subSec.id.includes("short")) ? `short_${q.id}` : subSec.id });
                        });
                    } else if (subSec.type === 'build_sentence') {
                        subSec.questions.forEach((q, idx) => {
                            // Initialize discrete slots for the sentence lines
                            state.sentenceStates[q.id] = { 
                                available: shuffleArray([...q.chunks]), 
                                slots: new Array(q.targetLength).fill(null) 
                            };
                            state.flatSteps.push({ type: 'build_sentence', globalSection: sectionKey, data: subSec, question: q, questionIndex: idx + 1, totalQuestions: subSec.questions.length, sectionId: subSec.id });
                        });
                    } else if (subSec.type === 'listen_and_repeat') {
                        if (subSec.scenario) {
                            state.flatSteps.push({ type: 'scenario', globalSection: sectionKey, data: subSec, scenarioText: subSec.scenario });
                        }
                        subSec.questions.forEach((q, idx) => {
                            state.answers[q.id] = ""; 
                            state.flatSteps.push({ type: 'listen_and_repeat', globalSection: sectionKey, data: subSec, question: q, questionIndex: idx + 1, totalQuestions: subSec.questions.length });
                        });
                    }
                });
            });
            
            assignVoices();
            startSectionTimer();
            render();
        }

        // --- GLOBAL CONTROLS ---

        function stopAllAudioAndRecording() {
            state.isPlayingAudio = false;
            window.speechSynthesis.cancel();
            
            if (state.recordingInterval) {
                clearInterval(state.recordingInterval);
                state.recordingInterval = null;
            }
            if (state.recognition && state.isRecording) {
                state.recognition.stop();
            }
            state.isRecording = false;
        }

        function stopRecordingEarly() {
            const step = state.flatSteps[state.currentStepIndex];
            if (step && step.question) {
                state.hasRecorded[step.question.id] = true;
            }
            stopAllAudioAndRecording();
            render();
        }

        function handleNext() {
            stopAllAudioAndRecording();
            if (state.currentStepIndex < state.flatSteps.length - 1) {
                state.currentStepIndex++;
                startSectionTimer();
                render();
            } else {
                finishTest();
            }
        }

        function handleBack() {
            stopAllAudioAndRecording();
            if (state.currentStepIndex > 0) {
                const step = state.flatSteps[state.currentStepIndex];
                if (step.type === 'listening') {
                    state.passageAudioFinished[step.passageId] = true; 
                }
                state.currentStepIndex--;
                startSectionTimer();
                render();
            }
        }

        function forceNextSection() {
            const currentSection = state.flatSteps[state.currentStepIndex].globalSection;
            const nextStep = state.flatSteps.find((s, idx) => idx > state.currentStepIndex && s.globalSection !== currentSection);
            
            stopAllAudioAndRecording();
            if (nextStep) {
                state.currentStepIndex = state.flatSteps.indexOf(nextStep);
                startSectionTimer();
                render();
            } else {
                finishTest();
            }
        }

        function finishTest() {
            stopAllAudioAndRecording();
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.showResults = true;
            render();
            setTimeout(generatePDFReport, 500);
        }

        // --- TIMER LOGIC ---

        function startSectionTimer() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            const step = state.flatSteps[state.currentStepIndex];
            if (!step) return;

            const currentSection = step.globalSection;
            
            if (currentSection === 'listening' && step.type === 'listening') {
                if (state.passageAudioFinished[step.passageId]) {
                    state.questionTimeLeft = step.question.timeLimit || 20;
                    state.timerInterval = setInterval(() => {
                        if (state.questionTimeLeft > 0) {
                            state.questionTimeLeft--;
                            updateTimerDisplay();
                        } else {
                            handleNext();
                        }
                    }, 1000);
                } else {
                    state.questionTimeLeft = null; 
                }
                updateTimerDisplay();
            } else if (state.sectionTimes[currentSection] !== undefined) {
                state.currentSectionTimer = currentSection;
                state.timerInterval = setInterval(() => {
                    if (state.sectionTimes[currentSection] > 0) {
                        state.sectionTimes[currentSection]--;
                        updateTimerDisplay();
                    } else {
                        forceNextSection();
                    }
                }, 1000);
            } else {
                state.currentSectionTimer = null;
                state.questionTimeLeft = null;
            }
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timer-display');
            if (!el) return;
            
            const step = state.flatSteps[state.currentStepIndex];

            if (step && step.globalSection === 'listening' && step.type === 'listening') {
                if (state.questionTimeLeft !== null && state.questionTimeLeft !== undefined) {
                    const secs = state.questionTimeLeft;
                    el.innerText = `0:${secs < 10 ? '0' : ''}${secs}`;
                } else {
                    el.innerText = '--:--';
                }
            } else if (state.currentSectionTimer && state.sectionTimes[state.currentSectionTimer] !== undefined) {
                const seconds = state.sectionTimes[state.currentSectionTimer];
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                el.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            } else {
                 el.innerText = '';
            }
        }

        // --- INPUT HANDLERS ---

        function handleClozeInput(id, value, missingLength) {
            state.answers[id] = value;
            const bgEl = document.getElementById(`bg-dashes-${id}`);
            if (bgEl) {
                const remaining = Math.max(0, missingLength - value.length);
                const safeValue = value.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
                bgEl.innerHTML = `<span class="opacity-0">${safeValue}</span><span>${'_'.repeat(remaining)}</span>`;
            }
        }

        function handleRadioInput(qId, value) {
            state.answers[qId] = value;
            // Force re-render to apply the brutalist checked styles to the label container
            render();
        }

        // --- WRITING: DRAG & DROP LOGIC (SLOT BASED) ---

        function initSortable(qId) {
            const bankEl = document.getElementById(`word-bank-${qId}`);
            
            const sharedOpts = {
                group: 'shared', 
                animation: 150, 
                delay: 100, // Mobile touch compatibility
                delayOnTouchOnly: true,
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag'
            };

            if (bankEl) {
                new Sortable(bankEl, {
                    ...sharedOpts,
                    onEnd: () => syncSentenceState(qId)
                });
            }

            const step = state.flatSteps[state.currentStepIndex];
            const targetCount = step.question.targetLength;

            for (let i = 0; i < targetCount; i++) {
                const slotEl = document.getElementById(`slot-${qId}-${i}`);
                if (slotEl) {
                    new Sortable(slotEl, {
                        ...sharedOpts,
                        onAdd: function(evt) {
                            if (evt.to.children.length > 1) {
                                const oldItem = Array.from(evt.to.children).find(c => c !== evt.item);
                                if (oldItem) {
                                    bankEl.appendChild(oldItem);
                                }
                            }
                            syncSentenceState(qId);
                        },
                        onRemove: () => syncSentenceState(qId),
                        onEnd: () => syncSentenceState(qId)
                    });
                    
                    slotEl.addEventListener('dragenter', () => slotEl.classList.add('sortable-ghost-parent'));
                    slotEl.addEventListener('dragleave', () => slotEl.classList.remove('sortable-ghost-parent'));
                    slotEl.addEventListener('drop', () => slotEl.classList.remove('sortable-ghost-parent'));
                }
            }
        }

        function syncSentenceState(qId) {
            const bankEl = document.getElementById(`word-bank-${qId}`);
            const step = state.flatSteps[state.currentStepIndex];
            const targetCount = step.question.targetLength;
            
            const available = Array.from(bankEl.querySelectorAll('.word-chip')).map(el => el.getAttribute('data-word'));
            
            const slots = [];
            let filledCount = 0;
            for (let i = 0; i < targetCount; i++) {
                const slotEl = document.getElementById(`slot-${qId}-${i}`);
                if (slotEl) {
                    slotEl.classList.remove('sortable-ghost-parent'); 
                    const chips = slotEl.querySelectorAll('.word-chip');
                    if (chips.length > 0) {
                        slots.push(chips[chips.length - 1].getAttribute('data-word'));
                        filledCount++;
                    } else {
                        slots.push(null);
                    }
                } else {
                    slots.push(null);
                }
            }
            
            state.sentenceStates[qId] = { available, slots, filledCount };
            
            setTimeout(() => render(), 20);
        }

        // --- LISTENING: NATIVE CONVERSATIONAL TTS LOGIC ---

        async function playListeningAudio() {
            const step = state.flatSteps[state.currentStepIndex];
            const passageId = step.passageId;
            const playCount = state.passageAudioPlayed[passageId] || 0;

            if (playCount >= 2) return;
            
            state.passageAudioPlayed[passageId] = playCount + 1;
            state.isPlayingAudio = true;
            updateAudioUI(); 

            if (!femaleVoice || !maleVoice) assignVoices();

            const transcriptText = step.question.transcript || step.data.transcript;
            const lines = transcriptText.split('\n').filter(l => l.trim().length > 0);

            for (let line of lines) {
                if (!state.isPlayingAudio) break;
                
                let spokenText = line;
                let currentGender = 'male'; 

                const match = line.match(/^([A-Za-z\s]+):\s*(.*)/);
                if (match) {
                    const speaker = match[1].toLowerCase().trim();
                    spokenText = match[2]; 
                    if (speaker === 'woman') currentGender = 'female'; 
                }

                await new Promise((resolve) => {
                    const utterance = new SpeechSynthesisUtterance(spokenText.trim());
                    if (currentGender === 'female' && femaleVoice) utterance.voice = femaleVoice;
                    else if (maleVoice) utterance.voice = maleVoice;
                    
                    utterance.rate = 1.0; 
                    utterance.onend = resolve;
                    utterance.onerror = resolve; 
                    window.speechSynthesis.speak(utterance);
                });
                
                if (state.isPlayingAudio && lines.length > 1) {
                    await new Promise(r => setTimeout(r, 250));
                }
            }

            state.isPlayingAudio = false;
            state.passageAudioFinished[passageId] = true;
            updateAudioUI(); 
            startSectionTimer(); 
        }

        function updateAudioUI() {
            const step = state.flatSteps[state.currentStepIndex];
            if (step?.type !== 'listening') return;

            const passageId = step.passageId;
            const isFinished = state.passageAudioFinished[passageId];
            const playCount = state.passageAudioPlayed[passageId] || 0;
            
            const btnContainer = document.getElementById('audio-btn-container');
            const iconContainer = document.getElementById('audio-icon-container');
            const overlay = document.getElementById('question-overlay');
            const nextBtn = document.getElementById('next-btn');

            if (btnContainer) {
                if (state.isPlayingAudio) {
                    btnContainer.innerHTML = `<button disabled class="brutal-button flex items-center px-6 md:px-10 py-3 md:py-4 bg-[#FFDE00] text-black w-full md:w-auto justify-center"><i data-lucide="volume-2" class="w-5 h-5 md:w-6 md:h-6 mr-2 md:mr-3 animate-pulse"></i> Playing...</button>`;
                } else if (playCount >= 2) {
                    btnContainer.innerHTML = `<button disabled class="brutal-button flex items-center px-6 md:px-10 py-3 md:py-4 bg-gray-300 text-gray-600 w-full md:w-auto justify-center"><i data-lucide="check-circle" class="w-5 h-5 md:w-6 md:h-6 mr-2 md:mr-3"></i> Completed</button>`;
                } else {
                    let playText = playCount === 1 ? 'Play Audio (1 play left)' : 'Play Audio Segment';
                    btnContainer.innerHTML = `<button onclick="playListeningAudio()" class="brutal-button flex items-center px-6 md:px-10 py-3 md:py-4 bg-[#A8FF76] text-black w-full md:w-auto justify-center"><i data-lucide="play-circle" class="w-6 h-6 md:w-8 md:h-8 mr-2 md:mr-3"></i> ${playText}</button>`;
                }
                lucide.createIcons();
            }

            if (iconContainer) {
                if (state.isPlayingAudio) {
                    iconContainer.classList.add('translate-x-[4px]', 'translate-y-[4px]', 'shadow-none', 'bg-[#FF5757]');
                    iconContainer.classList.remove('brutal-shadow', 'bg-[#00E5FF]');
                    iconContainer.innerHTML = `<i data-lucide="volume-2" class="w-16 h-16 md:w-24 md:h-24 text-black animate-pulse"></i>`;
                } else {
                    iconContainer.classList.remove('translate-x-[4px]', 'translate-y-[4px]', 'shadow-none', 'bg-[#FF5757]');
                    iconContainer.classList.add('brutal-shadow', 'bg-[#00E5FF]');
                    iconContainer.innerHTML = `<i data-lucide="headphones" class="w-16 h-16 md:w-24 md:h-24 text-black"></i>`;
                }
                lucide.createIcons();
            }

            if (overlay && isFinished) {
                overlay.classList.add('opacity-0');
                setTimeout(() => { overlay.classList.add('hidden'); }, 500);
            }
            
            if (nextBtn && isFinished) {
                nextBtn.disabled = false;
            }
        }

        // --- SPEAKING: NATIVE TTS AND RECORDING ---

        async function playPromptAudio() {
            if (state.isRecording) return; 
            const step = state.flatSteps[state.currentStepIndex];
            stopAllAudioAndRecording();
            
            try {
                let textToSpeak = step.type === 'scenario' ? step.scenarioText : step.question.prompt;
                
                if (!femaleVoice || !maleVoice) assignVoices();
                const voiceToUse = maleVoice; 

                state.isPlayingAudio = true;
                render();

                await new Promise((resolve) => {
                    const utterance = new SpeechSynthesisUtterance(textToSpeak);
                    if (voiceToUse) utterance.voice = voiceToUse;
                    utterance.rate = 1.0;
                    utterance.onend = resolve;
                    utterance.onerror = resolve;
                    window.speechSynthesis.speak(utterance);
                });

                state.isPlayingAudio = false;
                render();
            } catch (error) {
                console.error("TTS Error:", error);
                state.isPlayingAudio = false;
                render();
            }
        }

        function startRecording() {
            stopAllAudioAndRecording();
            if (!state.recognition) {
                alert("Speech recognition is not supported in your browser.");
                return;
            }

            const step = state.flatSteps[state.currentStepIndex];
            state.recordingTimeLeft = step.question.timeLimit;
            state.isRecording = true;
            state.answers[step.question.id] = ""; 
            
            try { state.recognition.start(); } catch (e) {}

            render();
            state.recordingInterval = setInterval(() => {
                if (state.recordingTimeLeft > 0) {
                    state.recordingTimeLeft--;
                    render();
                } else {
                    state.hasRecorded[step.question.id] = true;
                    stopAllAudioAndRecording();
                    render();
                }
            }, 1000);
        }

        // --- PDF GENERATION LOGIC ---
        function calculateSpeakingScore(qId) {
            const userText = state.answers[qId] || "";
            const step = state.flatSteps.find(s => s.question && s.question.id === qId);
            if (!step) return 0;
            const targetPrompt = step.question.prompt;

            const targetWords = targetPrompt.toLowerCase().replace(/[^a-z0-9 ]/g, '').split(' ').filter(w=>w);
            const userWords = userText.toLowerCase().replace(/[^a-z0-9 ]/g, '').split(' ').filter(w=>w);
            
            let matches = 0;
            targetWords.forEach(w => {
                if (userWords.includes(w)) matches++;
            });
            
            const accuracy = targetWords.length ? matches / targetWords.length : 0;
            if (accuracy > 0.8) return 5;
            if (accuracy > 0.5) return 4;
            if (accuracy > 0.2) return 2;
            if (userText.trim() !== "") return 1;
            return 0;
        }

        function getScore(sectionType) {
            let correct = 0; let total = 0;
            if(sectionType === 'reading' || sectionType === 'listening') {
                testData[sectionType].sections.forEach(sec => {
                    if (sec.type === 'cloze') {
                        sec.blanks.forEach(b => {
                            total++;
                            const u = state.answers[b.id] ? state.answers[b.id].trim() : "";
                            const fw = (b.prefix||"") + u + (b.suffix||"");
                            if (fw.toLowerCase() === b.answer.toLowerCase()) correct++;
                        });
                    } else if (sec.type === 'reading' || sec.type === 'listening') {
                        sec.questions.forEach(q => {
                            total++;
                            if (state.answers[q.id] === q.correctAnswer) correct++;
                        });
                    }
                });
            } else if (sectionType === 'writing') {
                testData.writing.sections[0].questions.forEach(q => {
                    total++;
                    const sState = state.sentenceStates[q.id];
                    if (sState) {
                        // Compare the exact sequence of filled slots
                        // Using case insensitive comparison for writing chunks assembly
                        const userSentence = sState.slots.map(w => w || "").join(" ").replace(/\s+/g, " ").trim().toLowerCase();
                        if (userSentence === q.answer.toLowerCase()) correct++;
                    }
                });
            } else if (sectionType === 'speaking') {
                testData.speaking.sections[0].questions.forEach(q => {
                    total += 5; 
                    correct += calculateSpeakingScore(q.id);
                });
            }
            return { correct, total };
        }

        function renderCloze(step) {
            const parts = step.data.text.split(/%\d+%/);
            let content = '';
            parts.forEach((part, idx) => {
                content += part;
                const blank = step.data.blanks[idx];
                if (blank) {
                    const val = state.answers[blank.id] || '';
                    const prefixLen = blank.prefix ? blank.prefix.length : 0;
                    const suffixLen = blank.suffix ? blank.suffix.length : 0;
                    const missingLength = blank.answer.length - prefixLen - suffixLen;
                    const safeVal = val.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
                    const remainingDashes = Math.max(0, missingLength - val.length);
                    
                    const inputWidthDesktop = (missingLength * 1.3) + 1.5;
                    const inputWidthMobile = (missingLength * 1.0) + 1.0;
                    
                    content += `
                    <span class="inline-flex items-baseline mx-0.5 whitespace-nowrap">
                        ${blank.prefix ? `<span class="text-black font-black tracking-wide">${blank.prefix}</span>` : ''}
                        <span class="relative inline-flex border-[3px] border-black bg-white focus-within:bg-[#00E5FF] brutal-shadow-sm transition-colors mx-0.5 align-baseline" style="width: clamp(${inputWidthMobile}rem, 2vw, ${inputWidthDesktop}rem);">
                            <span id="bg-dashes-${blank.id}" class="absolute inset-0 px-1 md:px-2 flex items-center justify-start text-left font-mono text-base md:text-xl tracking-[0.15em] md:tracking-[0.25em] pointer-events-none text-black font-black">
                                <span class="opacity-0">${safeVal}</span><span>${'_'.repeat(remainingDashes)}</span>
                            </span>
                            <input type="text" value="${safeVal}" maxlength="${missingLength}" oninput="handleClozeInput(${blank.id}, this.value, ${missingLength})" class="w-full relative z-10 px-1 md:px-2 py-1 md:py-1.5 text-left bg-transparent text-black font-mono text-base md:text-xl tracking-[0.15em] md:tracking-[0.25em] font-black focus:outline-none" autocomplete="off" spellcheck="false" />
                        </span>
                        ${blank.suffix ? `<span class="text-black font-black tracking-wide">${blank.suffix}</span>` : ''}
                    </span>`;
                }
            });

            return `
            <div class="absolute inset-0 overflow-y-auto custom-scroll p-4 md:p-8 bg-[#FDF8F5]">
                <div class="w-full max-w-5xl mx-auto bg-white brutal-border brutal-shadow-lg p-6 md:p-12 min-h-full md:min-h-0">

                        ${content}
                    </div>
                </div>
            </div>`;
        }

        function renderBuildSentence(step) {
            const sState = state.sentenceStates[step.question.id];
            const targetCount = step.question.targetLength;
            const punctuation = step.question.punctuation || '.';

            const availChips = sState.available.map(w => `<div data-word="${w}" class="word-chip">${w}</div>`).join('');
            
            let slotsHtml = '';
            for (let i = 0; i < targetCount; i++) {
                const word = sState.slots[i];
                let inner = '';
                if (word) {
                    inner = `<div data-word="${word}" class="word-chip">${word}</div>`;
                }
                
                if (i === targetCount - 1 && step.question.punctuation) {
                    // Group the last slot and punctuation together to prevent line breaks between them
                    slotsHtml += `
                    <div class="flex items-end">
                        <div id="slot-${step.question.id}-${i}" class="slot-zone transition-all duration-200 min-w-[4rem] sm:min-w-[5rem] md:min-w-[6rem] h-12 flex items-center justify-center overflow-visible mx-1 my-2 relative">
                            ${inner}
                        </div>
                        <div class="h-12 pb-1 text-xl md:text-4xl font-black text-black ml-1 my-2 select-none flex items-end">${step.question.punctuation}</div>
                    </div>`;
                } else {
                    slotsHtml += `
                    <div id="slot-${step.question.id}-${i}" class="slot-zone transition-all duration-200 min-w-[4rem] sm:min-w-[5rem] md:min-w-[6rem] h-12 flex items-center justify-center overflow-visible mx-1 my-2 relative">

            <div class="absolute inset-0 overflow-y-auto custom-scroll p-4 md:p-8 bg-[#FDF8F5]">
                <div class="w-full max-w-3xl mx-auto md:mt-10">
                    <div class="bg-[#B28DFF] brutal-border p-6 md:p-10 mb-8 text-center brutal-shadow-lg">
                        <div class="w-16 h-16 bg-white brutal-border brutal-shadow flex items-center justify-center mx-auto mb-6 text-black"><i data-lucide="ear" class="w-8 h-8"></i></div>
                        <h2 class="text-xl md:text-2xl font-black text-black mb-6 uppercase bg-white inline-block px-4 py-2 brutal-border">${step.data.title}</h2>
                        <div class="mt-4 flex justify-center w-full">${audioBtn}</div>
                    </div>
                    <div class="bg-white border-[4px] ${state.isRecording ? 'border-[#FF5757]' : 'border-black'} p-6 md:p-10 text-center brutal-shadow-lg relative">
                        <h3 class="font-black text-black mb-8 uppercase tracking-widest text-lg bg-[#FFDE00] inline-block px-4 py-2 border-[3px] border-black">Your Response</h3>
                        <div class="flex flex-col items-center justify-center w-full max-w-sm mx-auto">
                            ${recBtn}
                            ${localNextBtn}
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderResults() {
            let html = `
            <div class="w-full max-w-4xl mx-auto pb-12 mt-10">
                <div class="bg-white brutal-border brutal-shadow-lg overflow-hidden mb-8">
                    <div class="bg-[#00E5FF] p-8 md:p-12 text-black text-center border-b-[4px] border-black">
                        <h2 class="text-3xl md:text-5xl font-black mb-4 uppercase">Practice Completed!</h2>
                        <h3 class="text-xl md:text-2xl font-bold bg-white inline-block px-4 py-2 brutal-border">${state.userName}</h3>
                    </div>
                    <div class="p-8 md:p-12 text-center bg-[#FDF8F5]">
                        <p class="text-black font-bold text-lg md:text-xl mb-8 max-w-lg mx-auto">Your PDF report has been generated. If your browser blocked the automatic download, you can click the button below to retrieve your comprehensive score report.</p>
                        <button onclick="generatePDFReport()" class="brutal-button px-8 py-5 bg-[#A8FF76] text-black inline-flex items-center text-lg">
                            <i data-lucide="download" class="w-6 h-6 mr-3"></i> Download Report Again
                        </button>
                    </div>
                </div>
            </div>`;
            return html;
        }

        // --- GLOBAL LAYOUT ---

        function renderHeader() {
            const isWelcome = !state.hasStarted;
            const isResults = state.showResults;
            const step = state.flatSteps[state.currentStepIndex];
            const isIntro = step?.type === 'section_intro';

            let leftContent = `<span class="text-black text-lg md:text-xl font-black flex items-center uppercase tracking-tight"><i data-lucide="graduation-cap" class="w-6 h-6 mr-3 text-[#FF5757]"></i> <span class="hidden sm:inline">TOEFL iBT® Mini Test</span><span class="sm:hidden">Mini Test</span></span>`;

            if (isIntro && !isResults) {
                const sectionName = step.globalSection.charAt(0).toUpperCase() + step.globalSection.slice(1);
                leftContent = `<span class="text-black text-xl md:text-2xl font-black uppercase bg-[#00E5FF] px-3 py-1 brutal-border shadow-[2px_2px_0_0_#000]">${sectionName}</span>`;
            }

            const backBtn = (state.currentStepIndex > 0 && !state.showResults && !isIntro) 
                ? `<button onclick="handleBack()" class="brutal-button flex items-center px-4 py-2 bg-[#FFDE00] text-black mr-4"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>` : '';

            let rightContent = '';

            if (isIntro && !isResults) {
                rightContent = `
                    <button class="brutal-button flex items-center bg-[#B28DFF] text-black px-4 py-2 mr-4 hidden md:flex"><i data-lucide="volume-2" class="w-5 h-5 mr-2"></i> Volume</button>
                    <button onclick="handleNext()" class="brutal-button flex items-center bg-[#A8FF76] text-black px-6 py-2 text-lg">Begin <i data-lucide="chevron-right" class="w-5 h-5 ml-2"></i></button>
                `;
            } else {
                const isListeningBlock = step?.type === 'listening';
                const isListenRepeatTask = step?.type === 'listen_and_repeat';
                const disableNext = !state.isAdmin && isListeningBlock && !state.passageAudioFinished[step.passageId];
                
                const nextBtn = (!state.showResults && state.hasStarted && !isWelcome && !isListenRepeatTask) 
                    ? `<button id="next-btn" onclick="handleNext()" class="brutal-button flex items-center px-6 py-2 bg-[#A8FF76] text-black disabled:opacity-50 text-base md:text-lg" ${disableNext?'disabled':''}>Next <i data-lucide="chevron-right" class="ml-2 w-5 h-5"></i></button>` 
                    : '';
                
                rightContent = `<div class="flex items-center">${backBtn}${nextBtn}</div>`;
            }

            return `
            <header class="flex-shrink-0 bg-white border-b-[4px] border-black h-20 flex items-center justify-between px-6 md:px-8 z-50 w-full relative">
                ${leftContent}
                <div class="flex items-center">
                    ${rightContent}
                </div>
            </header>`;
        }

        function renderSubHeader() {
            if (!state.hasStarted || state.showResults || state.flatSteps[state.currentStepIndex]?.type === 'section_intro') return '';
            
            const step = state.flatSteps[state.currentStepIndex];
            const sectionName = step.globalSection.charAt(0).toUpperCase() + step.globalSection.slice(1);
            
            let displayTitle = step.data?.title || sectionName;
            let counter = step.questionIndex ? `${step.questionIndex}/${step.totalQuestions}` : '';

            const showTimer = state.currentSectionTimer || (step && step.globalSection === 'listening' && step.type === 'listening');

            const timerHtml = showTimer ? `
                <div class="flex items-center font-mono bg-[#FF5757] text-white px-3 md:px-4 py-1 brutal-border shadow-[2px_2px_0_0_#000] text-sm md:text-base flex-shrink-0 font-black">
                    <i data-lucide="clock" class="mr-2 w-4 h-4 md:w-5 md:h-5"></i><span id="timer-display" class="tracking-widest"></span>
                </div>` : '';

            return `
            <div class="flex-shrink-0 bg-[#E2E8F0] border-b-[4px] border-black px-4 md:px-8 py-3 md:py-4 flex justify-between items-center text-black font-sans z-40 w-full gap-4 min-h-[64px] relative">
                <span class="font-black text-sm md:text-lg uppercase flex-1 truncate flex items-center">
                    <span class="bg-black text-white px-2 py-1 mr-3">${sectionName}</span>
                    <span class="hidden sm:inline">${displayTitle}</span>
                    ${counter ? `<span class="ml-2 bg-[#FFDE00] border-2 border-black px-2 shadow-[2px_2px_0_0_#000]">Q ${counter}</span>` : ''}
                </span>
                ${timerHtml}
            </div>`;
        }

        function render() {
            const app = document.getElementById('app');

            if (!state.hasStarted) {
                app.innerHTML = renderWelcome();
            } else if (state.showResults) {
                app.innerHTML = renderHeader() + `
                <main class="flex-1 relative bg-[#FDF8F5]">
                    <div class="absolute inset-0 overflow-y-auto custom-scroll p-4 md:p-8">
                        ${renderResults()}
                    </div>
                </main>`;
            } else {
                let mainContent = '';
                const step = state.flatSteps[state.currentStepIndex];
                
                if (step.type === 'section_intro') mainContent = renderSectionIntro(step);
                else if (step.type === 'cloze') mainContent = renderCloze(step);
                else if (step.type === 'reading') mainContent = renderReading(step);
                else if (step.type === 'listening') mainContent = renderListening(step);
                else if (step.type === 'build_sentence') mainContent = renderBuildSentence(step);
                else if (step.type === 'scenario') mainContent = renderSpeakingScenario(step);
                else if (step.type === 'listen_and_repeat') mainContent = renderSpeakingTask(step);
                
                app.innerHTML = renderHeader() + renderSubHeader() + `
                <main class="flex-1 relative bg-[#FDF8F5]">
                    ${mainContent}
                </main>`;

                if (step.type === 'build_sentence') initSortable(step.question.id);
                updateTimerDisplay();
            }
            lucide.createIcons();
        }

        render();
    </script>
</body>
</html>
