            margin: 0.25rem;
            display: inline-flex;

            justify-content: center;

            font-size: 1rem;

        }
        .word-bank .word-chip:hover {
            background-color: #f9fafb;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Slot Line Styling */
        .slot-zone {
            transition: all 0.2s ease-in-out;
        }
        .slot-zone .word-chip {
            width: 100%;
            min-width: max-content;
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 0.1rem;

        // --- NATIVE BROWSER VOICE SETUP (EDGE NATURAL VOICES) ---
        let femaleVoice = null;
        let maleVoice = null;

        function assignVoices() {
            const voices = window.speechSynthesis.getVoices();
            if (voices.length === 0) return;

            const enUSVoices = voices.filter(v => v.lang === 'en-US' || v.lang === 'en_US' || v.lang.startsWith('en'));
            
            femaleVoice = enUSVoices.find(v => v.name.includes('Natural') && (v.name.includes('Aria') || v.name.includes('Jenny') || v.name.includes('Michelle'))) ||
                          enUSVoices.find(v => v.name.includes('Female') || v.name.includes('Zira') || v.name.includes('Samantha') || v.name.includes('Google US English')) ||
                          enUSVoices[0];

            maleVoice = enUSVoices.find(v => v.name.includes('Natural') && (v.name.includes('Guy') || v.name.includes('Christopher') || v.name.includes('Eric') || v.name.includes('Roger'))) ||
                        enUSVoices.find(v => v.name.includes('Male') || v.name.includes('David') || v.name.includes('Alex')) ||
                        enUSVoices.find(v => v.name !== femaleVoice.name) || 
                        enUSVoices[1] || enUSVoices[0];
        }
        
        window.speechSynthesis.onvoiceschanged = assignVoices;

        // --- BROWSER STT (SPEECH-TO-TEXT) INITIALIZATION ---
        function initSpeechRecognition() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (window.SpeechRecognition) {
                state.recognition = new window.SpeechRecognition();
                state.recognition.continuous = true;
                state.recognition.interimResults = true;
                
                state.recognition.onresult = (event) => {
                    let finalTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        }
                    }
                    const step = state.flatSteps[state.currentStepIndex];
                    if (step && step.type === 'listen_and_repeat' && finalTranscript) {
                        const qId = step.question.id;
                        state.answers[qId] = (state.answers[qId] || '') + ' ' + finalTranscript;
                        render(); 
                    }
                };
            } else {
                console.warn("Speech Recognition API not supported. Fallback text input will be provided.");
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startTestWithUser() {
            const nameInput = document.getElementById('user-name').value.trim();
            if (nameInput) {
                if (nameInput === '300198') {
                    state.userName = 'Admin';
                    state.isAdmin = true;
                } else {
                    state.userName = nameInput;
                    state.isAdmin = false;
                }
                initTest();
            }
        }

        function initTest() {
            initSpeechRecognition();
            state.hasStarted = true;
            state.showResults = false;
            state.pdfGenerated = false;
            state.currentStepIndex = 0;
            state.answers = {};
            state.flatSteps = [];
            state.sentenceStates = {};
            state.passageAudioPlayed = {};
            state.passageAudioFinished = {};
            state.hasRecorded = {};

            const sectionOrder = ['reading', 'listening', 'writing', 'speaking'];

            sectionOrder.forEach(sectionKey => {
                const sectionData = testData[sectionKey];
                
                state.flatSteps.push({
                    type: 'section_intro',
                    globalSection: sectionKey,
                    title: sectionData.title
                });

                sectionData.sections.forEach(subSec => {
                    if (subSec.type === 'cloze') {
                        state.flatSteps.push({ type: 'cloze', globalSection: sectionKey, data: subSec, sectionId: subSec.id });
                    } else if (subSec.type === 'reading') {
                        subSec.questions.forEach((q, idx) => {
                            state.flatSteps.push({ type: 'reading', globalSection: sectionKey, data: subSec, question: q, questionIndex: idx + 1, totalQuestions: subSec.questions.length, sectionId: subSec.id });
                        });
                    } else if (subSec.type === 'listening') {
                        subSec.questions.forEach((q, idx) => {
                            state.flatSteps.push({ type: 'listening', globalSection: sectionKey, data: subSec, question: q, questionIndex: idx + 1, totalQuestions: subSec.questions.length, passageId: (subSec.id.includes("short")) ? `short_${q.id}` : subSec.id });
                        });
                    } else if (subSec.type === 'build_sentence') {
                        subSec.questions.forEach((q, idx) => {
                            // Initialize discrete slots for the sentence lines
                            state.sentenceStates[q.id] = { 
                                available: shuffleArray([...q.chunks]), 
                                slots: new Array(q.targetLength).fill(null) 
                            };
                            state.flatSteps.push({ type: 'build_sentence', globalSection: sectionKey, data: subSec, question: q, questionIndex: idx + 1, totalQuestions: subSec.questions.length, sectionId: subSec.id });
                        });
                    } else if (subSec.type === 'listen_and_repeat') {
                        if (subSec.scenario) {
                            state.flatSteps.push({ type: 'scenario', globalSection: sectionKey, data: subSec, scenarioText: subSec.scenario });
                        }
                        subSec.questions.forEach((q, idx) => {
                            state.answers[q.id] = ""; 
                            state.flatSteps.push({ type: 'listen_and_repeat', globalSection: sectionKey, data: subSec, question: q, questionIndex: idx + 1, totalQuestions: subSec.questions.length });
                        });
                    }
                });
            });
            
            assignVoices();
            startSectionTimer();
            render();
        }

        // --- GLOBAL CONTROLS ---

        function stopAllAudioAndRecording() {
            state.isPlayingAudio = false;
            window.speechSynthesis.cancel();
            
            if (state.recordingInterval) {
                clearInterval(state.recordingInterval);
                state.recordingInterval = null;
            }
            if (state.recognition && state.isRecording) {
                state.recognition.stop();
            }
            state.isRecording = false;
        }

        function stopRecordingEarly() {
            const step = state.flatSteps[state.currentStepIndex];
            if (step && step.question) {
                state.hasRecorded[step.question.id] = true;
            }
            stopAllAudioAndRecording();
            render();
        }

        function handleNext() {
            stopAllAudioAndRecording();
            if (state.currentStepIndex < state.flatSteps.length - 1) {
                state.currentStepIndex++;
                startSectionTimer();
                render();
            } else {
                finishTest();
            }
        }

        function handleBack() {
            stopAllAudioAndRecording();
            if (state.currentStepIndex > 0) {
                const step = state.flatSteps[state.currentStepIndex];
                if (step.type === 'listening') {
                    state.passageAudioFinished[step.passageId] = true; 
                }
                state.currentStepIndex--;
                startSectionTimer();
                render();
            }
        }

        function forceNextSection() {
            const currentSection = state.flatSteps[state.currentStepIndex].globalSection;
            const nextStep = state.flatSteps.find((s, idx) => idx > state.currentStepIndex && s.globalSection !== currentSection);
            
            stopAllAudioAndRecording();
            if (nextStep) {
                state.currentStepIndex = state.flatSteps.indexOf(nextStep);
                startSectionTimer();
                render();
            } else {
                finishTest();
            }
        }

        function finishTest() {
            stopAllAudioAndRecording();
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.showResults = true;
            render();
            setTimeout(generatePDFReport, 500);
        }

        // --- TIMER LOGIC ---

        function startSectionTimer() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            const step = state.flatSteps[state.currentStepIndex];
            if (!step) return;

            const currentSection = step.globalSection;
            
            if (currentSection === 'listening' && step.type === 'listening') {
                if (state.passageAudioFinished[step.passageId]) {
                    state.questionTimeLeft = step.question.timeLimit || 20;
                    state.timerInterval = setInterval(() => {
                        if (state.questionTimeLeft > 0) {
                            state.questionTimeLeft--;
                            updateTimerDisplay();
                        } else {
                            handleNext();
                        }
                    }, 1000);
                } else {
                    state.questionTimeLeft = null; 
                }
                updateTimerDisplay();
            } else if (state.sectionTimes[currentSection] !== undefined) {
                state.currentSectionTimer = currentSection;
                state.timerInterval = setInterval(() => {
                    if (state.sectionTimes[currentSection] > 0) {
                        state.sectionTimes[currentSection]--;
                        updateTimerDisplay();
                    } else {
                        forceNextSection();
                    }
                }, 1000);
            } else {
                state.currentSectionTimer = null;
                state.questionTimeLeft = null;
            }
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timer-display');
            if (!el) return;
            
            const step = state.flatSteps[state.currentStepIndex];

            if (step && step.globalSection === 'listening' && step.type === 'listening') {
                if (state.questionTimeLeft !== null && state.questionTimeLeft !== undefined) {
                    const secs = state.questionTimeLeft;
                    el.innerText = `0:${secs < 10 ? '0' : ''}${secs}`;
                } else {
                    el.innerText = '--:--';
                }
            } else if (state.currentSectionTimer && state.sectionTimes[state.currentSectionTimer] !== undefined) {
                const seconds = state.sectionTimes[state.currentSectionTimer];
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                el.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            } else {
                 el.innerText = '';
            }
        }

        // --- INPUT HANDLERS ---

        function handleClozeInput(id, value, missingLength) {
            state.answers[id] = value;
            const bgEl = document.getElementById(`bg-dashes-${id}`);
            if (bgEl) {
                const remaining = Math.max(0, missingLength - value.length);
                const safeValue = value.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
                bgEl.innerHTML = `<span class="opacity-0">${safeValue}</span><span>${'_'.repeat(remaining)}</span>`;
            }
        }

        function handleRadioInput(qId, value) {
            state.answers[qId] = value;
        }

        // --- WRITING: DRAG & DROP LOGIC (SLOT BASED) ---

        function initSortable(qId) {
            const bankEl = document.getElementById(`word-bank-${qId}`);
            
            const sharedOpts = {
                group: 'shared', 
                animation: 150, 
                delay: 100, // Mobile touch compatibility
                delayOnTouchOnly: true,
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag'
            };

            if (bankEl) {
                new Sortable(bankEl, {
                    ...sharedOpts,
                    onEnd: () => syncSentenceState(qId)
                });
            }

            const step = state.flatSteps[state.currentStepIndex];
            const targetCount = step.question.targetLength;

            // Initialize each individual underscore line as its own drop target
            for (let i = 0; i < targetCount; i++) {
                const slotEl = document.getElementById(`slot-${qId}-${i}`);
                if (slotEl) {
                    new Sortable(slotEl, {
                        ...sharedOpts,
                        onAdd: function(evt) {
                            // If user drops a word onto a line that already has a word, kick the old word back to the bank
                            if (evt.to.children.length > 1) {
                                const oldItem = Array.from(evt.to.children).find(c => c !== evt.item);
                                if (oldItem) {
                                    bankEl.appendChild(oldItem);
                                }
                            }
                            syncSentenceState(qId);
                        },
                        onRemove: () => syncSentenceState(qId),
                        onEnd: () => syncSentenceState(qId)
                    });
                    
                    // Add hover listeners to the slot itself to trigger the ghost styling class
                    slotEl.addEventListener('dragenter', () => slotEl.classList.add('sortable-ghost-parent'));
                    slotEl.addEventListener('dragleave', () => slotEl.classList.remove('sortable-ghost-parent'));
                    slotEl.addEventListener('drop', () => slotEl.classList.remove('sortable-ghost-parent'));
                }
            }
        }

        function syncSentenceState(qId) {
            const bankEl = document.getElementById(`word-bank-${qId}`);
            const step = state.flatSteps[state.currentStepIndex];
            const targetCount = step.question.targetLength;
            
            // Sync Word Bank
            const available = Array.from(bankEl.querySelectorAll('.word-chip')).map(el => el.getAttribute('data-word'));
            
            // Sync individual slots
            const slots = [];
            let filledCount = 0;
            for (let i = 0; i < targetCount; i++) {
                const slotEl = document.getElementById(`slot-${qId}-${i}`);
                if (slotEl) {
                    slotEl.classList.remove('sortable-ghost-parent'); // Ensure cleanup
                    const chips = slotEl.querySelectorAll('.word-chip');
                    if (chips.length > 0) {
                        slots.push(chips[chips.length - 1].getAttribute('data-word'));
                        filledCount++;
                    } else {
                        slots.push(null);
                    }
                } else {
                    slots.push(null);
                }
            }
            
            state.sentenceStates[qId] = { available, slots, filledCount };
            
            // Wait slightly for Sortable to finish DOM manipulations before re-rendering the UI
            setTimeout(() => render(), 20);
        }

        // --- LISTENING: NATIVE CONVERSATIONAL TTS LOGIC ---

        async function playListeningAudio() {
            const step = state.flatSteps[state.currentStepIndex];
            const passageId = step.passageId;
            const playCount = state.passageAudioPlayed[passageId] || 0;

            if (playCount >= 2) return;
            
            state.passageAudioPlayed[passageId] = playCount + 1;
            state.isPlayingAudio = true;
            updateAudioUI(); 

            if (!femaleVoice || !maleVoice) assignVoices();

            const transcriptText = step.question.transcript || step.data.transcript;
            const lines = transcriptText.split('\n').filter(l => l.trim().length > 0);

            for (let line of lines) {
                if (!state.isPlayingAudio) break;
                
                let spokenText = line;
                let currentGender = 'male'; 

                const match = line.match(/^([A-Za-z\s]+):\s*(.*)/);
                if (match) {
                    const speaker = match[1].toLowerCase().trim();
                    spokenText = match[2]; 
                    if (speaker === 'woman') currentGender = 'female'; 
                }

                await new Promise((resolve) => {
                    const utterance = new SpeechSynthesisUtterance(spokenText.trim());
                    if (currentGender === 'female' && femaleVoice) utterance.voice = femaleVoice;
                    else if (maleVoice) utterance.voice = maleVoice;
                    
                    utterance.rate = 1.0; 
                    utterance.onend = resolve;
                    utterance.onerror = resolve; 
                    window.speechSynthesis.speak(utterance);
                });
                
                if (state.isPlayingAudio && lines.length > 1) {
                    await new Promise(r => setTimeout(r, 250));
                }
            }

            state.isPlayingAudio = false;
            state.passageAudioFinished[passageId] = true;
            updateAudioUI(); 
            startSectionTimer(); 
        }

        function updateAudioUI() {
            const step = state.flatSteps[state.currentStepIndex];
            if (step?.type !== 'listening') return;

            const passageId = step.passageId;
            const isFinished = state.passageAudioFinished[passageId];
            const playCount = state.passageAudioPlayed[passageId] || 0;
            
            const btnContainer = document.getElementById('audio-btn-container');
            const iconContainer = document.getElementById('audio-icon-container');
            const overlay = document.getElementById('question-overlay');
            const nextBtn = document.getElementById('next-btn');

            if (btnContainer) {
                if (state.isPlayingAudio) {
                    btnContainer.innerHTML = `<button disabled class="flex items-center px-6 md:px-10 py-3 md:py-4 bg-teal-50 text-teal-600 font-bold rounded-full border border-teal-200 cursor-not-allowed w-full md:w-auto justify-center"><i data-lucide="volume-2" class="w-5 h-5 md:w-6 md:h-6 mr-2 md:mr-3 animate-pulse"></i> Playing...</button>`;
                } else if (playCount >= 2) {
                    btnContainer.innerHTML = `<button disabled class="flex items-center px-6 md:px-10 py-3 md:py-4 bg-gray-100 text-gray-400 font-bold rounded-full shadow-inner border border-gray-200 cursor-not-allowed w-full md:w-auto justify-center"><i data-lucide="check-circle" class="w-5 h-5 md:w-6 md:h-6 mr-2 md:mr-3"></i> Completed</button>`;
                } else {
                    let playText = playCount === 1 ? 'Play Audio (1 play left)' : 'Play Audio Segment';
                    btnContainer.innerHTML = `<button onclick="playListeningAudio()" class="flex items-center px-6 md:px-10 py-3 md:py-4 bg-white text-[#007777] font-bold rounded-full shadow-lg border border-[#007777] w-full md:w-auto justify-center"><i data-lucide="play-circle" class="w-6 h-6 md:w-8 md:h-8 mr-2 md:mr-3"></i> ${playText}</button>`;
                }
                lucide.createIcons();
            }

            if (iconContainer) {
                if (state.isPlayingAudio) {
                    iconContainer.classList.add('scale-105', 'animate-pulse');
                    iconContainer.innerHTML = `<i data-lucide="volume-2" class="w-16 h-16 md:w-24 md:h-24 text-white opacity-90"></i>`;
                } else {
                    iconContainer.classList.remove('scale-105', 'animate-pulse');
                    iconContainer.innerHTML = `<i data-lucide="headphones" class="w-16 h-16 md:w-24 md:h-24 text-white opacity-90"></i>`;
                }
                lucide.createIcons();
            }

            if (overlay && isFinished) {
                overlay.classList.add('opacity-0');
                setTimeout(() => { overlay.classList.add('hidden'); }, 500);
            }
            
            if (nextBtn && isFinished) {
                nextBtn.disabled = false;
                nextBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // --- SPEAKING: NATIVE TTS AND RECORDING ---

        async function playPromptAudio() {
            if (state.isRecording) return; 
            const step = state.flatSteps[state.currentStepIndex];
            stopAllAudioAndRecording();
            
            try {
                let textToSpeak = step.type === 'scenario' ? step.scenarioText : step.question.prompt;
                
                if (!femaleVoice || !maleVoice) assignVoices();
                const voiceToUse = maleVoice; 

                state.isPlayingAudio = true;
                render();

                await new Promise((resolve) => {
                    const utterance = new SpeechSynthesisUtterance(textToSpeak);
                    if (voiceToUse) utterance.voice = voiceToUse;
                    utterance.rate = 1.0;
                    utterance.onend = resolve;
                    utterance.onerror = resolve;
                    window.speechSynthesis.speak(utterance);
                });

                state.isPlayingAudio = false;
                render();
            } catch (error) {
                console.error("TTS Error:", error);
                state.isPlayingAudio = false;
                render();
            }
        }

        function startRecording() {
            stopAllAudioAndRecording();
            if (!state.recognition) {
                alert("Speech recognition is not supported in your browser.");
                return;
            }

            const step = state.flatSteps[state.currentStepIndex];
            state.recordingTimeLeft = step.question.timeLimit;
            state.isRecording = true;
            state.answers[step.question.id] = ""; 
            
            try { state.recognition.start(); } catch (e) {}

            render();
            state.recordingInterval = setInterval(() => {
                if (state.recordingTimeLeft > 0) {
                    state.recordingTimeLeft--;
                    render();
                } else {
                    state.hasRecorded[step.question.id] = true;
                    stopAllAudioAndRecording();
                    render();
                }
            }, 1000);
        }

        // --- PDF GENERATION LOGIC ---
        function calculateSpeakingScore(qId) {
            const userText = state.answers[qId] || "";
            const step = state.flatSteps.find(s => s.question && s.question.id === qId);
            if (!step) return 0;
            const targetPrompt = step.question.prompt;

            const targetWords = targetPrompt.toLowerCase().replace(/[^a-z0-9 ]/g, '').split(' ').filter(w=>w);
            const userWords = userText.toLowerCase().replace(/[^a-z0-9 ]/g, '').split(' ').filter(w=>w);
            
            let matches = 0;
            targetWords.forEach(w => {
                if (userWords.includes(w)) matches++;
            });
            
            const accuracy = targetWords.length ? matches / targetWords.length : 0;
            if (accuracy > 0.8) return 5;
            if (accuracy > 0.5) return 4;
            if (accuracy > 0.2) return 2;
            if (userText.trim() !== "") return 1;
            return 0;
        }

        function getScore(sectionType) {
            let correct = 0; let total = 0;
            if(sectionType === 'reading' || sectionType === 'listening') {
                testData[sectionType].sections.forEach(sec => {
                    if (sec.type === 'cloze') {
                        sec.blanks.forEach(b => {
                            total++;
                            const u = state.answers[b.id] ? state.answers[b.id].trim() : "";
                            const fw = (b.prefix||"") + u + (b.suffix||"");
                            if (fw.toLowerCase() === b.answer.toLowerCase()) correct++;
                        });
                    } else if (sec.type === 'reading' || sec.type === 'listening') {
                        sec.questions.forEach(q => {
                            total++;
                            if (state.answers[q.id] === q.correctAnswer) correct++;
                        });
                    }
                });
            } else if (sectionType === 'writing') {
                testData.writing.sections[0].questions.forEach(q => {
                    total++;
                    const sState = state.sentenceStates[q.id];
                    if (sState) {
                        // Compare the exact sequence of filled slots
                        const userSentence = sState.slots.map(w => w || "").join(" ").replace(/\s+/g, " ").trim();
                        if (userSentence === q.answer) correct++;
                    }
                });
            } else if (sectionType === 'speaking') {
                testData.speaking.sections[0].questions.forEach(q => {
                    total += 5; 
                    correct += calculateSpeakingScore(q.id);
                });
            }
            return { correct, total };
        }

        function renderCloze(step) {
            const parts = step.data.text.split(/%\d+%/);
            let content = '';
            parts.forEach((part, idx) => {
                content += part;
                const blank = step.data.blanks[idx];
                if (blank) {
                    const val = state.answers[blank.id] || '';
                    const prefixLen = blank.prefix ? blank.prefix.length : 0;
                    const suffixLen = blank.suffix ? blank.suffix.length : 0;
                    const missingLength = blank.answer.length - prefixLen - suffixLen;
                    const safeVal = val.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
                    const remainingDashes = Math.max(0, missingLength - val.length);
                    
                    const inputWidthDesktop = (missingLength * 1.25) + 0.5;
                    const inputWidthMobile = (missingLength * 0.9) + 0.5;
                    
                    content += `
                    <span class="inline-flex items-baseline mx-0.5 whitespace-nowrap">
                        ${blank.prefix ? `<span class="text-[#005a9c] font-semibold tracking-wide">${blank.prefix}</span>` : ''}
                        <span class="relative inline-block h-6 md:h-8 border-b-[3px] border-gray-300 focus-within:border-[#007777] transition-colors mx-0.5 align-baseline" style="width: clamp(${inputWidthMobile}rem, 2vw, ${inputWidthDesktop}rem);">
                            <span id="bg-dashes-${blank.id}" class="absolute inset-0 px-0.5 md:px-1 text-left font-mono text-base md:text-xl tracking-[0.15em] md:tracking-[0.25em] pointer-events-none leading-6 md:leading-8 text-gray-500 font-bold overflow-hidden">
                                <span class="opacity-0">${safeVal}</span><span>${'_'.repeat(remainingDashes)}</span>
                            </span>
                            <input type="text" value="${safeVal}" maxlength="${missingLength}" oninput="handleClozeInput(${blank.id}, this.value, ${missingLength})" class="absolute inset-0 w-full h-full px-0.5 md:px-1 text-left bg-transparent text-[#005a9c] font-mono text-base md:text-xl tracking-[0.15em] md:tracking-[0.25em] font-bold focus:outline-none leading-6 md:leading-8" autocomplete="off" spellcheck="false" />
                        </span>
                        ${blank.suffix ? `<span class="text-[#005a9c] font-semibold tracking-wide">${blank.suffix}</span>` : ''}
                    </span>`;
                }
            });

            return `
            <div class="absolute inset-0 overflow-y-auto custom-scroll p-4 md:p-8 bg-white md:bg-transparent">
                <div class="w-full max-w-5xl mx-auto bg-white md:rounded-2xl md:shadow-sm md:border border-gray-200 p-6 md:p-12 min-h-full md:min-h-0">
                    <h2 class="text-center text-xl md:text-2xl font-sans font-bold text-black mb-8 md:mb-12">${step.data.title}</h2>
                    <div class="bg-gray-50 md:bg-white p-6 md:p-8 leading-loose text-base md:text-lg text-gray-800 font-sans text-justify rounded-xl md:rounded-none md:shadow-sm md:border border-gray-200">
                        ${content}
                    </div>
                </div>
            </div>`;
        }

        function renderBuildSentence(step) {
            const sState = state.sentenceStates[step.question.id];
            const targetCount = step.question.targetLength;
            // Get the punctuation from our updated step data (defaulting to a period if not set)
            const punctuation = step.question.punctuation || '.';

            const availChips = sState.available.map(w => `<div data-word="${w}" class="word-chip">${w}</div>`).join('');
            
            let slotsHtml = '';
            for (let i = 0; i < targetCount; i++) {
                const word = sState.slots[i];
                let inner = '';
                if (word) {
                    inner = `<div data-word="${word}" class="word-chip">${word}</div>`;
                }
                slotsHtml += `
                <div id="slot-${step.question.id}-${i}" class="slot-zone transition-all duration-200 min-w-[4rem] sm:min-w-[5rem] md:min-w-[6rem] h-8 border-b border-gray-700 bg-transparent flex items-end justify-center overflow-visible mx-1 my-2">
                    ${inner}
                </div>`;
            }
            
            // Append the punctuation right next to the last underline slot securely on the flex container's baseline
            slotsHtml += `<div class="h-8 flex items-end justify-center mx-1 my-2 pb-1 text-2xl font-bold text-gray-800">${punctuation}</div>`;

            return `
            <div class="absolute inset-0 overflow-y-auto custom-scroll p-4 md:p-8 bg-white md:bg-transparent">

                : `<button onclick="playPromptAudio()" class="flex items-center w-full md:w-auto justify-center px-6 py-3 md:py-4 bg-white border-2 border-[#007777] text-[#007777] font-bold rounded-full shadow hover:bg-gray-50 transition-colors"><i data-lucide="play" class="w-5 h-5 mr-2"></i> Play Prompt</button>`;

                ? `<button onclick="stopRecordingEarly()" class="flex items-center w-full justify-center px-8 py-4 bg-red-500 text-white font-bold rounded-full shadow-lg recording-pulse"><i data-lucide="square" class="w-6 h-6 mr-2"></i> Stop (${state.recordingTimeLeft}s)</button>`
                : `<button onclick="startRecording()" class="flex items-center w-full justify-center px-8 py-4 bg-gray-800 text-white font-bold rounded-full shadow-lg hover:bg-gray-700" ${state.isPlayingAudio || hasRecorded ? 'disabled opacity-50' : ''}><i data-lucide="mic" class="w-6 h-6 mr-2"></i> ${hasRecorded ? 'Recorded' : `Start Recording (${step.question.timeLimit}s)`}</button>`;

            let localNextBtn = (hasRecorded || state.isAdmin)
                ? `<button onclick="handleNext()" class="mt-4 flex items-center w-full justify-center px-8 py-4 bg-[#007777] text-white font-bold rounded-full shadow-lg hover:bg-[#005555] transition-colors">Next Question <i data-lucide="arrow-right" class="w-5 h-5 ml-2"></i></button>`
                : `<button disabled class="mt-4 flex items-center w-full justify-center px-8 py-4 bg-gray-200 text-gray-400 font-bold rounded-full shadow-inner cursor-not-allowed">Next Question <i data-lucide="arrow-right" class="w-5 h-5 ml-2"></i></button>`;

            return `
            <div class="absolute inset-0 overflow-y-auto custom-scroll p-4 md:p-8 bg-white md:bg-transparent">
                <div class="w-full max-w-3xl mx-auto md:mt-10">
                    <div class="bg-gray-50 border border-gray-200 rounded-xl p-6 md:p-8 mb-6 md:mb-8 text-center shadow-sm">
                        <div class="w-12 h-12 md:w-16 md:h-16 bg-[#007777] rounded-full flex items-center justify-center mx-auto mb-4 text-white shadow-md"><i data-lucide="ear" class="w-6 h-6 md:w-8 h-8"></i></div>
                        <h2 class="text-lg md:text-xl font-bold text-gray-800 mb-2">${step.data.title}</h2>
                        <div class="mt-6 flex justify-center w-full px-2 md:px-0">${audioBtn}</div>
                    </div>
                    <div class="bg-white border-2 ${state.isRecording ? 'border-red-400' : 'border-gray-200'} rounded-xl p-6 md:p-8 text-center shadow-md relative">
                        <h3 class="font-bold text-gray-700 mb-6 uppercase tracking-widest text-xs md:text-sm">Your Response</h3>
                        <div class="flex flex-col items-center justify-center w-full px-2 md:px-0 max-w-xs mx-auto">
                            ${recBtn}
                            ${localNextBtn}
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderResults() {
            let html = `
            <div class="w-full max-w-4xl mx-auto pb-12">
                <div class="bg-white shadow-lg rounded-xl overflow-hidden mb-8">
                    <div class="bg-[#007777] p-6 md:p-8 text-white text-center">
                        <h2 class="text-2xl md:text-3xl font-bold mb-2">Practice Completed, ${state.userName}!</h2>
                        <p class="text-sm md:text-base opacity-90">Your PDF report has been generated automatically.</p>
                    </div>
                    <div class="p-8 text-center bg-gray-50 border-b border-gray-100">
                        <p class="text-gray-700 mb-4 max-w-lg mx-auto">If your browser blocked the automatic download, you can click the button below to retrieve your comprehensive score report.</p>
                        <button onclick="generatePDFReport()" class="px-8 py-3 bg-[#007777] text-white font-bold rounded shadow hover:bg-[#005555] inline-flex items-center">
                            <i data-lucide="download" class="w-5 h-5 mr-2"></i> Download PDF Report Again
                        </button>
                    </div>
                </div>
            </div>`;
            return html;
        }

        // --- GLOBAL LAYOUT ---

        function renderHeader() {
            const isWelcome = !state.hasStarted;
            const isResults = state.showResults;
            const step = state.flatSteps[state.currentStepIndex];
            const isIntro = step?.type === 'section_intro';

            let leftContent = `<span class="text-white text-base md:text-lg font-sans font-bold flex items-center"><i data-lucide="graduation-cap" class="w-5 h-5 mr-2"></i> <span class="hidden sm:inline">TOEFL iBT® Mini Test</span><span class="sm:hidden">Mini Test</span></span>`;

            if (isIntro && !isResults) {
                const sectionName = step.globalSection.charAt(0).toUpperCase() + step.globalSection.slice(1);
                leftContent = `<span class="text-white text-lg md:text-xl font-sans font-medium">${sectionName}</span>`;
            }

            const backBtn = (state.currentStepIndex > 0 && !state.showResults && !isIntro) 
                ? `<button onclick="handleBack()" class="flex items-center px-3 py-2 bg-white text-[#007777] font-bold rounded shadow hover:bg-gray-100 mr-2"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>` : '';

            let rightContent = '';

            if (isIntro && !isResults) {
                rightContent = `
                    <button class="flex items-center bg-[#006262] text-white px-4 py-2 rounded text-sm font-bold mr-3 border border-transparent hover:bg-[#005555] transition-colors shadow-sm"><i data-lucide="volume-2" class="w-4 h-4 mr-2"></i> Volume</button>
                    <button onclick="handleNext()" class="flex items-center bg-white text-[#007777] px-5 py-2 rounded text-sm font-bold shadow hover:bg-gray-50 transition-colors">Begin <i data-lucide="chevron-right" class="w-4 h-4 ml-1"></i></button>
                `;
            } else {
                const isListeningBlock = step?.type === 'listening';
                const isListenRepeatTask = step?.type === 'listen_and_repeat';
                const disableNext = !state.isAdmin && isListeningBlock && !state.passageAudioFinished[step.passageId];
                
                const nextBtn = (!state.showResults && state.hasStarted && !isWelcome && !isListenRepeatTask) 
                    ? `<button id="next-btn" onclick="handleNext()" class="flex items-center px-4 py-2 bg-white text-[#007777] font-bold rounded shadow hover:bg-gray-100 disabled:opacity-50 text-sm md:text-base" ${disableNext?'disabled':''}>Next <i data-lucide="chevron-right" class="ml-1 w-4 h-4 md:w-5 md:h-5"></i></button>` 
                    : '';
                
                rightContent = `<div class="flex space-x-1 md:space-x-2 items-center">${backBtn}${nextBtn}</div>`;
            }

            return `
            <header class="flex-shrink-0 bg-[#007777] h-16 flex items-center justify-between px-6 md:px-8 shadow-sm z-50 w-full relative">
                ${leftContent}
                <div class="flex items-center">
                    ${rightContent}
                </div>
            </header>`;
        }

        function renderSubHeader() {
            if (!state.hasStarted || state.showResults || state.flatSteps[state.currentStepIndex]?.type === 'section_intro') return '';
            
            const step = state.flatSteps[state.currentStepIndex];
            const sectionName = step.globalSection.charAt(0).toUpperCase() + step.globalSection.slice(1);
            
            let displayTitle = step.data?.title || sectionName;
            let counter = step.questionIndex ? `${step.questionIndex}/${step.totalQuestions}` : '';

            const showTimer = state.currentSectionTimer || (step && step.globalSection === 'listening' && step.type === 'listening');

            const timerHtml = showTimer ? `
                <div class="flex items-center text-gray-500 font-mono bg-gray-100 px-2 md:px-3 py-1 rounded border border-gray-200 text-xs md:text-sm flex-shrink-0">
                    <i data-lucide="clock" class="mr-1 md:mr-2 w-3 h-3 md:w-4 md:h-4"></i><span id="timer-display" class="font-bold"></span>
                </div>` : '';

            return `
            <div class="flex-shrink-0 bg-white border-b border-gray-300 px-4 md:px-6 py-2 md:py-3 flex justify-between items-center text-gray-700 text-sm font-sans z-40 shadow-sm w-full gap-2 min-h-[48px] md:min-h-[56px] relative">
                <span class="font-semibold text-sm md:text-lg text-[#007777] flex-1 truncate">
                    ${sectionName}: <span class="hidden sm:inline">${displayTitle}</span>
                    ${counter ? `<span class="sm:hidden ml-1 opacity-70">(${counter})</span>` : ''}
                    ${counter ? `<span class="hidden sm:inline ml-1 opacity-70">(${counter})</span>` : ''}
                </span>
                ${timerHtml}
            </div>`;
        }

        function render() {
            const app = document.getElementById('app');

            if (!state.hasStarted) {
                app.innerHTML = renderWelcome();
            } else if (state.showResults) {
                app.innerHTML = renderHeader() + `
                <main class="flex-1 relative bg-[#f0f0f0]">
                    <div class="absolute inset-0 overflow-y-auto custom-scroll p-4 md:p-8">
                        ${renderResults()}
                    </div>
                </main>`;
            } else {
                let mainContent = '';
                const step = state.flatSteps[state.currentStepIndex];
                
                if (step.type === 'section_intro') mainContent = renderSectionIntro(step);
                else if (step.type === 'cloze') mainContent = renderCloze(step);
                else if (step.type === 'reading') mainContent = renderReading(step);
                else if (step.type === 'listening') mainContent = renderListening(step);
                else if (step.type === 'build_sentence') mainContent = renderBuildSentence(step);
                else if (step.type === 'scenario') mainContent = renderSpeakingScenario(step);
                else if (step.type === 'listen_and_repeat') mainContent = renderSpeakingTask(step);
                
                app.innerHTML = renderHeader() + renderSubHeader() + `
                <main class="flex-1 relative bg-white md:bg-gray-100">
                    ${mainContent}
                </main>`;

                if (step.type === 'build_sentence') initSortable(step.question.id);
                updateTimerDisplay();
            }
            lucide.createIcons();
        }

        render();
    </script>
</body>
</html>
