                            totalQuestions: section.questions.length,
                            sectionId: section.id

            state.flatSteps = steps;
            
            render();

        function startTimer() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                if (state.timeLeft > 0) {
                    state.timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(state.timerInterval);
                    handleModuleComplete();
                }
            }, 1000);

        function stopTimer() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
        }

        function handleNext() {
            if (state.currentStepIndex < state.flatSteps.length - 1) {
                state.currentStepIndex++;
                render();
            } else {
                if (state.isReviewMode) {
                    endReview();
                } else {
                    handleModuleComplete();
                }
            }
        }

        function handleModuleComplete() {
            stopTimer();
            if (state.currentModule === 'module1') {
                // Transition seamlessly to Module 2
                loadModule('module2');
            } else {
                // Both modules complete
                finishTest();
            }
        }

        function handleBack() {
            if (state.currentStepIndex > 0) {
                state.currentStepIndex--;
                render();
            }
        }

        function handleBeginTest() {
            state.showInstructions = false;
            render();
            startTimer();
        }

        function finishTest() {
            stopTimer();
            state.showResults = true;
            render();
        }

            state.isReviewMode = true;

            state.currentStepIndex = 0;

            const steps = [];

                moduleData.sections.forEach(section => {
                    if (section.type === 'cloze') {
                        steps.push({ type: 'cloze', data: section, sectionId: section.id });
                    } else if (section.type === 'reading') {
                        section.questions.forEach((q, idx) => {
                            steps.push({ type: 'reading', data: section, question: q, questionIndex: idx + 1, totalQuestions: section.questions.length, sectionId: section.id });
                        });
                    }
                });
            });
            state.flatSteps = steps;
            render();
        }

            state.isReviewMode = false;
            state.showResults = true;
            render();
        }

                            }
                        });
                    }
                });
            });
            return { correct, total };
        }

            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;

            const { data } = step;
            const parts = data.text.split(/%\d+%/);

                const blank = data.blanks[idx];
                if (blank) {
                    const val = state.answers[blank.id] || '';
                    
                    if (state.isReviewMode) {
                        const fullUserWord = (blank.prefix || "") + val.trim() + (blank.suffix || "");

                        if (isCorrect) {
                            content += `<span class="inline-block px-1 mx-1 bg-green-100 text-green-700 font-bold border border-green-300 rounded">${fullUserWord}</span>`;
                        } else {
                            content += `<span class="inline-block px-1 mx-1 bg-red-50 text-red-500 line-through decoration-2 decoration-red-500 border border-red-200 rounded">${fullUserWord || "(empty)"}</span>

                        }

                        const prefixLen = blank.prefix ? blank.prefix.length : 0;
                        const suffixLen = blank.suffix ? blank.suffix.length : 0;
                        const missingLength = blank.answer.length - prefixLen - suffixLen;
                        
                        const safeVal = val.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
                        
                        // Dynamically width the single robust input
                        const inputWidth = Math.max(missingLength * 1.2, 2.5);

                                maxlength="${missingLength}"

                    <div class="max-w-xl mx-auto pb-12">
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
                            <h3 class="text-xl font-bold text-slate-800 font-sans">${question.text}</h3>
                        </div>
                        <div class="space-y-4">
                            ${options}
                        </div>
                        ${explanationBlock}
                    </div>
                </div>
            </div>
            `;
        }

        // MAIN RENDER LOOP
        function render() {
            const app = document.getElementById('app');
            
            if (!state.currentModule) {
                app.innerHTML = renderWelcome();
            } else if (state.showResults) {
                app.innerHTML = renderResults();
            } else {
                let mainContent = '';
                if (state.showInstructions) {
                    mainContent = renderInstructions();
                } else {
                    const step = state.flatSteps[state.currentStepIndex];
                    if (step.type === 'cloze') {
                        mainContent = renderCloze(step);
                    } else if (step.type === 'reading') {
                        mainContent = renderReading(step);
                    }
                }
                
                app.innerHTML = renderHeader() + renderSubHeader() + mainContent;
            }

            lucide.createIcons();
        }

        render();
    </script>
</body>
</html>
