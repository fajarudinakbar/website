            femaleVoice = enVoices.find(v => (v.name.includes('Natural') || v.name.includes('Online')) && femaleKeywords.some(k => v.name.toLowerCase().includes(k))) ||
                          enVoices.find(v => femaleKeywords.some(k => v.name.toLowerCase().includes(k))) ||
                          enVoices[0];

            maleVoice = enVoices.find(v => (v.name.includes('Natural') || v.name.includes('Online')) && maleKeywords.some(k => v.name.toLowerCase().includes(k))) ||
                        enVoices.find(v => maleKeywords.some(k => v.name.toLowerCase().includes(k))) ||
                        enVoices.find(v => v.name !== femaleVoice.name) || 
                        enVoices[1] || enVoices[0];

            state.currentModule = moduleId;

            state.showInstructions = true; 
            state.isReviewMode = false;
            state.currentStepIndex = 0;

            // Flatten steps
            const steps = [];

                if (section.type === 'listening') {
                    section.questions.forEach((q, idx) => {
                        steps.push({
                            type: 'listening',
                            data: section,
                            question: q,
                            questionIndex: idx + 1,
                            totalQuestions: section.questions.length,
                            passageId: (section.id.includes("short")) ? `short_${q.id}` : section.id 
                        });
                    });
                }
            });
            state.flatSteps = steps;
            
            assignVoices();
            render();
        }

        function setupCurrentStep() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }

            if (state.isReviewMode) {
                return; // No timer needed in review mode
            }

            const step = state.flatSteps[state.currentStepIndex];
            const isTalk = step.data.id.includes('talk') || step.data.audioTitle.toLowerCase().includes('lecture') || step.data.audioTitle.toLowerCase().includes('podcast');
            
            // Initialize new question time
            state.questionTimeLeft = isTalk ? 30 : 20;

            // If audio was already completed previously for this passage, start timer immediately
            if (state.passageAudioFinished[step.passageId]) {
                startQuestionTimer();
            } else {
                updateTimerDisplay(); // Render the initial static time
            }
        }

        function startQuestionTimer() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            
            state.timerInterval = setInterval(() => {
                if (state.questionTimeLeft > 0) {
                    state.questionTimeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(state.timerInterval);
                    handleNext(); // Auto-advance when time runs out
                }
            }, 1000);
        }

        function stopAudio() {
            state.isPlaying = false;
            window.speechSynthesis.cancel();
        }

        async function playPreparedAudio() {
            const step = state.flatSteps[state.currentStepIndex];
            const passageId = step.passageId;
            const playCount = state.passageAudioPlayed[passageId] || 0;

            if (playCount >= 2) return;
            
            state.passageAudioPlayed[passageId] = playCount + 1;
            state.isPlaying = true;
            
            // Pause timer if it was running (e.g., user is using their 2nd replay)
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
            
            updateAudioUI(); 

            if (!femaleVoice || !maleVoice) assignVoices();

            const transcriptText = step.question.transcript || step.data.transcript;
            const lines = transcriptText.split('\n').filter(l => l.trim().length > 0);

            for (let line of lines) {
                if (!state.isPlaying) break;
                
                let spokenText = line;
                let currentGender = 'male'; 

                const match = line.match(/^([A-Za-z\s]+):\s*(.*)/);
                if (match) {
                    const speaker = match[1].toLowerCase().trim();
                    spokenText = match[2]; 
                    
                    if (speaker.includes('woman') || speaker.includes('host') || speaker.includes('layla')) {
                        currentGender = 'female'; 
                    } else if (speaker.includes('man') || speaker.includes('professor') || speaker.includes('sami')) {
                        currentGender = 'male';
                    }
                }

                const sentences = spokenText.match(/[^.!?]+[.!?]+/g) || [spokenText];

                for (let sentence of sentences) {
                    if (!state.isPlaying) break;

                    await new Promise((resolve) => {
                        const utterance = new SpeechSynthesisUtterance(sentence.trim());
                        
                        if (currentGender === 'female') {
                            if (femaleVoice) utterance.voice = femaleVoice;
                        } else {
                            if (maleVoice) utterance.voice = maleVoice;
                        }
                        
                        utterance.rate = 0.95; 
                        utterance.onend = resolve;
                        utterance.onerror = resolve; 
                        window.speechSynthesis.speak(utterance);
                    });
                }
                
                if (state.isPlaying && lines.length > 1) {
                    await new Promise(r => setTimeout(r, 400));
                }
            }

            state.isPlaying = false;
            state.passageAudioFinished[passageId] = true;
            
            // Resume/Start timer after playback concludes
            startQuestionTimer();
            updateAudioUI(); 
        }

        // Targeted DOM updates to prevent flickering
        function updateAudioUI() {
            if (state.isReviewMode) return;

            const step = state.flatSteps[state.currentStepIndex];
            const passageId = step?.passageId;
            const isAudioFinished = state.passageAudioFinished[passageId];
            const playCount = state.passageAudioPlayed[passageId] || 0;
            
            const btnContainer = document.getElementById('audio-btn-container');
            const iconContainer = document.getElementById('audio-icon-container');
            const overlay = document.getElementById('question-overlay');
            const nextBtn = document.getElementById('next-btn');
            const warning = document.getElementById('audio-warning');

            // Update Audio Button
            if (btnContainer) {
                if (state.isPlaying) {
                    btnContainer.innerHTML = `<button disabled class="flex items-center px-10 py-4 bg-sky-50 text-sky-600 font-bold rounded-full shadow-md border border-sky-200 cursor-not-allowed">
                                                  <i data-lucide="volume-2" class="w-6 h-6 mr-3 animate-pulse"></i> Playing Audio...
                                               </button>`;
                } else if (playCount >= 2) {
                    btnContainer.innerHTML = `<button disabled class="flex items-center px-10 py-4 bg-slate-100 text-slate-400 font-bold rounded-full shadow-inner border border-slate-200 cursor-not-allowed">
                                                  <i data-lucide="check-circle" class="w-6 h-6 mr-3"></i> Audio Completed
                                               </button>`;
                } else {
                    let playText = playCount === 1 ? 'Play Audio Segment (1 play left)' : 'Play Audio Segment';
                    btnContainer.innerHTML = `<button onclick="playPreparedAudio()" class="flex items-center px-10 py-4 bg-white text-sky-600 font-bold rounded-full shadow-lg hover:shadow-xl hover:bg-slate-50 transition-all border border-sky-600 text-lg">
                                                  <i data-lucide="play-circle" class="w-8 h-8 mr-3"></i> ${playText}
                                               </button>`;
                }
                lucide.createIcons();
            }

            // Update Visual Pulse
            if (iconContainer) {
                if (state.isPlaying) {
                    iconContainer.classList.add('scale-105', 'animate-pulse', 'duration-1000');
                    iconContainer.innerHTML = `<i data-lucide="volume-2" class="w-24 h-24 text-white opacity-90"></i>`;
                } else {
                    iconContainer.classList.remove('scale-105', 'animate-pulse', 'duration-1000');
                    iconContainer.innerHTML = `<i data-lucide="headphones" class="w-24 h-24 text-white opacity-90"></i>`;
                }
                lucide.createIcons();
            }

            // Smoothly hide overlay when audio finishes its FIRST play
            if (overlay && isAudioFinished) {
                overlay.classList.add('opacity-0');
                setTimeout(() => { overlay.classList.add('hidden'); }, 500);
            }
            
            if (warning && playCount >= 2) {
                warning.style.display = 'none';
            }
            
            // Enable radio buttons dynamically without a full render to preserve animations
            const radioLabels = document.querySelectorAll('label.group');
            if (isAudioFinished) {
                radioLabels.forEach(label => {
                    label.classList.remove('opacity-50', 'cursor-not-allowed');
                    label.classList.add('cursor-pointer', 'hover:bg-slate-100', 'hover:border-slate-200');
                    
                    const radio = label.querySelector('input[type="radio"]');
                    if (radio) {
                        radio.disabled = false;
                        radio.classList.remove('cursor-not-allowed');
                        radio.classList.add('cursor-pointer');
                    }
                    
                    const span = label.querySelector('span');
                    if (span) {
                        span.classList.add('group-hover:text-black');
                    }
                });
            }

            // Update Next button enablement based on audio finish AND answer presence
            if (nextBtn) {
                const hasAnswered = state.answers[step?.question?.id] !== undefined;
                if (isAudioFinished && hasAnswered) {
                    nextBtn.disabled = false;
                    nextBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    nextBtn.title = "";
                } else if (!isAudioFinished) {
                    nextBtn.disabled = true;
                    nextBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    nextBtn.title = "Listen to the audio completely before moving on";
                } else if (!hasAnswered) {
                    nextBtn.disabled = true;
                    nextBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    nextBtn.title = "Please choose an answer before moving on";
                }
            }
        }

        function autoPlayCheck() {
            if (state.showInstructions || state.showResults || state.isReviewMode || state.isPlaying) return;
            const step = state.flatSteps[state.currentStepIndex];
            if (!step) return;
            
            const passageId = step.passageId;
            if (!state.passageAudioPlayed[passageId]) {
                // Short delay ensures interface is fully loaded before the audio begins
                setTimeout(() => {
                    if (!state.passageAudioPlayed[passageId] && !state.isPlaying && !state.showInstructions && !state.isReviewMode) {
                        playPreparedAudio();
                    }
                }, 1000);
            }
        }

        function handleNext() {
            stopAudio();
            if (state.currentStepIndex < state.flatSteps.length - 1) {
                state.currentStepIndex++;
                setupCurrentStep();
                render(); 
            } else {
                if (state.isReviewMode) {
                    endReview();
                } else {
                    handleModuleComplete();
                }
            }
        }
        
        function handleModuleComplete() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            stopAudio();
            if (state.currentModule === 'module1') {
                loadModule('module2');
            } else {
                finishTest();
            }
        }

        function handleBack() {
            stopAudio();
            if (state.currentStepIndex > 0) {
                state.currentStepIndex--;
                setupCurrentStep();
                render(); 
            }
        }

        function handleBeginTest() {
            assignVoices();
            state.showInstructions = false;
            setupCurrentStep();
            render();
        }

        function finishTest() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            stopAudio();
            state.showResults = true;
            render();
        }

        function startReview() {
            state.isReviewMode = true;
            state.showResults = false;
            state.currentStepIndex = 0;
            if (state.timerInterval) clearInterval(state.timerInterval);
            
            // Flatten ALL steps from both modules for the review phase
            const steps = [];
            Object.values(testData).forEach(moduleData => {
                moduleData.sections.forEach(section => {
                    if (section.type === 'listening') {
                        section.questions.forEach((q, idx) => {
                            steps.push({
                                type: 'listening',
                                data: section,
                                question: q,
                                questionIndex: idx + 1,
                                totalQuestions: section.questions.length,
                                passageId: (section.id.includes("short")) ? `short_${q.id}` : section.id 
                            });
                        });
                    }
                });
            });
            state.flatSteps = steps;
            render();
        }

        function endReview() {
            state.isReviewMode = false;
            state.showResults = true;
            render();
        }

        function handleRadioInput(qId, value) {
            if (state.isReviewMode) return;
            state.answers[qId] = value;
            render(); 
        }

        function resetApp() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.currentModule = null;
            state.flatSteps = [];
            state.answers = {};
            state.passageAudioPlayed = {};
            state.passageAudioFinished = {};
            state.showResults = false;
            state.showInstructions = false;
            state.isReviewMode = false;
            stopAudio();
            render();
        }

        function calculateScore() {
            let correct = 0;
            let total = 0;

            Object.values(testData).forEach(moduleData => {
                moduleData.sections.forEach(sec => {
                    if (sec.type === 'listening') {
                        sec.questions.forEach(q => {
                            total++;
                            if (state.answers[q.id] === q.correctAnswer) {
                                correct++;
                            }
                        });
                    }
                });
            });
            return { correct, total };
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timer-display');
            const container = document.getElementById('timer-container');
            
            if (el) el.innerText = formatTime(state.questionTimeLeft);
            
            if (container && !state.isReviewMode) {
                // Pulse logic for low time
                if (state.questionTimeLeft <= 5 && state.questionTimeLeft > 0) {
                    container.classList.add('text-red-500', 'font-bold', 'animate-pulse');
                    container.classList.remove('text-slate-500');
                } else {
                    container.classList.remove('text-red-500', 'font-bold', 'animate-pulse');
                    container.classList.add('text-slate-500');
                }
            }
        }

            const { correct, total } = calculateScore();
            const percent = total === 0 ? 0 : (correct/total);

            const bandScore = Math.min(6.0, Math.max(1.0, rawBand)).toFixed(1);
            
            let cefr = "";
            if (bandScore >= 6.0) cefr = "CEFR C2";

        }

                    </div>
                </div>
            </header>
            `;
        }

        function renderSubHeader() {
            if (state.showInstructions) return '';
            
            const totalSteps = state.flatSteps.length;
            const moduleName = state.isReviewMode ? 'Full Review' : (state.currentModule === 'module1' ? 'Module 1' : 'Module 2');
            const displayText = `Listening | ${moduleName} | Question ${state.currentStepIndex + 1} of ${totalSteps}`;

            let rightSide = '';
            if (state.isReviewMode) {
                rightSide = `<div class="text-sky-700 font-bold bg-sky-100 px-3 py-1 rounded flex items-center"><i data-lucide="search" class="w-4 h-4 mr-2"></i> Review Mode</div>`;
            } else {
                const isLowTime = state.questionTimeLeft <= 5 && state.questionTimeLeft > 0;
                const timerColorClass = isLowTime ? 'text-red-500 font-bold animate-pulse' : 'text-slate-500';
                
                rightSide = `<div id="timer-container" class="flex items-center ${timerColorClass} font-mono transition-colors bg-slate-100 px-3 py-1 rounded">
                    <i data-lucide="clock" class="mr-2 w-4 h-4 text-sky-600"></i>
                    <span id="timer-display" class="font-bold">${formatTime(state.questionTimeLeft)}</span>
                </div>`;
            }

            return `
            <div class="fixed top-16 w-full bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center text-slate-700 text-sm font-sans z-40 shadow-sm">
                <span class="font-semibold text-lg">${displayText}</span>
                ${rightSide}
            </div>
            `;
        }

        function renderInstructions() {
            const title = state.currentModule === 'module1' ? 'Listening Section - Module 1' : 'Listening Section - Module 2';
            const intro = state.currentModule === 'module1' 
                ? "You are about to begin Module 1. Once you finish all questions in this module, you will automatically proceed to Module 2."
                : "You are about to begin Module 2. Your final predicted score will be calculated after completing this module.";

            return `
            <div class="pt-24 px-8 max-w-5xl mx-auto h-screen overflow-y-auto custom-scroll pb-10">
                <h1 class="text-3xl text-slate-800 mb-6 font-sans font-bold">${title}</h1>
                
                <p class="text-sky-900 font-semibold bg-sky-100 border-l-4 border-sky-600 p-4 rounded mb-8 text-lg leading-relaxed shadow-sm">
                    ${intro}
                </p>

                <p class="text-slate-700 text-lg mb-4 leading-relaxed">
                    In an actual test, you will answer up to 47 questions to demonstrate how well you understand spoken English. 
                    There are three types of tasks in the listening section of the test.
                </p>

                <div class="bg-amber-50 border-l-4 border-amber-500 p-4 mb-8 shadow-sm">
                    <p class="text-sm text-slate-800">
                        <strong>Practice Mode Note:</strong> To help you prepare, this interface automatically triggers the audio but allows you to replay the segment up to <strong>two times</strong> per passage. Audio transcripts remain hidden during the test but will become available for review at the end.
                    </p>
                    <p class="text-sm text-slate-800 mt-2">
                        <strong>Test Mechanics:</strong> You have 20 seconds to answer most questions, and 30 seconds for Academic Talks. The timer starts <strong>after</strong> the audio finishes playing. You must choose an answer before the Next button is enabled.
                    </p>
                </div>

                <div class="border border-slate-300 rounded overflow-hidden shadow-sm">
                    <div class="grid grid-cols-[30%_70%] bg-sky-200 border-b border-slate-300 text-sky-900">
                        <div class="p-4 font-bold border-r border-slate-300">Type of Task</div>
                        <div class="p-4 font-bold">Description</div>
                    </div>
                    
                    <div class="grid grid-cols-[30%_70%] border-b border-slate-300 bg-white">
                        <div class="p-4 border-r border-slate-300 font-semibold text-slate-700">Listen and Choose a Response</div>
                        <div class="p-4 text-slate-600">Select the best response to the question or statement based on short simulated interactions.</div>
                    </div>

                    <div class="grid grid-cols-[30%_70%] border-b border-slate-300 bg-slate-50">
                        <div class="p-4 border-r border-slate-300 font-semibold text-slate-700">Conversations</div>
                        <div class="p-4 text-slate-600">Answer questions about short, practical discussions.</div>
                    </div>

                    <div class="grid grid-cols-[30%_70%] bg-white">
                        <div class="p-4 border-r border-slate-300 font-semibold text-slate-700">Listen to Announcements and Academic Talks</div>
                        <div class="p-4 text-slate-600">Answer questions about announcements and academic talks.</div>
                    </div>
                </div>
            </div>
            `;
        }

        function renderListening(step) {
            const { data, question, passageId } = step;
            
            const isShortDialogue = data.id.includes("short");
            const isAudioFinished = state.passageAudioFinished[passageId];
            const playCount = state.passageAudioPlayed[passageId] || 0;
            const showQuestion = state.isReviewMode || isShortDialogue || isAudioFinished;

            const disabledLabelClass = (!state.isReviewMode && !isAudioFinished) ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer hover:bg-slate-100 hover:border-slate-200';
            const disabledInputClass = (!state.isReviewMode && !isAudioFinished) ? 'cursor-not-allowed' : 'cursor-pointer';
            const disabledSpanClass = (!state.isReviewMode && !isAudioFinished) ? '' : 'group-hover:text-black';
            const isDisabledAttribute = (!state.isReviewMode && !isAudioFinished) ? 'disabled' : '';

            const options = question.options.map((opt, idx) => {
                const isChecked = state.answers[question.id] === idx ? 'checked' : '';
                
                if (state.isReviewMode) {
                    const isUserAns = state.answers[question.id] === idx;
                    const isCorrectAns = question.correctAnswer === idx;
                    let optionClass = "p-3 rounded border border-slate-200 text-slate-700";
                    let icon = "";
                    
                    if (isCorrectAns) {
                        optionClass = "p-3 rounded border-2 border-green-500 bg-green-50 text-green-800 font-bold shadow-sm";
                        icon = '<i data-lucide="check-circle" class="w-5 h-5 ml-auto text-green-600 flex-shrink-0"></i>';
                    } else if (isUserAns && !isCorrectAns) {
                        optionClass = "p-3 rounded border-2 border-red-300 bg-red-50 text-red-800";
                        icon = '<i data-lucide="x-circle" class="w-5 h-5 ml-auto text-red-500 flex-shrink-0"></i>';
                    } else {
                        optionClass = "p-3 rounded border border-slate-100 bg-white opacity-60";
                    }
                    
                    return `
                    <label class="flex items-start cursor-default bg-white p-4 rounded-lg mb-3 shadow-sm ${optionClass}">
                        <div class="relative flex items-center justify-center flex-shrink-0 mt-0.5">
                            <input 
                                type="radio" 
                                disabled
                                ${isChecked}
                                class="peer appearance-none w-5 h-5 border-2 border-slate-400 rounded-full checked:border-sky-600 checked:border-4 transition-all opacity-60 mr-4"
                            />
                        </div>
                        <span class="text-slate-700 font-sans text-lg flex-grow pr-2">${opt}</span>
                        ${icon}
                    </label>
                    `;
                } else {
                    return `
                    <label class="flex items-start group p-4 rounded-lg transition-colors border border-slate-200 bg-white shadow-sm ${disabledLabelClass}">
                        <div class="relative flex items-center justify-center flex-shrink-0 mt-0.5">
                            <input 
                                type="radio" 
                                name="q-${question.id}" 
                                ${isChecked}
                                ${isDisabledAttribute}
                                onchange="handleRadioInput(${question.id}, ${idx})"
                                class="peer appearance-none w-5 h-5 border-2 border-slate-400 rounded-full checked:border-sky-600 checked:border-4 transition-all ${disabledInputClass}"
                            />
                        </div>
                        <span class="ml-4 text-slate-700 font-sans text-lg transition-colors ${disabledSpanClass}">
                            ${opt}
                        </span>
                    </label>
                    `;
                }
            }).join('');

            let audioButtonHTML = '';
            
            if (state.isReviewMode) {
                audioButtonHTML = `<button disabled class="flex items-center px-10 py-4 bg-slate-100 text-slate-400 font-bold rounded-full shadow-inner border border-slate-200 cursor-not-allowed">
                                      <i data-lucide="check-circle" class="w-6 h-6 mr-3"></i> Review Mode
                                   </button>`;
            } else if (state.isPlaying) {
                audioButtonHTML = `<button disabled class="flex items-center px-10 py-4 bg-sky-50 text-sky-600 font-bold rounded-full shadow-md border border-sky-200 cursor-not-allowed">
                                      <i data-lucide="volume-2" class="w-6 h-6 mr-3 animate-pulse"></i> Playing Audio...
                                   </button>`;
            } else if (playCount >= 2) {
                audioButtonHTML = `<button disabled class="flex items-center px-10 py-4 bg-slate-100 text-slate-400 font-bold rounded-full shadow-inner border border-slate-200 cursor-not-allowed">
                                      <i data-lucide="check-circle" class="w-6 h-6 mr-3"></i> Audio Completed
                                   </button>`;
            } else {
                let playText = playCount === 1 ? 'Play Audio Segment (1 play left)' : 'Play Audio Segment';
                audioButtonHTML = `<button onclick="playPreparedAudio()" class="flex items-center px-10 py-4 bg-white text-sky-600 font-bold rounded-full shadow-lg hover:shadow-xl hover:bg-slate-50 transition-all border border-sky-600 text-lg">
                                      <i data-lucide="play-circle" class="w-8 h-8 mr-3"></i> ${playText}
                                   </button>`;
            }

            let reviewBlock = '';
            if (state.isReviewMode) {
                const isUserAnsCorrect = state.answers[question.id] === question.correctAnswer;
                const correctnessBadge = isUserAnsCorrect 
                    ? '<span class="text-green-600 font-bold text-sm flex items-center bg-green-50 px-2 py-1 rounded mb-3 w-max border border-green-200"><i data-lucide="check" class="w-4 h-4 mr-1"></i> Correct</span>' 
                    : '<span class="text-red-500 font-bold text-sm flex items-center bg-red-50 px-2 py-1 rounded mb-3 w-max border border-red-200"><i data-lucide="x" class="w-4 h-4 mr-1"></i> Incorrect</span>';
                
                const transcriptText = (question.transcript || data.transcript).replace(/\n/g, '<br/>');

                reviewBlock = `
                <div class="mt-6 space-y-4 pb-8">
                    <div class="p-5 bg-sky-50 rounded-lg border border-sky-100 text-slate-700 shadow-sm">
                        ${correctnessBadge}
                        <div class="flex items-start">
                            <i data-lucide="lightbulb" class="w-5 h-5 mr-3 text-sky-600 flex-shrink-0 mt-0.5"></i>
                            <div>
                                <strong class="text-sky-900 block mb-1">Strategy & Context:</strong>
                                ${question.explanation}
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-50 p-5 rounded-lg border border-slate-200 text-sm text-slate-700 shadow-sm">
                        <strong class="text-slate-800 block mb-3 font-sans flex items-center border-b border-slate-200 pb-2">
                            <i data-lucide="file-text" class="w-4 h-4 mr-2 text-slate-500"></i> Audio Transcript
                        </strong>
                        <div class="leading-relaxed italic text-base">${transcriptText}</div>
                    </div>
                </div>`;
            }

            const overlayClass = showQuestion ? 'hidden opacity-0' : 'opacity-95';

            return `
            <div class="pt-28 h-screen flex flex-col md:flex-row overflow-hidden bg-white">
                
                <div class="w-full md:w-1/2 h-full border-r border-slate-300 bg-slate-50 flex flex-col items-center justify-center p-8 relative shadow-inner">
                    <div class="absolute top-8 left-8 text-sm font-bold text-slate-400 uppercase tracking-widest flex items-center">
                        <i data-lucide="ear" class="w-4 h-4 mr-2"></i> Audio Environment
                    </div>
                    
                    <div id="audio-icon-container" class="w-56 h-56 rounded-full bg-gradient-to-tr from-sky-700 to-sky-400 shadow-2xl flex items-center justify-center mb-10 transition-transform ${state.isPlaying ? 'scale-105 animate-pulse duration-1000' : ''}">
                        <i data-lucide="${state.isPlaying ? 'volume-2' : 'headphones'}" class="w-24 h-24 text-white opacity-90"></i>
                    </div>
                    
                    <div class="mb-2 flex flex-col items-center">
                        <div id="audio-btn-container">
                            ${audioButtonHTML}
                        </div>
                        ${!state.isReviewMode && playCount < 2 ? '<p id="audio-warning" class="text-xs text-red-500 mt-4 font-bold uppercase tracking-wide"><i data-lucide="alert-triangle" class="w-3 h-3 inline mr-1"></i> Audio can be played up to 2 times</p>' : ''}
                    </div>
                </div>
                
                <div class="w-full md:w-1/2 h-full overflow-y-auto p-10 bg-slate-50 custom-scroll relative">
                    
                    <div class="max-w-xl mx-auto">
                        <div class="mb-6 text-sm font-bold text-sky-700 uppercase tracking-widest border-b border-slate-200 pb-2">${data.title}</div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
                            <h3 class="text-xl font-bold text-slate-800 font-sans leading-snug">${question.text}</h3>
                        </div>
                        <div class="space-y-4">
                            ${options}
                        </div>
                        ${reviewBlock}
                    </div>

                    <div id="question-overlay" class="absolute inset-0 bg-slate-50 z-10 flex flex-col items-center justify-center text-center px-8 transition-opacity duration-500 ${overlayClass}">
                        <i data-lucide="lock" class="w-16 h-16 text-slate-400 mb-6"></i>
                        <h3 class="text-2xl font-bold text-slate-700 mb-4">Question Hidden</h3>
                        <p class="text-slate-500 max-w-sm text-lg leading-relaxed">
                            Please listen to the audio segment completely. The question and options will appear automatically once the playback finishes.
                        </p>
                    </div>

                </div>
            </div>
            `;
        }

        // --- MAIN RENDER LOOP ---
        function render() {
            const app = document.getElementById('app');
            
            if (!state.currentModule) {
                app.innerHTML = renderWelcome();
            } else if (state.showResults) {
                app.innerHTML = renderResults();
            } else {
                let mainContent = '';
                if (state.showInstructions) {
                    mainContent = renderInstructions();
                } else {
                    const step = state.flatSteps[state.currentStepIndex];
                    if (step.type === 'listening') {
                        mainContent = renderListening(step);
                    }
                }
                
                app.innerHTML = renderHeader() + renderSubHeader() + mainContent;
            }

            lucide.createIcons();
            
            // Check to auto-play after rendering
            autoPlayCheck();
        }

        // Initialize App
        render();

    </script>
</body>
</html>
