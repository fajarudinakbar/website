<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEFL iBT® Overview - Speaking</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Marked.js for Markdown parsing in feedback -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        purple: {
                            50: '#F5F5FF',
                            100: '#EBEBFF',
                            200: '#DADAFF', 
                            600: '#9A9CFF', 
                            700: '#8A8CFF', 
                            800: '#7678E5', 
                            900: '#6264CC', 
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        .recording-pulse {
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <div id="app"></div>

    <script>
        // --- DATA STRUCTURE ---
        const lessonData = {
            title: "Speaking Section",
            sections: [
                {
                    id: "sec_repeat",
                    type: "listen_and_repeat",
                    title: "Listen and Repeat",
                    description: "You will hear a series of sentences. After each sentence, there is a pause. Repeat exactly what was said. Sentences get progressively longer and more complex.",
                    scenario: "You are learning to welcome visitors to the zoo. Listen to your manager and repeat what she says. Repeat only once.",
                    voice: "Joanna", 
                    questions: [
                        { id: "r1", prompt: "We have a variety of wildlife.", timeLimit: 8 },
                        { id: "r2", prompt: "Bears, wolves, and large cats are to the right.", timeLimit: 8 },
                        { id: "r3", prompt: "You can find sea lions and elephants further down the path.", timeLimit: 10 },
                        { id: "r4", prompt: "Please, no outside food or drinks, and do not feed the animals.", timeLimit: 10 },
                        { id: "r5", prompt: "Avoid banging or tapping on the displays and enclosures.", timeLimit: 10 },
                        { id: "r6", prompt: "For those with children, we offer summer camps and educational opportunities.", timeLimit: 12 },
                        { id: "r7", prompt: "The visitor's center, located near the front entrance, can give you more information.", timeLimit: 12 }
                    ]
                },
                {
                    id: "sec_interview",
                    type: "interview",
                    title: "Take an Interview",
                    description: "You will participate in a simulated conversation with a prerecorded interviewer. You will have 45 seconds to answer each question.",
                    scenario: "You have agreed to take part in a research study about urban life. You will have a short online interview with a researcher. The researcher will ask you some questions.",
                    voice: "Matthew", 
                    questions: [
                        { 
                            id: "i1", 
                            prompt: "Thank you for speaking with me today. Now, I'd like you to think back to the last time you visited a city in your country, a city that you didn't live in. Why did you travel to that city? What did you like about that city?", 
                            timeLimit: 45,
                            sampleAnswer: {
                                point: "The last time I traveled to a different city was a trip to Bandung for a short weekend getaway.",
                                explanation: "I went there specifically to escape the heat of my hometown and enjoy the cooler climate and mountainous scenery.",
                                example: "For instance, I spent a whole afternoon at a local tea plantation, just breathing in the fresh air and taking photos of the green hills, which was incredibly refreshing.",
                                link: "Therefore, the combination of the cool weather and the beautiful natural environment is what I loved most about visiting that city."
                            }
                        },
                        { 
                            id: "i2", 
                            prompt: "Great. Cities affect people in different ways. Some people find cities dynamic and exciting. Others find that cities are overwhelming and drain them of energy. What kind of reaction do you have to cities? Why do you think you react in this way?", 
                            timeLimit: 45,
                            sampleAnswer: {
                                point: "Personally, I find cities to be highly dynamic and exciting environments.",
                                explanation: "I react this way because I thrive on the fast pace and the constant availability of new experiences and social interactions.",
                                example: "As an example, when I am in a busy city, I can easily attend a professional networking event in the morning and then explore a new art exhibit or try a diverse restaurant in the evening.",
                                link: "Because I enjoy having so many options and activities at my fingertips, cities always leave me feeling energized rather than drained."
                            }
                        },
                        { 
                            id: "i3", 
                            prompt: "OK. Next, I'd like to ask your opinion. Some people believe that those who live in cities lead more interesting lives. They would argue, for example, that people who live in cities have more access to professional opportunities and interesting leisure activities. Do you agree that people who live in cities lead more interesting lives? Why or why not?", 
                            timeLimit: 45,
                            sampleAnswer: {
                                point: "I completely agree that people living in cities generally lead more interesting lives.",
                                explanation: "Urban areas serve as hubs for culture, entertainment, and career advancement, which provides residents with a wider variety of daily experiences.",
                                example: "Take my friend who lives in Jakarta, for instance; she has the opportunity to attend international conferences for her tech career during the week and go to live music concerts on the weekends, opportunities that are rare in rural areas.",
                                link: "Ultimately, this easy access to diverse professional and leisure activities is why city life tends to be much more engaging and interesting."
                            }
                        },
                        { 
                            id: "i4", 
                            prompt: "Good points. Let me ask you one final question. For some time now, researchers have been interested in whether green spaces, such as parks, make people who live in cities happier. Do you think that city governments should create more parks in urban areas to promote a general sense of happiness and life satisfaction? Why or why not?", 
                            timeLimit: 45,
                            sampleAnswer: {
                                point: "I strongly believe that city governments must prioritize creating more parks in urban areas.",
                                explanation: "Green spaces are essential for mental well-being because they provide a peaceful refuge from the noise, pollution, and stress of crowded city environments.",
                                example: "For example, in cities with large central parks, residents regularly use these spaces to jog, have picnics, or simply read a book under a tree, which significantly lowers their daily stress levels.",
                                link: "Consequently, investing in urban parks is a direct and effective way for governments to improve the overall happiness and life satisfaction of their citizens."
                            }
                        }
                    ]
                }
            ]
        };

        // --- STATE MANAGEMENT ---
        const state = {
            flatSteps: [],
            currentStepIndex: 0,
            answers: {},          
            checkedSteps: {},     
            showResults: false,
            showInstructions: true,
            showTranscript: {},
            playCounts: {},
            
            // Audio & Recording States
            currentAudio: null,
            isPlaying: false,
            isAudioReady: true,
            voices: [],
            
            isRecording: false,
            recognition: null,    
            recordingTimeLeft: 0,
            recordingInterval: null,
            
            // AI Feedback States
            aiFeedback: {},
            isGeneratingFeedback: {}
        };

        // WEB SPEECH API VOICES
        function loadVoices() {
            state.voices = window.speechSynthesis.getVoices();
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        // --- BROWSER SPEECH TO TEXT INITIALIZATION ---
        function initSpeechRecognition() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (window.SpeechRecognition) {
                state.recognition = new window.SpeechRecognition();
                state.recognition.continuous = true;
                state.recognition.interimResults = true;
                
                state.recognition.onresult = (event) => {
                    let finalTranscript = '';
                    let interimTranscript = '';
                    
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        } else {
                            interimTranscript += event.results[i][0].transcript;
                        }
                    }
                    
                    const step = state.flatSteps[state.currentStepIndex];
                    if (step && step.type !== 'scenario') {
                        const qId = step.question.id;
                        if (finalTranscript) {
                            state.answers[qId] = (state.answers[qId] || '') + ' ' + finalTranscript;
                            render(); 
                        }
                    }
                };

                state.recognition.onerror = (event) => {
                    console.error("Speech Recognition Error", event.error);
                };
            } else {
                console.warn("Speech Recognition API not supported in this browser. Fallback text input will be provided.");
            }
        }

        function showCustomAlert(message) {
            const modal = document.createElement('div');
            modal.innerHTML = `
                <div style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background-color: #ef4444; color: white; padding: 16px 24px; border-radius: 8px; z-index: 9999; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-weight: bold; display: flex; align-items: center;">
                    <i data-lucide="alert-circle" class="w-5 h-5 mr-2"></i> ${message}
                </div>
            `;
            document.body.appendChild(modal);
            lucide.createIcons({ root: modal });
            setTimeout(() => {
                modal.remove();
            }, 4000);
        }

        // --- LOGIC FUNCTIONS ---
        function initLesson() {
            initSpeechRecognition();
            state.answers = {};
            state.checkedSteps = {};
            state.showTranscript = {};
            state.playCounts = {};
            state.showResults = false;
            state.showInstructions = false;
            state.currentStepIndex = 0;
            state.aiFeedback = {};
            state.isGeneratingFeedback = {};

            const steps = [];
            lessonData.sections.forEach(section => {
                
                if (section.scenario) {
                    steps.push({
                        type: 'scenario',
                        data: section,
                        scenarioText: section.scenario
                    });
                }

                section.questions.forEach((q, idx) => {
                    state.answers[q.id] = ""; 
                    steps.push({
                        type: section.type,
                        data: section,
                        question: q,
                        questionIndex: idx + 1,
                        totalQuestions: section.questions.length
                    });
                });
            });
            state.flatSteps = steps;
            render();
        }

        function stopAudio() {
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
            }
            state.isPlaying = false;
        }

        async function playPromptAudio() {
            if (state.isRecording) return; 
            
            const step = state.flatSteps[state.currentStepIndex];
            stopAudio();
            
            let textToSpeak = "";
            let isMale = false;

            if (step.type === 'scenario') {
                textToSpeak = step.scenarioText;
                isMale = true; 
            } else {
                textToSpeak = step.question.prompt;
                isMale = step.data.voice === 'Matthew'; 
                
                const qId = step.question.id;
                state.playCounts[qId] = (state.playCounts[qId] || 0) + 1;
                
                if (state.playCounts[qId] >= 3) {
                    state.showTranscript[qId] = true;
                }
            }

            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            
            let selectedVoice = state.voices.find(v => v.name.includes('Natural') && v.lang.startsWith('en') && (isMale ? (v.name.includes('Guy') || v.name.includes('Christopher')) : (v.name.includes('Jenny') || v.name.includes('Aria'))));
            
            if (!selectedVoice) {
                selectedVoice = state.voices.find(v => v.name.includes('Natural') && v.lang.startsWith('en'));
            }
            if (!selectedVoice) {
                selectedVoice = state.voices.find(v => v.lang.startsWith('en-US')) || state.voices[0];
            }
            
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            utterance.onstart = () => {
                state.isPlaying = true;
                render();
            };

            utterance.onend = () => {
                state.isPlaying = false;
                render();
            };

            utterance.onerror = () => {
                state.isPlaying = false;
                render();
            };

            window.speechSynthesis.speak(utterance);
        }

        function startRecording() {
            if (state.isPlaying) stopAudio();
            if (!state.recognition) {
                showCustomAlert("Speech recognition is not supported in your browser. Please type your response in the fallback box.");
                return;
            }

            const step = state.flatSteps[state.currentStepIndex];
            if (step.type === 'scenario') return; 

            state.recordingTimeLeft = step.question.timeLimit;
            state.isRecording = true;
            state.answers[step.question.id] = ""; 
            
            try {
                state.recognition.start();
            } catch (e) {
                // Might already be started
            }

            render();

            state.recordingInterval = setInterval(() => {
                if (state.recordingTimeLeft > 0) {
                    state.recordingTimeLeft--;
                    render();
                } else {
                    stopRecording();
                }
            }, 1000);
        }

        function stopRecording() {
            if (state.recordingInterval) {
                clearInterval(state.recordingInterval);
                state.recordingInterval = null;
            }
            if (state.recognition && state.isRecording) {
                state.recognition.stop();
            }
            state.isRecording = false;
            render();
        }

        function handleNext() {
            stopAudio();
            stopRecording();
            if (state.currentStepIndex < state.flatSteps.length - 1) {
                state.currentStepIndex++;
                render();
            } else {
                finishTest();
            }
        }

        function handleBack() {
            stopAudio();
            stopRecording();
            if (state.currentStepIndex > 0) {
                state.currentStepIndex--;
                render();
            }
        }

        function handleBeginLesson() {
            initLesson();
        }

        function finishTest() {
            stopAudio();
            stopRecording();
            state.showResults = true;
            render();
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function resetApp() {
            state.flatSteps = [];
            state.answers = {};
            state.checkedSteps = {};
            state.showTranscript = {};
            state.playCounts = {};
            state.showResults = false;
            state.showInstructions = true;
            state.aiFeedback = {};
            state.isGeneratingFeedback = {};
            stopAudio();
            stopRecording();
            render();
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // --- PRELIMINARY AUTOMATED FEEDBACK LOGIC ---
        function revealTranscript(qId) {
            state.showTranscript[qId] = true;
            state.checkedSteps[state.currentStepIndex] = true;
            render();
        }

        function calculateScore(user) {
            const cleanUser = user.toLowerCase().replace(/[^\w\s]/g, '');
            if (!cleanUser.trim()) return 0;
            
            const wordCount = cleanUser.split(/\s+/).length;
            
            if (wordCount >= 50) return 5;
            if (wordCount >= 30) return 4;
            if (wordCount >= 15) return 3;
            if (wordCount >= 5) return 2;
            return 1;
        }

        async function getAIFeedback(qId, stepType, targetPrompt) {
            const userText = state.answers[qId];
            if (!userText || userText.trim() === "") return;

            state.isGeneratingFeedback[qId] = true;
            render(); 

            // Simulate processing time for better user experience
            await new Promise(resolve => setTimeout(resolve, 800));

            let feedbackText = "*Please note: This is an automated practice evaluation based primarily on transcript length and keyword matching. It does not reflect an official TOEFL iBT score. The feedback below focuses on actionable steps you can take to improve your performance.*\n\n";
            let score = calculateScore(userText);
            
            if (score === 5) {
                feedbackText += "**Estimated Practice Level: Fully Successful**\n\nBased on your transcript length, your response appears fully elaborated and on topic.\n\n**What you can do better:** Ensure your pronunciation is consistently clear. Try recording yourself again and focus specifically on maintaining a natural rhythm and using precise vocabulary to convey nuanced meanings.";
            } else if (score === 4) {
                feedbackText += "**Estimated Practice Level: Generally Successful**\n\nYour answer addresses the question with reasonable clarity and detail.\n\n**What you can do better:** Focus on using effective sentence level connectors to link your ideas smoothly. Work on minimizing any awkward pauses so your overall conversational flow is completely natural.";
            } else if (score === 3) {
                feedbackText += "**Estimated Practice Level: Partially Successful**\n\nYour response is generally on topic but shows limited elaboration.\n\n**What you can do better:** Practice expanding your ideas with concrete examples. Work on reducing frequent filler words or lengthy pauses to avoid a choppy pace, and attempt to integrate a wider range of grammatical structures.";
            } else if (score === 2) {
                feedbackText += "**Estimated Practice Level: Mostly Unsuccessful**\n\nYour response reflects an attempt to answer the question but needs more meaningful elaboration.\n\n**What you can do better:** Avoid simply repeating language directly from the interviewer's question. Focus on building clear, supported answers from your own experience and improving your word level pronunciation.";
            } else if (score === 1) {
                feedbackText += "**Estimated Practice Level: Unsuccessful**\n\nYour answer consists mainly of isolated words or phrases and is vaguely connected to the prompt.\n\n**What you can do better:** Practice forming complete, basic sentences. Listen closely for the main topic in the question before starting so you can formulate a direct and connected answer.";
            } else {
                feedbackText += "**Estimated Practice Level: No Meaningful Response**\n\nNo intelligible response was detected.\n\n**What you can do better:** Speak clearly into the microphone and ensure you are answering the prompt provided in English.";
            }

            state.aiFeedback[qId] = feedbackText;
            state.checkedSteps[state.currentStepIndex] = true;
            state.showTranscript[qId] = true;
            state.isGeneratingFeedback[qId] = false;
            render(); 
        }

        // --- RENDER FUNCTIONS ---

        function renderWelcome() {
            return `
            <div class="min-h-screen w-full flex flex-col md:flex-row m-0 p-0">
                <div class="bg-purple-700 p-12 text-white flex flex-col justify-center items-center md:w-2/5 min-h-[40vh] md:min-h-screen text-center relative">
                    <div class="absolute inset-0 bg-gradient-to-br from-purple-600 to-purple-900 opacity-90"></div>
                    <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold font-sans leading-tight z-10">TOEFL iBT<br>Speaking<br>Overview</h1>
                </div>
                
                <div class="p-8 md:p-16 lg:p-24 flex flex-col justify-center md:w-3/5 bg-white min-h-[60vh] md:min-h-screen overflow-y-auto">
                    <div class="max-w-2xl mx-auto w-full">
                        <p class="text-gray-600 mb-8 text-lg md:text-xl leading-relaxed">
                            Welcome! This guided lesson will help you practice speaking strategies. 
                            You will receive <strong>immediate feedback and explanations</strong> after every question to help you learn as you go, and a full review at the end. There is no numerical score.
                        </p>

                        <div class="bg-blue-50 border-l-4 border-blue-500 p-6 mb-8 text-left rounded-r-lg shadow-sm">
                            <div class="flex items-center mb-3">
                                <i data-lucide="mic" class="w-6 h-6 text-blue-600 mr-2"></i>
                                <span class="font-bold text-blue-800 text-lg">Browser Recommendation</span>
                            </div>
                            <p class="text-sm md:text-base text-blue-700 leading-relaxed">
                                This module requires microphone access and speech recognition. For the most accurate speech to text transcription and natural audio, we <strong>highly recommend using Microsoft Edge</strong>.
                            </p>
                        </div>

                        <div class="text-left mb-12">
                            <button onclick="handleBeginLesson()" class="inline-flex items-center px-10 py-5 bg-purple-700 text-white font-bold rounded-full shadow-lg hover:shadow-xl hover:bg-purple-800 transition-all text-xl w-full sm:w-auto justify-center">
                                Start Lesson <i data-lucide="arrow-right" class="ml-3 w-6 h-6"></i>
                            </button>
                        </div>

                        <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-6 text-left flex items-start shadow-sm">
                            <i data-lucide="info" class="w-6 h-6 text-yellow-600 mr-4 flex-shrink-0 mt-1"></i>
                            <div>
                                <h4 class="font-bold text-yellow-800 mb-2 text-lg">Important Notes</h4>
                                <p class="text-sm text-yellow-800 leading-relaxed mb-4">
                                    This is a guided practice lesson focused on speaking strategy, <strong>not a full simulation test</strong>. 
                                    For a full simulation to see exactly how the real test looks and operates, please visit the 
                                    <a href="https://www.ets.org/toefl/test-takers/ibt/prepare.html" target="_blank" class="underline font-semibold hover:text-yellow-900 transition-colors">official TOEFL sample test</a>.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderHeader() {
            return `
            <header class="bg-purple-700 h-16 flex items-center justify-between px-6 shadow-md z-50 fixed w-full top-0">
                <div class="flex items-center space-x-4">
                    <span class="text-white text-lg font-sans font-semibold flex items-center">
                        TOEFL iBT Speaking Overview
                    </span>
                </div>
            </header>
            `;
        }

        function renderSubHeader() {
            if (state.showInstructions) return '';

            const backBtn = state.currentStepIndex > 0 
                ? `<button onclick="handleBack()" class="flex items-center text-gray-500 hover:text-purple-700 font-semibold transition-colors">
                    <i data-lucide="chevron-left" class="w-4 h-4 mr-1"></i> Previous
                   </button>` 
                : '<div></div>';

            return `
            <div class="fixed top-16 w-full bg-white border-b border-gray-300 px-6 py-3 flex items-center justify-between text-gray-700 text-sm font-sans z-40 shadow-sm min-h-[45px]">
                ${backBtn}
            </div>
            `;
        }

        function renderScenario(step) {
            const { data } = step;
            
            let audioBtn = '';
            if (!state.isAudioReady) {
                audioBtn = `<button disabled class="flex items-center px-6 py-3 bg-gray-200 text-gray-500 font-bold rounded-full shadow-inner"><i data-lucide="loader" class="w-5 h-5 mr-2 animate-spin"></i> Loading Audio...</button>`;
            } else if (state.isPlaying) {
                audioBtn = `<button disabled class="flex items-center px-6 py-3 bg-purple-100 text-purple-700 font-bold rounded-full shadow-inner"><i data-lucide="volume-2" class="w-5 h-5 mr-2 animate-pulse"></i> Playing Audio...</button>`;
            } else {
                audioBtn = `<button onclick="playPromptAudio()" class="flex items-center px-6 py-3 bg-white border-2 border-purple-700 text-purple-700 font-bold rounded-full shadow hover:bg-purple-50 transition-colors"><i data-lucide="play" class="w-5 h-5 mr-2"></i> Play Directions</button>`;
            }

            return `
            <div class="pt-32 h-screen overflow-y-auto bg-white custom-scroll pb-12">
                <div class="max-w-3xl mx-auto text-center">
                    
                    <div class="bg-gray-50 border border-gray-200 rounded-xl p-8 mb-8 shadow-sm">
                        <div class="w-16 h-16 bg-purple-700 rounded-full flex items-center justify-center mx-auto mb-4 text-white shadow-md">
                            <i data-lucide="info" class="w-8 h-8"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-gray-800 mb-4">${data.title} Directions</h2>
                        <p class="text-gray-700 text-lg max-w-xl mx-auto leading-relaxed">${step.scenarioText}</p>
                        
                        <div class="mt-8 flex justify-center">
                            ${audioBtn}
                        </div>
                    </div>
                    
                    <div class="mt-8 flex justify-center border-t pt-6 border-gray-200">
                        <button onclick="handleNext()" class="flex items-center px-6 py-3 bg-purple-700 text-white font-bold rounded shadow hover:bg-purple-800 transition-colors">
                            Continue <i data-lucide="arrow-right" class="ml-2 w-5 h-5"></i>
                        </button>
                    </div>

                </div>
            </div>
            `;
        }

        function renderActiveTask(step) {
            const { data, question } = step;
            const isInterview = step.type === 'interview';
            const qId = question.id;
            const userText = state.answers[qId] || "";
            const isChecked = state.checkedSteps[state.currentStepIndex];
            const isLastStep = state.currentStepIndex === state.flatSteps.length - 1;
            const btnText = isLastStep ? "Finish and Review All" : "Next";
            const btnIcon = isLastStep ? "list-checks" : "arrow-right";
            
            // Audio Button logic
            let audioBtn = '';
            if (!state.isAudioReady) {
                audioBtn = `<button disabled class="flex items-center px-6 py-3 bg-gray-200 text-gray-500 font-bold rounded-full shadow-inner"><i data-lucide="loader" class="w-5 h-5 mr-2 animate-spin"></i> Loading Audio...</button>`;
            } else if (state.isPlaying) {
                audioBtn = `<button disabled class="flex items-center px-6 py-3 bg-purple-100 text-purple-700 font-bold rounded-full shadow-inner"><i data-lucide="volume-2" class="w-5 h-5 mr-2 animate-pulse"></i> Playing Audio...</button>`;
            } else {
                let playCountBadge = '';
                if (state.playCounts[qId] > 0 && !isChecked) {
                    playCountBadge = `<span class="ml-2 bg-purple-100 text-purple-800 text-xs px-2 py-0.5 rounded-full">${state.playCounts[qId]}</span>`;
                }
                audioBtn = `<button onclick="playPromptAudio()" class="flex items-center px-6 py-3 bg-white border-2 border-purple-700 text-purple-700 font-bold rounded-full shadow hover:bg-purple-50 transition-colors"><i data-lucide="play" class="w-5 h-5 mr-2"></i> Play Prompt ${playCountBadge}</button>`;
            }

            // Recording Button logic
            let recBtn = '';
            if (state.isRecording) {
                recBtn = `<button onclick="stopRecording()" class="flex items-center px-8 py-4 bg-red-500 text-white font-bold rounded-full shadow-lg recording-pulse"><i data-lucide="square" class="w-6 h-6 mr-2"></i> Stop Recording (${formatTime(state.recordingTimeLeft)})</button>`;
            } else {
                recBtn = `<button onclick="startRecording()" class="flex items-center px-8 py-4 bg-gray-800 text-white font-bold rounded-full shadow-lg hover:bg-gray-700 transition-colors" ${(state.isPlaying || isChecked || state.isGeneratingFeedback[qId]) ? 'disabled opacity-50 cursor-not-allowed' : ''}><i data-lucide="mic" class="w-6 h-6 mr-2"></i> Start Recording (${question.timeLimit}s)</button>`;
            }

            const isTranscriptVisible = state.showTranscript[qId];
            let actionArea = '';

            if (step.type === 'listen_and_repeat') {
                if (!isChecked) {
                    actionArea = `
                    ${isTranscriptVisible ? `
                    <div class="mt-6 bg-purple-50 border border-purple-200 rounded-lg p-6 shadow-inner text-left mb-6">
                        <h4 class="font-bold text-purple-800 mb-3 flex items-center">
                            <i data-lucide="text-quote" class="w-5 h-5 mr-2"></i> ${state.playCounts[qId] >= 3 ? "Transcript (Revealed after 3 plays)" : "Audio Transcript"}
                        </h4>
                        <div class="p-5 bg-white border border-purple-200 rounded-lg text-gray-800 text-lg italic leading-relaxed">
                            "${question.prompt}"
                        </div>
                    </div>` : ''}

                    <div class="mt-6 flex justify-between items-center border-t pt-4 border-gray-200">
                        <button onclick="handleNext()" ${state.isRecording ? 'disabled' : ''} class="flex items-center text-gray-500 hover:text-gray-700 font-semibold transition-colors ${state.isRecording ? 'opacity-50 cursor-not-allowed' : ''}">
                            Next <i data-lucide="arrow-right" class="ml-2 w-4 h-4"></i>
                        </button>
                        <button 
                            onclick="revealTranscript('${qId}')" 
                            ${userText.trim().length === 0 || state.isRecording ? 'disabled' : ''}
                            class="flex items-center px-6 py-3 font-bold rounded shadow transition-colors ${(userText.trim().length > 0 && !state.isRecording) ? 'bg-purple-700 text-white hover:bg-purple-800' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}">
                            Show Transcript <i data-lucide="eye" class="ml-2 w-5 h-5"></i>
                        </button>
                    </div>`;
                } else {
                    actionArea = `
                    <div class="mt-6 bg-purple-50 border border-purple-200 rounded-lg p-6 shadow-inner text-left">
                        <h4 class="font-bold text-purple-800 mb-3 flex items-center">
                            <i data-lucide="text-quote" class="w-5 h-5 mr-2"></i> Target Audio Transcript
                        </h4>
                        <div class="p-5 bg-white border border-purple-200 rounded-lg text-gray-800 text-lg italic leading-relaxed">
                            "${question.prompt}"
                        </div>

                        <div class="mt-6 flex justify-end border-t border-purple-200 pt-4">
                            <button onclick="handleNext()" class="flex items-center px-6 py-3 bg-purple-700 text-white font-bold rounded shadow hover:bg-purple-800 transition-colors">
                                ${btnText} <i data-lucide="${btnIcon}" class="ml-2 w-5 h-5"></i>
                            </button>
                        </div>
                    </div>`;
                }
            } else {
                if (!isChecked) {
                    actionArea = `
                    ${isTranscriptVisible ? `
                    <div class="mt-6 bg-purple-50 border border-purple-200 rounded-lg p-6 shadow-inner text-left mb-6">
                        <h4 class="font-bold text-purple-800 mb-3 flex items-center">
                            <i data-lucide="text-quote" class="w-5 h-5 mr-2"></i> ${state.playCounts[qId] >= 3 ? "Transcript (Revealed after 3 plays)" : "Audio Transcript"}
                        </h4>
                        <div class="p-5 bg-white border border-purple-200 rounded-lg text-gray-800 text-lg italic leading-relaxed">
                            "${question.prompt}"
                        </div>
                    </div>` : ''}

                    <div class="mt-6 flex justify-between items-center border-t pt-4 border-gray-200">
                        <button onclick="handleNext()" ${state.isRecording ? 'disabled' : ''} class="flex items-center text-gray-500 hover:text-gray-700 font-semibold transition-colors ${state.isRecording ? 'opacity-50 cursor-not-allowed' : ''}">
                            Next <i data-lucide="arrow-right" class="ml-2 w-4 h-4"></i>
                        </button>
                        <button 
                            onclick="getAIFeedback('${qId}', '${step.type}', '${question.prompt.replace(/'/g, "\\'")}')" 
                            ${userText.trim().length === 0 || state.isGeneratingFeedback[qId] || state.isRecording ? 'disabled' : ''}
                            class="flex items-center px-6 py-3 font-bold rounded shadow transition-colors ${(userText.trim().length > 0 && !state.isGeneratingFeedback[qId] && !state.isRecording) ? 'bg-purple-700 text-white hover:bg-purple-800' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}">
                            ${state.isGeneratingFeedback[qId] ? '<i data-lucide="loader" class="w-5 h-5 mr-2 animate-spin"></i> Evaluating...' : 'Evaluate Response <i data-lucide="bot" class="ml-2 w-5 h-5"></i>'}
                        </button>
                    </div>`;
                } else {
                    actionArea = `
                    <div class="mt-6 bg-purple-50 border border-purple-200 rounded-lg p-6 shadow-inner text-left">
                        <h4 class="font-bold text-purple-800 mb-3 flex items-center">
                            <i data-lucide="bot" class="w-5 h-5 mr-2"></i> Automated Practice Feedback (Not an Official Score)
                        </h4>
                        <div class="p-5 bg-white border border-purple-200 rounded-lg text-gray-800 text-sm leading-relaxed prose max-w-none mb-6">
                            ${marked.parse(String(state.aiFeedback[qId]))}
                        </div>

                        <h4 class="font-bold text-purple-800 mb-3 flex items-center">
                            <i data-lucide="text-quote" class="w-5 h-5 mr-2"></i> Target Audio Transcript
                        </h4>
                        <div class="p-5 bg-white border border-purple-200 rounded-lg text-gray-800 text-lg italic leading-relaxed">
                            "${question.prompt}"
                        </div>

                        <div class="mt-6 flex justify-end border-t border-purple-200 pt-4">
                            <button onclick="handleNext()" class="flex items-center px-6 py-3 bg-purple-700 text-white font-bold rounded shadow hover:bg-purple-800 transition-colors">
                                ${btnText} <i data-lucide="${btnIcon}" class="ml-2 w-5 h-5"></i>
                            </button>
                        </div>
                    </div>`;
                }
            }

            return `
            <div class="pt-28 h-screen overflow-y-auto bg-white custom-scroll pb-32">
                <div class="max-w-3xl mx-auto">
                    
                    <!-- Context Section -->
                    <div class="bg-purple-50 border border-purple-200 rounded-xl p-6 mb-8 text-center shadow-sm">
                        <div class="w-16 h-16 bg-purple-700 rounded-full flex items-center justify-center mx-auto mb-4 text-white shadow-md">
                            <i data-lucide="${isInterview ? 'user' : 'ear'}" class="w-8 h-8"></i>
                        </div>
                        <h2 class="text-xl font-bold text-gray-800 mb-2">${data.title}</h2>
                        <div class="mt-6 flex justify-center">
                            ${audioBtn}
                        </div>
                    </div>

                    <!-- Recording Section -->
                    <div class="bg-white border-2 ${state.isRecording ? 'border-red-400' : 'border-gray-200'} rounded-xl p-8 text-center shadow-md transition-colors relative">
                        <h3 class="font-bold text-gray-700 mb-6 uppercase tracking-widest text-sm text-center">Your Response</h3>
                        
                        <div class="flex justify-center mb-6">
                            ${recBtn}
                        </div>

                        ${userText ? `
                        <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 text-gray-800 mb-6 text-left">
                            <strong class="text-purple-800 block mb-2 font-sans border-b border-gray-200 pb-2"><i data-lucide="file-text" class="w-4 h-4 inline mr-1"></i> Transcribed Speech</strong>
                            <p class="leading-relaxed mt-2">${userText}</p>
                        </div>
                        ` : ''}

                        ${actionArea}
                    </div>

                </div>
            </div>
            `;
        }

        function renderResults() {
            let reviewHtml = '<div class="max-w-4xl mx-auto mt-12 space-y-8 pb-16">';

            state.flatSteps.forEach(step => {
                if (step.type === 'scenario') return; 
                
                const qId = step.question.id;
                const userText = state.answers[qId] || "";
                
                reviewHtml += `
                <div class="bg-white p-8 rounded-xl shadow-md border-t-4 border-purple-500 mb-6 overflow-hidden">
                    <div class="flex items-center justify-between mb-6 border-b border-gray-100 pb-4">
                        <h3 class="font-bold text-purple-800 text-xl flex items-center">
                            <i data-lucide="${step.type === 'listen_and_repeat' ? 'repeat' : 'user-circle'}" class="w-6 h-6 mr-3"></i>
                            ${step.data.title}
                        </h3>
                    </div>
                    
                    <div class="bg-gray-50 p-5 mb-5 rounded-lg border border-gray-200 text-sm">
                        <strong class="text-gray-700 block mb-2 text-base">Target Audio Prompt</strong>
                        <p class="text-gray-800 italic text-[1.05rem]">"${step.question.prompt}"</p>
                    </div>

                    <div class="mb-6">
                        <strong class="text-gray-700 block mb-2 text-sm uppercase tracking-wide">Your Transcribed Response</strong>
                        <div class="p-5 border border-gray-200 rounded-lg ${userText ? 'text-gray-900 bg-white' : 'text-gray-400 bg-gray-50 italic'} text-[1.05rem] leading-relaxed">
                            ${userText || "No response recorded."}
                        </div>
                    </div>

                    ${step.type === 'interview' ? `
                    <div class="mt-6 border-t border-gray-200 pt-6">
                        <h4 class="font-bold text-purple-800 mb-4 flex items-center text-lg">
                            <i data-lucide="bot" class="w-6 h-6 mr-2"></i> Automated Practice Feedback (Not an Official Score)
                        </h4>
                        ${!userText.trim() ? 
                            '<p class="text-sm text-gray-500 italic">No response provided for evaluation.</p>' 
                            : state.aiFeedback[qId] ? 
                            `<div class="p-6 bg-purple-50 border border-purple-200 rounded-lg text-gray-800 text-sm leading-relaxed prose max-w-none shadow-inner">${marked.parse(String(state.aiFeedback[qId]))}</div>`
                            : `<p class="text-sm text-gray-500 italic">Evaluation skipped.</p>`
                        }
                    </div>
                    
                    <div class="mt-6 border-t border-gray-200 pt-6">
                        <h4 class="font-bold text-blue-800 mb-4 flex items-center text-lg">
                            <i data-lucide="lightbulb" class="w-6 h-6 mr-2"></i> Sample Answer (PEEL Structure)
                        </h4>
                        <div class="bg-blue-50 border border-blue-200 rounded-lg p-5 text-gray-800 text-[1.05rem] leading-relaxed">
                            <p class="mb-3"><strong class="text-blue-900 block uppercase tracking-wide text-xs mb-1">Point</strong> ${step.question.sampleAnswer.point}</p>
                            <p class="mb-3"><strong class="text-blue-900 block uppercase tracking-wide text-xs mb-1">Explanation</strong> ${step.question.sampleAnswer.explanation}</p>
                            <p class="mb-3"><strong class="text-blue-900 block uppercase tracking-wide text-xs mb-1">Example</strong> ${step.question.sampleAnswer.example}</p>
                            <p><strong class="text-blue-900 block uppercase tracking-wide text-xs mb-1">Link</strong> ${step.question.sampleAnswer.link}</p>
                        </div>
                    </div>` : ''}
                </div>`;
            });

            reviewHtml += '</div>';

            return `
            <div class="min-h-screen bg-[#f0f0f0] pt-24 pb-12 px-4 overflow-y-auto custom-scroll">
                <div class="max-w-5xl mx-auto bg-white shadow-lg rounded-xl overflow-hidden mb-8 border-t-8 border-purple-700">
                    <div class="bg-purple-700 p-10 text-white text-center">
                        <i data-lucide="mic" class="w-20 h-20 mx-auto mb-6 text-purple-200"></i>
                        <h2 class="text-4xl font-bold mb-3 font-sans">Lesson Review</h2>
                        <p class="text-lg text-purple-100">Review your transcriptions and AI evaluations below.</p>
                    </div>
                </div>
                
                ${reviewHtml}

                <div class="flex justify-center pb-12 mt-8">
                     <button onclick="resetApp()" class="px-8 py-4 bg-purple-700 text-white rounded-full shadow-lg hover:bg-purple-800 transition-colors text-lg font-bold flex items-center">
                        <i data-lucide="rotate-ccw" class="w-5 h-5 mr-3"></i> Restart Practice
                    </button>
                </div>
            </div>`;
        }

        // --- MAIN RENDER LOOP ---
        function render() {
            const app = document.getElementById('app');
            
            if (state.flatSteps.length === 0) {
                app.innerHTML = renderWelcome();
            } else if (state.showResults) {
                app.innerHTML = renderHeader() + renderResults();
            } else {
                let mainContent = '';
                const step = state.flatSteps[state.currentStepIndex];
                if (step.type === 'scenario') {
                    mainContent = renderScenario(step);
                } else {
                    mainContent = renderActiveTask(step);
                }
                app.innerHTML = renderHeader() + renderSubHeader() + mainContent;
            }
            lucide.createIcons();
        }

        // Initialize App
        render();

    </script>
</body>
</html>
