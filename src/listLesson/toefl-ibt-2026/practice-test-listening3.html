<body class="bg-slate-50 text-slate-900">

    <div id="app"></div>

    <script>
        // --- NATIVE BROWSER VOICE SETUP ---
        let femaleVoice = null;
        let maleVoice = null;

        function assignVoices() {
            const voices = window.speechSynthesis.getVoices();
            if (voices.length === 0) return;

            const enVoices = voices.filter(v => v.lang.startsWith('en'));
            const femaleKeywords = ['female', 'aria', 'jenny', 'zira', 'samantha', 'victoria', 'karen', 'susan', 'ava', 'allison'];
            const maleKeywords = ['male', 'guy', 'david', 'christopher', 'daniel', 'alex', 'george', 'matthew', 'mark', 'brian'];

            femaleVoice = enVoices.find(v => (v.name.includes('Natural') || v.name.includes('Online')) && femaleKeywords.some(k => v.name.toLowerCase().includes(k))) ||
                          enVoices.find(v => femaleKeywords.some(k => v.name.toLowerCase().includes(k))) ||
                          enVoices[0];

            maleVoice = enVoices.find(v => (v.name.includes('Natural') || v.name.includes('Online')) && maleKeywords.some(k => v.name.toLowerCase().includes(k))) ||
                        enVoices.find(v => maleKeywords.some(k => v.name.toLowerCase().includes(k))) ||
                        enVoices.find(v => v.name !== femaleVoice.name) || 
                        enVoices[1] || enVoices[0];
        }

        window.speechSynthesis.onvoiceschanged = assignVoices;

        // --- DATA STRUCTURE ---
        const testData = {
            module1: {
                title: "Module 1",
                sections: [
                    {
                        id: "m1_short",
                        type: "listening",
                        title: "Listen and Choose a Response",
                        audioTitle: "Short Dialogues",
                        questions: [
                            { id: 1, transcript: "Woman: Have you looked over the three-month financial reports yet?", text: "Choose the best response.", options: ["I wrote a review for a movie last night.", "I'm currently still balancing the ledgers.", "The statements were extremely brief.", "Yes, this quarter is almost finished."], correctAnswer: 1, explanation: "The woman asks about the status of reviewing financial reports. The correct response directly addresses the ongoing financial task." },
                            { id: 2, transcript: "Man: The server upgrade is planned for midnight, correct?", text: "Choose the best response.", options: ["Yes, to reduce any offline time for our users.", "The local birds fly south during the winter.", "I have scheduled an appointment for noon.", "Those servers are incredibly costly."], correctAnswer: 0, explanation: "The man asks for confirmation on a scheduled IT task. The correct response confirms ('Yes') and provides a logical reason for the timing." },
                            { id: 3, transcript: "Woman: Do we have to attend the visiting speaker's talk on artificial intelligence?", text: "Choose the best response.", options: ["The main topic of the talk is robotics.", "He is known to be a very demanding speaker.", "Only if you are looking for bonus points.", "I was at the mandatory staff meeting."], correctAnswer: 2, explanation: "The woman asks if attendance is mandatory. The correct response explains the condition under which attendance is necessary." },
                            { id: 4, transcript: "Man: I'm stuck on how to properly set up the reference list.", text: "Choose the best response.", options: ["The textbook is quite extensive.", "Look at the college's online writing guide.", "I finally solved that complex math issue.", "The formatting looked absolutely fantastic."], correctAnswer: 1, explanation: "The man expresses difficulty with an academic formatting task. The correct response offers a practical resource to help solve the problem." },
                            { id: 5, transcript: "Woman: Did they announce who the new head of marketing is?", text: "Choose the best response.", options: ["An email will be distributed about it later today.", "The recent promotional campaign went really well.", "I showed the new staff where the kitchen is.", "Yes, her pronunciation was very easy to understand."], correctAnswer: 0, explanation: "The woman asks if a specific announcement has been made. The correct response provides an update on when that information will be shared." },
                            { id: 6, transcript: "Man: Are we required to hand in a printed version of our final paper?", text: "Choose the best response.", options: ["That subject is quite difficult to grasp.", "No, uploading an electronic document is enough.", "I handed in my resignation letter yesterday.", "There are several copies sitting on the desk."], correctAnswer: 1, explanation: "The man asks about the submission format. The correct response directly answers the question ('No') and clarifies the accepted format." },
                            { id: 7, transcript: "Woman: The display screen in lecture hall 4B is just showing a blue background.", text: "Choose the best response.", options: ["The walls in that room are painted blue.", "I'll grab a spare connector cable and bring it over.", "My projections indicated that sales would double.", "That is an exceptionally large monitor."], correctAnswer: 1, explanation: "The woman reports a technical issue in a room. The most practical response is to offer an immediate troubleshooting action." },
                            { id: 8, transcript: "Man: Will you submit an application for the summer work program?", text: "Choose the best response.", options: ["The application form is three pages in length.", "Summer happens to be my favorite season.", "I actually passed the deadline a few days ago.", "That program is known to be very competitive."], correctAnswer: 2, explanation: "The man asks about the woman's intent to apply. The correct response explains why she will not be applying." }
                        ]
                    },
                    {
                        id: "m1_conv1",
                        type: "listening",
                        title: "Listen to a Conversation",
                        audioTitle: "Conversation: Internship Application",
                        transcript: `Man: Professor Davis, do you have a minute? I'd like to discuss the finance trainee position at Deloitte.\nWoman: Sure, Michael. The application window is closing soon. Is your CV ready?\nMan: It is, but I'm having a hard time with the motivation letter. I lack real-world experience in this industry.\nWoman: You should highlight the practical audit assignment we completed in my course last term. That demonstrates how you apply theories in real situations.`,
                        questions: [
                            { id: 9, text: "What is the male student's primary worry?", options: ["He was too late for the trainee deadline.", "He doesn't have enough practical background for his letter.", "He did not pass his recent finance test.", "He is unable to locate the instructor's office."], correctAnswer: 1, explanation: "The student explicitly states his problem: 'I'm having a hard time with the motivation letter. I lack real-world experience in this industry.'" },
                            { id: 10, text: "What is the professor's recommendation?", options: ["Apply to a different financial institution", "Enroll in an advanced auditing seminar next term", "Emphasize a particular class assignment in his letter", "Completely rewrite his current CV"], correctAnswer: 2, explanation: "The professor advises him to 'highlight the practical audit assignment we completed in my course last term' to compensate for his lack of experience." }
                        ]
                    },
                    {
                        id: "m1_conv2",
                        type: "listening",
                        title: "Listen to a Conversation",
                        audioTitle: "Conversation: IT Support",
                        transcript: `Woman: Hello, campus IT support. How can I help?\nMan: Hi there, I'm attempting to upload my software project for my final grade, but the university system keeps refusing my security key.\nWoman: Oh, we upgraded our firewall standards over the weekend. You'll have to create a fresh authentication key using the updated security method.\nMan: Ah, I must have missed that email. Is there a guide available on the tech website?\nWoman: Yes, you'll find it under the 'Web Hosting' section. It should only take a few minutes to complete.`,
                        questions: [
                            { id: 11, text: "For what reason is the student contacting tech support?", options: ["He cannot remember his university portal login.", "His software assignment was accidentally erased.", "He was denied access to the university servers.", "He needs an extension for his programming final."], correctAnswer: 2, explanation: "The student states that the 'university system keeps refusing my security key', meaning he is currently denied access to upload his project." },
                            { id: 12, text: "What is the root of the student's issue?", options: ["A recent update to the university's security standards", "A severe hardware malfunction on the main server", "Attempting to use an obsolete internet browser", "A coding error in his computer science project"], correctAnswer: 0, explanation: "The IT support worker explains that the problem is because 'we upgraded our firewall standards over the weekend'." }

                    {
                        id: "m1_announce1",
                        type: "listening",
                        title: "Listen to an Announcement",
                        audioTitle: "Announcement: Library Updates",
                        transcript: `Man: May I have your attention, library visitors. Beginning next Tuesday, the quiet reading zone on the second floor will shut down for remodeling. We're putting in modern power outlets and adding more comfortable chairs. While this is happening, you are welcome to study in the makeshift quiet areas located in the west wing. Furthermore, our updated digital catalog for scholarly articles is now accessible on the homepage. Speak with a staff member if you require assistance using this fresh database.`,
                        questions: [
                            { id: 13, text: "What is the main reason for the remodeling?", options: ["To make the campus coffee shop bigger", "To improve the amenities in the reading zone", "To build more shelves for physical textbooks", "To implement a modern climate control system"], correctAnswer: 1, explanation: "The announcement states the remodeling involves 'putting in modern power outlets and adding more comfortable chairs,' which are improvements to the amenities." },
                            { id: 14, text: "What additional news is shared in the broadcast?", options: ["Longer operating hours during exam periods", "A stricter policy for overdue borrowed items", "The introduction of a fresh digital academic tool", "The recruitment of extra library personnel"], correctAnswer: 2, explanation: "The speaker adds, 'Furthermore, our updated digital catalog for scholarly articles is now accessible', introducing a new academic tool." }
                        ]
                    },
                    {
                        id: "m1_talk1",
                        type: "listening",
                        title: "Listen to a Talk",
                        audioTitle: "Lecture: Remote Work Communication",
                        transcript: `Woman: Today we will examine how communication happens in virtual work settings. Before remote jobs became common, the majority of workplace interactions were synchronous. This implies they occurred immediately, such as in-person chats or voice calls. However, current scattered teams depend much more on asynchronous methods. This involves sharing details without demanding a fast reply, utilizing platforms like email or task-tracking applications. Asynchronous messaging lets staff members in varying time zones collaborate smoothly without breaking their concentration. Still, this needs a change in company culture. Supervisors have to rely on their staff and judge them by the work they produce, rather than the amount of time they sit at their computers. Organizations that do not adjust frequently see severe staff exhaustion caused by non-stop alerts and video-call fatigue.`,
                        questions: [
                            { id: 15, text: "What is the central subject of the presentation?", options: ["The development of modern task-tracking applications", "The transition from immediate to delayed workplace communication", "Techniques for coordinating meetings across global time zones", "The equipment challenges of outfitting home offices"], correctAnswer: 1, explanation: "The lecture focuses on the shift from synchronous ('occurred immediately') to asynchronous ('without demanding a fast reply') communication in remote work." },
                            { id: 16, text: "How is asynchronous communication described by the lecturer?", options: ["In-person discussions taking place in a corporate office", "Direct messaging apps that expect instant answers", "Sharing details without the expectation of an instant answer", "Digital conferencing software utilized for morning updates"], correctAnswer: 2, explanation: "The lecturer defines it directly: 'This involves sharing details without demanding a fast reply...'" },
                            { id: 17, text: "What significant advantage of this communication style is highlighted?", options: ["It drastically lowers the amount of required internet data.", "It ensures collaborative assignments are finished much quicker.", "It preserves the staff's ability to maintain deep concentration.", "It removes the necessity for formal written records."], correctAnswer: 2, explanation: "The speaker mentions it lets staff collaborate 'without breaking their concentration.'" },
                            { id: 18, text: "What difficulty do supervisors encounter regarding this transition?", options: ["They are forced to master complicated new computer software.", "They have to assess staff based on outcomes, not hours logged.", "They lose the ability to converse with international team members.", "They must persistently observe their staff through digital cameras."], correctAnswer: 1, explanation: "The lecturer points out that supervisors must 'judge them by the work they produce, rather than the amount of time they sit at their computers.'" }
                        ]
                    }
                ]
            },
            module2: {
                title: "Module 2",
                sections: [
                    {
                        id: "m2_short",
                        type: "listening",
                        title: "Listen and Choose a Response",
                        audioTitle: "Short Dialogues",
                        questions: [
                            { id: 19, transcript: "Woman: Is there a strict dress code for the networking dinner?", text: "Choose the best response.", options: ["The computer network is currently offline.", "Professional casual attire is perfectly acceptable.", "She put her clothes on extremely fast.", "The gathering turned out to be highly successful."], correctAnswer: 1, explanation: "The woman asks about clothing requirements for an event. The correct response provides the specific attire expectations." },
                            { id: 20, transcript: "Man: Has the vendor transmitted the billing statement yet?", text: "Choose the best response.", options: ["You'll find it in your email, flagged as high priority.", "The sound was incredibly loud.", "We specialize in paper goods.", "I shipped that parcel out yesterday."], correctAnswer: 0, explanation: "The man is asking about the status of a document (a bill). The correct response confirms its arrival and location." },
                            { id: 21, transcript: "Woman: I'm really struggling to grasp this advanced math concept.", text: "Choose the best response.", options: ["Advanced math is taught during the spring semester.", "The difficulties began sometime last week.", "You're welcome to attend my review session this evening.", "He comprehended the task flawlessly."], correctAnswer: 2, explanation: "The woman expresses academic difficulty. The best response offers practical, immediate support." },
                            { id: 22, transcript: "Man: Did the committee sign off on the technology budget?", text: "Choose the best response.", options: ["They are currently still evaluating the estimated expenses.", "I purchased a brand new laptop.", "The committee table is crafted from oak wood.", "Yes, the financial allocation was quite small."], correctAnswer: 0, explanation: "The man asks if an approval has happened. The correct response provides an update on the ongoing evaluation process." },
                            { id: 23, transcript: "Woman: My computer's power is completely drained.", text: "Choose the best response.", options: ["The power source is inside the clicker.", "There is a wall plug situated right behind that cabinet.", "I got my computer at a discounted price.", "The background audio has stopped entirely."], correctAnswer: 1, explanation: "The woman states a practical problem (dead battery). The best response provides a solution to charge the device." },
                            { id: 24, transcript: "Man: Could you point me to the location of the artificial intelligence symposium?", text: "Choose the best response.", options: ["Artificial intelligence is a fast-expanding industry.", "It was relocated to the primary lecture hall because so many people signed up.", "Understanding ethics is crucial in today's world.", "I kept the entryway open for her to pass."], correctAnswer: 1, explanation: "The man asks for directions. The correct response provides the new location and context for why it changed." },
                            { id: 25, transcript: "Woman: Would you mind looking over my slideshow before the conference?", text: "Choose the best response.", options: ["I should have some free time immediately following my meal break.", "That particular slide was positioned very steeply.", "The overall conference presentation was superb.", "I already looked over that novel last month."], correctAnswer: 0, explanation: "The woman makes a request for review. The correct response accepts and proposes a specific timeframe." },
                            { id: 26, transcript: "Man: The highway congestion was absolutely awful today.", text: "Choose the best response.", options: ["That is exactly the reason I began riding the local train.", "I always enjoy this time of day the most.", "I took the vehicle out for a drive yesterday.", "The intersection signal was malfunctioning."], correctAnswer: 0, explanation: "The man complains about traffic. The best response is a conversational agreement that offers an alternative solution." }
                        ]
                    },
                    {
                        id: "m2_conv1",
                        type: "listening",
                        title: "Listen to a Conversation",
                        audioTitle: "Conversation: Academic Project",
                        transcript: `Man: Hey Sarah, regarding our team assignment on artificial intelligence in schooling... I feel we ought to center it on student honesty.\nWoman: That is a massive subject, David. It might be too expansive for a brief speech. How about we restrict it specifically to how AI influences essay grading?\nMan: That's a logical approach. We could evaluate old-fashioned plagiarism checkers against the latest AI-spotting software.\nWoman: Precisely. I will begin collecting academic journals regarding the accuracy of these recent software programs right away.`,
                        questions: [
                            { id: 27, text: "What do the classmates decide to do about their assignment?", options: ["Increase the length of their speech to twenty minutes", "Restrict their focus specifically to essay grading", "Conduct interviews with faculty about student honesty", "Select a completely different research theme"], correctAnswer: 1, explanation: "They agree the original topic is too broad, and the man agrees with the woman's suggestion to 'restrict it specifically to how AI influences essay grading.'" },
                            { id: 28, text: "What is the female student's next step?", options: ["Draft the opening remarks for their speech", "Design visual aids illustrating traditional checkers", "Look up data on how well AI-spotting programs function", "Request a deadline extension from their instructor"], correctAnswer: 2, explanation: "The woman concludes by saying, 'I will begin collecting academic journals regarding the accuracy of these recent software programs right away.'" }
                        ]
                    },
                    {
                        id: "m2_announce1",
                        type: "listening",
                        title: "Listen to an Announcement",
                        audioTitle: "Announcement: Career Fair",
                        transcript: `Woman: Good morning, everyone. The yearly tech employment expo will occur tomorrow inside the campus hub from ten in the morning until four in the afternoon. More than fifty enterprises, encompassing major tech corporations and regional new businesses, will be present to hire for summer trainee roles and junior jobs. Kindly carry several printouts of your CV and wear business-appropriate clothing. Additionally, the student guidance department is providing a complimentary CV critique workshop today at two o'clock in Room 304 for anyone seeking a final review.`,
                        questions: [
                            { id: 29, text: "Who is this message primarily intended for?", options: ["Creators of regional new businesses", "Faculty and staff of the university", "University attendees searching for job openings", "Campus technical support workers"], correctAnswer: 2, explanation: "The announcement is advertising an 'employment expo' where enterprises will 'hire for summer trainee roles and junior jobs,' aimed at students." },
                            { id: 30, text: "What assistance is provided today to aid attendees?", options: ["A price reduction on professional workplace clothing", "A workshop to receive constructive comments on their CVs", "Early entry into the campus hub building", "A printed collection of common interview inquiries"], correctAnswer: 1, explanation: "The speaker notes that 'the student guidance department is providing a complimentary CV critique workshop today at two o'clock.'" }
                        ]
                    },
                    {
                        id: "m2_talk1",
                        type: "listening",
                        title: "Listen to a Talk",
                        audioTitle: "Lecture: Cybersecurity Fundamentals",
                        transcript: `Man: Let's shift our focus to the psychological side of digital security. We pour vast resources into protective barriers and data scrambling, yet the most vulnerable point is almost always the human user. This introduces the concept of 'social engineering.' Social engineering leverages mental tricks rather than software vulnerabilities to breach networks. A textbook illustration is phishing. A hacker transmits a fake message pretending to be a reliable source, such as a financial institution or the tech team, pressuring the recipient to click a harmful URL or hand over their login details. Why is this effective? Because scammers generate an artificial feeling of panic or necessity. They might claim your profile will be locked unless you respond instantly. To protect against this, institutions have to enforce mandatory threat recognition workshops. Staff must be taught how to authenticate a sender's true identity and spot the red flags of mental manipulation.`,
                        questions: [
                            { id: 31, text: "What is the core message of the presentation?", options: ["Protective barriers are useless against modern malware.", "Digital attacks frequently take advantage of human psychology.", "Electronic mail is the safest method for corporate messaging.", "Enterprises waste too many resources on tech support teams."], correctAnswer: 1, explanation: "The lecture's premise is that despite technology, the 'vulnerable point is almost always the human user' through 'social engineering' and 'mental tricks.'" },
                            { id: 32, text: "How does the lecturer explain social engineering?", options: ["Enhancing the physical safety measures for data servers", "Programming advanced scripts to defeat data scrambling", "Breaching networks via mental tricks and manipulation", "Utilizing digital networking platforms to boost digital security"], correctAnswer: 2, explanation: "The lecturer explicitly defines it: 'Social engineering leverages mental tricks rather than software vulnerabilities to breach networks.'" },
                            { id: 33, text: "Based on the talk, why are phishing schemes usually effective?", options: ["They rely on highly complex scrambling methods.", "They focus on individuals who lack internet connections.", "They look identical to regular promotional emails.", "They generate an artificial feeling of panic or necessity."], correctAnswer: 3, explanation: "The speaker asks 'Why is this effective?' and answers, 'Because scammers generate an artificial feeling of panic or necessity.'" },
                            { id: 34, text: "What protective measure does the lecturer recommend for institutions?", options: ["Prohibiting the utilization of personal email addresses", "Offering workshops to help staff spot deceptive techniques", "Investing in far more costly security barrier programs", "Employing extra physical security personnel for the facility"], correctAnswer: 1, explanation: "The lecturer recommends that 'institutions have to enforce mandatory threat recognition workshops' to teach staff how to 'spot the red flags of mental manipulation.'" }
                        ]
                    }
                ]
            }
        };

        // --- STATE MANAGEMENT ---
        const state = {
            currentModule: null,
            flatSteps: [],
            currentStepIndex: 0,
            answers: {},
            showResults: false,
            showInstructions: false,
            isReviewMode: false,
            
            // Per-question timer
            questionTimeLeft: 0,
            timerInterval: null,
            
            // Audio System States
            isPlaying: false,
            passageAudioPlayed: {}, 
            passageAudioFinished: {} 
        };

        // --- LOGIC FUNCTIONS ---

        function startTest() {
            state.answers = {};
            state.passageAudioPlayed = {};
            state.passageAudioFinished = {};
            loadModule('module1');
        }

        function loadModule(moduleId) {
            state.currentModule = moduleId;
            state.showResults = false;
            state.showInstructions = true; 
            state.isReviewMode = false;
            state.currentStepIndex = 0;

            // Flatten steps
            const steps = [];
            testData[moduleId].sections.forEach(section => {
                if (section.type === 'listening') {
                    section.questions.forEach((q, idx) => {
                        steps.push({
                            type: 'listening',
                            data: section,
                            question: q,
                            questionIndex: idx + 1,
                            totalQuestions: section.questions.length,
                            passageId: (section.id.includes("short")) ? `short_${q.id}` : section.id 
                        });
                    });
                }
            });
            state.flatSteps = steps;
            
            assignVoices();
            render();
        }

        function setupCurrentStep() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }

            if (state.isReviewMode) {
                return; // No timer needed in review mode
            }

            const step = state.flatSteps[state.currentStepIndex];
            const isTalk = step.data.id.includes('talk') || step.data.audioTitle.toLowerCase().includes('lecture');
            
            // Initialize new question time
            state.questionTimeLeft = isTalk ? 30 : 20;

            // If audio was already completed previously for this passage, start timer immediately
            if (state.passageAudioFinished[step.passageId]) {
                startQuestionTimer();
            } else {
                updateTimerDisplay(); // Render the initial static time
            }
        }

        function startQuestionTimer() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            
            state.timerInterval = setInterval(() => {
                if (state.questionTimeLeft > 0) {
                    state.questionTimeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(state.timerInterval);
                    handleNext(); // Auto-advance when time runs out
                }
            }, 1000);
        }

        function stopAudio() {
            state.isPlaying = false;
            window.speechSynthesis.cancel();
        }

        async function playPreparedAudio() {
            const step = state.flatSteps[state.currentStepIndex];
            const passageId = step.passageId;
            const playCount = state.passageAudioPlayed[passageId] || 0;

            if (playCount >= 2) return;
            
            state.passageAudioPlayed[passageId] = playCount + 1;
            state.isPlaying = true;
            
            // Pause timer if it was running (e.g., user is using their 2nd replay)
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
            
            updateAudioUI(); 

            if (!femaleVoice || !maleVoice) assignVoices();

            const transcriptText = step.question.transcript || step.data.transcript;
            const lines = transcriptText.split('\n').filter(l => l.trim().length > 0);

            for (let line of lines) {
                if (!state.isPlaying) break;
                
                let spokenText = line;
                let currentGender = 'male'; 

                const match = line.match(/^([A-Za-z\s]+):\s*(.*)/);
                if (match) {
                    const speaker = match[1].toLowerCase().trim();
                    spokenText = match[2]; 
                    
                    if (speaker === 'woman') {
                        currentGender = 'female'; 
                    } else if (speaker === 'man' || speaker === 'professor') {
                        currentGender = 'male';
                    }
                }

                const sentences = spokenText.match(/[^.!?]+[.!?]+/g) || [spokenText];

                for (let sentence of sentences) {
                    if (!state.isPlaying) break;

                    await new Promise((resolve) => {
                        const utterance = new SpeechSynthesisUtterance(sentence.trim());
                        
                        if (currentGender === 'female') {
                            if (femaleVoice) utterance.voice = femaleVoice;
                        } else {
                            if (maleVoice) utterance.voice = maleVoice;
                        }
                        
                        utterance.rate = 0.95; 
                        utterance.onend = resolve;
                        utterance.onerror = resolve; 
                        window.speechSynthesis.speak(utterance);
                    });
                }
                
                if (state.isPlaying && lines.length > 1) {
                    await new Promise(r => setTimeout(r, 400));
                }
            }

            state.isPlaying = false;
            state.passageAudioFinished[passageId] = true;
            
            // Resume/Start timer after playback concludes
            startQuestionTimer();
            updateAudioUI(); 
        }

        // Targeted DOM updates to prevent flickering
        function updateAudioUI() {
            if (state.isReviewMode) return;

            const step = state.flatSteps[state.currentStepIndex];
            const passageId = step?.passageId;
            const isAudioFinished = state.passageAudioFinished[passageId];
            const playCount = state.passageAudioPlayed[passageId] || 0;
            
            const btnContainer = document.getElementById('audio-btn-container');
            const iconContainer = document.getElementById('audio-icon-container');
            const overlay = document.getElementById('question-overlay');
            const nextBtn = document.getElementById('next-btn');
            const warning = document.getElementById('audio-warning');

            // Update Audio Button
            if (btnContainer) {
                if (state.isPlaying) {
                    btnContainer.innerHTML = `<button disabled class="flex items-center px-10 py-4 bg-sky-50 text-sky-600 font-bold rounded-full shadow-md border border-sky-200 cursor-not-allowed">
                                                  <i data-lucide="volume-2" class="w-6 h-6 mr-3 animate-pulse"></i> Playing Audio...
                                               </button>`;
                } else if (playCount >= 2) {
                    btnContainer.innerHTML = `<button disabled class="flex items-center px-10 py-4 bg-slate-100 text-slate-400 font-bold rounded-full shadow-inner border border-slate-200 cursor-not-allowed">
                                                  <i data-lucide="check-circle" class="w-6 h-6 mr-3"></i> Audio Completed
                                               </button>`;
                } else {
                    let playText = playCount === 1 ? 'Play Audio Segment (1 play left)' : 'Play Audio Segment';
                    btnContainer.innerHTML = `<button onclick="playPreparedAudio()" class="flex items-center px-10 py-4 bg-white text-sky-600 font-bold rounded-full shadow-lg hover:shadow-xl hover:bg-slate-50 transition-all border border-sky-600 text-lg">
                                                  <i data-lucide="play-circle" class="w-8 h-8 mr-3"></i> ${playText}
                                               </button>`;
                }
                lucide.createIcons();
            }

            // Update Visual Pulse
            if (iconContainer) {
                if (state.isPlaying) {
                    iconContainer.classList.add('scale-105', 'animate-pulse', 'duration-1000');
                    iconContainer.innerHTML = `<i data-lucide="volume-2" class="w-24 h-24 text-white opacity-90"></i>`;
                } else {
                    iconContainer.classList.remove('scale-105', 'animate-pulse', 'duration-1000');
                    iconContainer.innerHTML = `<i data-lucide="headphones" class="w-24 h-24 text-white opacity-90"></i>`;
                }
                lucide.createIcons();
            }

            // Smoothly hide overlay when audio finishes its FIRST play
            if (overlay && isAudioFinished) {
                overlay.classList.add('opacity-0');
                setTimeout(() => { overlay.classList.add('hidden'); }, 500);
            }
            
            if (warning && playCount >= 2) {
                warning.style.display = 'none';
            }
            
            // Enable radio buttons dynamically without a full render to preserve animations
            const radioLabels = document.querySelectorAll('label.group');
            if (isAudioFinished) {
                radioLabels.forEach(label => {
                    label.classList.remove('opacity-50', 'cursor-not-allowed');
                    label.classList.add('cursor-pointer', 'hover:bg-slate-100', 'hover:border-slate-200');
                    
                    const radio = label.querySelector('input[type="radio"]');
                    if (radio) {
                        radio.disabled = false;
                        radio.classList.remove('cursor-not-allowed');
                        radio.classList.add('cursor-pointer');
                    }
                    
                    const span = label.querySelector('span');
                    if (span) {
                        span.classList.add('group-hover:text-black');
                    }
                });
            }

            // Update Next button enablement based on audio finish AND answer presence
            if (nextBtn) {
                const hasAnswered = state.answers[step?.question?.id] !== undefined;
                if (isAudioFinished && hasAnswered) {
                    nextBtn.disabled = false;
                    nextBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    nextBtn.title = "";
                } else if (!isAudioFinished) {
                    nextBtn.disabled = true;
                    nextBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    nextBtn.title = "Listen to the audio completely before moving on";
                } else if (!hasAnswered) {
                    nextBtn.disabled = true;
                    nextBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    nextBtn.title = "Please choose an answer before moving on";
                }
            }
        }

        function autoPlayCheck() {
            if (state.showInstructions || state.showResults || state.isReviewMode || state.isPlaying) return;
            const step = state.flatSteps[state.currentStepIndex];
            if (!step) return;
            
            const passageId = step.passageId;
            if (!state.passageAudioPlayed[passageId]) {
                // Short delay ensures interface is fully loaded before the audio begins
                setTimeout(() => {
                    if (!state.passageAudioPlayed[passageId] && !state.isPlaying && !state.showInstructions && !state.isReviewMode) {
                        playPreparedAudio();
                    }
                }, 1000);
            }
        }

        function handleNext() {
            stopAudio();
            if (state.currentStepIndex < state.flatSteps.length - 1) {
                state.currentStepIndex++;
                setupCurrentStep();
                render(); 
            } else {
                if (state.isReviewMode) {
                    endReview();
                } else {
                    handleModuleComplete();
                }
            }
        }
        
        function handleModuleComplete() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            stopAudio();
            if (state.currentModule === 'module1') {
                loadModule('module2');
            } else {
                finishTest();
            }
        }

        function handleBack() {
            stopAudio();
            if (state.currentStepIndex > 0) {
                state.currentStepIndex--;
                setupCurrentStep();
                render(); 
            }
        }

        function handleBeginTest() {
            assignVoices();
            state.showInstructions = false;
            setupCurrentStep();
            render();
        }

        function finishTest() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            stopAudio();
            state.showResults = true;
            render();
        }

        function startReview() {
            state.isReviewMode = true;
            state.showResults = false;
            state.currentStepIndex = 0;
            if (state.timerInterval) clearInterval(state.timerInterval);
            
            // Flatten ALL steps from both modules for the review phase
            const steps = [];
            Object.values(testData).forEach(moduleData => {
                moduleData.sections.forEach(section => {
                    if (section.type === 'listening') {
                        section.questions.forEach((q, idx) => {
                            steps.push({
                                type: 'listening',
                                data: section,
                                question: q,
                                questionIndex: idx + 1,
                                totalQuestions: section.questions.length,
                                passageId: (section.id.includes("short")) ? `short_${q.id}` : section.id 
                            });
                        });
                    }
                });
            });
            state.flatSteps = steps;
            render();
        }

        function endReview() {
            state.isReviewMode = false;
            state.showResults = true;
            render();
        }

        function handleRadioInput(qId, value) {
            if (state.isReviewMode) return;
            state.answers[qId] = value;
            render(); 
        }

        function resetApp() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.currentModule = null;
            state.flatSteps = [];
            state.answers = {};
            state.passageAudioPlayed = {};
            state.passageAudioFinished = {};
            state.showResults = false;
            state.showInstructions = false;
            state.isReviewMode = false;
            stopAudio();
            render();
        }

        function calculateScore() {
            let correct = 0;
            let total = 0;

            Object.values(testData).forEach(moduleData => {
                moduleData.sections.forEach(sec => {
                    if (sec.type === 'listening') {
                        sec.questions.forEach(q => {
                            total++;
                            if (state.answers[q.id] === q.correctAnswer) {
                                correct++;
                            }
                        });
                    }
                });
            });
            return { correct, total };
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timer-display');
            const container = document.getElementById('timer-container');
            
            if (el) el.innerText = formatTime(state.questionTimeLeft);
            
            if (container && !state.isReviewMode) {
                // Pulse logic for low time
                if (state.questionTimeLeft <= 5 && state.questionTimeLeft > 0) {
                    container.classList.add('text-red-500', 'font-bold', 'animate-pulse');
                    container.classList.remove('text-slate-500');
                } else {
                    container.classList.remove('text-red-500', 'font-bold', 'animate-pulse');
                    container.classList.add('text-slate-500');
                }
            }
        }

            const isDisabledAttribute = (!state.isReviewMode && !isAudioFinished) ? 'disabled' : '';

            const options = question.options.map((opt, idx) => {
                const isChecked = state.answers[question.id] === idx ? 'checked' : '';
                
                if (state.isReviewMode) {
                    const isUserAns = state.answers[question.id] === idx;
                    const isCorrectAns = question.correctAnswer === idx;
                    let optionClass = "p-3 rounded border border-slate-200 text-slate-700";
                    let icon = "";
                    
                    if (isCorrectAns) {
                        optionClass = "p-3 rounded border-2 border-green-500 bg-green-50 text-green-800 font-bold shadow-sm";
                        icon = '<i data-lucide="check-circle" class="w-5 h-5 ml-auto text-green-600 flex-shrink-0"></i>';
                    } else if (isUserAns && !isCorrectAns) {
                        optionClass = "p-3 rounded border-2 border-red-300 bg-red-50 text-red-800";
                        icon = '<i data-lucide="x-circle" class="w-5 h-5 ml-auto text-red-500 flex-shrink-0"></i>';
                    } else {
                        optionClass = "p-3 rounded border border-slate-100 bg-white opacity-60";
                    }
                    
                    return `
                    <label class="flex items-start cursor-default bg-white p-4 rounded-lg mb-3 shadow-sm ${optionClass}">
                        <div class="relative flex items-center justify-center flex-shrink-0 mt-0.5">
                            <input 
                                type="radio" 
                                disabled
                                ${isChecked}
                                class="peer appearance-none w-5 h-5 border-2 border-slate-400 rounded-full checked:border-sky-600 checked:border-4 transition-all opacity-60 mr-4"
                            />
                        </div>
                        <span class="text-slate-700 font-sans text-lg flex-grow pr-2">${opt}</span>
                        ${icon}
                    </label>
                    `;
                } else {
                    return `
                    <label class="flex items-start group p-4 rounded-lg transition-colors border border-slate-200 bg-white shadow-sm ${disabledLabelClass}">
                        <div class="relative flex items-center justify-center flex-shrink-0 mt-0.5">
                            <input 
                                type="radio" 
                                name="q-${question.id}" 
                                ${isChecked}
                                ${isDisabledAttribute}
                                onchange="handleRadioInput(${question.id}, ${idx})"
                                class="peer appearance-none w-5 h-5 border-2 border-slate-400 rounded-full checked:border-sky-600 checked:border-4 transition-all ${disabledInputClass}"
                            />
                        </div>
                        <span class="ml-4 text-slate-700 font-sans text-lg transition-colors ${disabledSpanClass}">
                            ${opt}
                        </span>
                    </label>
                    `;
                }
            }).join('');

            let audioButtonHTML = '';
            
            if (state.isReviewMode) {
                audioButtonHTML = `<button disabled class="flex items-center px-10 py-4 bg-slate-100 text-slate-400 font-bold rounded-full shadow-inner border border-slate-200 cursor-not-allowed">
                                      <i data-lucide="check-circle" class="w-6 h-6 mr-3"></i> Review Mode
                                   </button>`;
            } else if (state.isPlaying) {
                audioButtonHTML = `<button disabled class="flex items-center px-10 py-4 bg-sky-50 text-sky-600 font-bold rounded-full shadow-md border border-sky-200 cursor-not-allowed">
                                      <i data-lucide="volume-2" class="w-6 h-6 mr-3 animate-pulse"></i> Playing Audio...
                                   </button>`;
            } else if (playCount >= 2) {
                audioButtonHTML = `<button disabled class="flex items-center px-10 py-4 bg-slate-100 text-slate-400 font-bold rounded-full shadow-inner border border-slate-200 cursor-not-allowed">
                                      <i data-lucide="check-circle" class="w-6 h-6 mr-3"></i> Audio Completed
                                   </button>`;
            } else {
                let playText = playCount === 1 ? 'Play Audio Segment (1 play left)' : 'Play Audio Segment';
                audioButtonHTML = `<button onclick="playPreparedAudio()" class="flex items-center px-10 py-4 bg-white text-sky-600 font-bold rounded-full shadow-lg hover:shadow-xl hover:bg-slate-50 transition-all border border-sky-600 text-lg">
                                      <i data-lucide="play-circle" class="w-8 h-8 mr-3"></i> ${playText}
                                   </button>`;
            }

            let reviewBlock = '';
            if (state.isReviewMode) {
                const isUserAnsCorrect = state.answers[question.id] === question.correctAnswer;
                const correctnessBadge = isUserAnsCorrect 
                    ? '<span class="text-green-600 font-bold text-sm flex items-center bg-green-50 px-2 py-1 rounded mb-3 w-max border border-green-200"><i data-lucide="check" class="w-4 h-4 mr-1"></i> Correct</span>' 
                    : '<span class="text-red-500 font-bold text-sm flex items-center bg-red-50 px-2 py-1 rounded mb-3 w-max border border-red-200"><i data-lucide="x" class="w-4 h-4 mr-1"></i> Incorrect</span>';
                
                const transcriptText = (question.transcript || data.transcript).replace(/\n/g, '<br/>');

                reviewBlock = `
                <div class="mt-6 space-y-4 pb-8">
                    <div class="p-5 bg-sky-50 rounded-lg border border-sky-100 text-slate-700 shadow-sm">
                        ${correctnessBadge}
                        <div class="flex items-start">
                            <i data-lucide="lightbulb" class="w-5 h-5 mr-3 text-sky-600 flex-shrink-0 mt-0.5"></i>
                            <div>
                                <strong class="text-sky-900 block mb-1">Strategy & Context:</strong>
                                ${question.explanation}
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-50 p-5 rounded-lg border border-slate-200 text-sm text-slate-700 shadow-sm">
                        <strong class="text-slate-800 block mb-3 font-sans flex items-center border-b border-slate-200 pb-2">
                            <i data-lucide="file-text" class="w-4 h-4 mr-2 text-slate-500"></i> Audio Transcript
                        </strong>
                        <div class="leading-relaxed italic text-base">${transcriptText}</div>
                    </div>
                </div>`;
            }

            const overlayClass = showQuestion ? 'hidden opacity-0' : 'opacity-95';

            return `
            <div class="pt-28 h-screen flex flex-col md:flex-row overflow-hidden bg-white">
                
                <div class="w-full md:w-1/2 h-full border-r border-slate-300 bg-slate-50 flex flex-col items-center justify-center p-8 relative shadow-inner">
                    <div class="absolute top-8 left-8 text-sm font-bold text-slate-400 uppercase tracking-widest flex items-center">
                        <i data-lucide="ear" class="w-4 h-4 mr-2"></i> Audio Environment
                    </div>
                    
                    <div id="audio-icon-container" class="w-56 h-56 rounded-full bg-gradient-to-tr from-sky-700 to-sky-400 shadow-2xl flex items-center justify-center mb-10 transition-transform ${state.isPlaying ? 'scale-105 animate-pulse duration-1000' : ''}">
                        <i data-lucide="${state.isPlaying ? 'volume-2' : 'headphones'}" class="w-24 h-24 text-white opacity-90"></i>
                    </div>
                    
                    <div class="mb-2 flex flex-col items-center">
                        <div id="audio-btn-container">
                            ${audioButtonHTML}
                        </div>
                        ${!state.isReviewMode && playCount < 2 ? '<p id="audio-warning" class="text-xs text-red-500 mt-4 font-bold uppercase tracking-wide"><i data-lucide="alert-triangle" class="w-3 h-3 inline mr-1"></i> Audio can be played up to 2 times</p>' : ''}
                    </div>
                </div>
                
                <div class="w-full md:w-1/2 h-full overflow-y-auto p-10 bg-slate-50 custom-scroll relative">
                    
                    <div class="max-w-xl mx-auto">
                        <div class="mb-6 text-sm font-bold text-sky-700 uppercase tracking-widest border-b border-slate-200 pb-2">${data.title}</div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
                            <h3 class="text-xl font-bold text-slate-800 font-sans leading-snug">${question.text}</h3>
                        </div>
                        <div class="space-y-4">
                            ${options}
                        </div>
                        ${reviewBlock}
                    </div>

                    <div id="question-overlay" class="absolute inset-0 bg-slate-50 z-10 flex flex-col items-center justify-center text-center px-8 transition-opacity duration-500 ${overlayClass}">
                        <i data-lucide="lock" class="w-16 h-16 text-slate-400 mb-6"></i>
                        <h3 class="text-2xl font-bold text-slate-700 mb-4">Question Hidden</h3>
                        <p class="text-slate-500 max-w-sm text-lg leading-relaxed">
                            Please listen to the audio segment completely. The question and options will appear automatically once the playback finishes.
                        </p>
                    </div>

                </div>
            </div>
            `;
        }

        // --- MAIN RENDER LOOP ---
        function render() {
            const app = document.getElementById('app');
            
            if (!state.currentModule) {
                app.innerHTML = renderWelcome();
            } else if (state.showResults) {
                app.innerHTML = renderResults();
            } else {
                let mainContent = '';
                if (state.showInstructions) {
                    mainContent = renderInstructions();
                } else {
                    const step = state.flatSteps[state.currentStepIndex];
                    if (step.type === 'listening') {
                        mainContent = renderListening(step);
                    }
                }
                
                app.innerHTML = renderHeader() + renderSubHeader() + mainContent;
            }

            lucide.createIcons();
            
            // Check to auto-play after rendering
            autoPlayCheck();
        }

        // Initialize App
        render();

    </script>
</body>
</html>
