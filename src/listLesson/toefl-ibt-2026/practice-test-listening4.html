    <script>
        // --- NATIVE BROWSER VOICE SETUP ---
        let femaleVoice = null;
        let maleVoice = null;

        function assignVoices() {
            const voices = window.speechSynthesis.getVoices();
            if (voices.length === 0) return;

            const enVoices = voices.filter(v => v.lang.startsWith('en'));
            const femaleKeywords = ['female', 'aria', 'jenny', 'zira', 'samantha', 'victoria', 'karen', 'susan', 'ava', 'allison'];
            const maleKeywords = ['male', 'guy', 'david', 'christopher', 'daniel', 'alex', 'george', 'matthew', 'mark', 'brian'];

            femaleVoice = enVoices.find(v => (v.name.includes('Natural') || v.name.includes('Online')) && femaleKeywords.some(k => v.name.toLowerCase().includes(k))) ||
                          enVoices.find(v => femaleKeywords.some(k => v.name.toLowerCase().includes(k))) ||
                          enVoices[0];

            maleVoice = enVoices.find(v => (v.name.includes('Natural') || v.name.includes('Online')) && maleKeywords.some(k => v.name.toLowerCase().includes(k))) ||
                        enVoices.find(v => maleKeywords.some(k => v.name.toLowerCase().includes(k))) ||
                        enVoices.find(v => v.name !== femaleVoice.name) || 
                        enVoices[1] || enVoices[0];
        }

        window.speechSynthesis.onvoiceschanged = assignVoices;

        // --- DATA STRUCTURE ---
        const testData = {

                            { id: 1, transcript: "Man: Does the building have a parking garage?", text: "Choose the best response.", options: ["No, I haven't received it yet.", "Yes, it's just around the corner.", "Let's walk to the park.", "Several times a month."], correctAnswer: 1, explanation: "The man asks about the availability of a parking garage. The correct response confirms its existence and provides the location." },
                            { id: 2, transcript: "Woman: Didn't you book a trip to Australia?", text: "Choose the best response.", options: ["No, the airport is on the right.", "Yes, I loved that book!", "I'd be happy to sell tickets for the fundraiser.", "I'm going to New Zealand instead."], correctAnswer: 3, explanation: "The woman asks for confirmation about a trip. The correct response corrects her assumption by stating a different destination." },
                            { id: 3, transcript: "Woman: Who's conducting the safety training?", text: "Choose the best response.", options: ["Elizabeth would be the person to ask.", "We'll be gathering in the main conference room.", "Did Robert place the food order?", "The train station closes at midnight."], correctAnswer: 0, explanation: "The woman asks to identify a person. The correct response directs her to someone who holds that information." },
                            { id: 4, transcript: "Man: Can I purchase this shirt in a different size?", text: "Choose the best response.", options: ["Are you looking for the same color?", "Yes, we stock a variety of styles of pants.", "All of our stores are open on Sundays.", "The store will be remodeled this summer."], correctAnswer: 0, explanation: "The man asks about a product variation. The correct response follows up to clarify his preference." },
                            { id: 5, transcript: "Man: Why did Sharon relocate to Belfast?", text: "Choose the best response.", options: ["The suitcases can be stored overhead.", "Because I have a doctor's appointment.", "I know you have some vacation time coming up.", "She was offered a new role."], correctAnswer: 3, explanation: "The man asks for a reason regarding a relocation. The correct response provides a logical professional reason." },
                            { id: 6, transcript: "Woman: How much do these watches cost?", text: "Choose the best response.", options: ["Did you watch the game yesterday?", "They start at a hundred dollars.", "These models feature a new display.", "The admission fee has gone up by twenty dollars."], correctAnswer: 1, explanation: "The woman asks for a price point. The correct response provides the starting price." },
                            { id: 7, transcript: "Woman: Where can I buy a charger for my phone?", text: "Choose the best response.", options: ["Battery recycling is available on Saturdays.", "The cost of those phones just went up.", "There's a shopping center a few minutes from here.", "The cashier charged me too much."], correctAnswer: 2, explanation: "The woman asks for a location to make a purchase. The correct response directs her to a nearby commercial area." },
                            { id: 8, transcript: "Man: What streaming services do you like to watch shows on?", text: "Choose the best response.", options: ["I don't have a cleaning service.", "I'm too busy to watch anything right now.", "The stream runs behind the house.", "The magazine subscription is expensive."], correctAnswer: 1, explanation: "The man asks about media preferences. The best response explains a current inability to participate in the activity." }

                    },
                    {

                        type: "listening",
                        title: "Listen to a Conversation",

                        transcript: `Woman: Have you decided which gym to join?\nMan: I'm torn between the NanoFitness Gym near my house and the Downtown Trainers gym near my work.\nWoman: The second one might suit you. You'll enjoy working up some sweat right after sitting at your desk in front of the computer all day, five days a week.\nMan: True. And Downtown Trainers has the better instructors and nicer equipment, too. But weekends is actually when I do most of my working out, and it'd be easier to do it near home than drive downtown.`,
                        questions: [
                            { id: 9, text: "What kind of job does the man most likely have?", options: ["Fitness instructor", "Driver", "Office worker", "Equipment manufacturer"], correctAnswer: 2, explanation: "The woman mentions him 'sitting at your desk in front of the computer all day, five days a week,' pointing to an office job." },

                        title: "Listen to a Conversation",

                            { id: 13, text: "Who is the intended audience of the lectures?", options: ["Science students", "University professors", "Everyone at the science fair", "A panel of judges"], correctAnswer: 2, explanation: "The announcement notes the lectures are 'aimed at a general audience,' which implies everyone attending." },
                            { id: 14, text: "What does the speaker hope the listeners will do?", options: ["Attend an event", "Submit a science project", "Join the university gym", "Volunteer for an event"], correctAnswer: 0, explanation: "The primary purpose is to 'invite you to the annual science fair' and urges listeners to 'Don't miss it!'" }

                    {

                        type: "listening",
                        title: "Listen to a Talk",
                        audioTitle: "Lecture: Anthropology Class",
                        transcript: `Professor: The potlatch is a ceremonial event among Indigenous peoples of the Pacific Northwest coast of North America. A potlatch involves the host giving away their possessions, including food, blankets, and even money, to guests. This practice serves multiple social functions, like redistributing wealth, reinforcing social bonds, and asserting status. Potlatches are often held to mark significant occasions, like weddings and such, and they involve feasting, dancing, and storytelling. The lavishness of a potlatch can elevate the host's status by demonstrating wealth and generosity. One fascinating aspect of the potlatch is its role in the social and economic structures of the communities that practice it. By redistributing wealth, potlatches ensure that resources circulate within the community, preventing the concentration of wealth in the hands of a few individuals. This practice strengthens community ties and fosters mutual support. For people who don't understand the function of potlatches, they may appear to be a waste of resources. Potlatches were even prohibited by the Canadian government in the late-nineteenth century because of this perceived wastefulness. The ban was lifted in the mid-twentieth century, and today, potlatches continue to be an important cultural practice. Let's now examine how Indigenous communities have revived this practice.`,
                        questions: [
                            { id: 15, text: "What aspect of the Indigenous peoples of the Northwest coast of North America is the talk mainly about?", options: ["Their economic structures", "A traditional event that they participate in", "Their relationship with the Canadian government", "The role of dancing and storytelling in their social functions"], correctAnswer: 1, explanation: "The entire lecture revolves around explaining the 'potlatch,' a traditional ceremonial event." },
                            { id: 16, text: "What can a host gain from a potlatch?", options: ["Food", "Money", "Items like blankets", "Social status"], correctAnswer: 3, explanation: "The professor states that the lavishness of the event 'can elevate the host's status.'" },
                            { id: 17, text: "What does the speaker imply about the Canadian government of the late-nineteenth century?", options: ["It was not aware of the social function of potlatches.", "It wanted Indigenous people to include other Canadians in potlatches.", "Its policies contributed to economic growth.", "It was extremely wasteful."], correctAnswer: 0, explanation: "The professor mentions the ban was due to 'perceived wastefulness' by people 'who don't understand the function of potlatches.'" },
                            { id: 18, text: "What aspect of potlatches will the speaker discuss next?", options: ["The ways in which communities brought them back", "The countries that ban them", "Their effect on wealth distribution", "Their possible future"], correctAnswer: 0, explanation: "The lecture concludes with: 'Let's now examine how Indigenous communities have revived this practice.'" }
                        ]
                    }
                ]
            },
            module2: {
                title: "Module 2",
                sections: [
                    {
                        id: "m2_short",
                        type: "listening",
                        title: "Listen and Choose a Response",
                        audioTitle: "Short Dialogues",
                        questions: [
                            { id: 19, transcript: "Man: Don't you have class right now?", text: "Choose the best response.", options: ["My professor is out this week.", "The syllabus was just posted.", "Yes, it's in my backpack.", "I don't think I received one."], correctAnswer: 0, explanation: "The man asks why the person is not currently in class. The best response explains a cancellation." },
                            { id: 20, transcript: "Woman: Have you met our new neighbor?", text: "Choose the best response.", options: ["It's a quiet neighborhood.", "I haven't yet.", "Yes, I'll drop it off tomorrow.", "Not usually at this time of day."], correctAnswer: 1, explanation: "The woman asks about meeting someone new. The correct response directly answers the yes or no question." },
                            { id: 21, transcript: "Woman: Why does my computer keep shutting down?", text: "Choose the best response.", options: ["Sure, you can borrow my charging cord.", "The door should remain shut and locked.", "Because the schedule was changed at the last minute.", "Sounds like it needs to be repaired."], correctAnswer: 3, explanation: "The woman presents a technical problem. The best response assesses the situation practically." },
                            { id: 22, transcript: "Man: Why didn't Andy come to the business dinner?", text: "Choose the best response.", options: ["I just met his assistant.", "The cafeteria closes at 2 o'clock.", "He's working late tonight.", "Because I lost mine."], correctAnswer: 2, explanation: "The man asks for a reason regarding an absence. The correct response provides a schedule conflict." },
                            { id: 23, transcript: "Man: Should we repaint the classrooms in that building?", text: "Choose the best response.", options: ["They usually study together.", "The library is past the cafeteria.", "I think it's time to do it.", "Some new classroom equipment."], correctAnswer: 2, explanation: "The man asks for an opinion on a maintenance task. The correct response agrees with the suggestion." },
                            { id: 24, transcript: "Woman: Would you mind making copies of the syllabus for me?", text: "Choose the best response.", options: ["I'll put them on your desk.", "Yes, I'll pass along the message.", "I like that new coffee maker.", "No, the other textbook."], correctAnswer: 0, explanation: "The woman makes a polite request. The correct response implies agreement and states the next action." },
                            { id: 25, transcript: "Woman: You managed to get to the concert, didn't you?", text: "Choose the best response.", options: ["I was able to make it to the trade show.", "I do not play any instruments.", "My manager agreed to the new schedule.", "It was a very long drive."], correctAnswer: 3, explanation: "The woman confirms attendance. The correct response implicitly agrees while adding a related detail about the journey." },
                            { id: 26, transcript: "Man: Does the restaurant use organic vegetables?", text: "Choose the best response.", options: ["The menu features two fish entrées.", "It depends on the season.", "The cost of broccoli has increased.", "Yes, the natural lighting is lovely."], correctAnswer: 1, explanation: "The man asks about ingredient sourcing. The correct response explains a condition related to the inquiry." }
                        ]
                    },
                    {
                        id: "m2_conv1",
                        type: "listening",
                        title: "Listen to a Conversation",
                        audioTitle: "Conversation: Online Store Setup",
                        transcript: `Woman: Did you finish setting up the new online store?\nMan: Almost. There's just a few more product descriptions to write.\nWoman: Do you need any help with that? I know the stuff we sell pretty intimately.\nMan: Thank you! I'd love to collaborate with you on this. Would you like to meet in my office after lunch?\nWoman: Later in the afternoon would be safer. I have a lunch-time meeting with our newest client today, and I don't know how long that's gonna last.`,
                        questions: [
                            { id: 27, text: "What does the woman offer to help with?", options: ["Deciding which products to sell", "Finding new clients", "Producing goods", "Describing items for sale"], correctAnswer: 3, explanation: "The man mentions needing to write 'product descriptions,' and the woman immediately asks if he needs help with 'that.'" },
                            { id: 28, text: "Why does the woman mention a client?", options: ["To emphasize the need for an online store", "To propose a strategy for increasing sales", "To illustrate the importance of collaboration", "To explain why she prefers not to plan a meeting after lunch"], correctAnswer: 3, explanation: "She mentions the client meeting to explain why meeting 'later in the afternoon would be safer' than directly after lunch." }
                        ]
                    },
                    {
                        id: "m2_announce1",
                        type: "listening",
                        title: "Listen to an Announcement",
                        audioTitle: "Announcement: Classroom Change",
                        transcript: `Man: Attention everyone. Several students have added this class in recent weeks, and as you can see, it is a bit crowded in here. So starting next week, our class will meet in Room 204 instead of Room 105. Room 204 is in the same building, but one floor up in the east wing. Please remember the change and arrive on time.`,
                        questions: [
                            { id: 29, text: "What is the reason for the change described in the announcement?", options: ["Repairs to a classroom", "Increased class enrollment", "A change in meeting time", "An additional assignment"], correctAnswer: 1, explanation: "The speaker states the room is 'crowded' because 'several students have added this class in recent weeks.'" },
                            { id: 30, text: "Why does the speaker mention the east wing?", options: ["To announce the location of an event", "To notify students of upcoming repairs", "To direct students to the professor's office", "To help students find a classroom"], correctAnswer: 3, explanation: "The east wing is mentioned to give specific directions to the new classroom, Room 204." }
                        ]
                    },
                    {
                        id: "m2_talk1",
                        type: "listening",
                        title: "Listen to a Talk",
                        audioTitle: "Lecture: Economics Class",
                        transcript: `Professor: Today, we are going to talk about the concept of the gig economy. The gig economy is a labor market characterized by short-term contracts or freelance work, as opposed to permanent jobs. It has gained significant traction in recent years because of technological advancements and the rise of digital platforms like ride-sharing apps and freelance websites. In a gig economy, workers typically take on multiple short-term jobs or projects, and they often do so through online platforms that connect them directly with clients. This can offer greater flexibility compared to traditional employment, as workers can choose when and where they wanna work. Companies benefit from the gig economy by reducing overhead costs associated with full-time employees, like for office space. This allows them to vary their workforce according to demand, which can be particularly useful during peak seasons or for specific projects. On the other hand, gig workers may face difficulties in securing consistent work and may have to juggle multiple gigs to make a living. Next, we will discuss potential regulatory responses to protect gig workers and after that: the implications of the gig economy on traditional labor markets.`,
                        questions: [
                            { id: 31, text: "What is the main topic of the talk?", options: ["The advantages of traditional employment", "The benefits of using apps instead of websites", "A new type of work tied to advances in technology", "A plan to restructure contract work"], correctAnswer: 2, explanation: "The talk introduces the 'gig economy,' describing it as a labor market tied to 'technological advancements' and 'digital platforms.'" },
                            { id: 32, text: "Why does the speaker mention ride-sharing apps and freelance websites?", options: ["To give examples of digital platforms in the gig economy", "To explain a problem with overhead costs", "To discuss how work conditions for gig workers have improved", "To illustrate technologies used both by companies and by their customers"], correctAnswer: 0, explanation: "They are cited directly as examples of the 'rise of digital platforms' driving the gig economy." },
                            { id: 33, text: "According to the speaker, what is a challenge for gig workers?", options: ["High overhead costs", "Limited flexibility", "Lack of a stable income", "Little office space"], correctAnswer: 2, explanation: "The professor notes they face 'difficulties in securing consistent work and may have to juggle multiple gigs to make a living.'" },
                            { id: 34, text: "What will the speaker discuss next?", options: ["The challenges of digital platforms for gig workers", "The efforts of regulators to protect gig workers", "The types of labor markets with many gig workers", "The advantages of flexible working hours for gig workers"], correctAnswer: 1, explanation: "The professor explicitly states, 'Next, we will discuss potential regulatory responses to protect gig workers...'" }
                        ]
                    }
                ]
            }
        };

        // --- STATE MANAGEMENT ---
        const state = {
            currentModule: null,
            flatSteps: [],
            currentStepIndex: 0,
            answers: {},
            showResults: false,
            showInstructions: false,
            isReviewMode: false,
            
            // Per-question timer
            questionTimeLeft: 0,
            timerInterval: null,
            
            // Audio System States
            isPlaying: false,
            passageAudioPlayed: {}, 
            passageAudioFinished: {} 
        };

        // --- LOGIC FUNCTIONS ---

        function startTest() {
            state.answers = {};
            state.passageAudioPlayed = {};
            state.passageAudioFinished = {};
            loadModule('module1');
        }

        function loadModule(moduleId) {
            state.currentModule = moduleId;
            state.showResults = false;
            state.showInstructions = true; 
            state.isReviewMode = false;
            state.currentStepIndex = 0;

            // Flatten steps
            const steps = [];
            testData[moduleId].sections.forEach(section => {
                if (section.type === 'listening') {
                    section.questions.forEach((q, idx) => {
                        steps.push({
                            type: 'listening',
                            data: section,
                            question: q,
                            questionIndex: idx + 1,
                            totalQuestions: section.questions.length,
                            passageId: (section.id.includes("short")) ? `short_${q.id}` : section.id 
                        });
                    });
                }
            });
            state.flatSteps = steps;
            
            assignVoices();
            render();
        }

        function setupCurrentStep() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }

            if (state.isReviewMode) {
                return; // No timer needed in review mode
            }

            const step = state.flatSteps[state.currentStepIndex];
            const isTalk = step.data.id.includes('talk') || step.data.audioTitle.toLowerCase().includes('lecture');
            
            // Initialize new question time
            state.questionTimeLeft = isTalk ? 30 : 20;

            // If audio was already completed previously for this passage, start timer immediately
            if (state.passageAudioFinished[step.passageId]) {
                startQuestionTimer();
            } else {
                updateTimerDisplay(); // Render the initial static time
            }
        }

        function startQuestionTimer() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            
            state.timerInterval = setInterval(() => {
                if (state.questionTimeLeft > 0) {
                    state.questionTimeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(state.timerInterval);
                    handleNext(); // Auto-advance when time runs out
                }
            }, 1000);
        }

        function stopAudio() {
            state.isPlaying = false;
            window.speechSynthesis.cancel();
        }

        async function playPreparedAudio() {
            const step = state.flatSteps[state.currentStepIndex];
            const passageId = step.passageId;
            const playCount = state.passageAudioPlayed[passageId] || 0;

            if (playCount >= 2) return;
            
            state.passageAudioPlayed[passageId] = playCount + 1;
            state.isPlaying = true;
            
            // Pause timer if it was running (e.g., user is using their 2nd replay)
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
            
            updateAudioUI(); 

            if (!femaleVoice || !maleVoice) assignVoices();

            const transcriptText = step.question.transcript || step.data.transcript;
            const lines = transcriptText.split('\n').filter(l => l.trim().length > 0);

            for (let line of lines) {
                if (!state.isPlaying) break;
                
                let spokenText = line;
                let currentGender = 'male'; 

                const match = line.match(/^([A-Za-z\s]+):\s*(.*)/);
                if (match) {
                    const speaker = match[1].toLowerCase().trim();
                    spokenText = match[2]; 
                    
                    if (speaker === 'woman') {
                        currentGender = 'female'; 
                    } else if (speaker === 'man' || speaker === 'professor') {
                        currentGender = 'male';
                    }
                }

                const sentences = spokenText.match(/[^.!?]+[.!?]+/g) || [spokenText];

                for (let sentence of sentences) {
                    if (!state.isPlaying) break;

                    await new Promise((resolve) => {
                        const utterance = new SpeechSynthesisUtterance(sentence.trim());
                        
                        if (currentGender === 'female') {
                            if (femaleVoice) utterance.voice = femaleVoice;
                        } else {
                            if (maleVoice) utterance.voice = maleVoice;
                        }
                        
                        utterance.rate = 0.95; 
                        utterance.onend = resolve;
                        utterance.onerror = resolve; 
                        window.speechSynthesis.speak(utterance);
                    });
                }
                
                if (state.isPlaying && lines.length > 1) {
                    await new Promise(r => setTimeout(r, 400));
                }
            }

            state.isPlaying = false;
            state.passageAudioFinished[passageId] = true;
            
            // Resume/Start timer after playback concludes
            startQuestionTimer();
            updateAudioUI(); 
        }

        // Targeted DOM updates to prevent flickering
        function updateAudioUI() {
            if (state.isReviewMode) return;

            const step = state.flatSteps[state.currentStepIndex];
            const passageId = step?.passageId;
            const isAudioFinished = state.passageAudioFinished[passageId];
            const playCount = state.passageAudioPlayed[passageId] || 0;
            
            const btnContainer = document.getElementById('audio-btn-container');
            const iconContainer = document.getElementById('audio-icon-container');
            const overlay = document.getElementById('question-overlay');
            const nextBtn = document.getElementById('next-btn');
            const warning = document.getElementById('audio-warning');

            // Update Audio Button
            if (btnContainer) {
                if (state.isPlaying) {
                    btnContainer.innerHTML = `<button disabled class="flex items-center px-10 py-4 bg-sky-50 text-sky-600 font-bold rounded-full shadow-md border border-sky-200 cursor-not-allowed">
                                                  <i data-lucide="volume-2" class="w-6 h-6 mr-3 animate-pulse"></i> Playing Audio...
                                               </button>`;
                } else if (playCount >= 2) {
                    btnContainer.innerHTML = `<button disabled class="flex items-center px-10 py-4 bg-slate-100 text-slate-400 font-bold rounded-full shadow-inner border border-slate-200 cursor-not-allowed">
                                                  <i data-lucide="check-circle" class="w-6 h-6 mr-3"></i> Audio Completed
                                               </button>`;
                } else {
                    let playText = playCount === 1 ? 'Play Audio Segment (1 play left)' : 'Play Audio Segment';
                    btnContainer.innerHTML = `<button onclick="playPreparedAudio()" class="flex items-center px-10 py-4 bg-white text-sky-600 font-bold rounded-full shadow-lg hover:shadow-xl hover:bg-slate-50 transition-all border border-sky-600 text-lg">
                                                  <i data-lucide="play-circle" class="w-8 h-8 mr-3"></i> ${playText}
                                               </button>`;
                }
                lucide.createIcons();
            }

            // Update Visual Pulse
            if (iconContainer) {
                if (state.isPlaying) {
                    iconContainer.classList.add('scale-105', 'animate-pulse', 'duration-1000');
                    iconContainer.innerHTML = `<i data-lucide="volume-2" class="w-24 h-24 text-white opacity-90"></i>`;
                } else {
                    iconContainer.classList.remove('scale-105', 'animate-pulse', 'duration-1000');
                    iconContainer.innerHTML = `<i data-lucide="headphones" class="w-24 h-24 text-white opacity-90"></i>`;
                }
                lucide.createIcons();
            }

            // Smoothly hide overlay when audio finishes its FIRST play
            if (overlay && isAudioFinished) {
                overlay.classList.add('opacity-0');
                setTimeout(() => { overlay.classList.add('hidden'); }, 500);
            }
            
            if (warning && playCount >= 2) {
                warning.style.display = 'none';
            }
            
            // Enable radio buttons dynamically without a full render to preserve animations
            const radioLabels = document.querySelectorAll('label.group');
            if (isAudioFinished) {
                radioLabels.forEach(label => {
                    label.classList.remove('opacity-50', 'cursor-not-allowed');
                    label.classList.add('cursor-pointer', 'hover:bg-slate-100', 'hover:border-slate-200');
                    
                    const radio = label.querySelector('input[type="radio"]');
                    if (radio) {
                        radio.disabled = false;
                        radio.classList.remove('cursor-not-allowed');
                        radio.classList.add('cursor-pointer');
                    }
                    
                    const span = label.querySelector('span');
                    if (span) {
                        span.classList.add('group-hover:text-black');
                    }
                });
            }

            // Update Next button enablement based on audio finish AND answer presence
            if (nextBtn) {
                const hasAnswered = state.answers[step?.question?.id] !== undefined;
                if (isAudioFinished && hasAnswered) {
                    nextBtn.disabled = false;
                    nextBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    nextBtn.title = "";
                } else if (!isAudioFinished) {
                    nextBtn.disabled = true;
                    nextBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    nextBtn.title = "Listen to the audio completely before moving on";
                } else if (!hasAnswered) {
                    nextBtn.disabled = true;
                    nextBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    nextBtn.title = "Please choose an answer before moving on";
                }
            }
        }

        function autoPlayCheck() {
            if (state.showInstructions || state.showResults || state.isReviewMode || state.isPlaying) return;
            const step = state.flatSteps[state.currentStepIndex];
            if (!step) return;
            
            const passageId = step.passageId;
            if (!state.passageAudioPlayed[passageId]) {
                // Short delay ensures interface is fully loaded before the audio begins
                setTimeout(() => {
                    if (!state.passageAudioPlayed[passageId] && !state.isPlaying && !state.showInstructions && !state.isReviewMode) {
                        playPreparedAudio();
                    }
                }, 1000);
            }
        }

        function handleNext() {
            stopAudio();
            if (state.currentStepIndex < state.flatSteps.length - 1) {
                state.currentStepIndex++;
                setupCurrentStep();
                render(); 
            } else {
                if (state.isReviewMode) {
                    endReview();
                } else {
                    handleModuleComplete();
                }
            }
        }
        
        function handleModuleComplete() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            stopAudio();
            if (state.currentModule === 'module1') {
                loadModule('module2');
            } else {
                finishTest();
            }
        }

        function handleBack() {
            stopAudio();
            if (state.currentStepIndex > 0) {
                state.currentStepIndex--;
                setupCurrentStep();
                render(); 
            }
        }

        function handleBeginTest() {
            assignVoices();
            state.showInstructions = false;
            setupCurrentStep();
            render();
        }

        function finishTest() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            stopAudio();
            state.showResults = true;
            render();
        }

        function startReview() {
            state.isReviewMode = true;
            state.showResults = false;
            state.currentStepIndex = 0;
            if (state.timerInterval) clearInterval(state.timerInterval);
            
            // Flatten ALL steps from both modules for the review phase
            const steps = [];
            Object.values(testData).forEach(moduleData => {
                moduleData.sections.forEach(section => {
                    if (section.type === 'listening') {
                        section.questions.forEach((q, idx) => {
                            steps.push({
                                type: 'listening',
                                data: section,
                                question: q,
                                questionIndex: idx + 1,
                                totalQuestions: section.questions.length,
                                passageId: (section.id.includes("short")) ? `short_${q.id}` : section.id 
                            });
                        });
                    }
                });
            });
            state.flatSteps = steps;
            render();
        }

        function endReview() {
            state.isReviewMode = false;
            state.showResults = true;
            render();
        }

        function handleRadioInput(qId, value) {
            if (state.isReviewMode) return;
            state.answers[qId] = value;
            render(); 
        }

        function resetApp() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.currentModule = null;
            state.flatSteps = [];
            state.answers = {};
            state.passageAudioPlayed = {};
            state.passageAudioFinished = {};
            state.showResults = false;
            state.showInstructions = false;
            state.isReviewMode = false;
            stopAudio();
            render();
        }

        function calculateScore() {
            let correct = 0;
            let total = 0;

            Object.values(testData).forEach(moduleData => {
                moduleData.sections.forEach(sec => {
                    if (sec.type === 'listening') {
                        sec.questions.forEach(q => {
                            total++;
                            if (state.answers[q.id] === q.correctAnswer) {
                                correct++;
                            }
                        });
                    }
                });
            });
            return { correct, total };
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timer-display');
            const container = document.getElementById('timer-container');
            
            if (el) el.innerText = formatTime(state.questionTimeLeft);
            
            if (container && !state.isReviewMode) {
                // Pulse logic for low time
                if (state.questionTimeLeft <= 5 && state.questionTimeLeft > 0) {
                    container.classList.add('text-red-500', 'font-bold', 'animate-pulse');
                    container.classList.remove('text-slate-500');
                } else {
                    container.classList.remove('text-red-500', 'font-bold', 'animate-pulse');
                    container.classList.add('text-slate-500');
                }
            }
        }

                    return `
                    <label class="flex items-start cursor-default bg-white p-4 rounded-lg mb-3 shadow-sm ${optionClass}">
                        <div class="relative flex items-center justify-center flex-shrink-0 mt-0.5">
                            <input 
                                type="radio" 
                                disabled
                                ${isChecked}
                                class="peer appearance-none w-5 h-5 border-2 border-slate-400 rounded-full checked:border-sky-600 checked:border-4 transition-all opacity-60 mr-4"
                            />
                        </div>
                        <span class="text-slate-700 font-sans text-lg flex-grow pr-2">${opt}</span>
                        ${icon}
                    </label>
                    `;
                } else {
                    return `
                    <label class="flex items-start group p-4 rounded-lg transition-colors border border-slate-200 bg-white shadow-sm ${disabledLabelClass}">
                        <div class="relative flex items-center justify-center flex-shrink-0 mt-0.5">
                            <input 
                                type="radio" 
                                name="q-${question.id}" 
                                ${isChecked}
                                ${isDisabledAttribute}
                                onchange="handleRadioInput(${question.id}, ${idx})"
                                class="peer appearance-none w-5 h-5 border-2 border-slate-400 rounded-full checked:border-sky-600 checked:border-4 transition-all ${disabledInputClass}"
                            />
                        </div>
                        <span class="ml-4 text-slate-700 font-sans text-lg transition-colors ${disabledSpanClass}">
                            ${opt}
                        </span>
                    </label>
                    `;
                }
            }).join('');

            let audioButtonHTML = '';
            
            if (state.isReviewMode) {
                audioButtonHTML = `<button disabled class="flex items-center px-10 py-4 bg-slate-100 text-slate-400 font-bold rounded-full shadow-inner border border-slate-200 cursor-not-allowed">
                                      <i data-lucide="check-circle" class="w-6 h-6 mr-3"></i> Review Mode
                                   </button>`;
            } else if (state.isPlaying) {
                audioButtonHTML = `<button disabled class="flex items-center px-10 py-4 bg-sky-50 text-sky-600 font-bold rounded-full shadow-md border border-sky-200 cursor-not-allowed">
                                      <i data-lucide="volume-2" class="w-6 h-6 mr-3 animate-pulse"></i> Playing Audio...
                                   </button>`;
            } else if (playCount >= 2) {
                audioButtonHTML = `<button disabled class="flex items-center px-10 py-4 bg-slate-100 text-slate-400 font-bold rounded-full shadow-inner border border-slate-200 cursor-not-allowed">
                                      <i data-lucide="check-circle" class="w-6 h-6 mr-3"></i> Audio Completed
                                   </button>`;
            } else {
                let playText = playCount === 1 ? 'Play Audio Segment (1 play left)' : 'Play Audio Segment';
                audioButtonHTML = `<button onclick="playPreparedAudio()" class="flex items-center px-10 py-4 bg-white text-sky-600 font-bold rounded-full shadow-lg hover:shadow-xl hover:bg-slate-50 transition-all border border-sky-600 text-lg">
                                      <i data-lucide="play-circle" class="w-8 h-8 mr-3"></i> ${playText}
                                   </button>`;
            }

            let reviewBlock = '';
            if (state.isReviewMode) {
                const isUserAnsCorrect = state.answers[question.id] === question.correctAnswer;
                const correctnessBadge = isUserAnsCorrect 
                    ? '<span class="text-green-600 font-bold text-sm flex items-center bg-green-50 px-2 py-1 rounded mb-3 w-max border border-green-200"><i data-lucide="check" class="w-4 h-4 mr-1"></i> Correct</span>' 
                    : '<span class="text-red-500 font-bold text-sm flex items-center bg-red-50 px-2 py-1 rounded mb-3 w-max border border-red-200"><i data-lucide="x" class="w-4 h-4 mr-1"></i> Incorrect</span>';
                
                const transcriptText = (question.transcript || data.transcript).replace(/\n/g, '<br/>');

                reviewBlock = `
                <div class="mt-6 space-y-4 pb-8">
                    <div class="p-5 bg-sky-50 rounded-lg border border-sky-100 text-slate-700 shadow-sm">
                        ${correctnessBadge}
                        <div class="flex items-start">
                            <i data-lucide="lightbulb" class="w-5 h-5 mr-3 text-sky-600 flex-shrink-0 mt-0.5"></i>
                            <div>
                                <strong class="text-sky-900 block mb-1">Strategy & Context:</strong>
                                ${question.explanation}
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-50 p-5 rounded-lg border border-slate-200 text-sm text-slate-700 shadow-sm">
                        <strong class="text-slate-800 block mb-3 font-sans flex items-center border-b border-slate-200 pb-2">
                            <i data-lucide="file-text" class="w-4 h-4 mr-2 text-slate-500"></i> Audio Transcript
                        </strong>
                        <div class="leading-relaxed italic text-base">${transcriptText}</div>
                    </div>
                </div>`;
            }

            const overlayClass = showQuestion ? 'hidden opacity-0' : 'opacity-95';

            return `
            <div class="pt-28 h-screen flex flex-col md:flex-row overflow-hidden bg-white">
                
                <div class="w-full md:w-1/2 h-full border-r border-slate-300 bg-slate-50 flex flex-col items-center justify-center p-8 relative shadow-inner">
                    <div class="absolute top-8 left-8 text-sm font-bold text-slate-400 uppercase tracking-widest flex items-center">
                        <i data-lucide="ear" class="w-4 h-4 mr-2"></i> Audio Environment
                    </div>
                    
                    <div id="audio-icon-container" class="w-56 h-56 rounded-full bg-gradient-to-tr from-sky-700 to-sky-400 shadow-2xl flex items-center justify-center mb-10 transition-transform ${state.isPlaying ? 'scale-105 animate-pulse duration-1000' : ''}">
                        <i data-lucide="${state.isPlaying ? 'volume-2' : 'headphones'}" class="w-24 h-24 text-white opacity-90"></i>
                    </div>
                    
                    <div class="mb-2 flex flex-col items-center">
                        <div id="audio-btn-container">
                            ${audioButtonHTML}
                        </div>
                        ${!state.isReviewMode && playCount < 2 ? '<p id="audio-warning" class="text-xs text-red-500 mt-4 font-bold uppercase tracking-wide"><i data-lucide="alert-triangle" class="w-3 h-3 inline mr-1"></i> Audio can be played up to 2 times</p>' : ''}
                    </div>
                </div>
                
                <div class="w-full md:w-1/2 h-full overflow-y-auto p-10 bg-slate-50 custom-scroll relative">
                    
                    <div class="max-w-xl mx-auto">
                        <div class="mb-6 text-sm font-bold text-sky-700 uppercase tracking-widest border-b border-slate-200 pb-2">${data.title}</div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
                            <h3 class="text-xl font-bold text-slate-800 font-sans leading-snug">${question.text}</h3>
                        </div>
                        <div class="space-y-4">
                            ${options}
                        </div>
                        ${reviewBlock}
                    </div>

                    <div id="question-overlay" class="absolute inset-0 bg-slate-50 z-10 flex flex-col items-center justify-center text-center px-8 transition-opacity duration-500 ${overlayClass}">
                        <i data-lucide="lock" class="w-16 h-16 text-slate-400 mb-6"></i>
                        <h3 class="text-2xl font-bold text-slate-700 mb-4">Question Hidden</h3>
                        <p class="text-slate-500 max-w-sm text-lg leading-relaxed">
                            Please listen to the audio segment completely. The question and options will appear automatically once the playback finishes.
                        </p>
                    </div>

                </div>
            </div>
            `;
        }

        // --- MAIN RENDER LOOP ---
        function render() {
            const app = document.getElementById('app');
            
            if (!state.currentModule) {
                app.innerHTML = renderWelcome();
            } else if (state.showResults) {
                app.innerHTML = renderResults();
            } else {
                let mainContent = '';
                if (state.showInstructions) {
                    mainContent = renderInstructions();
                } else {
                    const step = state.flatSteps[state.currentStepIndex];
                    if (step.type === 'listening') {
                        mainContent = renderListening(step);
                    }
                }
                
                app.innerHTML = renderHeader() + renderSubHeader() + mainContent;
            }

            lucide.createIcons();
            
            // Check to auto-play after rendering
            autoPlayCheck();
        }

        // Initialize App
        render();

    </script>
</body>
</html>
