<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEFL iBT® Practice Test 3 - Writing Section</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f8fafc;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .word-chip {
            transition: transform 0.1s ease-in-out, box-shadow 0.1s ease-in-out;
        }
        .sortable-ghost {
            opacity: 0.1;
        }
        .sortable-drag {
            cursor: grabbing !important;
        }
        /* Hide textareas used for copying without breaking formatting */
        .copy-textarea {
            position: absolute;
            left: -9999px;
            top: 0;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div id="app"></div>

    <script>
        const testData = {
            module1: {
                title: "Writing Section",
                sections: [
                    {
                        id: "sec_build",
                        type: "build_sentence",
                        title: "Build a Sentence",
                        timeLimit: 600,
                        description: "Move the words in the boxes to create grammatical sentences.",
                        questions: [
                            { id: 1, prompt: "What did Andre ask you at the party?", chunks: ["wanted", "does", "he", "ended", "when", "to know", "it"], answer: "he wanted to know when it ended", targetLength: 6, explanation: "The subject 'he' is followed by the main verb 'wanted', the infinitive 'to know', and the noun clause 'when it ended'. The word 'does' is an unnecessary distractor." },
                            { id: 2, prompt: "Why was the meeting rescheduled?", chunks: ["was moved", "to", "it", "a time", "when", "everyone", "could attend"], answer: "it was moved to a time when everyone could attend", targetLength: 7, suffix: ".", explanation: "This passive construction starts with 'It was moved'. The relative clause 'when everyone could attend' correctly modifies the noun phrase 'a time'." },
                            { id: 3, prompt: "I just spoke with the boss about applying for the open position.", prefix: "I am ", chunks: ["curious", "if", "mentioned", "any specific requirements", "because", "he"], answer: "curious if he mentioned any specific requirements", targetLength: 5, suffix: ".", explanation: "The adjective 'curious' introduces a conditional noun clause starting with 'if'. The word 'because' is an unnecessary distractor." },
                            { id: 4, prompt: "Why are you asking about the new restaurant?", prefix: "My ", chunks: ["is wondering", "it", "when", "is going", "to open", "she", "friend", "Jenna"], answer: "friend Jenna is wondering when it is going to open", targetLength: 7, suffix: ".", explanation: "The subject 'friend Jenna' pairs with the present continuous verb 'is wondering', followed by the noun clause 'when it is going to open'. The pronoun 'she' is unneeded." },
                            { id: 5, prompt: "Do you know anyone who can give me directions to the Big Tree Bistro?", prefix: "", chunks: ["Sally", "there", "to get", "how", "think", "I", "where", "knows"], answer: "I think Sally knows how to get there", targetLength: 7, suffix: ".", explanation: "The main clause 'I think' introduces the dependent noun clause 'Sally knows how to get there'. The word 'where' is a distractor since 'how to get there' is the correct phrase." },
                            { id: 6, prompt: "What are your plans for the summer?", prefix: "", chunks: ["I", "don't", "I'm", "where", "to do", "going", "know", "what"], answer: "I don't know what I'm going to do", targetLength: 7, suffix: " yet.", explanation: "The main verb 'don't know' is followed by a wh-noun clause 'what I'm going to do'. The word 'where' is a distractor." },
                            { id: 7, prompt: "What did Ruby ask about the new software?", prefix: "She wanted ", chunks: ["help", "however", "if", "it", "to know", "with", "need", "you"], answer: "to know if you need help with it", targetLength: 7, suffix: ".", explanation: "The infinitive 'to know' acts as the object, introducing an indirect yes/no question using 'if'. The transition word 'however' is incorrect here." },
                            { id: 8, prompt: "Why did Gustavo call you this morning?", prefix: "He wanted ", chunks: ["where", "a leak", "could find", "he", "to know", "a plumber", "to fix", "is"], answer: "to know where he could find a plumber to fix a leak", targetLength: 7, suffix: ".", explanation: "This sentence correctly orders a complex noun clause ('where he could find a plumber') followed by an infinitive phrase of purpose ('to fix a leak'). The verb 'is' is an unnecessary distractor." },
                            { id: 9, prompt: "I heard that the supervisor was looking for you.", prefix: "She ", chunks: ["we", "wanted", "to finish", "finished", "to know", "when", "the project", "expect"], answer: "wanted to know when we expect the project to finish", targetLength: 8, suffix: ".", explanation: "The main phrase 'wanted to know' introduces the clause 'when we expect the project to finish'. The past tense verb 'finished' is an incorrect distractor." },
                            { id: 10, prompt: "Julio said you had a question about the research paper.", prefix: "I'm hoping ", chunks: ["I might", "me", "you", "can", "tell", "where", "some reliable sources", "find"], answer: "you can tell me where I might find some reliable sources", targetLength: 8, suffix: ".", explanation: "Following 'I'm hoping', the clause 'you can tell me' sets up the indirect question 'where I might find some reliable sources'." }
                        ]
                    },
                    {
                        id: "sec_email",
                        type: "email",
                        title: "Write an Email",
                        timeLimit: 420,
                        timeLimitNotice: "Time Limit: 7 minutes",
                        prompt: "You are planning a business trip to another city. Your colleague, Maria, recently traveled to the same city for work.\n\nYou want to ask her recommendations for places to eat and things to do during your free time.\n\nWrite an email to Maria. In your email, do the following:\n\n• Explain why you are traveling to the city.\n• Ask for her recommendations about restaurants and activities.\n• Mention what you'd most like to do and what you'd like to avoid.\n\nWrite as much as you can and in complete sentences.",
                        to: "Maria",
                        subject: "Recommendations for Upcoming Business Trip"
                    },
                    {
                        id: "sec_discussion",
                        type: "discussion",
                        title: "Write for an Academic Discussion",
                        timeLimit: 600,
                        timeLimitNotice: "Time Limit: 10 minutes",
                        prompt: "A professor has posted a question about a topic and students have responded with their thoughts and ideas. Make a contribution to the discussion.\n\nYour professor is teaching a course on labor studies. Write a post responding to the professor's question.\n\nIn your response, you should do the following:\n• Express and support your opinion.\n• Make a contribution to the discussion in your own words.\n\nAn effective response will contain at least 100 words.",
                        professor: {
                            name: "Professor",
                            text: "More and more people can work remotely on portable electronic devices rather than in a dedicated office. These workers often have more flexibility regarding when and where they work, allowing them to become what are known as 'digital nomads', that is, workers who travel regularly and work from different locations, both inside and outside their own countries. Do you think digital nomadism is likely to continue increasing? Why or why not?"
                        },
                        students: [
                            { name: "Claire", text: "While digital nomadism does offer unparalleled freedom, it's important to note that it heavily relies on strong Internet connectivity. This requirement can significantly limit the destinations one can choose to work from, so digital nomadism probably won't increase globally as much as some people think." },
                            { name: "Paul", text: "While Claire makes a good point, Internet technologies and speed are always improving, so I think digital nomadism will continue to grow. Why work in a stuffy city office building just so you can afford to travel to someplace beautiful once or twice a year when you could work from such places all year round?" }
                        ]
                    }
                ]
            }
        };

        const state = {
            currentModule: null,
            flatSteps: [],
            currentStepIndex: 0,
            answers: {},
            sentenceStates: {},
            sectionTimes: {},
            currentSectionId: null,
            showResults: false,
            showInstructions: false,
            timerInterval: null
        };

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initModule(moduleId) {
            state.currentModule = moduleId;
            state.answers = {};
            state.sentenceStates = {};
            state.sectionTimes = {};
            state.showResults = false;
            state.showInstructions = true;
            state.currentSectionId = null;
            state.currentStepIndex = 0;

            const steps = [];
            testData[moduleId].sections.forEach(section => {
                state.sectionTimes[section.id] = section.timeLimit;
                if (section.type === 'build_sentence') {
                    section.questions.forEach((q, idx) => {
                        state.sentenceStates[q.id] = {
                            available: shuffleArray([...q.chunks]),
                            selected: []
                        };
                        steps.push({
                            type: 'build_sentence',
                            data: section,
                            question: q,
                            questionIndex: idx + 1,
                            totalQuestions: section.questions.length,
                            sectionId: section.id
                        });
                    });
                } else if (section.type === 'email' || section.type === 'discussion') {
                    state.answers[section.id] = "";
                    steps.push({
                        type: section.type,
                        data: section,
                        sectionId: section.id
                    });
                }
            });
            state.flatSteps = steps;
            render();
        }

        function startTimer() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                if (state.sectionTimes[state.currentSectionId] > 0) {
                    state.sectionTimes[state.currentSectionId]--;
                    updateTimerDisplay();
                } else {
                    forceNextSection();
                }
            }, 1000);
        }

        function forceNextSection() {
            const nextStep = state.flatSteps.find((s, idx) => idx > state.currentStepIndex && s.sectionId !== state.currentSectionId);
            if (nextStep) {
                state.currentStepIndex = state.flatSteps.indexOf(nextStep);
                state.currentSectionId = nextStep.sectionId;
                render();
            } else {
                finishTest();
            }
        }

        function stopTimer() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
        }

        function handleNext() {
            if (state.currentStepIndex < state.flatSteps.length - 1) {
                state.currentStepIndex++;
                state.currentSectionId = state.flatSteps[state.currentStepIndex].sectionId;
                render();
            } else {
                finishTest();
            }
        }

        function handleBack() {
            if (state.currentStepIndex > 0) {
                state.currentStepIndex--;
                state.currentSectionId = state.flatSteps[state.currentStepIndex].sectionId;
                render();
            }
        }

        function handleBeginTest() {
            state.showInstructions = false;
            state.currentSectionId = state.flatSteps[0].sectionId;
            startTimer();
            render();
        }

        function finishTest() {
            stopTimer();
            state.showResults = true;
            render();
        }

        function initSortable(qId) {
            const bankEl = document.getElementById(`word-bank-${qId}`);
            const zoneEl = document.getElementById(`sentence-zone-${qId}`);

            if (bankEl && zoneEl && typeof Sortable !== 'undefined') {
                new Sortable(bankEl, {
                    group: 'shared',
                    animation: 150,
                    filter: '.empty-placeholder',
                    onEnd: function() { syncSentenceState(qId); }
                });
                new Sortable(zoneEl, {
                    group: 'shared',
                    animation: 150,
                    filter: '.empty-placeholder',
                    onEnd: function() { syncSentenceState(qId); }
                });
            }
        }

        function syncSentenceState(qId) {
            const bankEl = document.getElementById(`word-bank-${qId}`);
            const zoneEl = document.getElementById(`sentence-zone-${qId}`);

            if (bankEl && zoneEl) {
                const available = Array.from(bankEl.querySelectorAll('.word-chip')).map(el => el.getAttribute('data-word'));
                const selected = Array.from(zoneEl.querySelectorAll('.word-chip')).map(el => el.getAttribute('data-word'));
                state.sentenceStates[qId].available = available;
                state.sentenceStates[qId].selected = selected;
                render();
            }
        }

        function handleTextInput(sectionId, value) {
            state.answers[sectionId] = value;
            updateWordCount(sectionId);
        }

        function updateWordCount(sectionId) {
            const text = state.answers[sectionId] || "";
            const wordCount = text.trim().split(/\s+/).filter(w => w.length > 0).length;
            const el = document.getElementById(`wc-${sectionId}`);
            if (el) el.innerText = wordCount;
        }

        function resetApp() {
            state.currentModule = null;
            state.flatSteps = [];
            state.answers = {};
            state.sentenceStates = {};
            state.sectionTimes = {};
            state.currentSectionId = null;
            state.showResults = false;
            state.showInstructions = false;
            stopTimer();
            render();
        }

        function calculateSentenceScore() {
            let correct = 0;
            let total = 0;
            if (!state.currentModule) return { correct: 0, total: 0 };
            testData[state.currentModule].sections.forEach(sec => {
                if (sec.type === 'build_sentence') {
                    sec.questions.forEach(q => {
                        total++;
                        const userArrangement = state.sentenceStates[q.id].selected.join(" ").trim().toLowerCase();
                        if (userArrangement === q.answer.toLowerCase()) correct++;
                    });
                }
            });
            return { correct, total };
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timer-display');
            if (el) el.innerText = formatTime(state.sectionTimes[state.currentSectionId] || 0);
        }

        function downloadPDF() {
            const nameInput = document.getElementById('learner-name').value.trim();
            const studentName = nameInput || "Learner";
            const dateStr = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

            const { correct, total } = calculateSentenceScore();
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const pageHeight = doc.internal.pageSize.height;

            doc.setFillColor(2, 132, 199);
            doc.rect(0, 0, 210, 45, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(22);
            doc.text("TOEFL iBT Writing Practice", 105, 22, { align: "center" });

            doc.setFontSize(12);
            doc.setFont("helvetica", "normal");
            doc.text("Performance Report", 105, 32, { align: "center" });

            let yPos = 60;
            doc.setTextColor(51, 65, 85);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(12);
            doc.text("Test Taker Information", 20, yPos);
            yPos += 8;
            doc.setFont("helvetica", "normal");
            doc.text(`Name: ${studentName}`, 20, yPos);
            yPos += 6;
            doc.text(`Date: ${dateStr}`, 20, yPos);
            yPos += 15;

            function addSectionText(text, isBold, fontSize, color, addSpacing = true) {
                doc.setFont("helvetica", isBold ? "bold" : "normal");
                doc.setFontSize(fontSize);
                doc.setTextColor(color[0], color[1], color[2]);

                const paragraphs = text.split('\n');
                paragraphs.forEach(para => {
                    const lines = doc.splitTextToSize(para, 170);
                    lines.forEach(line => {
                        if (yPos > pageHeight - 20) {
                            doc.addPage();
                            yPos = 20;
                        }
                        doc.text(line, 20, yPos);
                        yPos += 6;
                    });
                    if (addSpacing) yPos += 2;
                });
                if (addSpacing) yPos += 4;
            }

            addSectionText(`Part 1: Build a Sentence (Score: ${correct} / ${total})`, true, 14, [2, 132, 199]);
            yPos += 2;

            testData.module1.sections[0].questions.forEach((q, idx) => {
                const sState = state.sentenceStates[q.id];
                const userArrangement = sState.selected.join(" ").trim();
                const userDisplay = userArrangement.length > 0 ? userArrangement : "[No response provided]";
                const isCorrect = userArrangement.toLowerCase() === q.answer.toLowerCase();
                const mark = isCorrect ? "[Correct]" : "[Incorrect]";
                const formattedAnswer = q.answer.charAt(0).toUpperCase() + q.answer.slice(1) + (q.suffix || "");

                addSectionText(`${idx + 1}. ${q.prompt}`, true, 11, [51, 65, 85], false);
                addSectionText(`Your Answer: ${userDisplay} ${mark}`, false, 11, [51, 65, 85], false);
                addSectionText(`Correct Answer: ${formattedAnswer}`, false, 11, [51, 65, 85], false);
                yPos += 4; 
            });

            yPos += 6;
            addSectionText("Part 2: Write an Email (Student Response)", true, 14, [2, 132, 199]);
            yPos += 2;
            const emailResp = state.answers['sec_email'] || "[No response provided]";
            addSectionText(emailResp, false, 11, [51, 65, 85]);

            yPos += 10;
            addSectionText("Part 3: Academic Discussion (Student Response)", true, 14, [2, 132, 199]);
            yPos += 2;
            const discResp = state.answers['sec_discussion'] || "[No response provided]";
            addSectionText(discResp, false, 11, [51, 65, 85]);

            const safeFileName = studentName.replace(/\s+/g, '_');
            doc.save(`Writing_Report_${safeFileName}.pdf`);
        }

        function copyToClipboard(elementId, btnElement) {
            const textArea = document.getElementById(elementId);
            textArea.select();
            
            try {
                // Using standard execCommand as requested for iframe compatibility
                document.execCommand('copy');
                
                // Visual feedback
                const originalHtml = btnElement.innerHTML;
                btnElement.innerHTML = '<i data-lucide="check" class="w-4 h-4 mr-2"></i> Copied!';
                btnElement.classList.replace('bg-indigo-600', 'bg-green-600');
                btnElement.classList.replace('hover:bg-indigo-700', 'hover:bg-green-700');
                lucide.createIcons();
                
                setTimeout(() => {
                    btnElement.innerHTML = originalHtml;
                    btnElement.classList.replace('bg-green-600', 'bg-indigo-600');
                    btnElement.classList.replace('hover:bg-green-700', 'hover:bg-indigo-700');
                    lucide.createIcons();
                }, 2000);
            } catch (err) {
                console.error('Failed to copy', err);
                alert("Failed to copy text. Please try selecting it manually.");
            }
        }

        function renderWelcome() {
            return `
            <div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
                <div class="bg-white max-w-4xl w-full shadow-lg rounded-xl overflow-hidden">
                    <div class="bg-sky-600 py-12 px-6 text-white text-center">
                        <i data-lucide="pen-line" class="w-12 h-12 mx-auto mb-4 stroke-[2]"></i>
                        <h1 class="text-4xl font-bold font-sans tracking-tight mb-2">TOEFL iBT® Practice Test 3</h1>
                        <p class="text-xl text-sky-50 font-medium tracking-wide">Writing Section</p>
                    </div>
                    <div class="px-6 py-12 text-center md:px-12">
                        <p class="text-slate-600 mb-10 text-xl max-w-3xl mx-auto leading-relaxed">
                            This practice test simulates the digital interface of the writing section of the TOEFL iBT test. You will complete sentence building tasks and write responses to realistic prompts.
                        </p>
                        <div class="flex justify-center">
                            <button onclick="initModule('module1')" class="py-6 px-10 border border-slate-200 rounded-2xl hover:border-sky-500 hover:ring-1 hover:ring-sky-500 transition-all bg-white group shadow-sm hover:shadow-md cursor-pointer w-full max-w-xl">
                                <div class="flex items-center justify-center mb-2">
                                    <i data-lucide="file-text" class="w-6 h-6 mr-3 text-sky-700 group-hover:text-sky-600 transition-colors"></i>
                                    <h3 class="text-2xl font-bold text-slate-800 group-hover:text-sky-700 transition-colors">Start Writing Practice</h3>
                                </div>
                                <p class="text-slate-500 text-sm font-medium mt-1">10 Sentence Builds &bull; 1 Email &bull; 1 Academic Discussion</p>
                            </button>
                        </div>
                    </div>
                    <div class="bg-slate-50 p-5 text-center border-t border-slate-100">
                        <p class="text-slate-400 text-sm">Simulated interface for educational purposes.</p>
                    </div>
                </div>
            </div>`;
        }

        function renderInstructions() {
            return `
            <div class="pt-24 px-8 max-w-5xl mx-auto h-screen overflow-y-auto custom-scroll pb-10">
                <h1 class="text-3xl text-slate-800 mb-6 font-sans font-bold">Writing Section</h1>
                <p class="text-slate-700 text-lg mb-8 leading-relaxed">
                    This section evaluates your English writing proficiency across different communicative tasks.
                </p>
                <div class="border border-slate-300 bg-white shadow-sm rounded overflow-hidden">
                    <div class="grid grid-cols-[30%_70%] bg-sky-200 border-b border-slate-300 text-sky-900">
                        <div class="p-4 font-bold border-r border-slate-300">Type of Task</div>
                        <div class="p-4 font-bold">Description</div>
                    </div>
                    <div class="grid grid-cols-[30%_70%] border-b border-slate-300">
                        <div class="p-4 border-r border-slate-300 font-semibold text-slate-800">Build a Sentence</div>
                        <div class="p-4 text-slate-700">Assemble word chunks into grammatical responses in a conversation.</div>
                    </div>
                    <div class="grid grid-cols-[30%_70%] border-b border-slate-300">
                        <div class="p-4 border-r border-slate-300 font-semibold text-slate-800">Write an Email</div>
                        <div class="p-4 text-slate-700">Draft a formal email based on a scenario.</div>
                    </div>
                    <div class="grid grid-cols-[30%_70%]">
                        <div class="p-4 border-r border-slate-300 font-semibold text-slate-800">Academic Discussion</div>
                        <div class="p-4 text-slate-700">Contribute to a university discussion forum.</div>
                    </div>
                </div>
            </div>`;
        }

        function renderHeader() {
            const isInstructionPhase = state.showInstructions;
            let navButtons = '';
            if (isInstructionPhase) {
                navButtons = `
                    <button onclick="handleBeginTest()" class="flex items-center px-6 py-2 bg-white text-sky-700 font-bold rounded shadow hover:bg-slate-100 transition-colors">
                        Begin <i data-lucide="chevron-right" class="ml-1 w-5 h-5"></i>
                    </button>
                `;
            } else {
                const backBtn = state.currentStepIndex > 0 ? `<button onclick="handleBack()" class="flex items-center px-4 py-2 bg-white text-sky-700 font-bold rounded shadow hover:bg-slate-100 transition-colors mr-2 text-sm"><i data-lucide="chevron-left" class="mr-1 w-4 h-4"></i> Back</button>` : '';
                const nextText = state.currentStepIndex === state.flatSteps.length - 1 ? 'Finish' : 'Next';
                navButtons = `${backBtn} <button onclick="handleNext()" class="flex items-center px-6 py-2 bg-white text-sky-700 font-bold rounded shadow hover:bg-slate-100 transition-colors text-sm">${nextText} <i data-lucide="chevron-right" class="ml-1 w-4 h-4"></i></button>`;
            }
            return `
            <header class="bg-sky-600 h-16 flex items-center justify-between px-6 shadow-md z-50 fixed w-full top-0">
                <span class="text-white text-lg font-bold flex items-center"><i data-lucide="pen-tool" class="w-5 h-5 mr-2"></i> Writing Section</span>
                <div class="flex items-center space-x-2">${navButtons}</div>
            </header>`;
        }

        function renderSubHeader() {
            if (state.showInstructions) return '';
            const step = state.flatSteps[state.currentStepIndex];
            const displayTitle = step.type === 'build_sentence' ? `${step.data.title} (${step.questionIndex}/${step.totalQuestions})` : step.data.title;
            return `
            <div class="fixed top-16 w-full bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center text-slate-700 text-sm font-sans z-40 shadow-sm">
                <span class="font-semibold text-lg text-sky-700">${displayTitle}</span>
                <div class="flex items-center text-slate-500 font-mono bg-slate-100 px-3 py-1 rounded border border-slate-200">
                    <i data-lucide="clock" class="mr-2 w-4 h-4"></i>
                    <span id="timer-display" class="font-bold">${formatTime(state.sectionTimes[state.currentSectionId] || 0)}</span>
                </div>
            </div>`;
        }

        function renderBuildSentence(step) {
            const { data, question } = step;
            const sState = state.sentenceStates[question.id];
            const speaker1Img = `https://randomuser.me/api/portraits/women/${20 + question.id}.jpg`;
            const speaker2Img = `https://randomuser.me/api/portraits/men/${30 + question.id}.jpg`;

            const availableChips = sState.available.map((word) => `
                <div data-word="${word}" class="word-chip cursor-grab px-5 py-2 bg-white border border-slate-400 text-slate-800 font-medium rounded shadow-sm hover:shadow">
                    ${word}
                </div>
            `).join('');

            const selectedChips = sState.selected.map((word) => `
                <div data-word="${word}" class="word-chip cursor-grab px-2 border-b-2 border-slate-800 text-slate-800 font-medium min-w-[60px] text-center">
                    ${word}
                </div>
            `).join('');

            const remainingCount = Math.max(0, question.targetLength - sState.selected.length);
            let blanksHtml = '';
            for(let i=0; i<remainingCount; i++) {
                blanksHtml += `<span class="inline-block w-20 border-b-2 border-slate-800 h-2 mx-1"></span>`;
            }

            return `
            <div class="pt-32 px-4 md:px-12 max-w-4xl mx-auto pb-12 h-screen overflow-y-auto custom-scroll">
                <div class="bg-white p-10 rounded-lg shadow-sm border border-slate-200">
                    <div class="space-y-12">
                        <div class="flex items-start">
                            <img src="${speaker1Img}" class="w-20 h-20 rounded-full object-cover mr-6 border border-slate-200 shadow-sm" alt="Speaker 1">
                            <div class="pt-6 text-xl text-slate-800 font-sans">
                                ${question.prompt}
                            </div>
                        </div>
                        <div class="flex items-start">
                            <img src="${speaker2Img}" class="w-20 h-20 rounded-full object-cover mr-6 border border-slate-200 shadow-sm" alt="Speaker 2">
                            <div class="flex-grow pt-6">
                                <div id="sentence-zone-${question.id}" class="text-xl flex flex-wrap items-end gap-x-2 gap-y-4 mb-10 min-h-[40px] leading-relaxed">
                                    ${question.prefix ? `<span class="pb-1">${question.prefix}</span>` : ''}
                                    ${selectedChips}
                                    ${blanksHtml}
                                    ${question.suffix ? `<span class="pb-1 text-2xl font-bold">${question.suffix}</span>` : ''}
                                </div>
                                <div id="word-bank-${question.id}" class="border border-slate-300 p-6 flex flex-wrap justify-center gap-3 bg-slate-50 rounded min-h-[100px] shadow-inner">
                                    ${availableChips}
                                </div>
                                <div class="mt-8 text-slate-500 text-sm italic text-center">
                                    Arrange the words above, then click "Next" in the top menu when you are done.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderEmail(step) {
            const { data } = step;
            const currentText = state.answers[data.id] || "";
            const wordCount = currentText.trim().split(/\s+/).filter(w => w.length > 0).length;
            return `
            <div class="pt-28 h-screen flex flex-col md:flex-row overflow-hidden bg-white">
                <div class="w-full md:w-1/2 h-full overflow-y-auto border-r border-slate-300 p-8 bg-slate-50 custom-scroll">
                    <div class="prose max-w-none text-slate-800 leading-relaxed text-lg font-sans">${data.prompt.replace(/\n/g, '<br/>')}</div>
                </div>
                <div class="w-full md:w-1/2 h-full flex flex-col p-8 bg-white">
                    <div class="flex-grow flex flex-col border border-slate-300 rounded overflow-hidden shadow-sm">
                        <div class="bg-slate-100 border-b border-slate-200 p-4 text-sm font-sans text-slate-800">
                            <div><span class="font-bold text-slate-500 w-16 inline-block">To:</span> ${data.to}</div>
                            <div class="mt-2"><span class="font-bold text-slate-500 w-16 inline-block">Subject:</span> ${data.subject}</div>
                        </div>
                        <textarea class="flex-grow p-4 w-full resize-none focus:outline-none text-lg leading-relaxed font-sans text-slate-800" oninput="handleTextInput('${data.id}', this.value)">${currentText}</textarea>
                        <div class="bg-slate-50 border-t border-slate-200 p-3 text-sm text-slate-500 flex justify-between">
                            <span>Word Count: <span id="wc-${data.id}" class="font-bold text-sky-700">${wordCount}</span></span>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderDiscussion(step) {
            const { data } = step;
            const currentText = state.answers[data.id] || "";
            const wordCount = currentText.trim().split(/\s+/).filter(w => w.length > 0).length;
            const studentPosts = data.students.map(s => `<div class="mb-6"><div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm"><strong>${s.name}</strong><p class="text-slate-700 text-sm mt-2 leading-relaxed font-sans">${s.text}</p></div></div>`).join('');
            return `
            <div class="pt-28 h-screen flex flex-col md:flex-row overflow-hidden bg-white">
                <div class="w-full md:w-[55%] h-full overflow-y-auto border-r border-slate-300 p-8 bg-slate-50 custom-scroll">
                    <div class="prose max-w-none text-slate-800 mb-8 pb-6 border-b border-slate-200 font-sans text-lg">${data.prompt.replace(/\n/g, '<br/>')}</div>
                    <div class="bg-sky-50 p-5 rounded-lg border border-sky-200 mb-8 shadow-sm text-slate-800"><strong class="text-sky-900">${data.professor.name}</strong><p class="mt-2 leading-relaxed font-sans">${data.professor.text}</p></div>
                    ${studentPosts}
                </div>
                <div class="w-full md:w-[45%] h-full flex flex-col p-8 bg-white">
                    <h3 class="font-bold mb-4 flex items-center text-lg text-slate-800"><i data-lucide="message-square" class="w-5 h-5 mr-2 text-sky-600"></i> Your Response</h3>
                    <textarea class="flex-grow p-5 border border-slate-300 rounded-lg resize-none focus:ring-2 focus:ring-sky-500 focus:border-transparent text-lg leading-relaxed shadow-sm font-sans text-slate-800" oninput="handleTextInput('${data.id}', this.value)">${currentText}</textarea>
                    <div class="mt-3 text-sm text-slate-500 font-medium">Word Count: <span id="wc-${data.id}" class="font-bold text-sky-600">${wordCount}</span> / min 100</div>
                </div>
            </div>`;
        }

        function renderResults() {
            const { correct, total } = calculateSentenceScore();
            let sentenceReviewHtml = '';

            testData[state.currentModule].sections.forEach(sec => {
                if (sec.type === 'build_sentence') {
                    sec.questions.forEach((q, idx) => {
                        const sState = state.sentenceStates[q.id];
                        const userArrangement = sState.selected.join(" ").trim();
                        const isCorrect = userArrangement.toLowerCase() === q.answer.toLowerCase();
                        const userDisplay = userArrangement.length > 0 ? userArrangement : "<span class='text-slate-400 italic'>[No response provided]</span>";
                        const formattedAnswer = q.answer.charAt(0).toUpperCase() + q.answer.slice(1) + (q.suffix || "");

                        sentenceReviewHtml += `
                        <div class="border-b border-slate-200 pb-5 last:border-0 last:pb-0 mt-5">
                            <p class="font-semibold text-slate-800 mb-3">${idx + 1}. ${q.prompt}</p>
                            <div class="flex items-start mb-3">
                                <i data-lucide="${isCorrect ? 'check-circle' : 'x-circle'}" class="w-5 h-5 mr-3 mt-0.5 ${isCorrect ? 'text-green-600' : 'text-red-600'} flex-shrink-0"></i>
                                <div>
                                    <p class="text-slate-700 mb-1"><strong>Your Answer:</strong> ${userDisplay}</p>
                                    <p class="text-slate-700"><strong>Correct Answer:</strong> ${formattedAnswer}</p>
                                </div>
                            </div>
                            <div class="bg-slate-50 p-3 rounded text-sm text-slate-600 mt-2 border border-slate-100">
                                <strong class="text-slate-800 block mb-1">Explanation:</strong> ${q.explanation}
                            </div>
                        </div>
                        `;
                    });
                }
            });

            const emailRespRaw = state.answers['sec_email'] || "[No response provided]";
            const discRespRaw = state.answers['sec_discussion'] || "[No response provided]";
            
            const emailRespDisplay = state.answers['sec_email'] || "<span class='text-slate-400 italic'>[No response provided]</span>";
            const discRespDisplay = state.answers['sec_discussion'] || "<span class='text-slate-400 italic'>[No response provided]</span>";

            // Constructing the exact AI Prompts requested
            const aiEmailPromptText = `Act as an expert TOEFL iBT scorer. Please evaluate my "Write an Email" response based on the following official 5-point rubric criteria:

- 5: Fully successful. Effective elaboration, syntactic variety, precise word choice, appropriate social conventions, almost no errors.
- 4: Generally successful. Adequate elaboration, appropriate word choice, mostly appropriate social conventions, few errors.
- 3: Partially successful. Partial elaboration, moderate syntax/vocabulary, some noticeable errors.
- 2: Mostly unsuccessful. Limited/irrelevant elaboration, limited range, accumulation of errors.
- 1: Unsuccessful. Very little elaboration, telegraphic language, serious/frequent errors.

My response:
"${emailRespRaw}"

Please provide a score (0-5), a breakdown of my strengths and weaknesses, and a revised version of my email that sounds natural and professional.`;

            const aiDiscPromptText = `Act as an expert TOEFL iBT scorer. Please evaluate my "Write for an Academic Discussion" response based on the following official 5-point rubric criteria:

- 5: Fully successful. Relevant/well-elaborated contribution, effective syntactic variety, precise word choice, almost no errors.
- 4: Generally successful. Relevant/adequately elaborated, variety of structures, few errors.
- 3: Partially successful. Mostly relevant, partial elaboration, some noticeable errors.
- 2: Mostly unsuccessful. Poorly elaborated/partially relevant, limited range, accumulation of errors.
- 1: Unsuccessful. Ineffective attempt, severely limited range, serious/frequent errors.

My response:
"${discRespRaw}"

Please provide a score (0-5), a breakdown of my strengths and weaknesses, and a revised version of my response that fits an academic context.`;

            return `
            <div class="min-h-screen bg-slate-50 pt-16 pb-12 overflow-y-auto custom-scroll">

                <div class="bg-sky-600 p-10 text-white text-center shadow-md mb-8">
                    <i data-lucide="award" class="w-16 h-16 mx-auto mb-4 opacity-90"></i>
                    <h2 class="text-3xl font-bold">Review Your Performance</h2>
                    <p class="mt-2 opacity-90 text-lg">Practice Complete!</p>
                </div>

                <div class="max-w-4xl mx-auto px-4 space-y-8">

                    <!-- PDF Download Section -->
                    <div class="bg-sky-50 rounded-lg shadow-sm border border-sky-200 overflow-hidden p-6 text-center">
                        <h3 class="text-xl font-bold text-sky-900 mb-2">Download Your Writing Report</h3>
                        <p class="text-slate-700 mb-4 leading-relaxed">Please download your PDF report and send it to Teacher Fajar to receive predicted scores and feedback.</p>
                        <div class="flex flex-col items-center justify-center max-w-sm mx-auto">
                            <input type="text" id="learner-name" placeholder="Enter your full name" class="w-full px-4 py-3 border border-slate-300 rounded mb-4 focus:outline-none focus:ring-2 focus:ring-sky-500 shadow-sm" />
                            <button onclick="downloadPDF()" class="w-full px-6 py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded shadow transition-colors flex items-center justify-center">
                                <i data-lucide="download" class="w-5 h-5 mr-2"></i> Save Report as PDF
                            </button>
                        </div>
                    </div>

                    <!-- Standard Results -->
                    <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-50 p-5 border-b border-slate-200 font-bold text-lg text-slate-800 flex justify-between items-center">
                            <span class="flex items-center"><i data-lucide="layout-grid" class="w-5 h-5 mr-2 text-sky-600"></i> Build a Sentence</span>
                            <span class="text-sky-700 bg-sky-100 px-3 py-1 rounded text-sm">${correct} / ${total} Correct</span>
                        </div>
                        <div class="p-6 space-y-5">
                            ${sentenceReviewHtml}
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-50 p-5 border-b border-slate-200 font-bold text-lg text-slate-800 flex items-center">
                            <i data-lucide="mail" class="w-5 h-5 mr-2 text-sky-600"></i> Write an Email: Your Response
                        </div>
                        <div class="p-6 text-slate-700 whitespace-pre-wrap font-sans border-b border-slate-100">${emailRespDisplay}</div>
                        
                        <div class="bg-slate-50 p-6">
                            <h4 class="font-bold text-slate-800 mb-2 text-base">Write an Email: AI Self-Review</h4>
                            <p class="text-slate-600 text-sm mb-4 leading-relaxed">
                                Ready to evaluate your email? Click the button below to copy a specialized prompt along with your response. Paste it into an AI chatbot (like ChatGPT, Gemini, or Claude) to receive personalized, actionable feedback based on official rubrics.
                            </p>
                            <textarea id="hidden-ai-email" class="copy-textarea" readonly aria-hidden="true">${aiEmailPromptText.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</textarea>
                            <button onclick="copyToClipboard('hidden-ai-email', this)" class="inline-flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded shadow-sm transition-colors text-sm">
                                <i data-lucide="copy" class="w-4 h-4 mr-2"></i> Copy Prompt for AI
                            </button>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-50 p-5 border-b border-slate-200 font-bold text-lg text-slate-800 flex items-center">
                            <i data-lucide="message-square" class="w-5 h-5 mr-2 text-sky-600"></i> Academic Discussion: Your Response
                        </div>
                        <div class="p-6 text-slate-700 whitespace-pre-wrap font-sans border-b border-slate-100">${discRespDisplay}</div>
                        
                        <div class="bg-slate-50 p-6">
                            <h4 class="font-bold text-slate-800 mb-2 text-base">Academic Discussion: AI Self-Review</h4>
                            <p class="text-slate-600 text-sm mb-4 leading-relaxed">
                                Review your academic discussion contribution. Click the button below to copy a structured prompt along with your response. Paste it into your preferred AI tool to see how well you elaborated on your ideas and maintained an academic tone.
                            </p>
                            <textarea id="hidden-ai-disc" class="copy-textarea" readonly aria-hidden="true">${aiDiscPromptText.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</textarea>
                            <button onclick="copyToClipboard('hidden-ai-disc', this)" class="inline-flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded shadow-sm transition-colors text-sm">
                                <i data-lucide="copy" class="w-4 h-4 mr-2"></i> Copy Prompt for AI
                            </button>
                        </div>
                    </div>

                    <div class="flex justify-center pt-4 pb-8">
                        <button onclick="resetApp()" class="px-8 py-3 bg-slate-800 text-white font-bold rounded shadow hover:bg-slate-700 transition-colors flex items-center">
                            <i data-lucide="rotate-ccw" class="w-4 h-4 mr-2"></i> Retake Practice Test
                        </button>
                    </div>

                </div>
            </div>`;
        }

        function render() {
            const app = document.getElementById('app');
            if (!state.currentModule) {
                app.innerHTML = renderWelcome();
            } else if (state.showResults) {
                app.innerHTML = renderResults();
            } else {
                let mainContent = '';
                if (state.showInstructions) {
                    mainContent = renderInstructions();
                } else {
                    const step = state.flatSteps[state.currentStepIndex];
                    if (step.type === 'build_sentence') mainContent = renderBuildSentence(step);
                    else if (step.type === 'email') mainContent = renderEmail(step);
                    else if (step.type === 'discussion') mainContent = renderDiscussion(step);
                }
                app.innerHTML = renderHeader() + renderSubHeader() + mainContent;
            }
            lucide.createIcons();
            
            if (!state.showInstructions && !state.showResults && state.flatSteps.length > 0) {
                const currentStep = state.flatSteps[state.currentStepIndex];
                if (currentStep.type === 'build_sentence') initSortable(currentStep.question.id);
            }
        }

        render();
    </script>
</body>
</html>
