<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Fajar's TOEFL iBT: Write an Email Trainer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration for Neo-Brutalism -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    boxShadow: {
                        'brutal': '4px 4px 0px 0px rgba(0,0,0,1)',
                        'brutal-sm': '2px 2px 0px 0px rgba(0,0,0,1)',
                        'brutal-lg': '8px 8px 0px 0px rgba(0,0,0,1)',
                        'brutal-active': '0px 0px 0px 0px rgba(0,0,0,1)',
                    },
                    colors: {
                        brutal: {
                            yellow: '#fde047',
                            pink: '#f9a8d4',
                            blue: '#93c5fd',
                            green: '#86efac',
                            purple: '#d8b4fe',
                            orange: '#fdba74',
                            bg: '#f4f4f0',
                            white: '#ffffff',
                            black: '#000000'
                        }
                    },
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
                        mono: ['"Space Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');
        
        body {
            background-color: #f4f4f0;
            background-image: radial-gradient(#d1d5db 2px, transparent 2px);
            background-size: 24px 24px;
            color: #000;
        }

        /* Neo-Brutalist Scrollbar */
        ::-webkit-scrollbar {
            width: 14px;
            border-left: 3px solid black;
        }
        ::-webkit-scrollbar-track {
            background: #f4f4f0;
        }
        ::-webkit-scrollbar-thumb {
            background: black;
            border: 2px solid #f4f4f0;
        }

        /* Utility animations */
        .brutal-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="antialiased min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- DATA SECTION ---

        const prompts = [
            {
                id: 1,
                type: "Academic / Formal",
                title: "University Library Issue",
                scenario: "You borrowed a book from the university library that was due yesterday. However, you were sick and could not return it on time. You want to ask if the fine can be waived.",
                requirements: [
                    "Explain why you did not return the book on time.",
                    "Apologize for the inconvenience.",
                    "Ask if the late fee can be waived due to your illness."
                ],
                recipient: "library@university.edu",
                modelAnswer: {
                    subject: "Request regarding overdue book: [Student Name]",
                    body: "Dear Library Staff,\n\nI am writing to respectfully request a waiver for the late fee on a book I borrowed. The book was due yesterday; however, I came down with a sudden illness and was confined to bed, making it impossible for me to visit the campus to return it on time.\n\nI sincerely apologize for any inconvenience this delay has caused. I have now returned the book via the drop box. Given the circumstances regarding my health, I was wondering if it would be possible to waive the fine?\n\nThank you for your understanding and assistance.\n\nSincerely,\n\n[Student Name]",
                    notes: "This response scores a 5 because it uses a polite, formal register ('respectfully request', 'I was wondering if'). It clearly addresses all three points: the explanation (illness), the apology, and the specific request about the fee."
                }
            },
            {
                id: 2,
                type: "Social / Informal",
                title: "Weekend Trip Planning",
                scenario: "Your friend, Alex, wants to visit your city next weekend. However, you have a big exam on Monday and cannot spend the whole weekend with them.",
                requirements: [
                    "Express excitement about their visit.",
                    "Explain your exam situation.",
                    "Suggest a specific time you can meet for dinner instead of the whole weekend."
                ],
                recipient: "alex.friend@email.com",
                modelAnswer: {
                    subject: "Re: Visiting next weekend!",
                    body: "Hi Alex,\n\nIt is so great to hear from you! I am really excited that you are coming to visit my city next weekend. I have missed hanging out with you.\n\nHowever, I have a slight problem. I have a huge final exam on Monday morning, so I need to spend most of the weekend studying in the library. Unfortunately, this means I won't be able to show you around during the day.\n\nThat said, I definitely want to see you! Are you free for dinner on Saturday night around 7 PM? We could check out that new burger place downtown.\n\nLet me know if that works for you!\n\nBest,\n\n[Name]",
                    notes: "This email hits the perfect informal tone ('It is so great', 'hanging out'). It uses transition words ('However', 'That said') to manage the bad news effectively and ends with a clear, specific suggestion for meeting up."
                }
            },
            {
                id: 3,
                type: "Business / Formal",
                title: "Job Application Inquiry",
                scenario: "You applied for a part-time job at the campus bookstore two weeks ago but haven't heard back. You want to check the status of your application.",
                requirements: [
                    "State when you applied for the position.",
                    "Reiterate your interest in the job.",
                    "Ask when a decision is expected to be made."
                ],
                recipient: "manager@campusbooks.com",
                modelAnswer: {
                    subject: "Application Status Inquiry: Part-time Bookstore Assistant",
                    body: "Dear Hiring Manager,\n\nI am writing to inquire about the status of my application for the part-time position at the campus bookstore. I submitted my application via the online portal two weeks ago.\n\nI remain very interested in this opportunity, as I believe my organizational skills and love for reading would be a great asset to your team.\n\nCould you please let me know when you expect to make a hiring decision? I look forward to hearing from you soon.\n\nSincerely,\n\n[Name]",
                    notes: "This is a concise, professional email. It gets straight to the point ('I am writing to inquire'). It adds a nice touch by reiterating interest ('I remain very interested') and asks the question politely ('Could you please let me know')."
                }
            }
        ];

        const rubric = [
            { score: 5, desc: "Fully Successful", details: "Effective elaboration, varied syntax, precise vocabulary, appropriate social conventions (politeness/register), almost no errors." },
            { score: 4, desc: "Generally Successful", details: "Adequate elaboration, good syntax/vocab, mostly appropriate conventions, few errors." },
            { score: 3, desc: "Partially Successful", details: "Partial elaboration, moderate range of language, some noticeable errors or awkward tone." },
            { score: 2, desc: "Mostly Unsuccessful", details: "Limited elaboration, limited vocabulary/syntax, accumulation of errors making it hard to follow." },
            { score: 1, desc: "Unsuccessful", details: "Very little elaboration, telegraphic language, serious errors." }
        ];

        const toneExercises = [
            { phrase: "Hey, what's up?", type: "Informal" },
            { phrase: "I am writing to inquire about...", type: "Formal" },
            { phrase: "Thanks a bunch!", type: "Informal" },
            { phrase: "I would appreciate your assistance.", type: "Formal" },
            { phrase: "See ya later.", type: "Informal" },
            { phrase: "Sincerely,", type: "Formal" }
        ];

        const reorderingExercises = [
            { jumbled: ["writing", "am", "I", "to", "ask", "about", "the", "schedule"], correct: "I am writing to ask about the schedule" },
            { jumbled: ["let", "me", "Please", "know", "if", "available", "you", "are"], correct: "Please let me know if you are available" },
            { jumbled: ["forward", "I", "look", "to", "hearing", "from", "you"], correct: "I look forward to hearing from you" },
            { jumbled: ["apologize", "I", "for", "sincerely", "any", "caused", "inconvenience"], correct: "I sincerely apologize for any inconvenience caused" }
        ];

        // --- SUB-COMPONENTS ---

        // Thicker, bolder SVGs for the brutalist aesthetic
        const Icons = {
            Pen: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}><path strokeLinecap="square" strokeLinejoin="miter" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>,
            Book: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}><path strokeLinecap="square" strokeLinejoin="miter" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3}><path strokeLinecap="square" strokeLinejoin="miter" d="M5 13l4 4L19 7" /></svg>,
            Bulb: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}><path strokeLinecap="square" strokeLinejoin="miter" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" /></svg>,
            Ladder: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}><path strokeLinecap="square" strokeLinejoin="miter" d="M4 6h16M4 12h16M4 18h16" /></svg>,
            Star: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}><path strokeLinecap="square" strokeLinejoin="miter" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" /></svg>,
            Split: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}><path strokeLinecap="square" strokeLinejoin="miter" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" /></svg>
        };

        // Shared Brutalist Button Class
        const btnBrutal = "inline-flex items-center justify-center font-bold border-2 border-black shadow-brutal hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-brutal-sm active:translate-x-[4px] active:translate-y-[4px] active:shadow-brutal-active transition-all";

        // Skill Builder: Tone Detective
        const ToneDetective = ({ onComplete }) => {
            const [index, setIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [feedback, setFeedback] = useState(null);
            const [attempts, setAttempts] = useState(0);

            const moveToNext = () => {
                if (index < toneExercises.length - 1) {
                    setIndex(index + 1);
                    setFeedback(null);
                    setAttempts(0);
                } else {
                    onComplete();
                }
            };

            const handleChoice = (choice) => {
                if (feedback && (feedback.includes("Correct") || feedback.includes("Out of attempts"))) return;

                const isCorrect = choice === toneExercises[index].type;
                if (isCorrect) {
                    setFeedback("Correct!");
                    setScore(score + 1);
                    setTimeout(moveToNext, 1200);
                } else {
                    const newAttempts = attempts + 1;
                    setAttempts(newAttempts);
                    if (newAttempts >= 2) {
                        setFeedback(`Out of attempts! The correct answer is ${toneExercises[index].type}.`);
                        setTimeout(moveToNext, 2500);
                    } else {
                        setFeedback("Oops, try again. You have 1 attempt left.");
                    }
                }
            };

            return (
                <div className="bg-white border-4 border-black shadow-brutal-lg p-8 max-w-lg mx-auto brutal-pop">
                    <h3 className="text-2xl font-bold mb-2 uppercase tracking-wide bg-brutal-blue inline-block px-2 border-2 border-black">Level 1: Tone Detective</h3>
                    <p className="text-black font-bold mb-6 text-sm uppercase">Is this phrase Formal or Informal?</p>
                    
                    <div className="mb-8 p-6 bg-brutal-yellow border-4 border-black shadow-[4px_4px_0_0_#000]">
                        <p className="text-2xl font-bold text-black font-mono">"{toneExercises[index].phrase}"</p>
                    </div>

                    <div className="grid grid-cols-2 gap-6">
                        <button onClick={() => handleChoice('Formal')} className={`${btnBrutal} bg-brutal-blue text-black p-4 text-lg`}>Formal 👔</button>
                        <button onClick={() => handleChoice('Informal')} className={`${btnBrutal} bg-brutal-pink text-black p-4 text-lg`}>Informal 👋</button>
                    </div>
                    
                    {feedback && (
                        <div className={`mt-6 p-3 border-2 border-black font-bold text-lg text-center ${feedback === "Correct!" ? "bg-brutal-green" : "bg-red-400"}`}>
                            {feedback}
                        </div>
                    )}
                    <div className="mt-6 text-sm font-bold text-black border-t-2 border-black pt-2">Question {index + 1} / {toneExercises.length}</div>
                </div>
            );
        };

        // Skill Builder: Sentence Reordering (Typing)
        const SentenceReorderer = ({ onComplete }) => {
            const [index, setIndex] = useState(0);
            const [userInput, setUserInput] = useState("");
            const [feedback, setFeedback] = useState(null);
            const [showSuggestion, setShowSuggestion] = useState(false);
            const [attempts, setAttempts] = useState(0);

            const checkAnswer = () => {
                const attempt = userInput.trim().toLowerCase().replace(/\s+/g, ' ');
                const correct = reorderingExercises[index].correct.toLowerCase();

                if (attempt === "") {
                    setFeedback({ type: 'error', text: "Please type your sentence first." });
                    return;
                }

                if (attempt === correct || attempt === correct + ".") {
                    setFeedback({ type: 'success', text: "Perfect! Your sentence is grammatically correct and appropriate." });
                    setShowSuggestion(true);
                } else {
                    const newAttempts = attempts + 1;
                    setAttempts(newAttempts);
                    if (newAttempts >= 2) {
                        setFeedback({ type: 'warning', text: "Out of attempts. Review the correct sentence structure below." });
                        setShowSuggestion(true);
                    } else {
                        setFeedback({ type: 'error', text: "Not quite right. Check the word order and spelling. You have 1 attempt left." });
                    }
                }
            };

            const handleNext = () => {
                if (index < reorderingExercises.length - 1) {
                    setIndex(index + 1);
                    setUserInput("");
                    setFeedback(null);
                    setShowSuggestion(false);
                    setAttempts(0);
                } else {
                    onComplete();
                }
            };

            const currentExercise = reorderingExercises[index];

            return (
                <div className="bg-white border-4 border-black shadow-brutal-lg p-8 max-w-2xl mx-auto brutal-pop">
                    <h3 className="text-2xl font-bold mb-2 uppercase tracking-wide bg-brutal-pink inline-block px-2 border-2 border-black text-black">Level 2: Sentence Reordering</h3>
                    <p className="text-black font-bold mb-6 text-sm uppercase">Type the scrambled words in the correct order to form a professional sentence.</p>

                    <div className="bg-gray-100 p-6 border-4 border-black mb-6 text-center shadow-[4px_4px_0_0_#000]">
                        <div className="flex flex-wrap justify-center gap-3">
                            {currentExercise.jumbled.map((word, i) => (
                                <span key={i} className="px-3 py-1 bg-white border-2 border-black text-black font-bold shadow-[2px_2px_0_0_#000]">
                                    {word}
                                </span>
                            ))}
                        </div>
                    </div>

                    <div className="mb-6">
                        <input
                            type="text"
                            className="w-full border-4 border-black p-4 font-mono text-xl shadow-[4px_4px_0_0_#000] focus:outline-none focus:bg-brutal-yellow transition-colors placeholder-gray-400"
                            placeholder="Type the correct sentence here..."
                            value={userInput}
                            onChange={(e) => setUserInput(e.target.value)}
                            onKeyDown={(e) => { if(e.key === 'Enter') { !showSuggestion ? checkAnswer() : handleNext(); } }}
                            spellCheck="false"
                            autoComplete="off"
                            disabled={showSuggestion}
                        />
                    </div>

                    {!showSuggestion ? (
                        <button onClick={checkAnswer} className={`${btnBrutal} bg-brutal-blue text-black w-full py-4 text-xl`}>Check Sentence</button>
                    ) : (
                        <button onClick={handleNext} className={`${btnBrutal} bg-brutal-green text-black w-full py-4 text-xl`}>Next Sentence</button>
                    )}

                    {feedback && (
                        <div className={`mt-6 p-4 border-4 border-black font-bold text-center ${
                            feedback.type === 'success' ? 'bg-brutal-green text-black' : 
                            feedback.type === 'error' ? 'bg-red-400 text-black' :
                            'bg-brutal-yellow text-black'
                        }`}>
                            {feedback.text}
                        </div>
                    )}

                    {showSuggestion && (
                        <div className="mt-6 p-6 bg-brutal-purple border-4 border-black brutal-pop text-left shadow-[4px_4px_0_0_#000]">
                            <span className="text-sm font-bold text-black uppercase tracking-wider block mb-2 bg-white inline-block px-1 border border-black">Correct Structure:</span>
                            <p className="text-black font-bold text-xl font-mono">"{currentExercise.correct}"</p>
                        </div>
                    )}

                    <div className="mt-6 text-sm font-bold text-black border-t-2 border-black pt-2 uppercase text-center">
                        Question {index + 1} / {reorderingExercises.length}
                    </div>
                </div>
            );
        };

        // Skill Builder: Guided Drafter
        const GuidedDrafter = ({ onComplete }) => {
            const [step, setStep] = useState(0);
            const [draft, setDraft] = useState({ greeting: "", purpose: "", details: "", closing: "", signoff: "" });
            const [attempts, setAttempts] = useState(0);
            const [feedback, setFeedback] = useState(null);
            
            const prompt = prompts[0]; 

            const steps = [
                {
                    title: "Step 1: The Greeting",
                    instruction: "This is a Formal email to a university department. Choose the best greeting.",
                    options: ["Hi Library,", "Dear Library Staff,", "Hey there,"],
                    correct: "Dear Library Staff,",
                    field: "greeting"
                },
                {
                    title: "Step 2: The Purpose",
                    instruction: "Write ONE sentence explaining why you are writing. (Hint: Use 'I am writing to...')",
                    isInput: true,
                    placeholder: "I am writing to...",
                    field: "purpose",
                    tip: "Start directly. Don't say 'My name is...' unless necessary."
                },
                {
                    title: "Step 3: The Details",
                    instruction: `Explain the situation: "${prompt.requirements[0]}" and "${prompt.requirements[1]}"`,
                    isInput: true,
                    placeholder: "The book was due yesterday, but...",
                    field: "details",
                    tip: "Use connectors like 'However' or 'Unfortunately' to explain the problem."
                },
                {
                    title: "Step 4: Call to Action",
                    instruction: `Make your request: "${prompt.requirements[2]}"`,
                    isInput: true,
                    placeholder: "I would like to ask if...",
                    field: "closing",
                    tip: "Be polite! Use 'Could you please' or 'I was wondering if'."
                },
                {
                    title: "Step 5: Sign off",
                    instruction: "Choose a formal sign off.",
                    options: ["Best,", "Sincerely,", "Love,"],
                    correct: "Sincerely,",
                    field: "signoff"
                }
            ];

            const handleNext = () => {
                if(step < steps.length) {
                    setStep(step + 1);
                    setAttempts(0);
                    setFeedback(null);
                } else {
                    onComplete();
                }
            };

            const updateDraft = (value) => {
                setDraft({ ...draft, [steps[step].field]: value });
            };

            const handleOptionSelect = (opt) => {
                if (feedback && feedback.type === 'success') return; 
                
                const currentStep = steps[step];
                if (opt === currentStep.correct) {
                    setFeedback({ type: 'success', text: "CORRECT CHOICE!" });
                    updateDraft(opt);
                    setTimeout(handleNext, 1200);
                } else {
                    const newAttempts = attempts + 1;
                    setAttempts(newAttempts);
                    if (newAttempts >= 2) {
                        setFeedback({ type: 'warning', text: `OUT OF ATTEMPTS. THE BEST CHOICE IS "${currentStep.correct}".` });
                        updateDraft(currentStep.correct);
                        setTimeout(handleNext, 2500);
                    } else {
                        setFeedback({ type: 'error', text: "INCORRECT. YOU HAVE 1 ATTEMPT LEFT." });
                    }
                }
            };

            if (step >= steps.length) {
                return (
                    <div className="bg-white border-4 border-black shadow-brutal-lg p-8 max-w-2xl mx-auto brutal-pop">
                        <h3 className="text-3xl font-black mb-6 text-black uppercase bg-brutal-green inline-block px-3 border-2 border-black">Draft Complete!</h3>
                        <p className="font-bold text-black mb-6 uppercase">Here is your assembled email:</p>
                        <div className="bg-gray-100 p-6 border-4 border-black shadow-[4px_4px_0_0_#000] font-mono leading-relaxed whitespace-pre-wrap text-lg">
                            {`${draft.greeting}\n\n${draft.purpose} ${draft.details}\n\n${draft.closing}\n\n${draft.signoff}`}
                        </div>
                        <div className="mt-8 text-center">
                            <button onClick={onComplete} className={`${btnBrutal} bg-brutal-yellow text-black px-8 py-4 text-xl w-full`}>Finish Workshop</button>
                        </div>
                    </div>
                );
            }

            const currentStep = steps[step];

            return (
                <div className="bg-white border-4 border-black shadow-brutal-lg p-6 md:p-8 max-w-2xl mx-auto brutal-pop">
                    <div className="flex justify-between items-center mb-6 border-b-4 border-black pb-4">
                        <h3 className="text-2xl font-bold text-black uppercase bg-brutal-green inline-block px-2 border-2 border-black">{currentStep.title}</h3>
                        <span className="text-sm font-bold bg-black text-white px-3 py-1 border-2 border-black uppercase shadow-[2px_2px_0_0_#fde047]">Step {step + 1}/{steps.length}</span>
                    </div>
                    
                    <p className="text-black font-bold mb-6 text-lg">{currentStep.instruction}</p>

                    {currentStep.options ? (
                        <div className="grid gap-4">
                            {currentStep.options.map((opt, i) => (
                                <button 
                                    key={i} 
                                    onClick={() => handleOptionSelect(opt)}
                                    className={`${btnBrutal} bg-white text-black p-4 text-left justify-start text-lg`}
                                >
                                    {opt}
                                </button>
                            ))}
                            {feedback && (
                                <div className={`mt-4 p-4 border-4 border-black font-bold text-center uppercase ${
                                    feedback.type === 'success' ? 'bg-brutal-green text-black' : 
                                    feedback.type === 'error' ? 'bg-red-400 text-black' :
                                    'bg-brutal-yellow text-black'
                                }`}>
                                    {feedback.text}
                                </div>
                            )}
                        </div>
                    ) : (
                        <div className="space-y-6">
                            <textarea 
                                className="w-full border-4 border-black shadow-[4px_4px_0_0_#000] p-4 focus:outline-none focus:bg-brutal-yellow transition-colors font-mono text-lg" 
                                rows="4"
                                placeholder={currentStep.placeholder}
                                onChange={(e) => updateDraft(e.target.value)}
                            ></textarea>

                                                        <h3 className="font-black text-2xl text-black uppercase mb-2">{level.desc}</h3>
                                                        <p className="text-black font-bold text-lg leading-relaxed">{level.details}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="mt-10 p-6 bg-white border-4 border-black shadow-[4px_4px_0_0_#000] text-lg font-bold text-black text-center uppercase">
                                            Note: Automated scoring looks for lexical variety, syntactic complexity, and topic relevance.
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
