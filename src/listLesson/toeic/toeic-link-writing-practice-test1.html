<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEIC Link Simulation</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        /* Base styles and custom animations for the Neo-Brutalist theme */
        body {
            background-color: #f4f4f0;
            color: black;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        
        .draggable-slot.drag-over {
            background-color: #fef08a;
            border-style: solid;
        }

        /* Prevent text selection during drag and drop */
        .select-none {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Global Header -->
    <header id="global-header" class="w-full bg-[#ff90e8] text-black p-4 border-b-4 border-black flex justify-between items-center shadow-[0_4px_0_0_#000] z-10 relative">
        <div class="flex items-center gap-3">
            <i data-lucide="asterisk" class="text-black w-8 h-8 stroke-[3px]"></i>
            <span class="font-black text-2xl tracking-tighter uppercase">TOEIC Link.</span>
        </div>
        
        <div id="header-center-label" class="hidden md:block font-black text-lg uppercase tracking-wider bg-white border-2 border-black px-4 py-1 shadow-[2px_2px_0px_0px_#000]">
            Test Information
        </div>

        <div id="header-right-info" class="hidden md:block text-right pr-4">
            <div class="font-black uppercase tracking-wider text-sm bg-white border-2 border-black px-3 py-1 shadow-[2px_2px_0px_0px_#000] inline-block mb-1">Test: TOEIC Link</div>
            <div class="text-xs font-bold bg-black text-white px-2 py-1 inline-block ml-2 border-2 border-black">Section: Writing</div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app-root" class="flex-grow flex flex-col items-center justify-start p-2 md:p-8 w-[98%] max-w-[1600px] mx-auto">
        <!-- Dynamic content injected here -->
    </main>

    <!-- Modal Container -->
    <div id="modal-container" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="bg-[#fde047] border-4 border-black shadow-[12px_12px_0px_0px_#000] rounded-xl max-w-sm w-full p-8 text-center animate-in fade-in zoom-in duration-200">
            <i data-lucide="alert-circle" class="w-20 h-20 text-black mx-auto mb-4 stroke-[2.5px]"></i>
            <h3 class="text-2xl font-black text-black mb-2 uppercase">You still have time</h3>
            <p class="text-black font-bold mb-8">You have time remaining. Would you like to continue working?</p>
            <div class="flex flex-col gap-4">
                <button id="modal-resume-btn" class="w-full bg-[#4ade80] text-black border-4 border-black shadow-[4px_4px_0px_0px_#000] font-black uppercase tracking-wider py-3 rounded-lg hover:-translate-y-1 hover:shadow-[6px_6px_0px_0px_#000] active:translate-x-[4px] active:translate-y-[4px] active:shadow-none transition-all">
                    Yes
                </button>
                <button id="modal-finish-btn" class="w-full bg-white text-black border-4 border-black shadow-[4px_4px_0px_0px_#000] font-black uppercase tracking-wider py-3 rounded-lg hover:-translate-y-1 hover:shadow-[6px_6px_0px_0px_#000] active:translate-x-[4px] active:translate-y-[4px] active:shadow-none transition-all">
                    No, I am finished
                </button>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        // --- GLOBAL STATE ---
        let currentPage = 1;
        let responses = { 1: [], 2: [], 3: [], 4: "", 5: "", 6: "" };
        let timerInterval = null;
        let currentTimeLeft = 0;
        let currentQuestionNum = null;
        let isWordCountHidden = false;

        // Data for Build a Sentence
        const questionsData = {
            1: { starter: "Have you", words: ["reviewed", "this project", "report", "this morning"], endPunc: "?", slots: 4 },
            2: { starter: "Can you", words: ["when", "will launch", "the new", "software", "tell me"], endPunc: "?", slots: 5 },
            3: { starter: "The office that", words: ["to rent", "is", "wanted", "we", "available", "not"], endPunc: ".", slots: 6 }
        };

        // Data for Review
        const answerKeys = {
            1: { starter: "Have you", correct: "Have you reviewed this project report this morning?", end: "?" },
            2: { starter: "Can you", correct: "Can you tell me when the new software will launch?", end: "?" },
            3: { starter: "The office that", correct: "The office that we wanted to rent is not available.", end: "." },
            4: "Hi David,\n\nI highly recommend taking the Data Analytics course for your professional development. Although it requires attending early morning sessions, the instructor is highly rated, which will ensure you get the best possible foundation in the subject. The Cloud Computing course meets only once a week, but the heavy workload might interfere with our current project deliverables. Therefore, Data Analytics seems like the better choice right now.\n\nBest regards,\n[Your Name]",
            5: "Hi Sarah,\n\nI would love to help you with the event setup tomorrow morning. Unfortunately, I have an urgent project deadline tomorrow, and our manager has asked me to prioritize completing it. As an alternative, I could help you organize the digital registration materials this evening before I log off, or I can ask Mark if he is available to assist you tomorrow morning.\n\nBest regards,\n[Your Name]",
            6: "In my opinion, cloud collaboration tools have had the most profound impact on modern business communication. While video conferencing and instant messaging are essential for real-time interaction, cloud platforms allow teams to work asynchronously on the same documents from anywhere in the world. This eliminates version control issues and drastically speeds up project turnaround times. For instance, in our recent global marketing campaign, team members across three different time zones contributed to a single presentation without ever needing to schedule a live meeting. This level of seamless, continuous collaboration was impossible before cloud technology. Therefore, by fundamentally changing how we create and share work, cloud collaboration tools have transformed the modern workplace."
        };

        // Email Data
        const emailDataConfig = {
            4: {
                scenario: "Your colleague asked you to give him advice about which of two software training programs to take for professional development.",
                instruction: "Use the information from the table and write an email to your colleague David.",
                tasks: ["Recommend one of the training programs in the table.", "Explain why you think it is the better choice for him."],
                table: [
                    { course: "Data Analytics", adv: "Highly rated instructor", dis: "Early morning sessions" },
                    { course: "Cloud Computing", adv: "Meets once a week", dis: "Heavy workload" }
                ],
                to: "David",
                subject: "Training program advice"
            },
            5: {
                scenario: "Your coworker Sarah is organizing an upcoming client conference. She has asked you to help her with the event setup tomorrow morning. You want to help; however, you have an urgent project deadline tomorrow, and your manager said you should prioritize the project.",
                instruction: "Write an email to your coworker Sarah. In your email, do the following.",
                tasks: ["Express a desire to help.", "Explain why you cannot help.", "Suggest an alternative way to support her."],
                to: "Sarah",
                subject: "Conference setup"
            }
        };

        // --- UTILITY FUNCTIONS ---
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function startTimer(seconds, onComplete) {
            clearInterval(timerInterval);
            currentTimeLeft = seconds;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                currentTimeLeft--;
                updateTimerDisplay();
                if (currentTimeLeft <= 0) {
                    clearInterval(timerInterval);
                    onComplete();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const display = document.getElementById('timer-display');
            if (display) {
                display.innerText = formatTime(currentTimeLeft);
                if (currentTimeLeft <= 10) {
                    display.classList.add('bg-[#ff5252]', 'text-white', 'animate-pulse');
                    display.classList.remove('bg-[#fde047]', 'text-black');
                }
            }
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function showModal(onResume, onFinish) {
            const modal = document.getElementById('modal-container');
            modal.classList.remove('hidden');
            
            document.getElementById('modal-resume-btn').onclick = () => {
                modal.classList.add('hidden');
                if(onResume) onResume();
            };
            
            document.getElementById('modal-finish-btn').onclick = () => {
                modal.classList.add('hidden');
                stopTimer();
                if(onFinish) onFinish();
            };
        }

        function handleSubmit(qNum, saveFunction) {
            if (saveFunction) saveFunction();
            
            if (currentTimeLeft > 0) {
                showModal(null, () => goToPage(currentPage + 1));
            } else {
                goToPage(currentPage + 1);
            }
        }

        function updateHeader() {
            const centerLabel = document.getElementById('header-center-label');
            const rightInfo = document.getElementById('header-right-info');
            
            centerLabel.classList.add('hidden');
            rightInfo.classList.add('hidden');

            if (currentPage === 1) {
                centerLabel.innerText = "Test Information";
                centerLabel.classList.remove('hidden');
                centerLabel.classList.add('md:block');
            } else if (currentPage === 14) {
                centerLabel.innerText = "Simulation Review";
                centerLabel.classList.remove('hidden', 'bg-white');
                centerLabel.classList.add('md:block', 'bg-[#fde047]');
            } else {
                rightInfo.classList.remove('hidden');
                rightInfo.classList.add('md:block');
            }
        }

        function getSubHeaderHTML(qNum, totalQ = 6) {
            const progress = (qNum / totalQ) * 100;
            return `
                <div class="w-full bg-white border-b-4 border-black p-4 rounded-t-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div class="w-full md:w-1/2">
                        <div class="text-sm font-black text-black mb-2 uppercase tracking-widest">Question: ${qNum} of ${totalQ}</div>
                        <div class="w-full bg-white border-4 border-black rounded-full h-4 shadow-[2px_2px_0px_0px_#000] overflow-hidden">
                            <div class="bg-[#f472b6] border-r-4 border-black h-full transition-all duration-500" style="width: ${progress}%"></div>
                        </div>
                    </div>
                    <div class="flex items-center gap-3 text-black">
                        <i data-lucide="clock" class="w-8 h-8 text-black stroke-[2.5px]"></i>
                        <div class="flex flex-col items-end">
                            <span class="text-xs font-bold uppercase tracking-wider">Time left</span>
                            <span id="timer-display" class="font-black text-2xl bg-[#fde047] text-black border-4 border-black px-3 py-0.5 shadow-[2px_2px_0px_0px_#000] rounded-lg transition-colors">
                                00:00
                            </span>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- NAVIGATION ROUTER ---
        function goToPage(page) {
            stopTimer();
            currentPage = page;
            updateHeader();
            const root = document.getElementById('app-root');
            root.innerHTML = ''; // Clear previous content

            switch(page) {
                case 1: root.innerHTML = renderWaitingLounge(); bindWaitingLounge(); break;
                case 2: root.innerHTML = renderSimulationNotice(); bindNextButton(); break;
                case 3: root.innerHTML = renderWritingTestOverview(); bindNextButton(); break;
                case 4: root.innerHTML = renderSectionIntro("Build a Sentence", "Click or drag the words in the boxes to create grammatically correct sentences. You will have one minute to complete the sentence."); bindNextButton(); break;
                case 5: renderBuildSentence(1, root); break;
                case 6: renderBuildSentence(2, root); break;
                case 7: renderBuildSentence(3, root); break;
                case 8: root.innerHTML = renderSectionIntro("Write an Email", "You will read some information and use the information to write emails. You will have 7 minutes to write each of the two emails."); bindNextButton(); break;
                case 9: renderEmailQuestion(4, root); break;
                case 10: renderEmailQuestion(5, root); break;
                case 11: root.innerHTML = renderSectionIntro("Write About Your Perspective", "Someone has posted a question about a topic and others have responded with their thoughts and ideas. Write a response to the discussion. You will have 10 minutes to write."); bindNextButton(); break;
                case 12: renderPerspectiveQuestion(6, root); break;
                case 13: root.innerHTML = renderEndTest(); bindNextButton(); break;
                case 14: root.innerHTML = renderReviewAnswers(); bindReviewAnswers(); break;
            }
            
            // Re-initialize icons for new DOM elements
            lucide.createIcons();
            window.scrollTo(0, 0);
        }

        // --- PAGE RENDERERS ---

        function renderWaitingLounge() {
            return `
            <div class="w-full max-w-[1400px] bg-white border-4 border-black shadow-[12px_12px_0px_0px_#000] rounded-2xl overflow-hidden flex flex-col md:flex-row mt-4">
                <div class="w-full md:w-1/2 p-6 md:p-10 flex flex-col gap-6 bg-white md:border-r-4 border-black">
                    <div class="bg-[#bae6fd] border-4 border-black text-black p-5 rounded-xl shadow-[4px_4px_0px_0px_#000]">
                        <h2 class="font-black text-2xl uppercase">Welcome,</h2>
                        <p class="font-bold mt-1 text-sm">Please read the test instructions carefully.</p>
                    </div>
                    
                    <div class="bg-white border-4 border-black rounded-xl shadow-[6px_6px_0px_0px_#000] overflow-hidden flex-grow flex flex-col">
                        <div class="p-4 border-b-4 border-black bg-[#bbf7d0]">
                            <h3 class="font-black text-black uppercase text-lg tracking-wider">Test Information</h3>
                        </div>
                        <div class="p-6 text-sm text-black font-semibold space-y-6 flex-grow">
                            <div class="grid grid-cols-2 gap-2 bg-[#f4f4f0] p-4 border-4 border-black rounded-lg shadow-[2px_2px_0px_0px_#000]">
                                <div class="uppercase tracking-wider">Test Name:</div><div class="text-right font-black">TOEIC Link</div>
                                <div class="uppercase tracking-wider">Approx. Time:</div><div class="text-right font-black">27 Minutes</div>
                            </div>
                            <div>
                                <h4 class="font-black text-black text-lg mb-3 uppercase underline decoration-4 underline-offset-4 decoration-[#ff90e8]">What to Expect in the Simulation</h4>
                                <ul class="space-y-4">
                                    <li class="flex items-start gap-3"><i data-lucide="check-circle" class="w-6 h-6 text-black flex-shrink-0 mt-0.5 fill-[#fde047]" stroke-width="2.5"></i><span class="leading-relaxed">This is a practice environment designed to help you become familiar with the TOEIC Link Writing test interface.</span></li>
                                    <li class="flex items-start gap-3"><i data-lucide="check-circle" class="w-6 h-6 text-black flex-shrink-0 mt-0.5 fill-[#fde047]" stroke-width="2.5"></i><span class="leading-relaxed">You will experience three types of writing tasks: building sentences, writing emails, and expressing your perspective.</span></li>
                                    <li class="flex items-start gap-3"><i data-lucide="check-circle" class="w-6 h-6 text-black flex-shrink-0 mt-0.5 fill-[#fde047]" stroke-width="2.5"></i><span class="leading-relaxed">No scores will be recorded, saved, or reported to any institution.</span></li>
                                    <li class="flex items-start gap-3"><i data-lucide="check-circle" class="w-6 h-6 text-black flex-shrink-0 mt-0.5 fill-[#fde047]" stroke-width="2.5"></i><span class="leading-relaxed">Take your time to explore the interface and familiarize yourself with the tools provided.</span></li>
                                    <li class="flex items-start gap-3"><i data-lucide="check-circle" class="w-6 h-6 text-black flex-shrink-0 mt-0.5 fill-[#fde047]" stroke-width="2.5"></i><span class="leading-relaxed">If you encounter any issues, simply refresh the page to restart the simulation.</span></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="w-full md:w-1/2 p-6 md:p-10 flex flex-col justify-center items-center text-center bg-[#f4f4f0] border-t-4 md:border-t-0 border-black">
                    <div class="mb-8 flex items-center justify-center">
                        <img src="https://www.svgrepo.com/show/530651/monitor.svg" alt="Monitor Icon" class="w-40 h-40 md:w-48 md:h-48" />
                    </div>
                    <h2 class="text-3xl font-black text-black mb-4 uppercase">TOEIC Link Simulation</h2>
                    <div class="bg-[#fde047] border-4 border-black p-5 rounded-xl shadow-[4px_4px_0px_0px_#000] mb-6">
                        <p class="text-black text-sm leading-relaxed font-bold">
                            Please note that this is not a real test. This is a simulation designed to familiarize candidates with the TOEIC Link test format, interface, and task types.
                        </p>
                    </div>
                    <p class="text-black font-semibold text-sm mb-8 leading-relaxed px-4">
                        Please read all the test instructions carefully. When you are ready, check the agreement box below and click the "Proceed Now" button to enter the simulation window.
                    </p>
                    
                    <div class="w-full bg-white p-5 rounded-xl border-4 border-black shadow-[4px_4px_0px_0px_#000] mb-8 text-left">
                        <label class="flex items-start gap-4 cursor-pointer">
                            <input type="checkbox" id="agree-checkbox" class="mt-1 w-6 h-6 border-4 border-black accent-black rounded-none cursor-pointer" />
                            <span class="text-xs font-bold text-black leading-relaxed">
                                I understand that this is a simulation for practice purposes and have reviewed the instructions, navigation tools, and safety instructions to take the test.
                            </span>
                        </label>
                    </div>

                    <button id="proceed-btn" disabled class="w-full py-4 rounded-xl font-black text-xl uppercase tracking-widest transition-all bg-gray-200 text-gray-500 border-4 border-gray-400 shadow-[6px_6px_0px_0px_gray] cursor-not-allowed">
                        Proceed Now
                    </button>
                </div>
            </div>
            `;
        }

        function bindWaitingLounge() {
            const checkbox = document.getElementById('agree-checkbox');
            const btn = document.getElementById('proceed-btn');
            
            checkbox.addEventListener('change', (e) => {
                if(e.target.checked) {
                    btn.disabled = false;
                    btn.className = "w-full py-4 rounded-xl font-black text-xl uppercase tracking-widest transition-all bg-[#4ade80] text-black border-4 border-black shadow-[6px_6px_0px_0px_#000] hover:-translate-y-1 hover:shadow-[8px_8px_0px_0px_#000] active:translate-x-[4px] active:translate-y-[4px] active:shadow-none";
                } else {
                    btn.disabled = true;
                    btn.className = "w-full py-4 rounded-xl font-black text-xl uppercase tracking-widest transition-all bg-gray-200 text-gray-500 border-4 border-gray-400 shadow-[6px_6px_0px_0px_gray] cursor-not-allowed";
                }
            });

            btn.addEventListener('click', () => goToPage(2));
        }

        function bindNextButton() {
            const btn = document.getElementById('next-btn');
            if(btn) btn.addEventListener('click', () => goToPage(currentPage + 1));
        }

        function renderSimulationNotice() {
            return `
            <div class="w-full max-w-[1200px] bg-white border-4 border-black shadow-[12px_12px_0px_0px_#000] rounded-2xl overflow-hidden flex flex-col mt-10">
                <div class="p-8 md:p-14 flex-grow bg-[#c084fc]">
                    <div class="bg-white border-4 border-black rounded-xl p-8 shadow-[8px_8px_0px_0px_#000]">
                        <h2 class="text-4xl font-black text-black mb-8 text-center uppercase tracking-wide">Simulation Notice</h2>
                        <div class="space-y-6 text-black font-bold leading-relaxed text-lg">
                            <p>The following assessment is a simulation designed solely for practice and familiarization purposes. It is not an official TOEIC Link test.</p>
                            <p class="bg-[#fde047] p-4 border-4 border-black shadow-[4px_4px_0px_0px_#000] rounded-lg">
                                Your responses will not be evaluated, saved, or used for any official certification. By selecting <strong class="uppercase">Next</strong> on this screen, you understand that this platform is intended to help you experience the format, question types, and navigation of the actual test environment.
                            </p>
                        </div>
                    </div>
                </div>
                <div class="bg-white border-t-4 border-black p-6 flex justify-end">
                    <button id="next-btn" class="bg-black text-white px-8 py-3 rounded-lg border-4 border-black shadow-[6px_6px_0px_0px_#000] font-black uppercase text-lg flex items-center gap-2 hover:-translate-y-1 hover:shadow-[8px_8px_0px_0px_#000] active:translate-x-[4px] active:translate-y-[4px] active:shadow-none transition-all">
                        Next <i data-lucide="chevron-right" class="w-6 h-6 stroke-[3px]"></i>
                    </button>
                </div>
            </div>
            `;
        }

        function renderWritingTestOverview() {
            return `
            <div class="w-full max-w-[1400px] bg-white border-4 border-black shadow-[12px_12px_0px_0px_#000] rounded-2xl overflow-hidden flex flex-col mt-10">
                <div class="p-8 md:p-12 flex-grow">
                    <h2 class="text-4xl font-black text-black mb-6 text-center uppercase border-b-4 border-black pb-6 inline-block w-full">Writing Simulation Overview</h2>
                    <p class="text-lg font-bold text-black mb-10 text-center max-w-2xl mx-auto bg-[#bbf7d0] p-4 border-4 border-black shadow-[4px_4px_0px_0px_#000] rounded-xl">
                        In this writing simulation, you will practice answering 6 questions to familiarize yourself with the test format. The simulation will last approximately 27 minutes. There are three types of questions.
                    </p>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse border-4 border-black bg-white shadow-[6px_6px_0px_0px_#000] hidden md:table rounded-xl overflow-hidden">
                            <thead>
                                <tr class="bg-[#fbcfe8] text-black border-b-4 border-black">
                                    <th class="p-5 border-r-4 border-black font-black uppercase tracking-wider w-1/3 text-lg">Type of Question</th>
                                    <th class="p-5 font-black uppercase tracking-wider text-lg">Description</th>
                                </tr>
                            </thead>
                            <tbody class="font-bold text-lg">
                                <tr class="bg-white border-b-4 border-black hover:bg-[#f4f4f0] transition-colors">
                                    <td class="p-5 border-r-4 border-black">Build a Sentence</td>
                                    <td class="p-5">Create a grammatical sentence</td>
                                </tr>
                                <tr class="bg-[#fef08a] border-b-4 border-black hover:bg-[#fde047] transition-colors">
                                    <td class="p-5 border-r-4 border-black">Write an Email</td>
                                    <td class="p-5">Write an email using information provided</td>
                                </tr>
                                <tr class="bg-white hover:bg-[#f4f4f0] transition-colors">
                                    <td class="p-5 border-r-4 border-black">Write About Your Perspective</td>
                                    <td class="p-5">Participate in an online discussion</td>
                                </tr>
                            </tbody>
                        </table>
                        
                        <div class="md:hidden space-y-6">
                            <div class="border-4 border-black p-5 rounded-xl shadow-[4px_4px_0px_0px_#000] bg-white">
                                <div class="font-black text-xl uppercase mb-2 bg-black text-white inline-block px-3 py-1">Build a Sentence</div>
                                <div class="font-bold text-lg">Create a grammatical sentence</div>
                            </div>
                            <div class="border-4 border-black p-5 rounded-xl shadow-[4px_4px_0px_0px_#000] bg-[#fef08a]">
                                <div class="font-black text-xl uppercase mb-2 bg-black text-white inline-block px-3 py-1">Write an Email</div>
                                <div class="font-bold text-lg">Write an email using information provided</div>
                            </div>
                            <div class="border-4 border-black p-5 rounded-xl shadow-[4px_4px_0px_0px_#000] bg-white">
                                <div class="font-black text-xl uppercase mb-2 bg-black text-white inline-block px-3 py-1">Write About Your Perspective</div>
                                <div class="font-bold text-lg">Participate in an online discussion</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-[#e5e7eb] border-t-4 border-black p-6 flex justify-end">
                    <button id="next-btn" class="bg-[#4ade80] text-black px-8 py-3 rounded-lg border-4 border-black shadow-[6px_6px_0px_0px_#000] font-black uppercase text-lg flex items-center gap-2 hover:-translate-y-1 hover:shadow-[8px_8px_0px_0px_#000] active:translate-x-[4px] active:translate-y-[4px] active:shadow-none transition-all">
                        Next <i data-lucide="chevron-right" class="w-6 h-6 stroke-[3px]"></i>
                    </button>

        function bindDragAndDropEvents() {
            const draggables = document.querySelectorAll('.draggable-word, .draggable-slot');
            
            draggables.forEach(el => {
                // Drag Start
                el.addEventListener('dragstart', (e) => {
                    const source = e.target.getAttribute('data-source');
                    const index = parseInt(e.target.getAttribute('data-index'));
                    // Only allow dragging if there's a word
                    const word = source === 'bank' ? currentBank[index] : currentAnswers[index];
                    if(!word) { e.preventDefault(); return; }
                    e.dataTransfer.setData('application/json', JSON.stringify({ source, index }));
                });

                // Drag Over (allow drop)
                el.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if(e.currentTarget.classList.contains('draggable-slot')) {
                        e.currentTarget.classList.add('drag-over');
                    }
                });
                
                el.addEventListener('dragleave', (e) => {
                    e.currentTarget.classList.remove('drag-over');
                });

                // Drop
                el.addEventListener('drop', (e) => {
                    e.preventDefault();
                    e.currentTarget.classList.remove('drag-over');
                    const dataString = e.dataTransfer.getData('application/json');
                    if (!dataString) return;
                    
                    const { source: dragSource, index: dragIndex } = JSON.parse(dataString);
                    const dropTarget = e.currentTarget;
                    const targetSource = dropTarget.getAttribute('data-source');
                    const targetIndex = parseInt(dropTarget.getAttribute('data-index'));

                    handleDragDropLogic(dragSource, dragIndex, targetSource, targetIndex);
                });

                // Click (for click-to-move)
                el.addEventListener('click', (e) => {
                    const source = e.currentTarget.getAttribute('data-source');
                    const index = parseInt(e.currentTarget.getAttribute('data-index'));
                    handleClickLogic(source, index);
                });

                // Double Click (return to bank)
                if(el.getAttribute('data-source') === 'slot') {
                    el.addEventListener('dblclick', (e) => {
                        const index = parseInt(e.currentTarget.getAttribute('data-index'));
                        const word = currentAnswers[index];
                        if (!word) return;
                        
                        const emptyBankIndex = currentBank.findIndex(w => w === null);
                        if (emptyBankIndex !== -1) {
                            currentAnswers[index] = null;
                            currentBank[emptyBankIndex] = word;
                            selectedWord = null;
                            updateSentenceUI();
                        }
                    });
                }
            });
        }

        function handleDragDropLogic(source, sourceIndex, targetType, targetIndex) {
            if (source === 'bank' && targetType === 'slot') {
                const word = currentBank[sourceIndex];
                currentBank[sourceIndex] = null;
                
                if (currentAnswers[targetIndex]) {
                    currentBank[sourceIndex] = currentAnswers[targetIndex];
                }
                currentAnswers[targetIndex] = word;
            } else if (source === 'slot' && targetType === 'bank') {
                const word = currentAnswers[sourceIndex];
                currentAnswers[sourceIndex] = null;
                
                if (currentBank[targetIndex]) {
                    currentAnswers[sourceIndex] = currentBank[targetIndex];
                }
                currentBank[targetIndex] = word;
            } else if (source === 'slot' && targetType === 'slot') {
                const temp = currentAnswers[targetIndex];
                currentAnswers[targetIndex] = currentAnswers[sourceIndex];
                currentAnswers[sourceIndex] = temp;
            } else if (source === 'bank' && targetType === 'bank') {
                const temp = currentBank[targetIndex];
                currentBank[targetIndex] = currentBank[sourceIndex];
                currentBank[sourceIndex] = temp;
            }
            updateSentenceUI();
        }

        function handleClickLogic(source, index) {
            const isBank = source === 'bank';
            const word = isBank ? currentBank[index] : currentAnswers[index];

            if (isBank) {
                if (!word) return;
                if (selectedWord) {
                    selectedWord = null; 
                } else {
                    selectedWord = { source: 'bank', index };
                }
            } else {
                // Clicking a slot
                if (selectedWord && selectedWord.source === 'bank') {
                    const bankWord = currentBank[selectedWord.index];
                    currentBank[selectedWord.index] = currentAnswers[index]; // Swap if full
                    currentAnswers[index] = bankWord;
                    selectedWord = null;
                } else if (!selectedWord && word) {
                    selectedWord = { source: 'slot', index };
                } else if (selectedWord && selectedWord.source === 'slot') {
                    const temp = currentAnswers[index];
                    currentAnswers[index] = currentAnswers[selectedWord.index];
                    currentAnswers[selectedWord.index] = temp;
                    selectedWord = null;
                }
            }
            updateSentenceUI();
        }

                                    <div class="w-12 h-12 bg-[#ff5252] rounded-full flex items-center justify-center text-white font-black text-xl border-4 border-black shadow-[2px_2px_0px_0px_#000]">M</div>
                                    <div class="font-black text-black text-xl uppercase">Maya</div>
                                </div>
                                <p class="text-black font-bold leading-relaxed text-lg">I believe instant messaging applications led to the most change. I recently attended a workshop where leaders argued that without immediate team messaging, projects would move much slower. Even though email is an older technology, instant messaging provides real-time problem solving. Teamwork as we know it would be vastly less efficient if we had not adopted these apps.</p>
                            </div>

                    <!-- Right Panel - Editor -->

                        <div class="p-4 bg-[#ff90e8] border-b-4 border-black font-black text-black uppercase tracking-widest text-lg">Your Response:</div>

                        <div class="flex flex-wrap items-center justify-between p-4 bg-[#bae6fd] border-b-4 border-black gap-4">
                            <div class="flex gap-2">
                                ${['copy', 'scissors', 'clipboard', 'undo', 'redo'].map(icon => `
                                    <button class="p-3 bg-white border-4 border-black rounded-lg text-black shadow-[2px_2px_0px_0px_#000] hover:-translate-y-1 hover:shadow-[4px_4px_0px_0px_#000] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all">
                                        <i data-lucide="${icon}" class="w-5 h-5 stroke-[3px]"></i>

            const textarea = document.getElementById('perspective-textarea');
            textarea.value = responses[qNum];
            isWordCountHidden = false;

            function updateWordCountDisplay() {
                const text = textarea.value;
                const wc = text.trim() ? text.trim().split(/\s+/).filter(w => w.length > 0).length : 0;
                const btn = document.getElementById('toggle-word-count-btn');
                const display = document.getElementById('word-count-display');
                
                if (isWordCountHidden) {
                    display.innerText = "Show Word Count";
                    document.getElementById('word-count-icon').setAttribute('data-lucide', 'eye-off');
                    btn.className = "flex items-center gap-2 font-black uppercase text-sm tracking-wider border-4 border-black shadow-[4px_4px_0px_0px_#000] px-4 py-3 rounded-lg hover:-translate-y-1 hover:shadow-[6px_6px_0px_0px_#000] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all bg-white text-black";

                    display.innerText = `Word Count: ${wc} (min 100)`;
                    document.getElementById('word-count-icon').setAttribute('data-lucide', 'eye');
                    if(wc >= 100) {
                        btn.className = "flex items-center gap-2 font-black uppercase text-sm tracking-wider border-4 border-black shadow-[4px_4px_0px_0px_#000] px-4 py-3 rounded-lg hover:-translate-y-1 hover:shadow-[6px_6px_0px_0px_#000] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all bg-[#4ade80] text-black";

            updateWordCountDisplay();

            textarea.addEventListener('input', (e) => {
                responses[qNum] = e.target.value;
                updateWordCountDisplay();
            });

            document.getElementById('toggle-word-count-btn').addEventListener('click', () => {
                isWordCountHidden = !isWordCountHidden;
                updateWordCountDisplay();
            });

            startTimer(10 * 60, () => goToPage(currentPage + 1));
            document.getElementById('submit-perspective-btn').addEventListener('click', () => handleSubmit(qNum, null));
        }

        // --- END OF TEST & REVIEW ---
        function renderEndTest() {

        function getSentenceUserAnswer(qNum) {
            const arr = responses[qNum] || [];
            if(arr.length === 0 || arr.every(x => x === null)) return "No response provided.";
            const joined = arr.map(w => w || "___").join(" ");
            return `${answerKeys[qNum].starter} ${joined}${answerKeys[qNum].end}`;
        }

        function renderReviewAnswers() {
            let sentencesHTML = [1, 2, 3].map(qNum => `
                <div class="bg-white p-6 rounded-xl border-4 border-black shadow-[6px_6px_0px_0px_#000]">
                    <div class="font-black text-white bg-black inline-block px-3 py-1 border-2 border-black uppercase text-base mb-4 shadow-[2px_2px_0px_0px_#000]">QUESTION ${qNum}</div>
                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <h4 class="text-base font-black text-black mb-3 uppercase tracking-wider bg-[#fbcfe8] border-2 border-black inline-block px-3 py-1 shadow-[2px_2px_0px_0px_#000]">Your Answer</h4>
                            <p class="p-4 rounded-xl border-4 border-black text-lg font-bold shadow-[4px_4px_0px_0px_#000] ${responses[qNum].includes(null) || responses[qNum].length === 0 ? 'bg-[#ff5252] text-white' : 'bg-[#fde047] text-black'}">
                                ${getSentenceUserAnswer(qNum)}
                            </p>
                        </div>
                        <div>
                            <h4 class="text-base font-black text-black mb-3 uppercase tracking-wider bg-[#bbf7d0] border-2 border-black inline-block px-3 py-1 shadow-[2px_2px_0px_0px_#000]">Answer Key</h4>
                            <p class="p-4 rounded-xl border-4 border-black text-lg bg-[#4ade80] text-black font-black shadow-[4px_4px_0px_0px_#000]">
                                ${answerKeys[qNum].correct}
                            </p>
                        </div>
                    </div>
                </div>
            `).join('');

            let emailsHTML = [4, 5].map(qNum => `
                <div class="bg-white p-6 rounded-xl border-4 border-black shadow-[6px_6px_0px_0px_#000]">
                    <div class="font-black text-white bg-black inline-block px-3 py-1 border-2 border-black uppercase text-base mb-4 shadow-[2px_2px_0px_0px_#000]">QUESTION ${qNum}</div>
                    <div class="grid lg:grid-cols-2 gap-6">
                        <div>
                            <h4 class="text-base font-black text-black mb-3 uppercase tracking-wider bg-[#fbcfe8] border-2 border-black inline-block px-3 py-1 shadow-[2px_2px_0px_0px_#000]">Your Answer</h4>
                            <div class="p-4 rounded-xl border-4 border-black text-base font-bold shadow-[4px_4px_0px_0px_#000] whitespace-pre-wrap min-h-[250px] ${!responses[qNum] ? 'bg-[#ff5252] text-white' : 'bg-[#fde047] text-black'}">${responses[qNum] || '<span class="uppercase tracking-widest text-black/50">No response provided.</span>'}</div>
                        </div>
                        <div>
                            <h4 class="text-base font-black text-black mb-3 uppercase tracking-wider bg-[#bbf7d0] border-2 border-black inline-block px-3 py-1 shadow-[2px_2px_0px_0px_#000]">Model Answer</h4>
                            <div class="p-4 rounded-xl border-4 border-black text-base bg-[#4ade80] text-black font-bold shadow-[4px_4px_0px_0px_#000] whitespace-pre-wrap min-h-[250px] leading-relaxed">${answerKeys[qNum]}</div>
                        </div>
                    </div>
                </div>
            `).join('');

            return `
            <div class="w-full max-w-[1600px] bg-[#f4f4f0] border-4 border-black shadow-[12px_12px_0px_0px_#000] rounded-2xl overflow-hidden flex flex-col mt-6 mb-12">
                
                <div class="p-8 md:p-14 border-b-4 border-black bg-[#c084fc]" data-html2canvas-ignore="true">
                    <h2 class="text-5xl font-black text-black mb-6 flex items-center gap-4 uppercase tracking-tighter bg-white border-4 border-black p-4 shadow-[6px_6px_0px_0px_#000] inline-flex -rotate-1">
                        <i data-lucide="book-open" class="w-10 h-10 text-black" stroke-width="3"></i> Simulation Review
                    </h2>
                    <br>
                    <p class="text-black text-xl font-bold bg-[#fde047] border-4 border-black p-4 rounded-xl shadow-[4px_4px_0px_0px_#000] inline-block mt-4">
                        Review your responses alongside the suggested model answers.
                    </p>
                </div>

                <!-- Input & Download Controls -->
                <div class="bg-white p-6 md:p-10 border-b-4 border-black flex flex-col xl:flex-row gap-6 items-start xl:items-center justify-between" data-html2canvas-ignore="true">
                    <div class="flex-grow flex flex-col sm:flex-row items-start sm:items-center gap-4 w-full xl:w-auto">
                        <label class="font-black text-2xl uppercase tracking-wider whitespace-nowrap">Your Name:</label>
                        <input type="text" id="student-name-input" class="flex-grow w-full border-4 border-black p-4 text-xl font-bold shadow-[4px_4px_0px_0px_#000] focus:translate-x-[2px] focus:translate-y-[2px] focus:shadow-[2px_2px_0px_0px_#000] outline-none transition-all bg-[#fffbea]" placeholder="Enter your name to download results...">
                    </div>
                    <button id="download-pdf-btn" class="bg-[#4ade80] text-black px-10 py-5 rounded-xl border-4 border-black shadow-[6px_6px_0px_0px_#000] font-black uppercase text-xl flex items-center justify-center gap-3 hover:-translate-y-1 hover:shadow-[8px_8px_0px_0px_#000] active:translate-x-[4px] active:translate-y-[4px] active:shadow-none transition-all w-full xl:w-auto">
                        Download PDF <i data-lucide="download" class="w-6 h-6 stroke-[3px]"></i>
                    </button>
                </div>
                
                <!-- Content captured by html2canvas -->
                <div id="pdf-capture-area" class="bg-white w-full">

                    <!-- PAGE 1: Header + Part 1 -->
                    <div id="pdf-part-1" class="flex flex-col bg-white">
                        <div id="pdf-header" class="hidden bg-[#c084fc] p-8 border-b-4 border-black flex flex-col gap-4">
                            <h2 class="text-4xl font-black text-black uppercase tracking-tighter bg-white border-4 border-black p-4 shadow-[6px_6px_0px_0px_#000] inline-flex w-max">
                                TOEIC Link Simulation
                            </h2>
                            <div id="pdf-student-name" class="text-2xl font-black text-black bg-[#fde047] border-4 border-black p-3 px-6 rounded-xl shadow-[4px_4px_0px_0px_#000] inline-block w-max">
                                Candidate: 
                            </div>
                        </div>

                        <div class="p-6 md:p-12">
                            <section class="bg-[#f4f4f0] p-6 border-4 border-black rounded-2xl shadow-[8px_8px_0px_0px_#000]">
                                <h3 class="text-2xl font-black text-black mb-8 pb-4 border-b-4 border-black uppercase tracking-wider inline-block">Part 1: Build a Sentence</h3>
                                <div class="space-y-8">${sentencesHTML}</div>
                            </section>
                        </div>
                    </div>

                    <!-- PAGE 2: Part 2 -->
                    <div id="pdf-part-2" class="flex flex-col bg-white">
                        <div class="p-6 md:p-12">

                                        <div>
                                            <h4 class="text-base font-black text-black mb-3 uppercase tracking-wider bg-[#fbcfe8] border-2 border-black inline-block px-3 py-1 shadow-[2px_2px_0px_0px_#000]">Your Answer</h4>
                                            <div class="p-4 rounded-xl border-4 border-black text-base font-bold shadow-[4px_4px_0px_0px_#000] whitespace-pre-wrap min-h-[350px] ${!responses[6] ? 'bg-[#ff5252] text-white' : 'bg-[#fde047] text-black'}">${responses[6] || '<span class="uppercase tracking-widest text-black/50">No response provided.</span>'}</div>
                                        </div>
                                        <div>
                                            <h4 class="text-base font-black text-black mb-3 uppercase tracking-wider bg-[#bbf7d0] border-2 border-black inline-block px-3 py-1 shadow-[2px_2px_0px_0px_#000]">Model Answer</h4>
                                            <div class="p-4 rounded-xl border-4 border-black text-base bg-[#4ade80] text-black font-bold shadow-[4px_4px_0px_0px_#000] whitespace-pre-wrap min-h-[350px] leading-relaxed">${answerKeys[6]}</div>
                                        </div>
                                    </div>
                                </div>
                            </section>
                        </div>
                    </div>

                </div>
            </div>
            `;
        }

        // --- PDF GENERATION LOGIC ---
        function bindReviewAnswers() {
            const downloadBtn = document.getElementById('download-pdf-btn');
            
            if (downloadBtn) {
                downloadBtn.addEventListener('click', async () => {
                    const nameInput = document.getElementById('student-name-input').value.trim();
                    const nameDisplay = document.getElementById('pdf-student-name');
                    const pdfHeader = document.getElementById('pdf-header');

                    if (nameInput) {
                        nameDisplay.innerText = `Candidate: ${nameInput}`;
                    } else {
                        nameDisplay.innerText = `Candidate: Guest`;
                    }
                    
                    pdfHeader.classList.remove('hidden');

                    const captureArea = document.getElementById('pdf-capture-area');
                    
                    // Set a fixed width to ensure high-quality render and consistent flow before forcing it to A4
                    const originalWidth = captureArea.style.width;
                    captureArea.style.width = '1200px';

                    const originalText = downloadBtn.innerHTML;
                    downloadBtn.innerHTML = 'GENERATING... <i data-lucide="loader-2" class="w-6 h-6 stroke-[3px] animate-spin"></i>';
                    lucide.createIcons();

                    // Wait a moment for DOM to reflow with the new width and visible header
                    await new Promise(r => setTimeout(r, 200));

                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    const pdfWidth = 210;
                    const pdfHeight = 297;
                    
                    const parts = ['pdf-part-1', 'pdf-part-2', 'pdf-part-3'];

                    for (let i = 0; i < parts.length; i++) {
                        if (i > 0) pdf.addPage();
                        
                        const el = document.getElementById(parts[i]);
                        const canvas = await window.html2canvas(el, { 
                            scale: 2, 
                            useCORS: true,
                            backgroundColor: '#ffffff'
                        });
                        
                        const imgData = canvas.toDataURL('image/jpeg', 0.98);
                        const imgProps = pdf.getImageProperties(imgData);
                        
                        // Calculate aspect ratio height
                        const imgHeight = (imgProps.height * pdfWidth) / imgProps.width;
                        
                        if (imgHeight > pdfHeight) {
                            // If content is taller than A4, scale it down to fit height-wise (perfectly on page)
                            const scaledWidth = (pdfHeight * imgProps.width) / imgProps.height;
                            const xOffset = (pdfWidth - scaledWidth) / 2; // center horizontally
                            pdf.addImage(imgData, 'JPEG', xOffset, 0, scaledWidth, pdfHeight);
                        } else {
                            // If content fits normally, scale full width with 0 margin, and let height fall where it may
                            pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, imgHeight);
                        }
                    }

                    const filename = nameInput ? `TOEIC_Link_Review_${nameInput.replace(/\s+/g, '_')}.pdf` : 'TOEIC_Link_Review.pdf';
                    pdf.save(filename);

                    // Restore UI
                    captureArea.style.width = originalWidth;
                    downloadBtn.innerHTML = originalText;
                    lucide.createIcons();
                    pdfHeader.classList.add('hidden');
                });
            }
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            goToPage(1); // Start at the first page
        });
    </script>
