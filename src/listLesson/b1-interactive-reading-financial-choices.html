<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B1 Interactive Reading - Smart Financial Choices</title>
    
    <!-- Tailwind CSS for flawless styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts for Graphic Novel Aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Vibrant Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        comic: ['Bangers', 'cursive'],
                    },
                    boxShadow: {
                        'comic': '6px 6px 0px 0px #0f172a',
                        'comic-hover': '8px 8px 0px 0px #0f172a',
                        'comic-sm': '3px 3px 0px 0px #0f172a',
                        'comic-pressed': '0px 0px 0px 0px #0f172a',
                    }
                }
            }
        }
    </script>

    <style>
        /* Halftone Comic Background */
        body {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
            background-size: 24px 24px;
            overflow-x: hidden;
        }

        /* Tactile Button Mechanics */
        .comic-btn {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translate(0px, 0px);
        }
        .comic-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px 0px #0f172a !important;
        }
        .comic-btn:active {
            transform: translate(6px, 6px);
            box-shadow: 0px 0px 0px 0px #0f172a !important;
        }

        /* Staggered Pop-In Animation */
        .animate-pop {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.95) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Page Transition */
        #app-container {
            transition: opacity 0.3s ease-out, transform 0.3s ease-out;
        }
        .fade-out-active {
            opacity: 0 !important;
            transform: scale(0.98) translateY(10px) !important;
        }

        /* Progress Bar Animation */
        .progress-fill {
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="text-slate-900 font-sans p-4 sm:p-6 lg:p-8 min-h-screen flex flex-col">

    <div class="max-w-4xl mx-auto flex-grow w-full" id="app-container">
        <!-- Content will be injected here by JavaScript -->
    </div>

    <!-- Footer -->
    <footer class="mt-16 mb-4 text-center animate-pop" style="animation-delay: 1s;">
        <p class="font-extrabold text-slate-500 text-sm sm:text-base uppercase tracking-widest">
            Designed by <a href="https://fajarudinakbar.online" target="_blank" rel="noopener noreferrer" class="text-indigo-600 hover:text-indigo-800 hover:bg-indigo-100 px-3 py-1 rounded-md border-2 border-transparent hover:border-indigo-600 transition-all font-black border-b-4 border-b-indigo-600">fajarudinakbar.online</a>
        </p>
    </footer>

    <script>
        // --- DATA STRUCTURES ---
        const readingPanels = [
            { text: "Money management is a very important skill for adults. Many people earn a good salary but still struggle with massive debt.", icon: "fa-solid fa-coins", bg: "bg-sky-100", color: "text-sky-600" },
            { text: "The first step is creating a budget. A budget helps you track your income and your expenses every single month.", icon: "fa-solid fa-file-invoice-dollar", bg: "bg-emerald-100", color: "text-emerald-600" },
            { text: "A popular strategy is the fifty thirty twenty rule. You spend fifty percent on needs, thirty percent on wants, and twenty percent on savings.", icon: "fa-solid fa-chart-pie", bg: "bg-amber-100", color: "text-amber-600" },
            { text: "Emergency funds are also critical. You should save enough money to cover three to six months of basic living costs.", icon: "fa-solid fa-piggy-bank", bg: "bg-rose-100", color: "text-rose-600" },
            { text: "Impulsive buying is the biggest enemy of saving. Online shopping makes it too easy to buy things you do not actually need.", icon: "fa-solid fa-cart-shopping", bg: "bg-purple-100", color: "text-purple-600" },
            { text: "Credit cards can be dangerous. If you do not pay the full balance every month, the interest charges will destroy your budget.", icon: "fa-solid fa-credit-card", bg: "bg-indigo-100", color: "text-indigo-600" },
            { text: "Investing your money helps it grow over time. However, you should never invest in things you do not completely understand.", icon: "fa-solid fa-arrow-trend-up", bg: "bg-yellow-200", color: "text-yellow-700" },
            { text: "Financial freedom is not about being rich. It is about having control over your money and feeling secure about your future.", icon: "fa-solid fa-shield-halved", bg: "bg-emerald-100", color: "text-emerald-700" }
        ];

        const storyNodes = {
            start: {
                chapter: 1, title: "The First Salary",
                panels: [
                    { type: "narration", text: "You are Maya. You just received your very first professional salary.", icon: "fa-solid fa-wallet", color: "text-emerald-600", bg: "bg-emerald-100" },
                    { type: "action", text: "You look at your bank account. The number is larger than you have ever seen before.", icon: "fa-solid fa-building-columns", color: "text-blue-600", bg: "bg-blue-100" },
                    { type: "thought", text: "I feel so rich right now. I want to buy everything I have ever wanted.", icon: "fa-solid fa-face-smile-beam", color: "text-amber-600", bg: "bg-amber-100" }
                ],
                choices: [
                    { text: "Create a strict monthly budget before spending a single coin.", next: "step2_temptation", btnClass: "bg-white text-slate-900" },
                    { text: "Go straight to the shopping mall to celebrate your new wealth.", next: "step2_temptation", btnClass: "bg-white text-slate-900" }
                ]
            },
            step2_temptation: {
                chapter: 2, title: "The Mall Temptation",
                panels: [
                    { type: "narration", text: "You walk past a luxury clothing store. You see a beautiful designer jacket in the window.", icon: "fa-solid fa-store", color: "text-purple-600", bg: "bg-purple-100" },
                    { type: "action", text: "The jacket costs exactly half of your entire monthly salary.", icon: "fa-solid fa-tag", color: "text-rose-600", bg: "bg-rose-100" },
                    { type: "thought", text: "I really want it. I could just use my credit card and pay the money back later.", icon: "fa-solid fa-credit-card", color: "text-sky-600", bg: "bg-sky-100" }
                ],
                choices: [
                    { text: "Walk away from the store and keep your money safe in the bank.", next: "step3_pressure", btnClass: "bg-white text-slate-900" },
                    { text: "Use your credit card to buy the jacket because you deserve a reward.", next: "step3_pressure", btnClass: "bg-white text-slate-900" }
                ]
            },
            step3_pressure: {
                chapter: 3, title: "The Social Pressure",
                panels: [
                    { type: "action", text: "Your friends invite you to a very expensive weekend holiday at a luxury resort.", icon: "fa-solid fa-plane-departure", color: "text-blue-600", bg: "bg-blue-100" },
                    { type: "dialogue", speaker: "Friend", text: "You just got paid! You have to come with us. It will be the best trip ever.", icon: "fa-solid fa-user-group", color: "text-amber-600", bg: "bg-amber-100" },
                    { type: "thought", text: "I cannot afford this trip unless I borrow money from my parents.", icon: "fa-solid fa-scale-unbalanced", color: "text-red-600", bg: "bg-red-100" }
                ],
                choices: [
                    { text: "Tell your friends the truth and respectfully decline the invitation.", next: "step4_emergency", btnClass: "bg-white text-slate-900" },
                    { text: "Borrow money to go on the trip so you do not feel left out.", next: "step4_emergency", btnClass: "bg-white text-slate-900" }
                ]
            },
            step4_emergency: {
                chapter: 4, title: "The Sudden Emergency",
                panels: [
                    { type: "action", text: "On Monday morning, your motorcycle suddenly breaks down on the way to work.", icon: "fa-solid fa-motorcycle", color: "text-slate-700", bg: "bg-slate-200" },
                    { type: "system", text: "MECHANIC REPORT.\nEngine failure detected.\nRepair cost is very high.", icon: "fa-solid fa-wrench", color: "text-rose-700", bg: "bg-rose-100" },
                    { type: "thought", text: "This is a disaster. I need my motorcycle to go to the office every day.", icon: "fa-solid fa-triangle-exclamation", color: "text-orange-600", bg: "bg-orange-100" }
                ],
                choices: [
                    { text: "Pay for the repair using the emergency fund you saved earlier.", next: "step5_scam", btnClass: "bg-white text-slate-900" },
                    { text: "Ignore the repair and take an expensive taxi to work every single day.", next: "step5_scam", btnClass: "bg-white text-slate-900" }
                ]
            },
            step5_scam: {
                chapter: 5, title: "The Secret Investment",
                panels: [
                    { type: "narration", text: "A coworker approaches you during your lunch break. He looks very excited.", icon: "fa-solid fa-user-tie", color: "text-indigo-600", bg: "bg-indigo-100" },
                    { type: "dialogue", speaker: "Coworker", text: "I found a secret digital investment. If you give me your money, it will double in three days!", icon: "fa-solid fa-chart-line", color: "text-emerald-600", bg: "bg-emerald-100" },
                    { type: "thought", text: "Doubling my money sounds amazing, but this feels extremely suspicious.", icon: "fa-solid fa-circle-question", color: "text-purple-600", bg: "bg-purple-100" }
                ],
                choices: [
                    { text: "Refuse the offer because it sounds exactly like a financial scam.", next: "step6_sale", btnClass: "bg-white text-slate-900" },
                    { text: "Give the coworker your money because you want to get rich quickly.", next: "step6_sale", btnClass: "bg-white text-slate-900" }
                ]
            },
            step6_sale: {
                chapter: 6, title: "The Midnight Sale",
                panels: [
                    { type: "action", text: "It is midnight. Your phone buzzes with a notification from a shopping application.", icon: "fa-solid fa-mobile-screen", color: "text-sky-600", bg: "bg-sky-100" },
                    { type: "system", text: "FLASH SALE.\nEverything is seventy percent off.\nThe sale ends in one hour.", icon: "fa-solid fa-bolt", color: "text-yellow-600", bg: "bg-yellow-100" },
                    { type: "thought", text: "I do not actually need anything, but these prices are incredibly low.", icon: "fa-solid fa-cart-shopping", color: "text-rose-600", bg: "bg-rose-100" }
                ],
                choices: [
                    { text: "Close the application, turn off your phone, and go to sleep.", next: "step7_review", btnClass: "bg-white text-slate-900" },
                    { text: "Stay awake and buy a lot of cheap items you will probably never use.", next: "step7_review", btnClass: "bg-white text-slate-900" }
                ]
            },
            step7_review: {
                chapter: 7, title: "The Monthly Review",
                panels: [
                    { type: "narration", text: "The month is finally over. It is time to check your financial health.", icon: "fa-solid fa-calendar-check", color: "text-blue-600", bg: "bg-blue-100" },
                    { type: "action", text: "You open your banking application to look at your final balance.", icon: "fa-solid fa-building-columns", color: "text-emerald-700", bg: "bg-emerald-100" },
                    { type: "thought", text: "Every choice I made this month led me exactly to this moment.", icon: "fa-solid fa-brain", color: "text-purple-600", bg: "bg-purple-100" }
                ],
                choices: [
                    { text: "Promise to continue building your savings and learning about personal finance.", next: "ending_success", btnClass: "bg-white text-slate-900" },
                    { text: "Decide that budgeting is too boring and plan to spend all your money tomorrow.", next: "ending_failure", btnClass: "bg-white text-slate-900" }
                ]
            },
            ending_success: {
                chapter: "END", title: "Financial Freedom",
                panels: [
                    { type: "action", text: "You look at your growing savings account with massive pride.", icon: "fa-solid fa-piggy-bank", color: "text-emerald-600", bg: "bg-emerald-100" },
                    { type: "narration", text: "You survived the temptations. You have an emergency fund and zero bad debt.", icon: "fa-solid fa-shield-halved", color: "text-blue-600", bg: "bg-blue-100" },
                    { type: "dialogue", speaker: "You", text: "Financial freedom is a marathon, not a sprint. I am building a secure future.", icon: "fa-solid fa-star", color: "text-amber-600", bg: "bg-amber-100" }
                ],
                isEnding: true,
                softSkill: "Delayed Gratification and Discipline",
                analysis: "You chose to save money instead of buying things immediately. How does delayed gratification reduce your stress in the long term?"
            },
            ending_failure: {
                chapter: "END", title: "The Debt Trap",
                panels: [
                    { type: "action", text: "Your bank account is completely empty, and your credit card bill is massive.", icon: "fa-solid fa-receipt", color: "text-rose-600", bg: "bg-rose-100" },
                    { type: "narration", text: "You fell for every temptation. Now you have to work extra hours just to pay off your debt.", icon: "fa-solid fa-battery-empty", color: "text-purple-600", bg: "bg-purple-100" },
                    { type: "system", text: "CRITICAL ALERT.\nInsufficient funds.\nLate fees have been applied.", icon: "fa-solid fa-triangle-exclamation", color: "text-red-600", bg: "bg-red-100" }
                ],
                isEnding: true,
                softSkill: "Impulsive Spending and Debt",
                analysis: "Giving in to social pressure and flash sales ruined your budget. Why is it so difficult to control our spending emotions?"
            }
        };

        let state = {
            stage: 'reading',
            currentNode: 'start'
        };

        // --- TEXT TO SPEECH (TTS) INTEGRATION ---
        let availableVoices = [];
        let currentUtterance = null;
        let activeSpeakerBtn = null;

        function loadVoices() {
            availableVoices = window.speechSynthesis.getVoices();
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices(); 

        function toggleSpeech(btnElement, textToSpeak) {
            if (window.speechSynthesis.speaking && activeSpeakerBtn === btnElement) {
                window.speechSynthesis.cancel();
                resetSpeakerButton();
                return;
            }

            window.speechSynthesis.cancel();
            resetSpeakerButton();

            if (!textToSpeak) return;

            currentUtterance = new SpeechSynthesisUtterance(textToSpeak);
            
            if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();

            let selectedVoice = availableVoices.find(v => v.name.includes('Natural') && v.lang.startsWith('en'));
            if (!selectedVoice) selectedVoice = availableVoices.find(v => v.name.includes('Google') && v.lang.startsWith('en'));
            if (!selectedVoice) selectedVoice = availableVoices.find(v => v.lang.startsWith('en'));

            if (selectedVoice) {
                currentUtterance.voice = selectedVoice;
            }

            currentUtterance.rate = 0.9;
            currentUtterance.pitch = 1.0;

            activeSpeakerBtn = btnElement;
            const icon = btnElement.querySelector('i');
            icon.classList.remove('fa-volume-high', 'text-slate-500');
            icon.classList.add('fa-stop', 'text-rose-600');
            btnElement.classList.add('bg-rose-100', 'border-rose-600');
            btnElement.classList.remove('bg-white', 'border-slate-300');

            currentUtterance.onend = resetSpeakerButton;
            currentUtterance.onerror = resetSpeakerButton;

            window.speechSynthesis.speak(currentUtterance);
        }

        function resetSpeakerButton() {
            if (activeSpeakerBtn) {
                const icon = activeSpeakerBtn.querySelector('i');
                if (icon) {
                    icon.classList.remove('fa-stop', 'text-rose-600');
                    icon.classList.add('fa-volume-high', 'text-slate-500');
                }
                activeSpeakerBtn.classList.remove('bg-rose-100', 'border-rose-600');
                activeSpeakerBtn.classList.add('bg-white', 'border-slate-300');
                activeSpeakerBtn = null;
            }
        }

        function stopAllAudio() {
            window.speechSynthesis.cancel();
            resetSpeakerButton();
        }

        // --- RENDER FUNCTIONS ---
        function render() {
            const container = document.getElementById('app-container');
            container.innerHTML = ''; 

            const header = document.createElement('header');
            header.className = 'mb-12 text-center animate-pop';
            header.innerHTML = `
                <h1 class="font-comic text-6xl md:text-7xl text-slate-900 mb-3 tracking-wider uppercase" style="text-shadow: 3px 3px 0 #cbd5e1;">Smart Financial Choices</h1>
                <div class="inline-block bg-slate-900 text-white font-extrabold text-sm md:text-lg uppercase tracking-widest px-6 py-2 rounded-full shadow-comic-sm transform -rotate-1">
                    A B1 Level Interactive Lesson
                </div>
            `;
            container.appendChild(header);

            if (state.stage === 'reading') container.appendChild(renderReading());
            else if (state.stage === 'story') container.appendChild(renderStory());
            else if (state.stage === 'reflection') container.appendChild(renderReflection());
        }

        function renderReading() {
            const div = document.createElement('div');
            
            let panelsHTML = '<div class="flex flex-col space-y-8 mb-16">';
            readingPanels.forEach((panel, index) => {
                const delay = index * 150; 
                panelsHTML += `
                    <div class="animate-pop relative bg-white border-4 border-slate-900 rounded-2xl shadow-comic p-6 sm:p-8 flex flex-col sm:flex-row items-center sm:items-start gap-6 hover:-translate-y-1 hover:shadow-[8px_8px_0px_0px_#0f172a] transition-transform duration-300" style="animation-delay: ${delay}ms;">
                        
                        <button onclick="toggleSpeech(this, \`${panel.text.replace(/"/g, '&quot;')}\`)" class="absolute top-4 right-4 bg-white border-2 border-slate-300 rounded-full w-10 h-10 flex items-center justify-center shadow-sm hover:-translate-y-1 hover:shadow-md transition-all z-20 group" aria-label="Read Aloud">
                            <i class="fa-solid fa-volume-high text-slate-500 group-hover:text-indigo-600 transition-colors"></i>
                        </button>

                        <div class="absolute -top-5 -left-4 sm:-left-6 bg-amber-400 border-4 border-slate-900 rounded-full w-14 h-14 flex items-center justify-center font-comic text-3xl text-slate-900 z-10 transform -rotate-6 shadow-comic-sm">
                            ${index + 1}
                        </div>
                        <div class="flex-shrink-0 border-4 border-slate-900 rounded-full w-24 h-24 flex items-center justify-center transform -rotate-3 shadow-comic-sm ${panel.bg}">
                            <i class="${panel.icon} text-5xl ${panel.color}"></i>
                        </div>
                        <div class="flex-grow text-center sm:text-left mt-2 sm:mt-0 flex items-center pr-8 sm:pr-12">
                            <p class="font-extrabold text-xl sm:text-2xl leading-relaxed text-slate-800 text-left">${panel.text}</p>
                        </div>
                    </div>
                `;
            });
            panelsHTML += '</div>';

            div.innerHTML = `
                <div class="flex justify-center items-center space-x-4 mb-12 animate-pop" style="animation-delay: 0ms;">
                    <i class="fa-solid fa-book-open-reader text-5xl text-indigo-600 transform -rotate-6"></i>
                    <h2 class="font-comic text-5xl text-slate-900 tracking-wide uppercase">Prologue</h2>
                </div>
                
                ${panelsHTML}

                <div class="animate-pop bg-indigo-600 rounded-3xl p-8 sm:p-12 border-4 border-slate-900 shadow-comic mt-12 relative overflow-hidden group" style="animation-delay: ${readingPanels.length * 150}ms;">
                    <div class="absolute -right-10 -bottom-10 opacity-20 transform group-hover:rotate-12 group-hover:scale-110 transition-all duration-700">
                        <i class="fa-solid fa-piggy-bank text-9xl text-white"></i>
                    </div>
                    <div class="relative z-10 text-center sm:text-left">
                        <h4 class="font-comic text-4xl text-white mb-4 tracking-wide uppercase">Start Your Financial Journey</h4>
                        <p class="text-indigo-100 mb-8 font-bold text-xl sm:text-2xl max-w-2xl text-left">
                            You have read the facts. Now, you must make the difficult choices. This scenario has 7 chapters. Can you survive the month without going into debt?
                        </p>
                        <button onclick="startGame()" class="comic-btn inline-flex bg-amber-400 text-slate-900 px-8 py-5 rounded-xl font-black text-2xl hover:bg-amber-300 items-center justify-center space-x-4 border-4 border-slate-900 shadow-comic w-full sm:w-auto cursor-pointer">
                            <span>ENTER CHAPTER 1</span>
                            <i class="fa-solid fa-arrow-right transform group-hover:translate-x-2 transition-transform"></i>
                        </button>
                    </div>
                </div>
            `;
            return div;
        }

        function renderStory() {
            const node = storyNodes[state.currentNode];
            const div = document.createElement('div');
            
            const isEnding = node.chapter === 'END';
            const progressPercent = isEnding ? 100 : Math.round(((node.chapter - 1) / 7) * 100);

            const progressBar = `
                <div class="animate-pop w-full bg-white border-4 border-slate-900 rounded-full h-8 mb-10 shadow-comic-sm overflow-hidden relative" style="animation-delay: 0ms;">
                    <div class="progress-fill bg-emerald-400 h-full border-r-4 border-slate-900 flex items-center justify-end px-3" style="width: ${progressPercent}%">
                        ${progressPercent > 10 ? `<i class="fa-solid fa-coins text-slate-900"></i>` : ''}
                    </div>
                </div>
            `;

            let html = progressBar + `
                <div class="animate-pop bg-white rounded-3xl shadow-comic p-6 sm:p-10 border-4 border-slate-900" style="animation-delay: 150ms;">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-10 pb-6 border-b-4 border-slate-200 gap-4">
                        <h2 class="font-comic text-5xl text-slate-900 tracking-widest uppercase">${node.title}</h2>
                        <span class="text-lg font-black text-slate-900 bg-amber-400 px-5 py-2 border-4 border-slate-900 rounded-xl uppercase transform rotate-2 shadow-comic-sm">
                            ${isEnding ? 'CONCLUSION' : `CHAPTER ${node.chapter} OF 7`}
                        </span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">
            `;

            node.panels.forEach((panel, index) => {
                const isFullWidth = index % 3 === 0;
                const delay = 300 + (index * 150);
                
                let content = "";
                if (panel.type === "dialogue") {
                    content = `
                        <div class="flex items-end space-x-4 w-full mt-2">
                            <i class="${panel.icon} text-6xl ${panel.color} drop-shadow-md"></i>
                            <div class="bg-white border-4 border-slate-900 rounded-[2rem] rounded-bl-none p-5 relative shadow-comic-sm flex-grow">
                                <p class="font-black text-slate-900 text-xl leading-snug text-left">"${panel.text}"</p>
                            </div>
                        </div>
                    `;
                } else if (panel.type === "system") {
                    content = `
                        <div class="flex items-center space-x-6 mt-2">
                            <div class="bg-white p-3 rounded-full border-4 border-slate-900 shadow-comic-sm">
                                <i class="${panel.icon} ${panel.color} text-4xl animate-pulse"></i>
                            </div>
                            <p class="font-mono text-lg font-black whitespace-pre-line leading-relaxed text-slate-900 uppercase text-left">${panel.text}</p>
                        </div>
                    `;
                } else {
                    content = `
                        <div class="flex flex-col items-center text-center space-y-5 mt-4">
                            <div class="bg-white p-5 rounded-full border-4 border-slate-900 shadow-comic-sm transform hover:scale-110 transition-transform duration-300">
                                <i class="${panel.icon} text-6xl ${panel.color}"></i>
                            </div>
                            <p class="font-extrabold text-xl sm:text-2xl text-slate-900 leading-relaxed text-center">${panel.text}</p>
                        </div>
                    `;
                }

                html += `
                    <div class="animate-pop relative border-4 border-slate-900 rounded-2xl shadow-comic p-8 flex flex-col justify-center ${panel.bg} ${isFullWidth ? 'md:col-span-2' : ''}" style="animation-delay: ${delay}ms;">
                        <button onclick="toggleSpeech(this, \`${panel.text.replace(/"/g, '&quot;')}\`)" class="absolute top-4 right-4 bg-white border-2 border-slate-300 rounded-full w-10 h-10 flex items-center justify-center shadow-sm hover:-translate-y-1 hover:shadow-md transition-all z-20 group" aria-label="Read Aloud">
                            <i class="fa-solid fa-volume-high text-slate-500 group-hover:text-indigo-600 transition-colors"></i>
                        </button>
                        ${content}
                    </div>
                `;
            });
            html += `</div>`;

            if (!isEnding) {
                const choiceDelay = 300 + (node.panels.length * 150);
                html += `
                    <div class="animate-pop bg-slate-100 p-8 rounded-2xl border-4 border-slate-900 shadow-comic" style="animation-delay: ${choiceDelay}ms;">
                        <h3 class="font-comic text-4xl text-slate-900 tracking-widest mb-8 text-center uppercase">Make Your Decision</h3>
                        <div class="space-y-5">
                `;
                node.choices.forEach((choice, index) => {
                    html += `
                        <button onclick="handleChoice('${choice.next}')" class="comic-btn w-full text-left p-5 rounded-xl border-4 border-slate-900 shadow-comic hover:bg-amber-100 transition-colors flex items-center space-x-6 ${choice.btnClass} group cursor-pointer">
                            <div class="bg-indigo-600 text-white w-14 h-14 rounded-full flex items-center justify-center font-comic text-3xl border-4 border-slate-900 flex-shrink-0 shadow-comic-sm">
                                ${index + 1}
                            </div>
                            <span class="font-extrabold text-xl sm:text-2xl leading-snug flex-grow text-slate-900">${choice.text}</span>
                            <i class="fa-solid fa-circle-arrow-right text-4xl text-slate-300 group-hover:text-indigo-600 transform group-hover:translate-x-2 transition-all"></i>
                        </button>
                    `;
                });
                html += `</div></div></div>`;
            } else {
                const endDelay = 300 + (node.panels.length * 150);
                html += `
                    <div class="animate-pop bg-amber-300 rounded-2xl p-8 sm:p-12 border-4 border-slate-900 shadow-comic mt-10" style="animation-delay: ${endDelay}ms;">
                        <h3 class="font-comic text-5xl text-slate-900 tracking-widest mb-8 border-b-4 border-slate-900 pb-4 uppercase">Status Report</h3>
                        
                        <div class="bg-white border-4 border-slate-900 rounded-xl p-6 mb-6 shadow-comic-sm">
                            <h4 class="text-base font-black text-slate-500 uppercase mb-2">Soft Skill Focus</h4>
                            <p class="text-indigo-700 font-comic text-3xl tracking-wide">${node.softSkill}</p>
                        </div>

                        <div class="bg-white border-4 border-slate-900 rounded-xl p-6 mb-10 shadow-comic-sm relative">
                            <button onclick="toggleSpeech(this, \`${node.analysis.replace(/"/g, '&quot;')}\`)" class="absolute top-4 right-4 bg-white border-2 border-slate-300 rounded-full w-10 h-10 flex items-center justify-center shadow-sm hover:-translate-y-1 hover:shadow-md transition-all z-20 group" aria-label="Read Aloud">
                                <i class="fa-solid fa-volume-high text-slate-500 group-hover:text-indigo-600 transition-colors"></i>
                            </button>
                            <h4 class="text-base font-black text-slate-500 uppercase mb-3">Critical Analysis Prompt</h4>
                            <p class="text-slate-900 font-extrabold text-2xl leading-relaxed pr-12 text-left">
                                ${node.analysis}
                            </p>
                        </div>

                        <div class="flex flex-col sm:flex-row gap-6">
                            <button onclick="resetApp()" class="comic-btn flex-1 bg-white border-4 border-slate-900 text-slate-900 px-6 py-5 rounded-xl font-black text-xl hover:bg-slate-100 transition-colors flex items-center justify-center space-x-3 shadow-comic">
                                <i class="fa-solid fa-rotate-left"></i>
                                <span>PLAY AGAIN</span>
                            </button>
                            <button onclick="setStage('reflection')" class="comic-btn flex-1 bg-indigo-600 border-4 border-slate-900 text-white px-6 py-5 rounded-xl font-black text-xl hover:bg-indigo-700 transition-colors flex items-center justify-center space-x-3 shadow-comic">
                                <i class="fa-solid fa-users"></i>
                                <span>CLASS DISCUSSION</span>
                            </button>
                        </div>
                    </div></div>
                `;
            }

            div.innerHTML = html;
            return div;
        }

        function renderReflection() {
            const div = document.createElement('div');
            
            const discussionPrompts = [
                "Based on the prologue, what is the 'fifty thirty twenty' rule, and how does it help people manage their salary?",
                "During the story, why was it dangerous for Maya to accept the secret investment opportunity from her coworker?",
                "If a friend invites you to an expensive dinner that you cannot afford, what is the most polite way to say no?"
            ];

            div.innerHTML = `
                <div class="animate-pop bg-white rounded-3xl shadow-comic p-8 sm:p-12 border-4 border-slate-900" style="animation-delay: 0ms;">
                    <div class="flex flex-col items-center justify-center space-y-4 mb-12 border-b-4 border-slate-900 pb-8 text-center">
                        <i class="fa-solid fa-comments text-6xl text-indigo-600"></i>
                        <h2 class="font-comic text-5xl md:text-6xl text-slate-900 tracking-wide uppercase">Class Discussion</h2>
                    </div>

                    <div class="space-y-10 mb-12">
                        <div class="animate-pop bg-sky-50 p-8 rounded-2xl border-4 border-slate-900 shadow-comic relative" style="animation-delay: 200ms;">
                            <button onclick="toggleSpeech(this, \`${discussionPrompts[0].replace(/"/g, '&quot;')}\`)" class="absolute top-4 right-4 bg-white border-2 border-slate-300 rounded-full w-10 h-10 flex items-center justify-center shadow-sm hover:-translate-y-1 hover:shadow-md transition-all z-20 group" aria-label="Read Aloud">
                                <i class="fa-solid fa-volume-high text-slate-500 group-hover:text-indigo-600 transition-colors"></i>
                            </button>
                            <div class="absolute -top-6 -left-6 bg-amber-400 border-4 border-slate-900 rounded-full w-14 h-14 flex items-center justify-center font-comic text-3xl shadow-comic-sm">1</div>
                            <h3 class="font-comic text-4xl text-sky-900 mb-4 tracking-wide uppercase pr-12">Reading Comprehension</h3>
                            <p class="text-slate-800 font-extrabold text-xl leading-relaxed text-left">${discussionPrompts[0]}</p>
                        </div>

                        <div class="animate-pop bg-purple-50 p-8 rounded-2xl border-4 border-slate-900 shadow-comic relative" style="animation-delay: 400ms;">
                            <button onclick="toggleSpeech(this, \`${discussionPrompts[1].replace(/"/g, '&quot;')}\`)" class="absolute top-4 right-4 bg-white border-2 border-slate-300 rounded-full w-10 h-10 flex items-center justify-center shadow-sm hover:-translate-y-1 hover:shadow-md transition-all z-20 group" aria-label="Read Aloud">
                                <i class="fa-solid fa-volume-high text-slate-500 group-hover:text-indigo-600 transition-colors"></i>
                            </button>
                            <div class="absolute -top-6 -left-6 bg-amber-400 border-4 border-slate-900 rounded-full w-14 h-14 flex items-center justify-center font-comic text-3xl shadow-comic-sm">2</div>
                            <h3 class="font-comic text-4xl text-purple-900 mb-4 tracking-wide uppercase pr-12">Evaluating Process</h3>
                            <p class="text-slate-800 font-extrabold text-xl leading-relaxed text-left">${discussionPrompts[1]}</p>
                        </div>

                        <div class="animate-pop bg-emerald-50 p-8 rounded-2xl border-4 border-slate-900 shadow-comic relative" style="animation-delay: 600ms;">
                            <button onclick="toggleSpeech(this, \`${discussionPrompts[2].replace(/"/g, '&quot;')}\`)" class="absolute top-4 right-4 bg-white border-2 border-slate-300 rounded-full w-10 h-10 flex items-center justify-center shadow-sm hover:-translate-y-1 hover:shadow-md transition-all z-20 group" aria-label="Read Aloud">
                                <i class="fa-solid fa-volume-high text-slate-500 group-hover:text-indigo-600 transition-colors"></i>
                            </button>
                            <div class="absolute -top-6 -left-6 bg-amber-400 border-4 border-slate-900 rounded-full w-14 h-14 flex items-center justify-center font-comic text-3xl shadow-comic-sm">3</div>
                            <h3 class="font-comic text-4xl text-emerald-900 mb-4 tracking-wide uppercase pr-12">Strategic Application</h3>
                            <p class="text-slate-800 font-extrabold text-xl leading-relaxed text-left">${discussionPrompts[2]}</p>
                        </div>
                    </div>

                    <div class="animate-pop" style="animation-delay: 800ms;">
                        <button onclick="resetApp()" class="comic-btn w-full bg-slate-900 text-white px-8 py-6 rounded-2xl font-black text-2xl hover:bg-slate-800 transition-colors flex items-center justify-center space-x-4 border-4 border-slate-900 shadow-comic uppercase tracking-wider">
                            <i class="fa-solid fa-rotate-right text-3xl"></i>
                            <span>Restart Entire Lesson</span>
                        </button>
                    </div>
                </div>
            `;
            return div;
        }

        // --- ACTIONS ---
        function doTransition(actionCallback) {
            const container = document.getElementById('app-container');
            container.classList.add('fade-out-active');
            stopAllAudio(); 
            
            setTimeout(() => {
                actionCallback();
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
                
                setTimeout(() => {
                    container.classList.remove('fade-out-active');
                }, 50);
            }, 300); 
        }

        function setStage(newStage) {
            doTransition(() => { state.stage = newStage; });
        }

        function startGame() {
            doTransition(() => {
                state.currentNode = 'start';
                state.stage = 'story';
            });
        }

        function handleChoice(nextNode) {
            doTransition(() => { state.currentNode = nextNode; });
        }

        function resetApp() {
            doTransition(() => {
                state = { stage: 'reading', currentNode: 'start' };
            });
        }

        // --- INITIALIZE ---
        window.onload = () => {
            const container = document.getElementById('app-container');
            container.classList.add('fade-out-active');
            render();
            setTimeout(() => { container.classList.remove('fade-out-active'); }, 50);
        };
    </script>
</body>
</html>
